.route-floor{top:8px;width:110px;margin-left:-55px;font-size:10px;letter-spacing:.12em}

.route-map .map-node b{font-size:24px}
.route-map .map-node span{font-size:11px}
.route-map .map-node small{font-size:8px;line-height:1.35}
.route-map .map-node.unknown{background:linear-gradient(150deg,#182a2d,#101f22);border-style:dashed;border-color:#72877c55}

.event-orbit:before,.event-orbit:after{content:"";position:absolute;inset:12%;border:1px dashed #b99d6540;border-radius:50%;transform:rotate(28deg)}
.event-orbit:after{inset:25%;transform:rotate(-18deg)}
.event-glyph{position:relative;z-index:1;font:150px/1 var(--serif);color:var(--event-accent,var(--gold));text-shadow:0 0 35px #d7b87545,0 8px 25px #000;transform:translateY(-8px)}

.event-outcome>span{display:block;font-size:9px;letter-spacing:.24em;color:var(--muted);margin-bottom:8px}

      const ally=f.messengerAvailable&&!f.handedMessenger?'季远果然等在门外。他把接收日期念给秦蘅听，秦蘅认出了那一夜。':f.checkpointEvidence?'你带来的路引抄件上，宋箴的签押与门内账册相同。':f.handedMessenger?'宋箴知道信使已被送走，合上账册：“你把能对账的人交出去了，现在打算拿什么指控我？”':'你没有可靠口供，门牌只证明这里曾接收过宗门的人。';
      const winFlags={rescueReached:true,rescuedQinHeng:true,ledgerOriginal:true,killedAgent:true,agentDefeated:true};
      const winOutcome='宋箴倒下，秦蘅自己从案后取出账册。她走出仪式白线：“我肯作证，也要自己决定以后去哪。”原件收入你的包裹。';
      return scene(id,2,'账册旁的活人',[
        '秦蘅还活着，手腕上的引灵线一端扣在案脚。宋箴把账册横在她面前：“长老付过价。她留下，外堂才有药领。”',
        '“我的名字在册上，不等于我答应过。”秦蘅扯住线头。晏绮罗看着宋箴：“原件和人，你开价，还是让我查？”',ally
      ],[
        C('purchase','买下原件，把秦蘅带离仪式',`支付 ${COSTS.buyLedger} 灵石；取得账册原件并救出秦蘅，不战斗。宋箴收款后离开，未被杀死。`,'宋箴点清灵石，亲手撤去案脚引灵符。秦蘅拿走写着自己名字的账页，跟你走出白线。你买下了原件，也把收钱的人留在了世上。',{goldCost:COSTS.buyLedger,questItem:'hehuan_ledger_original',hehuanFlags:{rescueReached:true,rescuedQinHeng:true,ledgerOriginal:true,boughtLedger:true,agentSpared:true}}),
        reliable?C('negotiate','用已核证据逼宋箴放人','出示路引抄件或信使证词，核对签押；宋箴无法否认，交出原件并放人。本次不支付、不战斗。','宋箴的签押与接收时间一项项对上。秦蘅自己划去受领栏，拿走原件。宋箴放开引灵线，要求你别把账交回同一位长老。',{questItem:'hehuan_ledger_original',hehuanFlags:{rescueReached:true,rescuedQinHeng:true,ledgerOriginal:true,negotiatedRescue:true,agentSpared:true}}):battleChoice('negotiate_failed','没有可靠证词，仍逼他放人','证据不足，交涉将失败并立即与宋箴交战，玩家先手；获胜才救出秦蘅、取得原件，失败结束本局。','宋箴把空白处转向你：“人已送走，证词也没有。你说我签过字，拿给谁看？”他按住案下兵刃。',ENCOUNTERS.agent,winFlags,winOutcome,['hehuan_ledger_original']),
        battleChoice('attack','拔扇，连人带原件一起带走','立即与宋箴交战，玩家先手；胜利后取得原件、救出秦蘅并领取一份正常精英战利，失败结束本局。','晏绮罗将扇骨挑开案上引灵线。宋箴起身拔刃，原件仍压在他的左手下。',ENCOUNTERS.agent,winFlags,winOutcome,['hehuan_ledger_original']),
        C('hush','收下封口钱，不带人回去',`获得 ${COSTS.hushMoney} 灵石；不取得原件，不救秦蘅；她仍留在宋箴看守的仪式中。之后不能把此事写成营救。`,'宋箴把灵石推来，账册重新合拢。秦蘅没有喊她师姐，只把自己的名字念了一遍。你收了钱，从白线外离开。',{goldGain:COSTS.hushMoney,hehuanFlags:{rescueReached:true,tookHushMoney:true,rescueAbandoned:true,agentSpared:true}})
      ],state);
    }
    const original=ownsLedger(state),rescued=!!f.rescuedQinHeng;
    const unavailable=!original?'未持有账册原件，不能按此方式处置。':'';
    const lock=(c,extraReason='')=>({...c,requiresHehuanItem:'hehuan_ledger_original',locked:!original||!!extraReason,text:[c.text,!original?unavailable:extraReason].filter(Boolean).join(' ')});
    const witness=rescued?'秦蘅站在门外：“救命的事我记着。可账上别再替我签一个新主人。”':f.tookHushMoney?'接应者看见你收过的封口款袋：“这趟安静得很。账册呢？”案后的秦蘅没有跟来。':'接应者只见到你一个人，先看行囊，再问账册；秦蘅仍未被你带出仪式。';
    const messenger=f.messengerAvailable&&!f.handedMessenger?'季远把签押写在一旁，愿在公开时署名。':f.handedMessenger?'季远已被交给巡使；接应者说他不能来。你没有假称他已同意替你作证。':f.checkpointEvidence?'你仍能拿路引抄件逐字对照，但原件的去向只能按手中实物说明。':'眼前没有当初信使的口供，空缺不能由一句传闻补上。';
    const choices=[
      lock(C('publish','公布原件，请证人各自署名',`交出原件供核验，留下副本；下场战斗首回合获得 ${COSTS.publishGuard} 护盾，获得回春草×2。不能同时收宗门的回购钱。`,'晏绮罗把原件摊在各宗见证人面前，签名的人只写亲见的部分。护送者将护符系在她腕上；秦蘅若愿出面，名字由她自己写。',{questItem:'hehuan_ledger_copy',hehuanItemsRemove:['hehuan_ledger_original'],guard:COSTS.publishGuard,itemGrants:[{id:'herb',count:2}],hehuanFlags:{ledgerOriginal:false,ledgerPublished:true,ledgerCopy:true,publicWitnessSupport:true}})),
      lock(C('return','把原件交回宗门，换取补给',`交出原件，获得 ${COSTS.returnLedger} 灵石与聚灵丹×2；失去原件，不能再用它公布或索价。`,'接应者封好原件，把灵石和药逐件放下。晏绮罗没有再留下可公开核对的那一册。秦蘅若已获救，便独自收起行囊，不再替她作证。',{goldGain:COSTS.returnLedger,itemGrants:[{id:'spirit_pill',count:2}],hehuanItemsRemove:['hehuan_ledger_original'],hehuanFlags:{ledgerOriginal:false,returnedLedger:true,sectSupport:true,qinTrustLost:rescued}})),
      lock(C('leverage','保留原件，向长老索价',`保留原件，获得 ${COSTS.leverage} 灵石与「满堂红」；不获公开证人的护符或宗门回购补给。`,'晏绮罗将原件贴身收好，只让接应者看了一行签名。“外堂的药钱，从这里重新算。”对方付钱留下功诀；把柄仍在你手里，秦蘅的名字也仍在册中。',{goldGain:COSTS.leverage,cardIds:['H12'],hehuanFlags:{ledgerLeverage:true,sectHostile:true}})),
      lock(C('destroy','只带秦蘅离开，当面毁掉原件',`须已救出秦蘅；焚毁原件，恢复 ${COSTS.burnHeal} 生命并获得回春草×2，不取得封口或回购钱。`,'秦蘅把自己的账页先投入火中，其余原件随后烧尽。“我不替长老守口。”她说，“但以后也别拿这本账替我决定。”晏绮罗留下药，让她自己择路。',{heal:COSTS.burnHeal,itemGrants:[{id:'herb',count:2}],hehuanItemsRemove:['hehuan_ledger_original'],hehuanFlags:{ledgerOriginal:false,ledgerDestroyed:true,qinOwnPath:true}}),rescued?'':'尚未救出秦蘅，不能选择带她离开。')
    ];
    if(!original)choices.push(C('unfinished',f.tookHushMoney?'保留封口钱，不伪称已带回证据':'没有原件，不接新的处置约定','不改变资源，不补发原件、不自动救人。此前交人、收款或错过证词的事实仍保留。',f.tookHushMoney?'接应者不再问账，转而清点你收过的钱。秦蘅不在门外，晏绮罗没有替这个空位编一个圆满的说法。':'你摊开手里实际有的纸页，没有账册原件。接应者收回空匣，你继续赶路；失踪者和旧账都还未结清。',{hehuanFlags:{ledgerDispositionMissed:true}}));
    return scene(id,3,'原件只够交给一方',['接应者追到断亭，打开一只空匣：“长老说，原件交回来，外堂还有药钱。你若拿去给别人看，便别再用宗门的名号。”',witness,messenger],choices,state);
  }
  function ending(state,won=true){
    const f=flags(state),rescue=f.rescuedQinHeng===true;
    if(!won)return {title:'纱断，账未结',goal:rescue?'秦蘅曾被救出；她能否独自出域，尚无消息。':'秦蘅未被你带离祭仪。',text:['晏绮罗没能走完寒渊。'+(rescue?'她安排过的避难处仍有一人等归路；这不是已经抵达雾外的证明。':'那本交人账册和没能带走的人，仍留在这一程的记录里。'),f.tookHushMoney?'她收过封口钱，这一笔没有因落败消失。':'她最后握紧的仍是扇骨，没能替旧案写下终页。'],relation:rescue?'秦蘅的去向待查':'营救未成',quote:'账别替我销。'};
    let title,text,relation;
    if(rescue&&f.ledgerPublished){title='人归，账见天光';text=['秦蘅自己走过雾外的界碑，转身指了指晏绮罗腕上的见证护符：“救我这笔记着。往后的名字，我自己写。”','公开副本让几处签押有了核验的人。长老不再能把秦蘅说成从未入册，宗门也没有因此全变得干净。'];relation='秦蘅愿独立作证，外堂与长老的关系决裂';}
    else if(rescue&&f.returnedLedger){title='归人不替归账';text=['秦蘅获救后独自收好行囊：“人情我认。可这回卖回去的，不只有纸。”她没有替晏绮罗再作证。','宗门回购原件的灵石和丹药已经入袋，原件不在你手里。晏绮罗拿到了补给，也失去了用那一本账公开核验的机会。'];relation='秦蘅已离去，信任受损；宗门仍愿交易';}
    else if(rescue&&f.ledgerLeverage){title='活人归路，把柄随身';text=['秦蘅走出封域，却没有接外堂的新名帖：“我不想再让自己的名字，替你的药钱担保。”','晏绮罗保留着原件，索来的灵石和「满堂红」已实际入手。她救回了人，也选择继续用这份把柄与长老做生意。'];relation='秦蘅保留距离；长老的把柄仍在你手里';}
    else if(rescue&&f.ledgerDestroyed){title='灰尽，人各有路';text=['秦蘅在界碑外停步：“我会说自己见过的事，不替那本烧掉的账作保证。”她拿着留下的药，选了另一条路。','原件已经焚毁，未换取长老的灵石。晏绮罗失去了那份把柄，也没有再替秦蘅订下下一份约定。'];relation='师姐妹各走自己的路；原件无法再核验';}
    else if(f.tookHushMoney){title='带钱出域，无人同行';text=['雾外接应者先点封口钱，再问账册。晏绮罗没有带出秦蘅，也没有拿到原件。','秦蘅在案后念自己名字的声音没有跟来。她收过的钱仍在本局账上，胜利没有将那次离去改写成救人。'];relation='营救被放弃，宗门接应者知晓封口交易';}
    else if(rescue){title='人已带回，旧案未竟';text=['秦蘅确实离开了祭仪，亲自走到雾外。她说自己会另选去处，没有应允替任何一方守口。','账册未按完整处置方案落定；'+(ownsLedger(state)?'原件仍由晏绮罗保管。':'她手中没有可供处置的原件。')+'这部分仍是未竟之事。'];relation='营救完成，证据处置未竟';}
    else {title='穿过寒渊，未带回她';text=['晏绮罗走完七境，扇边的符结已经换过数次。秦蘅却没有被她救出，不能用镇境之战的胜利来替代那一次营救。','她带出的见闻有多少，只按本局确实取得的纸页作数。长老、巡使与师妹的旧账，还没有结清。'];relation='营救未成，旧案未竟';}
    if(f.killedPatrol)text.push('巡使岳衡被她所杀。季远即使愿作证，也没有为这次杀人改写经过。');
    else if(f.handedMessenger)text.push('季远曾被她交给巡使，后来没有被悄悄写成一直同行的证人。');
    return {title,goal:rescue?'秦蘅已被救出。':'秦蘅未被救出。',text,relation,quote:rescue?'人不是账上的东西。可账，还得有人算。':'这一页，还不能合。'};
  }
  function identityReply(event,state){
    if(state?.character!=='hehuan')return '';
    const id=typeof event==='string'?event:event?.id||'',f=flags(state),m=/^faction_(gate_boss|camp_boss|snake|bell_boss)_(source|cave)$/.exec(id);if(!m)return '';
    const rescued=f.rescuedQinHeng;
    const replies={
      gate_boss:rescued?'晏绮罗：“我从仪式里带出来的是秦蘅，不是一张无名牌。你问她想走哪条路，别问我的宗门替她签过什么。”':'晏绮罗：“我要找的人叫秦蘅。合欢宗的名帖不替她答话，渡簿也不能只替有钱的人认名字。”',
      camp_boss:f.guaranteedMessenger?'晏绮罗：“我替一个信使交过担保钱。担保写谁、药交谁，都得当面点；别拿门派替账目说话。”':'晏绮罗：“想问我是不是来偷药，就把药箱的数量摆开。我的宗门不能替你证明我做过哪一件事。”',
      snake:'晏绮罗看过秤盘：“买药、换证词、替人开井，是三笔事。先把价钱写清，别见我拿扇，就把药账也算成一场情债。”',
      bell_boss:f.tookHushMoney?'晏绮罗没有碰续钟绳，只问：“名字留下了，写这个名字的人还愿意吗？”她把手收回袖内。':rescued?'晏绮罗：“秦蘅活着，她要不要替谁作证，由她自己说。这里亡者的名字，也别只听替人签押的那一方。”':'晏绮罗：“留名是记住一个人，留魂是叫她继续等。把这两件事说清，我再碰你这根绳。”'
    };
    return replies[m[1]];
  }
  const api={CARDS,STARTERS,CHARACTERS,RELICS,FACTION,ITEMS,STORY_IDS,PERSONAL_SLOTS,COSTS,ENCOUNTERS,INITIAL_STORY,TUTORIAL,CONDITION_TEXT,flags,ownsLedger,buildEvent,ending,identityReply};
  root.NightHehuan=api;if(typeof module!=='undefined'&&module.exports)module.exports=api;
})(typeof globalThis==='object'?globalThis:window);
</script>
<script>
/* Small offline expedition rules: inventory, fixed cave discoveries and shop supplies. */
(function(root){
  'use strict';
  const ITEMS={
    herb:{name:'回春草',text:'恢复 6 点生命。不会解除毒素。',icon:'herb',rarity:'common',price:9,heal:6},
    dewherb:{name:'凝露叶',text:'恢复 12 点生命。不会解除毒素。',icon:'herb',rarity:'common',price:16,heal:12},
    healing_pill:{name:'回气丹',text:'恢复 24 点生命。不会解除毒素。',icon:'pill',rarity:'uncommon',price:28,heal:24},
    fullheal_pill:{name:'九转还元丹',text:'将生命完全恢复至当前上限。不会解除毒素。',icon:'fullheal',rarity:'rare',price:55,fullHeal:true},
    antidote:{name:'百草解厄丹',text:'清除全部战斗毒素，并彻底根除缠脉毒；不恢复生命。',icon:'antidote',rarity:'rare',price:42,cure:true},
    battle_pill:{name:'虎魄丹',text:'本场战斗每张攻击牌的第一段伤害 +2，最多 +4；战斗外服用则在下一场生效。',icon:'strength',rarity:'uncommon',price:32,power:2},
    spirit_pill:{name:'聚灵丹',text:'立即获得 2 点灵力。只能在自己的战斗回合使用。',icon:'pill',rarity:'uncommon',price:20,energy:2}
  };
  const OUTSIDE_SCREENS=['arrival','map','rest','shop','fox','event','cave','threshold'];
  function create(hooks){
    const getState=hooks.getState;
    const random=()=>Math.max(0,Math.min(.999999999999,Number((hooks.rng||Math.random)())||0));
    const pick=values=>values[Math.floor(random()*values.length)];
    const emit=()=>hooks.emit?.();
    const note=message=>hooks.note?.(message);
    const event=(type,fields)=>hooks.event?.(type,fields);
    const log=message=>hooks.log?.(message);
    function resetRun(){const s=getState();s.player.inventory={herb:2};s.player.pendingPillPower=0;s.cave=null;}
    function grantItem(id,amount=1){
      if(!ITEMS[id]||!Number.isSafeInteger(amount)||amount<1)return false;
      const p=getState().player;p.inventory=p.inventory||{};p.inventory[id]=(p.inventory[id]||0)+amount;return true;
    }
    function getItemUse(id){
      const s=getState(),p=s.player,b=s.battle,item=ITEMS[id];
      const no=reason=>({usable:false,reason});
      if(!item||!(p.inventory?.[id]>0))return no('包裹中没有此物');
      if(p.hp<=0||s.screen==='defeat'||s.screen==='victory'||s.screen==='title')return no('此时无法服用');
      const battle=s.screen==='battle';
      if(battle&&(!b||b.phase!=='player'||b.enemy.hp<=0))return no('等待自己的回合');
      if(!battle&&!OUTSIDE_SCREENS.includes(s.screen))return no('完成当前结算后再服用');
      if(battle&&b.itemUsedTurn===b.turn)return no('本回合已服用一件药物');
      if((item.heal||item.fullHeal)&&p.hp>=p.maxHp)return no('生命已满');
      if(item.cure&&!(p.affliction?.active||(battle&&b.poison>0)))return no('当前没有需要清除的毒素');
      if(item.energy&&!battle)return no('只能在自己的战斗回合服用');
      if(item.power&&(battle?(b.pillPower||0):(p.pendingPillPower||0))>=4)return no('药力已达上限');
      return {usable:true,reason:battle?'不消耗灵力；每回合限服用一件':'服用后消耗一件'};
    }
    function getInventory(){
      const inventory=getState().player.inventory||{};
      return Object.keys(ITEMS).filter(id=>inventory[id]>0).map(id=>({id,...ITEMS[id],count:inventory[id],...getItemUse(id)}));
    }
    function useItem(id){
      const availability=getItemUse(id);if(!availability.usable)return false;
      const s=getState(),p=s.player,b=s.screen==='battle'?s.battle:null,item=ITEMS[id];
      if(b)hooks.beginEvents?.();
      // Consume and lock before effects: reentrant renders cannot spend this dose twice.
      p.inventory[id]--;if(!p.inventory[id])delete p.inventory[id];
      if(b)b.itemUsedTurn=b.turn;
      let result='';
      if(item.heal||item.fullHeal){const amount=hooks.heal(item.fullHeal?p.maxHp:item.heal,item.name);result=`恢复 ${amount} 点生命`;}
      if(item.cure){
        const poison=b?.poison||0;
        if(b){b.poison=0;if(poison)event('poison',{target:'player',amount:-poison,total:0});}
        if(p.affliction?.active){
          if(hooks.cureAffliction)hooks.cureAffliction();
          else {p.affliction.active=false;p.affliction.revealed=true;p.affliction.suppressed=0;}
        }
        result='毒素已清，经脉恢复平静';
      }
      if(item.power){
        if(b)b.pillPower=Math.min(4,(b.pillPower||0)+item.power);
        else p.pendingPillPower=Math.min(4,(p.pendingPillPower||0)+item.power);
        result=b?`本场攻击牌首段增伤 ${b.pillPower}`:`下一场攻击牌首段增伤 ${p.pendingPillPower}`;
      }
      if(item.energy){b.energy+=item.energy;result=`获得 ${item.energy} 点灵力`;event('energy',{target:'player',amount:item.energy,total:b.energy});}

    function buyItem(index){
      const s=getState();if(s.screen!=='shop'||!Number.isInteger(index))return false;

      const rare=rewards.some(r=>r.kind==='relic'||(r.kind==='item'&&ITEMS[r.id].rarity==='rare'));

      const s=getState(),cave=s.cave;
      if(s.screen!=='cave'||!cave||cave.explored||cave.resolved||s.player.hp<=0)return false;

    silent_astrolabe:{name:'停转星盘',glyph:'星',regionIndex:6,minRegion:6,maxRegion:6,minFloor:62,maxFloor:69,story:['一座巨大的星盘横卧在断阶上，指针指向一个被刮掉的字。盘沿仍有供人转动的握柄，上面留着不同深浅的指印。','你摸到了一处温热的刻槽。星盘没有转，远处命枢的细线却短暂地绷紧了。'],choices:[

<script>

(function(root){

 const CHAIN_DEFS={
 debt:{name:'渡口的旧账',person:'岑娘',theme:'欠债的人与替人记债的人，各自藏着一份不能毁掉的账。',stages:[

   C('aid','替她付十二枚灵石','支付12灵石；她会收好这份代付。','她当着你的面在借据背后按了手印，没有说这是最后一笔债。',{goldCost:12}),

   C('redact','对照借据，另抄匿名粮册','支付8灵石买纸墨；下一战首回合护盾+6。','你们逐户核对，姓名换成只有各家认得的鞋印。老人没被洗清，岑娘也没被免债；先让人吃上饭。',{goldCost:8,guard:6}),

   C('return','把册子留给当事人','不领取报酬；各人自行承担这本账。','你把借据压在桌上，让他们自己谈。老人第一次摘了帽，露出同样逃亡留下的烙痕。')]),

 medicine:{name:'分作两碗的药',person:'杜蘅',theme:'救人的资格不是奖赏，救人的代价也不能永远由一人承担。',stages:[

   C('move','帮她迁走仍在发热的病人','支付12灵石；下一战首回合护盾+12。','你没有与封条争辩，先把人搬到有风的地方。有人因此责你偏袒，病人的呼吸却不必等争论结束。',{goldCost:12,guard:12}),
   C('distance','替药棚抄清交货条，不介入查封','获得12灵石誊录工钱；不是退还从未支付的押金。','你把交货的日期和数量逐笔誊清，收下十二枚灵石工钱。杜蘅仍得面对查封，你没有替药棚作证。',{goldGain:12})]),
  c=>E('没人问出身的长凳',[c.p(2)==='distance'?'更深处的水榭里，杜蘅用旧门板重新支起药台。她认得你，却只先问伤在哪里。':'你写过的供述或搬过的病人没有解决所有争执。药棚重新开张时，长凳仍按伤势排队。',c.p(1)==='priority'?'那名伤者也在排队。他承认自己怕被问责才先递了查封文书，今日带来营中结余的药。':'女行脚把新的药包送到门口，没有再把自己的那份推开。'],[
   C('receive','接受一次治疗和一剂药','恢复14生命，获得1份凝露叶。','杜蘅同样记录了用药。她说这不是偿清人情，是让这张长凳继续有用。',{heal:14,...item('dewherb')}),
   C('supply','支付二十枚灵石，分担下一批药资','支付20灵石；获得1枚百草解厄丹和对应主角功法。','你的名字写在供药栏，不写在病人的身上。受过药的人不欠你一个必须回报的未来。',{goldCost:20,...item('antidote'),cardIds:[gift(c.role)]}),
   C('pass','把位置让给更急的人','下一战首回合护盾+10。','你把位置让出去，杜蘅仍替你补好护身符。她不赞你比旁人高尚，只说别撑到来不及。',{guard:10})])]},
 letter:{name:'未寄出的家书',person:'阿筠',theme:'真相有其价值，承受真相的人也有决定如何承受的权利。',stages:[

  c=>E('碑上留白',[c.p(2)==='consent'?'家属带着信的复本来到旧址。她选择公开命令时辰，却不愿把丈夫写成只剩罪或只剩功的人。':c.p(2)==='expose'?'命令时辰迫使营地重查旧档。写信人的名字仍被争论，家属没有授权任何人替她原谅。':'旧址的碑没有新增供人争论的字。阿筠说家属保存了信，也保存了暂时不说的权利。','阿筠要离开封域了。她问你，给后来的人留证据，是否一定要把某个人的一生刻在最显眼的地方。'],[

   C('farewell','把决定留给家属，送她出驿亭','恢复10生命。','你们谁也没有说事情已经圆满。阿筠终于不用把信举在火上，来决定一个人的归处。',{heal:10})])]},
 name:{name:'借来的名字',person:'许渡',theme:'身份能给人庇护，也可能把另一个活人从自己的位置挤走。',stages:[

   C('owner','归还玉牌，让原主先过关','获得20灵石寻物报酬。','你把牌递回原主。他付清灵石，许渡退到墙外；归还了东西，并不等于第二个人就有了去处。',{goldGain:20}),
   C('escape','帮两人从不验身份的旧渠离开','下一战首回合护盾+8。','两人都活着离开关卡，也都失去了向营地求援的资格。你指的路不是没有代价。',{guard:8})]),
  c=>E('能够自报名姓',[c.p(2)==='record'?'许渡在新营地用自己的名字领到一份临时活计。玉牌原主替他作过见证，不曾说借牌之事值得效仿。':c.p(2)==='owner'?'原主已经过关，许渡则在搬运伤者时重新登记了名字。他没有等来你的援助，也没有因此停止活下去。':'旧渠尽头，两人轮流照看新来的伤者。没有宗门名册替他们担保，他们只能逐件做能被人看见的事。','许渡终于把自己的名字告诉你，不再附上一个更响亮的门派。'],[
   C('accept','收下他们共同备下的护符','下一战首回合护盾+16，获得1份回春草。','两个人各系了一半绳结。你收下的是今日的谢意，没有抹去昨日的责任。',{guard:16,...item('herb')}),
   C('sponsor','支付十六枚灵石，为临时伤籍留名','支付16灵石；获得对应主角功法。','你只担保自己看过的部分。许渡在册末签下真名，不再借别人的一生替自己开门。',{goldCost:16,cardIds:[gift(c.role)]}),
   C('part','互道名字后告别','恢复10生命。','他把旧外袍交还给原主。名姓并没有让路突然平坦，却让这次分别不必再靠一句假话。',{heal:10})])]},
 lanterns:{name:'逆水的灯',person:'孟夫人',theme:'思念可以挽留死者的形象，却不能替活人决定何时离开。',stages:[
  c=>E('灯在向上游',['淹水的宅院里，孟夫人放出的河灯一盏盏逆流。她说女儿去世后，只有灯还肯回家。','纱帘后有人伸手扶正灯芯。孟夫人没回头，只请你添一些灯油。'],[
   C('oil','买灯油，陪她坐一会儿','支付10灵石；恢复8生命。','她给你添了热水。帘后那只手停住，像在等你问一句，却最终没有开口。',{goldCost:10,heal:8}),
   C('ask','轻声询问帘后是谁','无即时奖励。','一个声音答：“我叫孟清，还活着。”孟夫人把灯拨得更亮，像是没有听见。'),
   C('leave','不惊扰这场家事','获得1份回春草。','孟夫人把草药放在门边，说来客路远。你离开后，水声又替她遮住了帘后的话。',item('herb'))]),
  c=>E('水里的人不是倒影',['孟清在泽国的小舟上找到你。灾变让她的形貌时常透明，母亲把她当成早逝姐姐的归魂，不肯让她出门。','“她也怕失去我。”孟清替母亲说完这句，才补上自己的请求，“但我不能用一辈子证明姐姐还在。”'],[
   C('speak','陪她回去，把两个人的话都听完','支付8灵石雇船；下一战首回合护盾+8。','你坐在两人之间，只在孟清被打断时请她继续说。孟夫人没有立刻理解，但第一次叫对了名字。',{goldCost:8,guard:8}),
   C('passage','替她安排独自离开的船位','支付14灵石；获得1枚聚灵丹。','孟清留下去向，没有留下供人追索的契印。她选择离开，也接受母亲可能一时不会原谅。',{goldCost:14,...item('spirit_pill')}),
   C('delay','劝她等母亲平复后再走','恢复6生命。','她点头，随后自己收好船票。你说了一个容易出口的“再等等”，却不能替她过等待的日子。',{heal:6})]),
  c=>E('顺流而下的一盏',[c.p(2)==='speak'?'天阙边的渡口，孟夫人终于把一盏灯交给孟清。她仍会叫错名字，却愿意被提醒。':c.p(2)==='passage'?'孟清寄来一小包灯芯。孟夫人看了去向很久，没有拆开回邮的封口；至少这次她知道活人能来信。':'孟清后来还是自己走了。孟夫人留着她的船票存根，等候的对象终于不再是死者的影子。','那盏灯这次随水向下。没有人说思念已经结束，只是不再拿它拴住另一个人。'],[
   C('keepsake','收下一枚不系归魂契的灯珠','获得1枚回气丹与下一战首回合护盾+10。','灯珠只是一盏灯的余温，不承诺让谁回来，也不要求收下的人永远留下。',{guard:10,...item('healing_pill')}),
   C('send','付十二枚灵石，替她们保留往来的船位','支付12灵石；获得对应主角功法。','船位可以不用，信也可以暂时不回。你留下的是来往的可能，而不是必须团圆的命令。',{goldCost:12,cardIds:[gift(c.role)]}),
   C('watch','看着河灯顺水离开','恢复12生命。','水面没有给出圆满的答案。两个人却终于能把各自的名字，放在同一封信上。',{heal:12})])]},
 grain:{name:'余粮与旧秤',person:'陶掌柜',theme:'价格、秩序与善意，都可能成为让某些人不必承担代价的说辞。',stages:[
  c=>E('秤盘里的最后一升',['陶掌柜用一把旧秤分粮。她把价码提了两倍，说护送费也涨了；护卫却悄悄割开一只粮袋给伤者。','“人人先拿一把，明日就都没得拿。”她发现破口，第一眼看的仍是剩下多少粮。'],[
   C('fund','付十二枚灵石，买一份公开分配的粮','支付12灵石；获得1份凝露叶。','陶掌柜把价目写在袋上，护卫依伤势分粮。灵石没有凭空变多，至少这一袋不能再暗中卖第二次。',{goldCost:12,...item('dewherb')}),
   C('guard','接受护送委托，领取报酬','获得18灵石；答应沿路照看车队。','她当面付了定金，护卫不太高兴。你答应的是护送，没有答应替每一种价码辩护。',{goldGain:18}),
   C('weigh','先核验秤与损耗，再决定','下一战首回合护盾+5。','秤没有少斤两，账里却把丢失的车马都摊给最后的买主。陶掌柜说，总要有人付。',{guard:5})]),
  c=>E('被算进损耗的人',[c.p(1)==='guard'?'车队按约经过营地，陶掌柜请求你继续护送。护卫带来一群付不起粮资的运粮人，问他们的劳酬何时结。':'你在新营地再见旧粮车。袋数对得上，付不起粮资的却有当初搬运它们的人。','掌柜拿出押运合同，护卫拿出伤者名单。两份都是真的，谁的损耗先入账却一直没人明说。'],[
   C('audit','先结运粮劳酬，再商量减价','支付10灵石请人逐笔核账；获得1枚回气丹。','陶掌柜删去自己一项利润，护卫交回私分的粮。谁也没有单凭善意就不必对账。',{goldCost:10,...item('healing_pill')}),
   C('discount','补二十枚灵石，替眼前伤者买粮','支付20灵石；下一战首回合护盾+14。','这批人吃到了粮，账上的劳酬仍未结清。你解决了今日的饥饿，没有把它说成全部的公道。',{goldCost:20,guard:14}),
   C('contract',c.p(1)==='guard'?'按先前委托护车，不介入分粮':'接下一段短途护车，不介入分粮',c.p(1)==='guard'?'完成已接护送，获得16灵石尾款。':'现在护送车队走到下一道灯桩，获得16灵石工钱；不是先前未接委托的尾款。',c.p(1)==='guard'?'掌柜点清尾款，划去你此前接下的护送一项。运粮人的劳酬仍在另一页。':'你把车护送到下一道灯桩。掌柜付清这段新差事的十六枚灵石，未将你记成旧约的护卫。',{goldGain:16})]),
  c=>E('新秤第一次落下',[c.p(2)==='audit'?'车队在泽岸支起公秤。运粮人有了自己的账页，陶掌柜还在做买卖，只是不再独自解释所有损耗。':c.p(2)==='discount'?'你买过粮的人中，有几位回来搬货抵劳酬。掌柜愿意重谈价码，护卫则要求写清谁有权停秤。':'买卖仍在继续，护卫离队另设小灶。掌柜少了一队人，也才发现粮袋不会自己被抬过桥。','陶掌柜请你看第一笔新账。她不再问自己算不算好人，只问这笔灵石还有谁没看见。'],[
   C('escrow','让双方共同保管二十枚押金','支付20灵石；获得2份凝露叶与下一战首回合护盾+10。','一把钥匙给掌柜，一把给搬运人。你无法保证他们永不争执，但让下一次争执有账可查。',{goldCost:20,guard:10,...item('dewherb',2)}),
   C('accept','收下明码标出的谢礼','获得24灵石。','谢礼写进公开账，没有改成伤者头上的新欠款。你点清后收下。',{goldGain:24}),
   C('meal','吃一顿按新价付清的饭','恢复14生命。','饭不因你曾帮过谁就更甜，账也不会因一顿饭就消失。你们总算能把这些分开谈。',{heal:14})])]},
 bridge:{name:'桥上三尺',person:'石砚',theme:'一个人变得不再像人，是否就失去了替自己解释的资格。',stages:[
  c=>E('还在修桥的人',['石砚用一只手修桥，另一只手臂已长成白色树皮与黑晶。他说桥塌那晚自己在下面，醒来便这样了。','岸上的人请他快些，又不许他踏上完工的桥。照灯的女医把灯举高，没有替谁下结论。'],[
   C('tools','付十枚灵石，替他补齐工具','支付10灵石；下一战首回合护盾+7。','石砚先用新凿子修了供伤者走的低阶。他没有要求你证明他还是不是人。',{goldCost:10,guard:7}),
   C('observe','帮女医记录异变，并征求他的同意','获得1份回春草。','他允许量伤口，不允许取骨。女医把这句话也写进记录，和脉象放在一起。',item('herb')),
   C('avoid','从旧渡口绕行','获得8灵石退回的过桥费。','你绕了远路，没有踏上新桥。石砚仍在岸边一下一下地凿石。',{goldGain:8})]),
  c=>E('火把照向桥下',['有人在桥边失踪，村人拿着火把找石砚。女医说失踪者刚在河岸偷拿过封禁药匣，也可能是去找解药。','石砚把藏在桥下的伤者让出来：那人确实拿了药匣，也确实病得无法过河。他没有要求对方替自己说好话。'],[
   C('witness','先让伤者说话，再查药匣','支付8灵石安置伤者；获得1枚百草解厄丹。','你让每个人只说亲眼见过的事。火把没有立即熄灭，至少不再把沉默当成认罪。',{goldCost:8,...item('antidote')}),
   C('escort','护送石砚离开桥边','下一战首回合护盾+10；桥暂时无人维护。','你让出退路，女医带他离开。众人保住了想要的距离，也得自己学会修桥。',{guard:10}),
   C('search','让他暂留桥下，先找齐失踪者','恢复6生命。','你留下水和照明，却没有给出保证。石砚问最迟等到何时，你只能把寻找的时限说清。',{heal:6})]),
  c=>E('桥有第二个工匠',[c.p(2)==='escort'?'旧桥如今由两个村民轮班修补。石砚在别处找到活计，来信只问女医的灯还亮不亮。':'失踪者被找回，石砚没有因此变回原样。桥边多了一个学手艺的人，也多了一条先听证言的规矩。','女医把抄本递给你：“不必说所有异变都无害。也别把不知道的事，当成一个人有罪的证据。”'],[
   C('record','留下经过核对的证言','获得对应主角功法与1份凝露叶。','你只担保自己见过的桥和人。后来的危险仍须后来的人认真分辨。',{cardIds:[gift(c.role)],...item('dewherb')}),
   C('pay','付十八枚灵石，让新工匠继续学下去','支付18灵石；下一战首回合护盾+18。','石砚没有被要求永远负责这座桥。第二个人学会以后，第一人才终于能自行决定去留。',{goldCost:18,guard:18}),
   C('rest','在桥边安静坐一会儿','恢复14生命。','桥下仍有雾，桥上终于容得下一张给修桥者坐的凳子。',{heal:14})])]},
 forge:{name:'铸剑余温',person:'陆炉',theme:'力量可以继承，别人的牺牲却不应在锻造时被抹去。',stages:[
  c=>E('炉里有人的回声',['陆炉从废宅铁料中锻出一截剑胚。每次敲击，剑里都会响起像人说话的余音。她说是引灵残渣，并非完整魂魄。','一名来认旧物的妇人站在炉外，手里拿着同样纹样的断剑柄。炉料确实已付清灵石买来，卖料的人却未必有权卖掉。'],[
   C('trace','替她核查炉料来处','支付10灵石；获得1枚聚灵丹。','陆炉暂时停炉，损耗由自己承担。你把断剑柄放在未冷的铁旁，纹样正好接上。',{goldCost:10,...item('spirit_pill')}),
   C('order','付十五枚灵石，订一把能用的剑','支付15灵石；下一战首回合护盾+9。','她开了收据，没保证这把剑只会带来好处。妇人把手柄握紧，没有替你决定要不要订。',{goldCost:15,guard:9}),
   C('return','请她先归还认得出的旧件','获得8灵石运送费。','陆炉挑出能认的纹样，付你运送费。她并未答应把所有来不及认领的铁都扔进河里。',{goldGain:8})]),
  c=>E('剑胚与姓名',['来认物的人更多了，有人想取回家人的旧铃，有人愿把旧件留下，只求名字别被磨掉。','陆炉说整把停工，守营的人便等不到新刃；继续铸，她也不能再把买到材料当成一切都已结清。'],[
   C('consent','逐件询问意愿，另铸不混名的刃','支付12灵石；获得1份凝露叶。','愿意留下的铁另封一炉，不愿留下的旧物退还。进度慢了，陆炉没有把这份慢都算给索物的人。',{goldCost:12,...item('dewherb')}),
   C('memorial','保留旧物纹样，优先铸守营的剑','下一战首回合护盾+12。','剑按期送到，旧名刻在匣上。有些家属接受，有些仍认为自己被迫替众人让步。你没有要求他们感激。',{guard:12}),
   C('purchase','按已付清的货约取用炉料','获得20灵石交易差额。','货约在手，炉料交割没有争议。没有写在货约里的人，却仍在炉外等着。',{goldGain:20})]),
  c=>E('炉火照得到的地方',[c.p(2)==='consent'?'新剑用另一炉铁铸成，旧件按当事人的意思分别留下或归还。陆炉终于能说清这把剑用了什么。':c.p(2)==='memorial'?'守营的剑确实挡过一次夜袭。剑匣上那些名字，也没有让反对者失去继续索还旧物的权利。':'陆炉照约交完货，后来却为未认领的旧件停了一炉。合法的买卖没能替她回答所有问题。','她把一把已稳住剑息的「听雪」放在案上；若你已有此剑，可以让它换作后来者的炉资。'],[
   C('sword','收下听雪，记住材料的来处','获得剑器「听雪」；若已有，改得22灵石。需灵识2级才可装备。','你没有把一把剑当成对所有旧事的赔偿。陆炉也没有把名字磨去。',{weapon:'rime',duplicateWeaponGold:22}),
   C('endow','留下二十枚灵石，给新一炉做底资','支付20灵石；获得对应主角功法和1枚虎魄丹。','新炉资单独记账，认领旧物不必再与守营的人争同一把刃。',{goldCost:20,cardIds:[gift(c.role)],...item('battle_pill')}),
   C('listen','听最后一道回声散去','恢复12生命。','那不是谁回来向你致谢，只是一段余音终于不必再被拿来证明力量值得一切。',{heal:12})])]},
 theatre:{name:'空席上的戏',person:'祝停云',theme:'苦难不是供旁人消费的故事，沉默也不该只能由出资者购买。',stages:[
  c=>E('没有客人的开场',['祝停云在废宫戏台上演灾变那夜。第一排只有一位穿素衣的女人，看到门被推开便起身要走。','台柱挂着资助人的印绳，戏本上删去了最后一折。停云说，若不删，今晚连台上的灯都点不起。'],[
   C('support','付十二枚灵石，让戏能演完这一夜','支付12灵石；恢复6生命。','灯没有灭。素衣女人没有因此坐回原处，停云也没把你的灵石当成她必须留下的理由。',{goldCost:12,heal:6}),
   C('ask','征求她们同意，听删去的那一折','下一战首回合护盾+6。','女人只肯说自己是幸存者，不肯说名字。停云合上戏本，先把她不愿登台的部分遮住。',{guard:6}),
   C('job','接受替戏班运灯的活计','获得12灵石。','你按约运灯，领到劳酬。谁出的灯油不等于谁有权替所有人编结局。',{goldGain:12})]),
  c=>E('戏本上不能写的人',['资助人要戏班把开门的命令改成“妖物蛊惑”，承诺再付三夜灯油。幸存者却认得下令的人，也认得那位出资者的印绳。','停云问素衣女人是否愿意作证。她回答：“我可以说我见过什么，不想每晚把那一夜再死一次。”'],[
   C('consent','分开证言与演出，允许当事人撤回','支付10灵石另抄案卷；获得1枚回气丹。','证言交给能查证的人，戏本另行征得同意。停云没有再拿“替她发声”当成越过她的理由。',{goldCost:10,...item('healing_pill')}),
   C('anon','演出时隐去能辨认幸存者的细节','下一战首回合护盾+10。','观众听见了命令，也不能靠一场戏找到那位女人的住处。停云知道隐去身份仍不等于万无一失。',{guard:10}),
   C('patron','按资助者要求删掉指认部分','获得26灵石灯油余款。','灯确实能继续亮。素衣女人把未采用的证言收走，说会找别的去处，而不是再坐在那张椅子上。',{goldGain:26})]),
  c=>E('谁来决定散场',[c.p(2)==='patron'?'戏班仍在演出，素衣女人另立了一份证言。没有人再把台上版本当成她已经同意的真相。':'证言有了单独的去处。停云改演后来人怎样互相救助，素衣女人有时看，有时也只是路过。','停云问你，要不要留一个响亮的名字在最后一折。她先补上一句：“不留，也不会少你一份劳酬。”'],[
   C('unnamed','不留英雄姓名，把劳酬结给所有人','获得18灵石及对应主角功法。','台上的灯不只照着一个英雄。搭台、递水、先开口的人，都在劳酬册里有自己的位置。',{goldGain:18,cardIds:[gift(c.role)]}),
   C('fund','付十六枚灵石，保留不依附资助者的一夜','支付16灵石；获得2份凝露叶。','停云把这一夜留给当事人选择说或不说。买下的不是他们的故事，是不用先讨谁欢心的灯油。',{goldCost:16,...item('dewherb',2)}),
   C('audience','只当一个能够中途离席的观众','恢复14生命。','你在散场前离开，台上没有因此追问。那张空椅子终于可以只是空椅子。',{heal:14})])]},
 well:{name:'守井的人',person:'井娘',theme:'公共的清白若建立在看不见的劳作上，称赞便可能成了另一种索取。',stages:[
  c=>E('井绳磨出的伤',['井娘每天更换滤井铜轮，双手缠满布条。管事挂起洁水玉印，告诉过路人此处受宗门庇佑。','她没有否认玉印有用，只请管事拨一个人替班。管事说大家都很忙，又问她还需要多少药。'],[

   C('repair','检查铜轮与玉印各自的作用','下一战首回合护盾+6。','玉印确能压住一部分污秽，铜轮同样不可少。你把两者记在同一张纸上，不只抄门派的名字。',{guard:6}),
   C('water','按价买一份净水，不问井中事','支付6灵石；恢复10生命。','水很干净，伤口也不再发烫。井娘收清水资，再次把伤手缠紧。',{goldCost:6,heal:10})]),
  c=>E('玉印背面的名字',['井娘被请去接受褒奖，井却没有人接手。管事指着墙上的荣名说她该知足；新来的伤者只问为何今日无水。','她承认玉印与药资都帮过忙，也问：“被写进匾里以后，我是不是就不能说做不动？”'],[
   C('rota','把药资的一部分改为轮班劳酬','支付10灵石补足第一班；下一战首回合护盾+10。','管事起初说预算不能改，伤者却愿意公开见证新的用度。井娘终于不是唯一不能拒绝的人。',{goldCost:10,guard:10}),
   C('repair','先修好能减轻劳作的铜轮','支付16灵石；获得1枚百草解厄丹。','铜轮转得轻了一些，但仍要有人值守。你们没有拿一件器物宣称从此不再有人受累。',{goldCost:16,...item('antidote')}),
   C('medal','替她领回褒奖与药资','获得20灵石公开发放的路费。','井娘接了药，也把“不再独自守井”的请求另写一张。她没有把被称赞当成问题已经解决。',{goldGain:20})]),
  c=>E('井边多出来的凳子',[c.p(2)==='rota'?'井边轮值簿添了几个名字，井娘只在愿意的日子守井。管事的玉印还在，没有因此少一份应有的功劳。':c.p(2)==='repair'?'新铜轮减轻了伤势，后来几个人自发来帮手。井娘把办法留给他们，也留下随时可以退出的期限。':'井娘最终另找了愿付劳酬的水站。旧井停了两日，众人才学会玉印不会自己转动铜轮。','她给你留一壶水，不再说自己什么都不需要。'],[
   C('take','收下净水与护井药','恢复16生命，获得1枚百草解厄丹。','井娘把自己的药先收好，才分给你多出的那一份。你们谁也不必先把自己耗尽，才有资格帮人。',{heal:16,...item('antidote')}),
   C('share','支付十八枚灵石，补下一轮的劳酬','支付18灵石；获得对应主角功法与下一战首回合护盾+10。','这笔灵石写明用途，也写明谁可以查账。援手不再全靠井娘一直不好意思拒绝。',{goldCost:18,guard:10,cardIds:[gift(c.role)]}),
   C('rest','坐在井边，喝完水再走','恢复12生命。','她也坐下来。管事路过时想说两句，最后自己提起了下一桶水。',{heal:12})])]}
 };
 const CHAINS=Object.fromEntries(Object.entries(CHAIN_DEFS).map(([id,value])=>[id,{id,...value,artId:'tale_'+id}]));
 const META=Object.fromEntries(Object.keys(CHAINS).flatMap(chain=>[1,2,3].map(step=>['tale_'+chain+'_'+step,{chain,step,artId:'tale_'+chain+'_'+step}])));
 const INTERRUPT_IDS=['campfire_hunt','road_aftermath'];
 const ART_IDS=[...Object.values(META).map(m=>m.artId),'ambush_campfire','road_aftermath','cave'];
 function artId(id){return META[id]?.artId||(id==='campfire_hunt'?'ambush_campfire':id==='road_aftermath'?'road_aftermath':id);}
 function build(id,state){const meta=META[id];if(!meta)return null;const chain=CHAINS[meta.chain],record=state.journey.tales?.chains?.[meta.chain];if(!record||record.stage!==meta.step-1||state.floor<(record.floors?.[meta.step-1]||1))return null;
  const c={role:state.character,p:n=>record.choices[n]?.key};const e=chain.stages[meta.step-1](c);return {id,...e,tale:{chain:meta.chain,step:meta.step},glyph:'缘',kicker:'雾中相逢',description:e.story[0],connection:record.lastOutcome||'',choices:e.choices};}
 const api={CHAINS,META,EVENT_IDS:[...Object.keys(META),...INTERRUPT_IDS],INTERRUPT_IDS,ART_IDS,artId,build};root.NightTales=api;if(typeof module!=='undefined'&&module.exports)module.exports=api;
})(typeof globalThis==='object'?globalThis:window);

<script>
/* 镇境旧事：任务只在本局已抽定的镇境者所在地域出现。 */
(function(root){
 'use strict';
 const QUESTS={
  lotus_boss:{title:'空席上的热茶',items:['puppet_key','puppet_voice'],ward:null,stages:[
   {name:'灰里的一把钥匙',story:['烧毁的宅门外，一名老木匠拿着账簿。寻宝客付过修门灵石，纵火时却把他的女儿也关在了屋里。','他从灰里捡出主人的备用铜匙。那人曾替穷邻免过租，也替掠夺器谱的客人开过门。善意没有认清来人，留下的却是机仆一遍遍烧热的茶。'],act:'帮木匠安葬遗骨，接过铜匙',paid:'付 15 灵石，赎回铜匙',take:'替木匠护送木料，收下谢礼',outcome:'你把遗骨一一收好。木匠交出铜匙，叮嘱你别再把“守家”说成“复仇”。',paidOutcome:'他收下灵石，为女儿买最后一盏魂灯；铜匙留在你手中。'},
   {name:'留声簧里缺掉的半句',story:['一名修器女修正在听一枚开裂的留声簧。她曾替寻宝客修好开门的灵械，如今说自己当时并不知道他们要做什么。','簧片仍能拼出主人的末句话：“看好家……别追出去，救活着的人。”缄红听到的恰好只有前半句。女修既怕担责，又不愿让误听继续杀人。'],act:'陪她署名作证，修复留声簧',paid:'付 15 灵石，请她修复留声簧',take:'不取簧片，换取她的修器酬劳',outcome:'你陪她把名字刻在证词上。她把修复的簧片交给你，不再声称自己毫无关系。',paidOutcome:'灵石付清，簧片恢复完整。她依然不肯署名，却终于肯把主人的话还给缄红。'},
   {name:'门前仍有一双鞋',story:['故宅近在眼前。门阶上的鞋被擦得干净，鞋主人却永远不会回来。一个孩子说，机仆夜里仍给失踪的人缝冬衣。','孩子记得两件事：备用铜匙能开家令心匣，完整留声簧能让她听见主人最后的叮嘱。少一件，都只能闯过仍将来客视为凶手的家政机关。'],advice:'收好铜匙与留声簧，进门时会自动唤醒缄红；只有传闻、只有一件物品都无法止战。'}]},
  gate_boss:{title:'灯照不到的名字',items:['gate_names','gate_wick'],ward:'playerMark',stages:[
   {name:'渡簿上的空白',story:['桥头抄写人请求你帮他辨认泡湿的名册。当年他把无力交灵石的难民写成“无名”，好让渡灯人不必逐一记下他们的死。','他保住了自己的差事，也把那些人从被寻找的可能中抹去。如今灯影按着空白名单索人，他想补名字，却不敢让家属看见旧笔迹。'],act:'陪他补录亡者姓名',paid:'付 15 灵石，雇人核对名册',take:'替渡口搬灯，领取酬劳',outcome:'家属认出了旧笔迹，也认出了迟来的名字。抄写人没有得到宽恕，却交出一份不再空白的渡簿。',paidOutcome:'核验人把每个名字读过一遍。灵石买来了人手，没有买来原谅。'},
   {name:'最后一寸归灯芯',story:['一位老妇藏着照微用过的灯芯。她曾央求渡灯人多留一夜，等儿子归来；多留的那一夜里，渡口最后一船人再没出发。','老妇不愿承认儿子已经不在，也知道灯芯应该回到渡口。她问你，若把等待也拿走，一个人还能靠什么活下去。'],act:'听完她的话，接下旧灯芯',paid:'付 15 灵石，为她另点家灯',take:'替她整理屋舍，收下报酬',outcome:'你没有保证儿子会回来，只记下她想写给儿子的话；你没有接下一个并未完成的送信任务。她把旧灯芯交给了你。',paidOutcome:'新的家灯亮起。她仍会等，却让你把渡灯人的灯芯带回桥头。'},
   {name:'一盏不必再等的灯',story:['灯影里的人不断报出别人的名字，唯独没叫过自己。渡灯人的职责变成了不许任何人离开的理由。','补全的渡簿能抵去她首次追索印；归灯芯可在开战时护住你。她不会因为几句劝告放下灯，但你至少知道自己正在面对什么。'],advice:'携带补名渡簿：抵消本次战斗首次施加追索印；携带归灯芯：首回合额外 8 护盾。'}]},
  camp_boss:{title:'活人的誓书',items:['camp_ledger','camp_seal'],ward:'energyPenalty',stages:[
   {name:'营外的欠命簿',story:['一名退役守卒拿出欠饷簿，想用它换盘缠。闻铮当年按誓书把逃兵送回营地，也曾替全营扣下最后一份救命药。','簿子上后来改过一行：用来救军官的药，写成了救全营。守卒签过字；他如今想揭穿谎话，也想让自己的签名先消失。'],act:'保留原签名，替他誊清真账',paid:'付 15 灵石，买下未删改的账簿',take:'只接搬运差事，收取酬劳',outcome:'账簿没有洗掉任何名字。守卒把它交给你，第一次承认自己既是受害者，也做过帮凶。',paidOutcome:'他收下盘缠，却没能收回自己的签名。原账留在你这里。'},
   {name:'不再发号施令的印',story:['断营里的军医保管着旧营印。她用它骗过几次关卡，带走伤卒，也用它留下过她认为“还有用”的人。','她说放下印意味着再也不能命令别人牺牲。说完之后，她仍问你，若明天没有命令，谁来决定救谁。'],act:'带走营印，也记下她的选择',paid:'付 15 灵石，为伤卒备药换印',take:'协助清点营物，领取酬劳',outcome:'你没有替她辩白。她把营印放进布袋，不再要求你替她证明每个决定都是对的。',paidOutcome:'药箱留给伤卒，旧营印归你。救援不再以一纸军令作抵押。'},
   {name:'誓言留给谁',story:['闻铮的誓墙还在，墙下的名字却一半是被“保护”到再也无法离开的人。','原账能让你识破她首次封灵军令；旧营印可护住开战一刻。证据不自动结束争斗，它只是让人没那么容易再把服从误当成救命。'],advice:'携带欠命原账：抵消本次战斗首次封灵；携带旧营印：首回合额外 8 护盾。'}]},
  snake:{title:'旧鳞下的药方',items:['snake_formula','snake_scale'],ward:'poison',stages:[
   {name:'药摊后的试方簿',story:['采药人把发黑的试方簿压在摊底。绛鳞曾借自己的蛇毒救过疫民，商盟随后逼她加量，好把稀药卖到雾外。','采药人抄过那张加量的方子，得的灵石已经换成家人的口粮。他不敢把药全扔掉，也不敢再把下一瓶交出去。'],act:'陪他封存毒药，核验原方',paid:'付 15 灵石，买下未加量的原方',take:'只替他运送无毒草药，收取酬劳',outcome:'毒药封进石匣。你留下原方，他留下自己签过的加量记录；没有谁因此变得清白。',paidOutcome:'原方回到你手里。采药人还得决定怎样面对那些买过药的人。'},
   {name:'不该拿去抵债的旧鳞',story:['桥下的孩子藏着一片蜕鳞，说绛鳞曾用它替病母挡寒。母亲后来仍没活下来，债主却拿鳞片算起了利息。','孩子想把它卖掉离开，又怕最后连那次无偿的善意也像一笔交易。他不知道该恨谁，只是不想再欠谁。'],act:'替他核销虚账，收存旧鳞',paid:'付 15 灵石，替他赎回旧鳞',take:'替他送一趟药，领取酬劳',outcome:'假账被逐条划去。孩子让你带走旧鳞，免得它再成为讨债的凭据。',paidOutcome:'债契当面烧尽。旧鳞归你，孩子终于能不背着利息离开。'},
   {name:'蛇息前的一缕药香',story:['药香越近，越能看见石壁上实验的编号。绛鳞的沉默不是没有记忆，而是不再信任来取药的人。','按原方配出的药引可以挡下首次蛇毒；旧鳞可护住首回合。蜕鳞仍会清除猎印，绞缠也仍是三段攻击，准备并不等于免去防守。'],advice:'携带未改原方：抵消本次战斗首次施毒；携带避寒旧鳞：首回合额外 8 护盾。'}]},
  bell_boss:{title:'钟声里的第二个人',items:['bell_names','bell_mallet'],ward:'drawPenalty',stages:[
   {name:'没有写进丧帖的人',story:['抄丧帖的女修在墙角重写一份名单。晚蘅曾替无人收尸的人敲钟，灾变后，雇她的人却把异乡死者从丧帖里划掉。','女修照做过。她当时需要灵石送弟弟出域，如今弟弟安全了，那些被划掉的人仍一遍遍从钟里喊她。'],act:'陪她访认遗物，补全丧帖',paid:'付 15 灵石，请她重新刻帖',take:'帮她送纸灯，收取酬劳',outcome:'每认出一件遗物，她就补上一个名字。她没有再说自己只是照吩咐办事。',paidOutcome:'新帖保留了旧帖上的划痕。补刻没有假装当年的删除从未发生。'},
   {name:'敲钟人的手还在发抖',story:['曾为晚蘅铸钟的匠人留下了木槌。他发现钟腔会吞下未尽的愿望，却为了让工坊活下去，把这个发现写成了“余韵绵长”。','他把木槌举起又放下，说那口钟最初真的只想送人一程。谎话越小，延长它的理由反而越多。'],act:'让他写下实情，收下木槌',paid:'付 15 灵石，赎回封存木槌',take:'协助整理铸件，领取酬劳',outcome:'匠人在槌柄刻下自己的名字和钟的缺陷。木槌终于不再是一件待价而沽的名作。',paidOutcome:'工坊收下赎价，木槌归你。槌柄上的裂缝比柜上的价签更值得记住。'},
   {name:'钟停之前的一次呼吸',story:['山风进了钟楼，却没带走任何回声。晚蘅记得每个名字，已经分不清自己是在送别，还是在逼死者留下作伴。','补全的丧帖能抵消她首次封住抽牌的余响；旧木槌可护住第一回合。先安排防守，再决定何时将积蓄的力量交出去。'],advice:'携带补刻丧帖：抵消本次战斗首次抽牌封印；携带旧送魂槌：首回合额外 8 护盾。'}]}

    function makeCard(id) { return { uid: `card-${++serial}`, id }; }
    function rand(n) { return Math.min(n - 1, Math.max(0, Math.floor(rng() * n))); }
    function shuffle(items) {
      const array = items.slice();
      for (let i = array.length - 1; i > 0; i--) {
        const j = rand(i + 1);
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }
    function sample(pool, count) { return shuffle(pool).slice(0, count); }
    function setStoryNode(map,floor,id,{all=false,name='雾中异迹'}={}) {
      const row=map[floor-1],targets=all?row:[row.find(n=>n.type==='event'&&!n.storyId)||row.find(n=>!n.storyId)||row[row.length-1]];
      for(const node of targets){node.type='event';node.storyId=id;delete node.encounter;node.name=name;node.description='这条路上，留下了一段尚未完成的相逢。';}
      if(!all&&floor>1){
        const previous=map[floor-2],required=targets[0].id;
        for(const source of previous)if(!source.next.includes(required))source.next.push(required);
        const storyTargets=new Set(row.filter(node=>node.storyId).map(node=>node.id));
        const incoming=id=>previous.reduce((count,source)=>count+Number(source.next.includes(id)),0);
        for(const source of previous)while(source.next.length>3){
          let index=source.next.findIndex(id=>!storyTargets.has(id)&&incoming(id)>1);
          if(index<0){
            index=source.next.findIndex(id=>!storyTargets.has(id)&&previous.some(other=>other!==source&&other.next.length<3&&!other.next.includes(id)));
            if(index<0)break;
            const destination=source.next[index],other=previous.find(other=>other!==source&&other.next.length<3&&!other.next.includes(destination));other.next.push(destination);
          }
          source.next.splice(index,1);
        }
      }
    }
    function sevenEventAvailable(def, floor=state?.floor||1, regionIndex=state?.journey?.regionIndex||0) {
      if (legacyCampaign || !def) return false;
      if (Number.isInteger(def.minFloor) && floor < def.minFloor) return false;
      if (Number.isInteger(def.maxFloor) && floor > def.maxFloor) return false;
      if (Number.isInteger(def.regionIndex) && regionIndex !== def.regionIndex) return false;
      if (Array.isArray(def.regionIndex) && !def.regionIndex.includes(regionIndex)) return false;
      return true;
    }
    function makeSevenBuilders(p) {
      return Object.fromEntries(Object.entries(SEVEN.EVENTS || {}).map(([id,def])=>[id,()=>{
        const choices=def.choices.map(original=>{
          const choice={...original};
          if (choice.cardRarity) {
            const pool=cardPool().filter(cardId=>CARDS[cardId].rarity===choice.cardRarity);
            choice.cardIds=sample(pool.length?pool:cardPool(),Math.max(1,choice.cardCount||1));
          }
          return choice;
        });
        return {id,name:def.name,glyph:def.glyph||'异',kicker:def.kicker||'雾后见闻',description:def.description||def.story[0],story:def.story.slice(),choices:finishChoices(choices,p)};
      }]));
    }

    const TALE_SLOTS = [[6,26,46],[8,38,58],[12,32,62]];
    function initializeTales(){
      const selected=sample(Object.keys(TALES.CHAINS),3);
      state.journey.tales={selected,chains:Object.fromEntries(selected.map((id,i)=>[id,{stage:0,choices:{},floors:TALE_SLOTS[i].map(f=>state.character==='sovereign'&&f===26?36:f),lastOutcome:''}])),nextRoadAt:12,roadVisits:0,lastHuntFloor:-99,hunts:0};
    }
    function prepareTaleOpportunity(){
      const tales=state.journey.tales;if(!talesEnabled||!tales)return;
      for(const [id,record]of Object.entries(tales.chains)){
        const step=record.floors.indexOf(state.floor)+1;
        if(!step||record.stage!==step-1)continue;
        // Attach only to a genuinely connected node; never add or remove route edges.
        const choices=(state.map[state.floor-1]||[]).filter(n=>state.availableNodes.includes(n.id)&&!n.storyId&&!n.encounter&&n.type!=='boss');
        const node=choices.find(n=>n.type==='event')||choices[0];
        if(node){node.type='event';node.storyId=`tale_${id}_${step}`;node.name=step===1?'雾中来人':'路旁灯影';node.description='雾里的这段路上，有人停在灯下。';}
      }
    }
    function witnessedAid(){
      const chains=state.journey.tales?.chains||{};
      const evidence=[['medicine','杜蘅',['testify','move']],['bridge','石砚',['witness']],['name','许渡',['record']],['letter','阿筠',['consent']]];
      return evidence.filter(([id,,keys])=>keys.includes(chains[id]?.choices[2]?.key)).map(([,name])=>name);
    }
    function interruptionFor(node){
      const tales=state.journey.tales;
      if(!talesEnabled||!tales||node.storyId||node.encounter||node.type==='boss')return null;
      if(node.type==='rest'&&state.character==='sword'&&state.player.path.fallen&&tales.hunts<2&&state.floor-tales.lastHuntFloor>=8){
        tales.lastHuntFloor=state.floor;tales.hunts++;
        return 'campfire_hunt';
      }
      if(node.type==='fight'&&state.history.length>=tales.nextRoadAt&&tales.roadVisits<3){
        tales.roadVisits++;tales.nextRoadAt=state.history.length+14;
        return 'road_aftermath';
      }
      return null;
    }

          ...(witnesses.length?[{key:'witness',label:'出示已经发生过的见证，请她核查',text:'凭此前助人的真实记录交涉；不支付灵石、不战斗，继续使用原休息点。',resumeRest:true,outcome:`你没有要求她因为一纸见证就原谅一切，只请她先核查${witnesses.join('、')}能证明的事实。巡使收起封息符，仍远远守着火塘，却让出了供你调息的位置。`}]:[]),

      if (idOrNull !== null) state.player.deck.push(makeCard(idOrNull));
      if(state.battle?.storyEncounter?.resumeRest&&state.interruption){resumeInterruptedRest();}else advance();
      emit();
      return true;

      if (Object.prototype.hasOwnProperty.call(choice, 'relic')) {

  function regionRows(){const range=regionRange();return (game.state.map||[]).filter(row=>row[0]&&row[0].floor>=range[0]&&row[0].floor<=range[1]);}
  function afflictionStatus(){return game.getAffliction?.()||game.state.player.affliction||{active:false,revealed:false,ticks:0};}
  function practiceStatus(){const p=game.state.player;return {fallen:heroId()==='sword'&&!!p.path?.fallen,learned:heroId()==='sword'&&!!p.path?.learned,protected:!!p.questItems?.includes('clearheart_jade')};}
  function symbol(key,cls=''){
    const geometry={fight:'M18 10 45 40M11 17l7-7 7 7M38 33l7 7-7 7M46 10 19 40M53 17l-7-7-7 7M26 33l-7 7 7 7',elite:'M32 7 42 23l15 9-15 9-10 16-10-16-15-9 15-9Z M32 20v24M20 32h24',boss:'M11 17 23 24 32 9 41 24 53 17 48 46H16Z M19 54h26',rest:'M10 42h44M16 42c-3-10 3-15 3-21M31 41c-4-13 6-15 2-28M46 41c-3-10 3-15 3-21',shop:'M9 26h46l-6-14H15Z M14 26v27h36V26M26 53V37h12v16',fox:'M13 12 24 23h16l11-11-5 27-14 15-14-15Z M23 32l5 3M41 32l-5 3M28 43h8',event:'M18 12h28v40H18Z M24 21h16M24 29h12M26 43l6-8 6 8',affliction:'M32 8C18 27 17 32 17 38a15 15 0 0 0 30 0c0-6-1-11-15-30Z M22 36l20 7M24 28l16 7',suppressed:'M32 7 51 16v18c0 12-11 20-19 24-8-4-19-12-19-24V16Z M22 32h20M32 22v20',cleansed:'M15 34l11 11 24-27M9 16l6-7M48 49l7 7',fallen:'M33 7C17 23 45 27 24 45c-8-3-12-9-10-17C0 45 24 62 42 52c20-12 9-33 1-39 3 12-5 16-6 19 1-9-3-17-4-25Z',clearheart:'M23 10h18l9 18-18 28L14 28Z M23 10l9 18 9-18M14 28h36M32 28v28',environment:'M5 49 22 20l9 16L42 13l17 36Z M17 49l8-13M38 49l6-17',weapon:'M44 7 54 17 29 42 20 44 22 35Z M14 39l11 11M19 45l-9 9',learned:'M9 13c9-3 16-2 23 3 7-5 14-6 23-3v37c-9-3-16-2-23 3-7-5-14-6-23-3Z M32 16v37M16 23l9 2M16 32l9 2M39 25l9-2M39 34l9-2',poison:'M32 8C18 27 17 32 17 38a15 15 0 0 0 30 0c0-6-1-11-15-30Z M24 41l16-9M24 32l16 9',soul:'M32 9c-16 0-22 12-18 25l-4 13 14-2 8 10 8-10 14 2-4-13C54 21 48 9 32 9Z M23 27v6M41 27v6',swordIntent:'M32 6 38 16 35 43h-6l-3-27Z M20 43h24M32 43v15M11 13l7 7M53 13l-7 7',block:'M32 7 51 16v18c0 12-11 20-19 24-8-4-19-12-19-24V16Z',relic:'M32 8 50 19v26L32 56 14 45V19Z M32 20l11 12-11 12-11-12Z'};
    const art=globalThis.YokaiArt?.icons?.[key]||`<svg viewBox="0 0 64 64" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="${geometry[key]||geometry.relic}"/></g></svg>`;
    return `<span class="symbol-mark ${cls}" aria-hidden="true">${art}</span>`;
  }
  function statusIcon(id,key,label='查看气息',tone=key){return btn('status',symbol(key),'status-icon status-tone-'+tone,`data-status="${id}" aria-label="${label}"`);}
  function statusMarkup(){
    const a=afflictionStatus(),c=practiceStatus(),e=game.getEnvironment?.(),items=[];
    if(a.revealed)items.push(statusIcon('affliction',!a.active?'cleansed':a.suppressed?'suppressed':'affliction','查看伤势'));
    if(c.fallen)items.push(statusIcon('fallen','fallen','查看气息'));
    if(c.protected)items.push(statusIcon('clearheart','clearheart','查看随身玉佩'));
    if(e)items.push(statusIcon('environment','environment','察看四周'));
    if(game.state.player.equippedWeapon)items.push(statusIcon('weapon','weapon','查看随身兵刃'));
    return items.length?`<div class="status-icons" aria-label="随身气息">${items.join('')}</div>`:'';
  }
  function combatStatusMarkup(b){const items=[];
    if(b.poison)items.push(statusIcon('poison','poison','查看伤势'));


    if(game.state.player.power)items.push(statusIcon('power','soul'));


    if(b.bloodPower)items.push(statusIcon('bloodPower','fallen','查看气息'));
    if(b.riposte)items.push(statusIcon('riposte','block'));

    if(b.pillPower)items.push(statusIcon('pillPower','strength','查看气息'));
    if(b.nextEnergyPenalty||b.nextDrawPenalty)items.push(statusIcon('sealed','weak','查看气息'));
    return items.length?`<div class="combat-status-icons" aria-label="战中气息">${items.join('')}</div>`:'';
  }
  function enemyStatusMarkup(e,revenge=!!game.getIntent?.()?.revengeBonus){const items=[];
    for(const [id,key,name,value] of [['enemy-mark','event','猎印',e.mark],['enemy-chill','frost','霜寒',e.chill],['enemy-condensation','resistance','凝寒',e.chillProgress],['enemy-bleed','bleed','流血',e.bleed],['enemy-poison','poison','毒',e.poison],['enemy-counter','counter','反击',e.counter],['enemy-heat','fire','蓄热',e.heat]]){
      if(value>0)items.push(resourceStatus(id,key,name,value));
    }
    if(e.id==='m01'&&e.hp<=e.maxHp/2&&e.frenzyUses<3)items.push(resourceStatus('enemy-frenzy','blood','饥乱',3-e.frenzyUses));
    if(e.id==='m26'&&!e.shellUsed)items.push(resourceStatus('enemy-lifeShell','resistance','代死账',1));
    if(e.id==='m17'&&e.jarBroken)items.push(resourceStatus('enemy-jar','block','瓮裂',3));
    if(e.thinPowder)items.push(resourceStatus('enemy-powder','weak','薄粉',2));
    if(e.hesitation)items.push(resourceStatus('enemy-hesitation','strength','未决蓄势',2));
    if(e.armorPenalty)items.push(resourceStatus('enemy-armor','block','甲隙',2));
    if(revenge)items.push(statusIcon('enemy-revenge','household','查看机关家令'));
    return `<div class="enemy-status-icons" aria-label="敌方已生效状态">${items.join('')}</div>`;
  }
  function resourceStatus(id,key,name,value){return btn('status',symbol(key)+`<b class="status-stack" id="${id}">${value}</b>`,'enemy-status-badge',`data-status="${id}" aria-label="${name} ${value} ${['反击','薄粉','未决蓄势','甲隙','瓮裂'].includes(name)?'点':['代死账','饥乱'].includes(name)?'次':'层'}，点按查看规则"`);}
  function deltaMarkup(key){const c=resourceChanges.get(key);return c&&c.until>Date.now()?`${c.amount>0?'+':''}${c.amount}`:'';}
  function classResource(key,name,value,cap){return btn('status',`${symbol(key)}<span class="resource-reading" aria-live="polite" aria-atomic="true">${name} <b id="${key}-value">${value||0}</b><small id="${key}-full" ${(value||0)===cap?'':'hidden'}>已满</small></span><em id="${key}-change" class="resource-change">${deltaMarkup(key)}</em>${['swordIntent','soul'].includes(key)?`<span class="resource-steps" aria-hidden="true">${Array.from({length:cap},(_,i)=>`<i class="${i<value?'filled':''}"></i>`).join('')}</span>`:''}`,'class-resource '+((value||0)===cap?'is-full':''),`data-resource="${key}" data-status="${key}" aria-label="${name} ${value||0}，点按查看规则"`);}
  function componentText(b){const out=[];if(game.state.player.relics.includes('bell'))out.push('金铃：'+(b.bellUsed?'本回合已触发':'本回合待触发'));if(game.state.player.relics.includes('jade'))out.push('磨爪玉：'+(b.jadeUsed?'已触发':'第3张牌结算后触发'));return out.join(' · ');}
  function temporaryResourceText(b){return [b.orbit?'御剑 '+b.orbit+'（回合末'+(isFallen()?Math.floor(b.orbit/2):b.orbit)+'伤害后减1）':'',b.swordFormation?'两仪剑阵 每回合护盾+'+(isFallen()?Math.floor(b.swordFormation/2):b.swordFormation):'',b.clearSwordHeart?'剑心 每回合剑意+'+b.clearSwordHeart:'',b.silkGuard?'燃香 首次藏招护盾+'+b.silkGuard:'',b.trapPower?'织梦 藏招首段+'+b.trapPower:'',b.drawWard?'北海 抽到攻击护盾+'+(isFallen()?Math.floor(b.drawWard/2):b.drawWard):'',(b.nextAttack||0)>0?`蓄势 ${b.nextAttack}（首段增幅合计上限 ${NightPact.BALANCE.firstHitBonusCap}）`:'',b.nextEnergy||b.nextDraw?`下回合：灵力＋${b.nextEnergy||0} · 抽牌＋${b.nextDraw||0}`:''].filter(Boolean).join('；');}
  function coreResourcesMarkup(b){const id=heroId();return `<section class="combat-resource-panel" aria-label="核心战斗资源"><div class="resource-main">${id==='hehuan'?`<div class="class-resource"><b>薄纱藏招</b><span>已藏 ${b.traps?.length||0} 张 · 本回合出牌 ${b.played}</span></div>`:id==='sword'?classResource('swordIntent','剑意',b.swordIntent,8):id==='sovereign'?classResource('soul','魂息',b.soul,6):`<div class="class-resource combo-resource" aria-label="本回合已出牌 ${b.played} 张"><span>本回合已出牌 <b id="played-value">${b.played}</b> 张</span><small id="component-status">${esc(componentText(b))}</small></div>`}<div class="resource-vitals" aria-label="灵力与护盾"><span>灵力 <b id="core-energy">${b.energy}</b></span><span>护盾 <b id="core-block">${b.block}</b></span></div></div><div id="temporary-resources" class="temporary-resources">${esc(temporaryResourceText(b))}</div><div id="pursuit-resource" class="pursuit-resource" ${b.playerMark?'':'hidden'}>${btn('status',symbol('event')+`<span>追索印 <b id="pursuit-value">${b.playerMark||0}</b></span>`,'resource-status',`data-status="playerMark" aria-label="追索印 ${b.playerMark||0} 层，点按查看规则"`)}</div></section>`;}
  function statusDetail(id){if(id==='enemy-lifeShell')return {title:'代死账',key:'resistance',text:'首次致命伤保留1生命，与借壳治疗共用一次额度；任一效果用过后，本战另一效果也耗尽。'};if(id==='enemy-jar')return {title:'瓮裂',key:'block',text:`单张攻击牌累计削盾达到${game.state.battle?.factionDef?.budgetD||6}点，抱紧的护盾此后减少3。连击按同一张牌累计。`};if(id==='enemy-powder')return {title:'薄粉',key:'weak',text:'下一张攻击牌首次造成生命伤害的那一段额外+2，只一次；被护盾完全挡住时不消耗。'};if(id==='enemy-hesitation')return {title:'未决蓄势',key:'strength',text:'上一完整玩家回合未受生命伤害，已蓄存下一次攻击首段+2；最多储存一次，用后清除。'};if(id==='enemy-armor')return {title:'甲隙',key:'block',text:'旧甲已被实际破盾，下次守桥护盾减少2，仅一次。这是已生效的缺口，不显示下一招。'};if(id==='enemy-heat')return {title:'蓄热',key:'fire',text:'当前蓄热1，下一次攻击首段额外3，随后消耗；不会透露下一招。'};if(id==='enemy-frenzy')return {title:'饥乱',key:'blood',text:'已低于半血，后续每段攻击+1，每次行动后自损2，最多三次。'};const a=afflictionStatus(),c=practiceStatus(),b=game.state.battle||{},e=game.getEnvironment?.(),w=weaponStatus();
    const details={
      affliction:a.revealed?{title:a.active?'缠脉余毒':'毒脉已清',key:!a.active?'cleansed':a.suppressed?'suppressed':'affliction',text:a.active?`毒性仍伏在经脉之中。每进入一处地标或玩家回合开始时，失去 1 生命；寻常治疗无法祛除。${a.suppressed?`药力尚能护住接下来的 ${a.suppressed} 次发作。`:'可在夜市求药，或在休息时运气压制。夜市药散可护住 6 次发作，静息调脉可护住 4 次。'}`:'经脉中的余毒已散，气息重新顺畅。'}:null,
      fallen:c.fallen?{title:'功法生涩',key:'fallen',text:'因心境异变，部分旧有功法难以运转。霜锋仍在掌中，只是熟悉的行气之法已不再如初。'}:null,
      clearheart:c.protected?{title:'随身清玉',key:'clearheart',text:'玉色澄明，贴身微凉。纷杂的念头掠过时，掌心仍留着一分宁静。'}:null,
      learned:c.learned?{title:'新习秘术',key:'learned',text:'你记下了残页中的行气之法。新学的招式已收入牌组，可在牌面查阅其效用。'}:null,
      environment:e?{title:e.name,key:'environment',text:e.text}:null,
      weapon:game.state.player.equippedWeapon?{title:w.name,key:'weapon',text:[WEAPONS[w.id]?.text||WEAPONS[w.id]?.description,weaponOmen()||(!w.controlled?'器中灵息躁动，尚难完全驾驭。':'掌中兵刃灵息平稳。')].filter(Boolean).join(' '),equipment:true}:null,
      poison:b.poison?{title:'毒附经脉',key:'poison',text:`当前附毒 ${b.poison} 层。玩家回合开始时，失去等同层数的生命，随后毒减少 1 层；毒伤无视护盾。`}:null,
      playerMark:b.playerMark?{title:'追索印缠身',key:'event',text:`当前追索印 ${b.playerMark} 层，上限 5 层。敌人下一次有攻击的行动，第一段伤害额外增加 ${b.playerMark}，随后追索印全部消散。新施加的追索印会留到后续行动；护盾仍可抵挡这部分伤害。`}:null,
      soul:heroId()==='sovereign'?{title:'魂息流转',key:'soul',text:`当前魂息 ${b.soul||0}，最多积蓄 6。依具体牌面蓄积或消耗，跨回合保留。`}:null,
      power:game.state.player.power?{title:'旧力归身',key:'soul',text:`当前归身之力 ${game.state.player.power}，每张攻击的第一段额外获得对应伤害。`}:null,
      swordIntent:heroId()==='sword'?{title:'剑意凝锋',key:'swordIntent',text:`当前剑意 ${b.swordIntent||0}，最多积蓄 8。剑意跨回合保留，只有指定剑诀会将其消耗。`}:null,
      nextAttack:b.nextAttack?{title:'静候破绽',key:'weapon',text:`下一张攻击的第一段额外造成 ${b.nextAttack} 伤害，回合结束后散去。`}:null,
      bloodPower:b.bloodPower?{title:'血契余势',key:'fallen',text:`本场血力 ${b.bloodPower}，随攻击发动。`}:null,
      riposte:b.riposte?{title:'守势待发',key:'block',text:`反击 ${b.riposte}，依牌面规则在敌人进攻时发动。`}:null,

      pillPower:b.pillPower?{title:'丹火行脉',key:'strength',text:`本场战斗每张攻击牌的第一段伤害 +${b.pillPower}。战斗结束后散去。`}:null,
      sealed:b.nextEnergyPenalty||b.nextDrawPenalty?{title:'经脉受封',key:'weak',text:`下个玩家回合少获得 ${b.nextEnergyPenalty||0} 点灵力，少抽 ${b.nextDrawPenalty||0} 张牌。仅影响下一回合。`}:null,
      'enemy-mark':b.enemy?{title:'猎印',key:'event',text:`敌方猎印 ${b.enemy.mark||0} 层，上限 5 层，跨回合保留。只强化明确与猎印互动的牌；扑杀会消耗全部猎印。`}:null,
      'enemy-condensation':b.enemy?.frostResistant?{title:'凝寒',key:'resistance',text:`当前未凝寒意 ${b.enemy.chillProgress||0} 层，上限 2 层。御寒敌人每两张实际施霜技能才凝成1层霜寒；一张连击牌仍只计一次。`}:null,
      'enemy-chill':b.enemy&&(heroId()==='sword'||b.enemy.chill)?{title:'霜寒缠身',key:'frost',text:`当前霜寒 ${b.enemy.chill||0} 层，上限 10 层。达到 5 层后，行动力降低：每段攻击伤害 −1。达到 10 层时，每个敌方回合有 10% 的几率无法行动。回合结束后仅消退 1 层；特定净化招式可额外清除。`}:null,
      'enemy-bleed':b.enemy&&(heroId()==='assassin'||b.enemy.bleed)?{title:'创口流血',key:'bleed',text:`当前流血 ${b.enemy.bleed||0} 层，上限 7 层。敌方回合开始时有 ${b.enemy.bleed*3}% 几率流失 1—${b.enemy.bleed} 生命，等概率抽取，无视护盾。每回合只判定一次；流血不会自然消退。`}:null,
      'enemy-resistance':b.enemy?.frostResistant?{title:'御寒灵躯',key:'resistance',text:`每两张施加霜寒的技能才增加 1 层霜寒，连击仍只算一张技能。尚未成霜的寒意会跨回合保留。${b.enemy.chillProgress?'此刻已有一缕寒意蓄在其身。':'此刻没有未凝结的寒意。'}`}:null,
      'enemy-counter':b.enemy?.counter?{title:'守势反震',key:'counter',text:`每张攻击牌实际伤及生命后，反击 ${b.enemy.counter} 点伤害，一张连击牌只触发一次。守势持续到敌人下次回合开始。`}:null,
      'enemy-revenge':game.getIntent?.()?.revengeBonus?{title:'血债覆令',key:'household',text:'主人的旧家令被复仇覆写。缄红生命不高于一半时，每段攻击额外 +1，实际出手时生效。铁锅反击保持 2 点，不受此加成影响。'}:null,
      'enemy-poison':b.enemy?.poison?{title:'毒附其身',key:'poison',text:`当前附毒 ${b.enemy.poison} 层。回合开始时失去等同层数的生命，随后毒减少 1 层。`}:null
    };
    return details[id]||{title:'气息平稳',key:'cleansed',text:'此刻没有异样。'};
  }
  function catalogueEntries(filter='all'){return Object.keys(CARDS).filter(id=>catalogueVisible(id)&&(filter==='all'||filter==='demonic'&&id.startsWith('D')||filter!=='demonic'&&!id.startsWith('D')&&CARDS[id].character===filter));}
  function releaseInfo(){const r=globalThis.NightRelease||{};return '<section class="release-info"><h3>当前版本</h3><p>'+esc(r.name||'剑道绯纱')+' · '+esc(r.id||'未标记')+'</p><p>刺客 '+catalogueEntries('assassin').length+' · 正道剑术 '+catalogueEntries('sword').length+' · 合欢 '+catalogueEntries('hehuan').length+' 种。魔修功法独立列出。</p></section>';}

  function render(){if(!game||holdRender)return;rememberMapScroll();if(game.state.screen==='title'&&!isUnlocked(chosenCharacter)){chosenCharacter='assassin';starter='mark';}if(game.state.screen!=='title'){starter=game.state.starter;chosenCharacter=game.state.character||chosenCharacter;}hidePreview();disposePortraits(app);renderAudioToggle();renderHud();const previous=lastScreen;lastScreen=game.state.screen;document.body.dataset.screen=lastScreen;document.body.dataset.opening=lastScreen==='title'?openingScreen:'';document.body.dataset.character=heroId();document.body.dataset.fallen=String(isFallen());const pages={title:titleScreen,arrival:arrivalScreen,map:mapScreen,threshold:thresholdScreen,battle:battleScreen,reward:rewardScreen,rest:restScreen,fox:foxScreen,event:eventScreen,cave:caveScreen,shop:shopScreen,victory:()=>endingScreen(true),defeat:()=>endingScreen(false)};app.innerHTML=(pages[game.state.screen]||titleScreen)();if(game.state.screen==='map')requestAnimationFrame(focusCurrentMap);if(modal)renderModal();const logs=document.getElementById('recent-logs');if(logs)logs.scrollTop=logs.scrollHeight;if(previous!==lastScreen)screenCue(lastScreen);}
  function renderAudioToggle(){const state=audio()?.getState?.()||{muted:false,volume:.3},el=document.getElementById('audio-nav');if(el){el.textContent=state.muted?'声音：关':'声音：开';el.setAttribute('aria-pressed',String(state.muted));}}
  function screenCue(screen){if(screen==='reward')audio()?.playCue?.(game.state.reward?.cards.some(id=>CARDS[id].rarity==='rare')?'rareReveal':'rewardReveal');if(['fox','rest','shop','event','cave'].includes(screen)){const id=screen==='event'?game.state.event.id:screen;lastEncounter=id;audio()?.playEncounter?.(id);}if(screen==='victory')audio()?.playCue?.('win');if(screen==='defeat')audio()?.playCue?.('death');}
  function openModal(kind,pile){if(window.uiBusy)return;selected=null;modal={kind,pile};render();modalRoot.querySelector('button')?.focus();}
  function closeModal(){disposePortraits(modalRoot);modal=null;modalRoot.innerHTML='';render();}
  function rules(){return `<div class="rules"><section><h3>灵力与回合</h3><p>玩家先手。每回合先清空旧护盾，结算毒，再恢复基础 3 灵力、抽 5 张牌。手牌上限 10，溢出进入弃牌堆。</p><p>攻击／施加状态的牌先点卡牌，再点敌人；再次点同牌或 Esc 取消，不扣灵力。无目标牌点击即用。动作结算期间暂不能重复出牌。</p><p>结束回合弃掉剩余手牌并清除临时蓄势，敌人行动不会提前预告；实际招式与伤害在动作和战斗记录中显示。敌人旧护盾在其自己回合开始时清空。</p></section><section><h3>影契刺客 · 夜铃</h3><p>「猎印」即卡牌上的猎印，最多 5 层，跨回合保留；窥隙铺垫，扑杀兑现。只有写明互动的牌受到猎印影响。</p><p>所有攻击牌第一段的附加增伤合计最多 ${NightPact.BALANCE?.firstHitBonusCap||8}；牌面基础伤害与按猎印、剑意计算的招式伤害分别结算。</p><p>「连段」用低费、抽牌和返还灵力延长出牌。候机只增强下一张攻击的第一段，连爪每爪独立结算。</p><p>「流血」由特定爪技施加，最多 7 层。敌方回合开始时，按每层 3% 概率触发一次，等概率损失 1 至当前层数的生命，无视护盾；7 层即 21% 几率损失 1—7 生命。创口跨回合保留，也能与猎印、连击和汲取招式互动。血契自损无视护盾，生命不足会死亡。</p></section><section><h3>霜华剑修 · 沈霜白</h3><p>正道剑术 ${catalogueEntries('sword').length}种，魔修功法另列。御剑回合末自动攻击后减1层；剑阵与剑心提供跨回合护持，天地一剑可收束御剑与剑意。</p><p>「剑意」上限 8，跨回合保留。剑诀按各自说明蓄积或消耗剑意；没有写消耗的剑招不会自动扣层。</p><p>「霜寒」上限 10，跨回合保留，敌方回合结束后减少 1 层。5 层起降低行动力：每段攻击伤害 −1；10 层时有 10% 几率无法行动。特定净化招式能清除霜寒。精英与 Boss 需要两张施霜技能才能叠加 1 层，连击按一张技能计数。</p><p>霜寒减伤按实际结算生效；满层时冻结概率在状态说明中显示，结束回合后只判定一次。冰镜、三叠泉与碎霜可围绕寒意衔接，具体以牌面为准。</p></section><section><h3>合欢执事 · 晏绮罗</h3><p>${catalogueEntries('hehuan').length}种双模式技能，均可立即使用或藏进两个纱位。观息只辨攻击与否。幻席保留原藏招并复制；欲擒故纵撤下最后一张藏招并退回实际费用；偷梁换柱交换顺序。触发前效果、敌人整招、触发后效果依次结算，死亡停止后续治疗。</p></section><section><h3>伤害、牌堆与秘宝</h3><p>普通伤害先扣护盾再扣生命；自损和毒无视护盾。毒在持有者回合开始造成当前层数的直接生命伤害，随后减 1。</p><p>消耗牌本场不再抽回，下场恢复。商店删除指定实例，本局永久移除。抽牌堆空时重洗弃牌，正在结算的牌不会抽回自己。</p><p>遗物与秘宝的完整效果可点击顶栏查看。精英珍藏先二选一，再选卡；同一份战利只会发放一次。休息恢复 ${NightPact.BALANCE?.restHeal||18}，狐契以 8 最大生命换一次免死。</p></section><section><h3>包裹与未知洞府</h3><p>草药、丹药收入包裹后可随时查看。草药小幅疗伤，九转还元丹补满生命，解毒丹祛除余毒，战丹强化本场或下一场攻击；完整效果写在物品上。</p><p>玩家回合每回合只能服用一件，且不消耗灵力；敌方行动与动画结算中不能用药。战后仍保留未用物品，重新开始会清空。无效果时不会消耗。</p><p>洞府里可能有守卫、药草、遗留丹药或秘宝。入口不会提前揭示所藏之物；一旦探索，结果便不会重抽。击败守卫后才取得它看守的宝物。</p></section><section><h3>器灵与归月</h3><p>战斗后获得历练，提高本局灵识等级。剑匣中的装备只能在战斗与战利结算之外更换。高阶器灵可提前佩带；若灵识尚浅，器中躁动也会随之而来。可点开随身兵刃，察看此刻的气息。</p><p>绯夜解锁后可使用独立牌组。魂息上限 6，按具体牌面积蓄和消耗；归身之力来自专属道路上的交锋，每层强化一张攻击牌的第一段，最多 3 层。解锁只保存可选角色，本局养成仍在重开时清空。</p></section><section><h3>封域路线与异闻</h3><p>本局逐境深入，共 ${chineseNumber(regions().length)} 境、${chineseNumber(totalFloors())} 段。每境十段，第十段迎战镇境 Boss。走完当前地域，才会看见下一境；只显示当前一境的路线。地标由真实连线连接，不能跳段、返回，或进入未连接的分支。</p><p>每境至少 40 处地标，第一段位于画面底部，第十段镇境之敌位于上方。向上滚动可察看前路。连线与下方路线卡使用相同状态，每境独立抽取路线样式，只有亮起且相连的地标能进入。</p><p>异闻包含数段人物的连续故事：初逢、重遇、余波会沿行程逐渐展开。有人会报答援手，有人会带来麻烦，也有人觊觎你的宝物；戒备、交易和应战会改变后果。行旅手记只记录你已经知道的事，战斗与选择都只能结算一次。全程离线，本局不存档；角色解锁会单独保存。</p></section></div>`;}
  function worldLore(){return `<div class="world-lore"><p class="world-prologue">寒渊原是群山之间的采灵之地。玄烬教试图从地底引出一段不属于此世的灵性，却在最后一夜被仪式反噬。黑雾封住整片区域，山路和建筑渐渐失去原本的形状。外界的占卜、传讯与窥视均告失效，只能让活人走进去。</p><div class="faction-grid"><article><i>剑</i><h3>太微剑宗</h3><p>受托探查并寻找失踪弟子。有人只想救人，也有人想替正道先封存禁术。</p></article><article><i>烬</i><h3>玄烬残众</h3><p>回收实验记录与失控造物；想补救的人和想继续实验的人同行，却互不信任。</p></article><article><i>灯</i><h3>千灯商盟</h3><p>以补给换取遗物、记忆与情报。他们以护命灵符抵御黑雾，认定险地的丹药与遗器能卖出数倍价码；问路要价，救货也要先结灵石。</p></article><article><i>纱</i><h3>合欢宗</h3><p>魔门外堂负责交涉、收账和接应。宗内有人互惠修行，也有长老将弟子交给祭仪；晏绮罗来追问这笔交易。</p></article><article><i>影</i><h3>夜契盟与散修</h3><p>受雇寻物，或为自身执念而来。身上的契约、未偿的债与想带走的东西各不相同。</p></article></div><p class="note">雾外无人看清寒渊全貌。同行者未必同心，偶遇者也未必无害；你能带回多少真相，取决于你愿意走进哪些地方。</p></div>`;}
  function bossData(id){const boss=globalThis.NightSeven?.BOSSES?.[id]||(NightPact.BOSS_QUESTS?.[id]?ENEMIES[id]:null);return boss?{...boss,lore:[boss.lore,NightPact.BOSS_LORE?.[id]].filter(Boolean).join(' ')}:null;}
  function bossIds(){return Object.keys(NightPact.BOSS_QUESTS||{}).filter(id=>!['feiye','feiye_echo','retainer','heart','snake_ascended'].includes(id)||isUnlocked('sovereign')||game.state.history?.some(h=>h.enemyId===id)||game.state.battle?.enemy.id===id);}
  function intentSummary(intent){const parts=[];if(intent.clearMark)parts.push('清除猎印');if(intent.clearChill)parts.push('清除霜寒');if(intent.clearBleed)parts.push('清除流血');if(intent.heal)parts.push(`恢复 ${intent.heal} 生命`);if(intent.block)parts.push(`护盾 ${intent.block}`);const hits=intent.hits||[];if(hits.length)parts.push(hits.length===1?`攻击 ${hits[0]}`:`${hits.length} 段攻击 × ${hits.join(' / ')}`);if(intent.poison)parts.push(`毒 ${intent.poison} 层`);if(intent.playerMark)parts.push(`对你施加 ${intent.playerMark} 层追索印`);if(intent.counter)parts.push(`反击 ${intent.counter}`);if(intent.energyPenalty)parts.push(`下回合灵力 −${intent.energyPenalty}`);if(intent.drawPenalty)parts.push(`下回合少抽 ${intent.drawPenalty}`);return parts.join(' · ')||intent.text||'气息未定';}
  function bossGallery(){return `<div class="boss-gallery">${bossIds().map(id=>{const boss=bossData(id);return `<button class="boss-gallery-card" data-action="boss-detail" data-boss="${esc(id)}">${portrait(id,{player:false})}<div><small>${({early:'雾外守关',middle:'封域深处',final:'终极之敌'})[boss.tier]||'镇境之敌'}</small><h3>${esc(boss.name)}</h3><p>${esc(boss.title||'')}</p><span>展开人物画卷 →</span></div></button>`;}).join('')}</div>`;}
  function bossDetail(id){const boss=bossData(id);if(!boss)return '<p class="muted">这卷人物志尚未展开。</p>';return `<article class="boss-dossier" data-boss="${esc(id)}">${portrait(id,{player:false})}<div class="boss-dossier-copy"><div class="eyebrow">${esc(boss.title||'封域之主')}</div><h3>${esc(boss.name)}</h3><p class="boss-biography">${esc(boss.lore||'雾中的故事，尚待亲眼见证。')}</p>${(boss.quotes||[]).map(quote=>`<blockquote>“${esc(quote.replace(/^[“”]|[“”]$/g,''))}”</blockquote>`).join('')}${boss.passive?`<div class="boss-trait"><b>战斗气质</b><p>${esc(boss.passive)}</p></div>`:''}<p class="note">旧事可以循迹寻访。对方将如何出手，需要在交锋中亲眼见证。</p><div class="actions">${btn('bosses','返回人物志','btn ghost small')}</div></div></article>`;}
  function bossBattleLore(enemy){const visitor=NightPact.ENEMY_FACTIONS?.DEFS[enemy.id];if(visitor)return `<aside class="boss-battle-lore"><div><span>眼前的来客</span><p>${esc(visitor.intro)}</p>${game.state.battle?.factionCause?`<p class="event-dialogue">${esc(game.state.battle.factionCause)}</p>`:''}</div></aside>`;const boss=bossData(enemy.id);return boss?`<aside class="boss-battle-lore"><div><span>${esc(boss.title||'镇境之敌')}</span><p>“${esc(boss.quotes?.[0]||'雾深处，并无归途。')}”</p></div>${btn('boss-detail','读这段旧事','btn ghost small',`data-boss="${esc(enemy.id)}"`)}</aside>`:'';}
  function renderModal(){
    const s=game.state;let title='',hint='',body='';
    if(modal.kind==='bosses'){title='封域人物志';hint='镇境之人与雾后旧影，各有执念与未了的旧事。';body=bossGallery();}
    if(modal.kind==='boss-detail'){const boss=bossData(modal.pile);title=boss?.name||'镇境人物';hint=boss?.title||'';body=bossDetail(modal.pile);}
    if(modal.kind==='bag'){title='随身包裹';hint='旅途中采得的药草与丹药。未用的物品会随你进入下一处地标。';body=bagContents();}
    if(modal.kind==='equipment'){title='随身装备';hint=`灵识等级 ${s.player.level||1} · 历练 ${s.player.xp||0}。只在战斗与战利结算之外换器；装备跟随本局，重开清空。`;body=`<div class="weapon-grid">${(s.player.weaponInventory||[]).map(id=>weaponCard(id)).join('')}</div>${wardrobe()}`;}
    if(modal.kind==='status'){const detail=statusDetail(modal.pile);title=detail.title;body=`<section class="status-detail" data-status="${esc(modal.pile)}">${symbol(detail.key)}<div><p>${esc(detail.text)}</p>${detail.equipment?`<div class="actions">${btn('equipment','打开随身装备','btn ghost')}</div>`:''}</div></section>`;}
    if(modal.kind==='profile'){title='留存解锁凭证';hint='只保存角色解锁，不保存本局进度。';body=profileSettings();}
    if(modal.kind==='rules'){title='玩法手札';hint='观察招式、选择路径，再决定何时出手。';body=rules();if(!isUnlocked('sovereign'))body=body.replace(/<p>绯夜解锁后[\s\S]*?<\/p>/,'');}
    if(modal.kind==='journal'){title='行旅手记 · 旧事有回声';hint='只记已经发生的选择与眼前的人，不预写任何人的结局。';body=relationsMarkup()+journalMarkup()+`<section class="faction-fieldnotes"><h3>亲见的来客</h3>${Object.entries(game.state.journey.factions?.seen||{}).map(([id,seen])=>`<article><h4>${esc(seen.name)}</h4><p>${esc(seen.intro||'当时未能看清来路。')}</p>${(seen.notes||[]).map(n=>`<blockquote><small>第${n.floor}段 · 当时留下的记录</small><p>${esc(n.text)}</p></blockquote>`).join('')}<p>亲眼见过：${seen.abilities.map(esc).join('、')||'尚未见其出手'}</p></article>`).join('')||'<p>尚无此类见闻。</p>'}</section>`;}
    if(modal.kind==='world'){title='寒渊封域 · 各怀所求';hint='禁术反噬之后，没有一方愿意空手离开。';body=worldLore();}
    if(modal.kind==='catalogue'){if(!catalogueEntries(catalogueFilter).length)catalogueFilter='all';const entries=catalogueEntries(catalogueFilter);title=`技能图鉴 · ${entries.length} 种`;hint='数量直接读取当前牌池；正道剑术与魔修功法分别列出。每张技能均可查看费用和完整效果。';body=`<div class="catalogue-filters">${[['all','全部技能'],['assassin','影契刺客'],['sword','霜华剑修'],['hehuan','合欢执事'],...(game.state.player.path?.learned?[['demonic','魔修秘术']]:[]),...(isUnlocked('sovereign')?[["sovereign","归月之身"]]:[])].map(([id,name])=>btn('catalogue-filter',name+' · '+catalogueEntries(id).length,'btn small '+(catalogueFilter===id?'primary':'ghost'),`data-filter="${id}"`)).join('')}</div><div class="deck-grid catalogue">${entries.map(id=>cardMarkup(id)).join('')}</div>`;}
    if(modal.kind==='settings'){title='声画与战斗表现';hint='调整声画表现，管理角色解锁与兑换信物。';body=`<div class="settings-options">${[['full','完整表现','刺客潜袭、剑修剑芒、逐段命中与受击姿态。'],['fast','快速表现','更短的动作与数字停留，适合重复试玩。'],['reduced','减少动态','取消位移、晃动和闪烁，保留数值与战损换装。']].map(([mode,name,text])=>btn('motion',`<b>${name}${motionMode===mode?' · 已选择':''}</b><small>${text}</small>`,'btn '+(motionMode===mode?'primary':'ghost'),`data-mode="${mode}"`)).join('')}</div><section class="portrait-settings"><h3>${esc(hero().name)} · 角色表现</h3><p>生命降至 50% 与 25% 时，衣装和神态显示不同战痕；恢复生命后回到对应状态。立绘按实际生命切换，攻击与受击使用短暂的位移、光效和数值反馈。</p><div class="actions">${btn('portrait-gallery','展开三态画卷','btn ghost')}</div></section>${soundSettings()}${releaseInfo()}${profileSettings()}${redemptionSettings()}`;}
    if(modal.kind==='portrait-gallery'){const sword=heroId()==='sword',sovereign=heroId()==='sovereign';title=hero().name+' · 三态画卷';hint='这里只预览立绘，不改变生命、战斗或本局进度。血量以当前最大生命的比例计算。';body=`<div class="damage-gallery">${[['normal',sword?'静心':'从容','生命高于 50%',heroId()==='hehuan'?'双纱绷出弧线，扇下藏着轻笑。':sovereign?'夜纱未乱，月光仍在指间。':sword?'白袍齐整，目光清寒。':'衣袍齐整，金瞳含笑。'],['wounded','战痕','生命不高于 50%',heroId()==='hehuan'?'纱缘擦损，笑意收起，目光更谨慎。':sovereign?'衣角染尘，指尖魂光仍稳。':sword?'衣角染尘，剑锋仍稳。':'外袍磨损，神色警觉。'],['critical','濒危','生命不高于 25%',heroId()==='hehuan'?'借扇稳住身形，垂纱仍指向对手。':sovereign?'夜纱残损，神色沉静而倦。':sword?'霜衣破损，握剑不退。':'衣袖破损，疲惫而不退。']].map(([stage,name,threshold,text])=>`<article class="damage-gallery-card" data-stage="${stage}">${portrait(heroKind(),{previewStage:stage})}<div><span>${threshold}</span><h3>${name}</h3><p>${text}</p></div></article>`).join('')}</div><div class="actions">${btn('settings','返回声画设置','btn ghost')}</div>`;}
    if(modal.kind==='hehuan-recall'){title='幻席 · 复制哪一张？';hint='原藏招保留。复制牌仍付原费用，使用后消耗，仅本场有效；然后抽1张。确认前可取消。';body=`<div class="recall-options">${(s.battle.traps||[]).filter(c=>c.id!=='H06').map(c=>btn('hehuan-recall',esc(CARDS[c.id].name)+'<small>'+esc(CARDS[c.id].trap.text)+'</small>','btn ghost',`data-trap="${esc(c.uid)}" data-card="${esc(modal.pile)}"`)).join('')}</div>`;}
    if(modal.kind==='relics'){title='今夜的珍藏';hint='每件效果都已在本局生效；战斗中触发时会显示名称。';body=`<div class="relic-gallery">${s.player.relics.map(id=>relicCard(id)).join('')}</div>`;}

      keep(fx('relic','player',`<i></i><span>${esc(name)}</span>`));if(['fox','ninelives'].includes(relic)){visual.player.hp=Math.min(relic==='fox'?12:18,visual.player.maxHp);updateDisplayed(visual);portraitAct('revive',{hp:visual.player.hp});keep(fx('rebirth','player',`<b>命火重燃</b><span>${esc(name)} · ${visual.player.hp} 生命</span>`));}await delay(['fox','ninelives'].includes(relic)?470:190);
    }else if(type==='draw'||type==='shuffle'){
      if(type==='shuffle'||!context.drawShown){keep(fx('draw','player',`<span>${type==='shuffle'?'弃牌重洗':`抽牌${event.amount>1?' ×'+event.amount:''}`}</span>`));context.drawShown=true;await delay(100);}
    }else if(type==='death'){
      const actor=document.querySelector(`[data-combatant="${target}"] .portrait`);if(actor&&motionMode==='full')actor.animate([{opacity:1,filter:'grayscale(0)'},{opacity:.35,filter:'grayscale(1)'}],{duration:250,fill:'forwards'});await delay(200);
    }else if(type==='victory'){keep(fx('victory','enemy','<span>契破</span>'));await delay(260);}
    temporary.forEach(el=>el.remove());
  }
  async function battleAction(fn,label,alreadyBusy=false){
    if(window.uiBusy&&!alreadyBusy)return false;
    setBusy(true);holdRender=true;lockBattleDOM();
    hidePreview();const previousPlayed=game.state.battle.played;
    const b=game.state.battle,visual={player:{hp:game.state.player.hp,maxHp:game.state.player.maxHp,block:b.block},enemy:{hp:b.enemy.hp,maxHp:b.enemy.maxHp,block:b.enemy.block,mark:b.enemy.mark},resources:resourceSnapshot(b)};
    let banner;
    try{
      const ok=fn();if(ok===false){toast(game.state.notice);return false;}
      const events=[...(game.state.battle?.events||[])];

      banner=document.createElement('div');banner.className='skill-banner';banner.dataset.fx='skill';banner.innerHTML=`<small>${alreadyBusy?'妖异行动':`${hero().name} · ${heroId()==='hehuan'?'牵纱':heroId()==='sovereign'?'归月':heroId()==='sword'?'出剑':'潜袭'}`}</small><b>${esc(label)}</b>`;fxRoot.append(banner);
      const context={drawShown:false,intentName:alreadyBusy?label:'',enemyTurn:alreadyBusy};for(const event of events)await showEvent(event,visual,context);
      if(!events.length)await delay(180);
      const chain=game.state.battle?.played;if(!alreadyBusy&&chain>previousPlayed&&[3,5,7].includes(chain)&&game.state.screen==='battle'){const stamp=fx('combo','player',`<b>${chain} 连招</b><small>此回合已打出 ${chain} 张</small>`);audio()?.playCue?.('combo',{amount:chain});await delay(155);stamp.remove();}
      return true;
    }finally{banner?.remove();fxRoot.innerHTML='';holdRender=false;setBusy(false);render();if(game.state.notice)toast(game.state.notice);}
  }
  async function endTurn(){if(window.uiBusy||game.state.screen!=='battle'||game.state.battle.phase!=='player')return;selected=null;setBusy(true);const name=(game.getIntent?.()||ENEMIES[game.state.battle.enemy.id].intents[game.state.battle.enemy.intentIndex]).name;if(!act(()=>game.endTurn())){setBusy(false);render();return;}await delay(220);await battleAction(()=>game.resolveEnemyTurn(),name,true);}
  function start(){if(window.uiBusy)return;if(!isUnlocked(chosenCharacter)||!(HEROES[chosenCharacter]?.starters||[]).includes(starter))return;resourceChanges.clear();selected=null;disposePortraits(modalRoot);modal=null;modalRoot.innerHTML='';fxRoot.innerHTML='';act(()=>game.newRun(starter,chosenCharacter));mapFocusKey='';mapScrollPosition=null;window.scrollTo(0,0);}
  function title(pick=true){if(window.uiBusy)return;openingScreen=pick?'characters':'home';tacticsExpanded=false;resourceChanges.clear();selected=null;disposePortraits(modalRoot);modal=null;modalRoot.innerHTML='';game=makeGame();window.game=game;render();window.scrollTo(0,0);}
  function exportHTML(){if(assets.mode==='folder'){const link=document.createElement('a');link.href='baiyao-standalone.html';link.download='百妖夜契-完整单文件.html';document.body.append(link);link.click();link.remove();toast('已请求保存同目录的完整单文件版；请保留压缩包中的 baiyao-standalone.html。');return;}const copy=document.documentElement.cloneNode(true);for(const id of ['app','hud','modal-root','toast-root','fx-root']){const el=copy.querySelector('#'+id);if(el)el.innerHTML='';}copy.querySelector('body').removeAttribute('data-ui-busy');copy.querySelector('#app').removeAttribute('aria-busy');const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='百妖夜契-index.html';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('已请求浏览器保存完整 HTML；重新打开从新的一局开始。');}
  document.addEventListener('click',event=>{
    void audio()?.unlock?.();
    if(event.target.matches('[data-overlay]'))return closeModal();
    const el=event.target.closest('button[data-action]');if(!el||el.disabled)return;if(modal&&!el.closest('#modal-root'))return;const a=el.dataset.action;
    if(window.uiBusy)return;
    if(a==='new-journey'){openingScreen='characters';tacticsExpanded=false;render();app.querySelector('h1')?.scrollIntoView({block:'start'});return;}if(a==='home')return title(false);
    if(a==='start')return start();if(a==='title')return title();if(a==='export')return exportHTML();if(['rules','world','journal','deck','restart','log','catalogue','settings','equipment','bag','profile','relics','portrait-gallery','bosses'].includes(a))return openModal(a);if(a==='boss-detail')return openModal('boss-detail',el.dataset.boss);if(a==='close')return closeModal();if(a==='pile')return openModal('pile',el.dataset.pile);if(a==='status')return openModal('status',el.dataset.status);
    if(a==='use-item'){const id=el.dataset.item;if(!game.getItemUse?.(id)?.usable)return;selected=null;if(game.state.screen==='battle'){closeModal();void battleAction(()=>game.useItem(id),ITEMS[id]?.name||'服药');}else if(act(()=>game.useItem(id))){audio()?.playCue?.('heal');}return;}
    if(a==='buy-item'){if(act(()=>game.buyItem(Number(el.dataset.index))))audio()?.playCue?.('rewardReveal');return;}
    if(a==='cave-explore'){selected=null;if(act(()=>game.exploreCave())){audio()?.playCue?.(game.state.screen==='battle'?'power':game.state.cave?.result?.rarity==='rare'?'treasure':'rewardReveal');scrollAfterAction();}return;}
    if(a==='cave-leave'){act(()=>game.leaveCave());scrollAfterAction();return;}
    if(a==='hidden-enter'){selected=null;act(()=>game.startHiddenBoss());scrollAfterAction();return;}if(a==='threshold-leave'){act(()=>game.leaveThreshold());scrollAfterAction();return;}
    if(a==='equip-outfit'){if(act(()=>game.equipOutfit(el.dataset.id||null))){renderModal();audio()?.playCue?.('relic');}return;}
    if(a==='buy-outfit'){if(act(()=>game.buyOutfit(el.dataset.id))){audio()?.playCue?.('treasure');toast('新衣已收入随身装备。');}return;}
    if(a==='equip-weapon'){if(act(()=>game.equipWeapon(el.dataset.id))){renderModal();audio()?.playCue?.('relic');}return;}
    if(a==='buy-weapon'){if(act(()=>game.buyWeapon(Number(el.dataset.index)))){audio()?.playCue?.('treasure');toast('新器入匣；可在随身剑匣中佩带。');}return;}
    if(a==='profile-export'){const area=document.getElementById('profile-code');if(area){area.value=JSON.stringify(game.getProfile?.()||savedProfile);area.focus();area.select();toast('凭证已选中，请复制并保存。');}return;}
    if(a==='redeem-key'){redeemKey();return;}
    if(a==='profile-import'){const value=document.getElementById('profile-code')?.value||'';if(game.importProfile?.(value)){profileChanged(game.getProfile());toast('凭证已载入，已解锁的角色可在选角界面选择。');render();}else toast('凭证格式不正确，未改变任何解锁。');return;}
    if(a==='catalogue-filter'){catalogueFilter=el.dataset.filter;return renderModal();}
    if(a==='audio-toggle'){const state=audio()?.getState?.();audio()?.setMuted?.(!state?.muted);renderAudioToggle();if(modal?.kind==='settings')renderModal();return;}
    if(a==='audio-preview'){audio()?.preview?.(el.dataset.id);return;}
    if(a==='character'){if(!isUnlocked(el.dataset.character))return;if(game.state.screen!=='title')return;openingScreen='characters';tacticsExpanded=false;chosenCharacter=el.dataset.character;starter=(HEROES[chosenCharacter]?.starters||[chosenCharacter==='sword'?'sword':'mark'])[0];return render();}if(a==='starter'){if(game.state.screen!=='title'||!(HEROES[chosenCharacter]?.starters||[]).includes(el.dataset.starter))return;tacticsExpanded=true;starter=el.dataset.starter;return render();}if(a==='motion'){window.setMotionMode(el.dataset.mode);return renderModal();}
    if(a==='arrival-enter'){selected=null;act(()=>game.enterRegion());scrollAfterAction();return;}
    if(a==='node'){selected=null;act(()=>game.enterNode(el.dataset.node));scrollAfterAction();return;}
    if(a==='reveal-breath'){act(()=>game.revealBreath());return;}
    if(a==='set-trap'){selected=null;hidePreview();void battleAction(()=>game.setTrap(el.dataset.card),'藏入薄纱');return;}
    if(a==='hehuan-now'){const c=game.state.battle?.hand.find(x=>x.uid===el.dataset.card);if(!c)return;if(c.id==='H06'&&(game.state.battle.traps?.length||0)>1)return openModal('hehuan-recall',c.uid);if(CARDS[c.id].target){selected=selected===c.uid?null:c.uid;syncTargetSelection();}else{selected=null;void battleAction(()=>game.playCard(c.uid),CARDS[c.id].name);}return;}
    if(a==='hehuan-recall'){const uid=el.dataset.card,trap=el.dataset.trap;closeModal();void battleAction(()=>game.playCard(uid,false,trap),'幻席');return;}
    if(a==='card'){const b=game.state.battle,c=b?.hand.find(c=>c.uid===el.dataset.card);if(game.state.screen!=='battle'||b.phase!=='player'||!c||CARDS[c.id].cost>b.energy)return;if(CARDS[c.id].target){selected=selected===c.uid?null:c.uid;syncTargetSelection();}else{selected=null;syncTargetSelection();void battleAction(()=>game.playCard(c.uid),CARDS[c.id].name);}return;}
    if(a==='target'){if(selected){const uid=selected,c=game.state.battle.hand.find(c=>c.uid===uid);selected=null;syncTargetSelection();if(c)void battleAction(()=>game.playCard(uid,true),CARDS[c.id].name);}return;}
    if(a==='end-turn')return void endTurn();
    if(a==='reward'||a==='skip-reward'){const id=a==='reward'?el.dataset.id:null,rect=el.getBoundingClientRect();if(act(()=>game.chooseReward(id))&&id)acquisition(id,rect);scrollAfterAction();return;}
    if(a==='choose-relic'){const id=el.dataset.relic,rect=el.getBoundingClientRect();if(act(()=>game.chooseRelic(id)))acquisition(id,rect,true);return;}
    if(a==='reroll-reward'){if(act(()=>game.rerollReward()))audio()?.playCue?.('shuffle');return;}
    if(a==='event-choice'){const before=[...game.state.player.relics],choice=game.state.event?.choices[Number(el.dataset.index)],id=game.state.event?.id;if(act(()=>game.chooseEvent(Number(el.dataset.index)))){audio()?.playEncounter?.(id);if(game.state.screen!=='event')return;const gained=game.state.player.relics.find(r=>!before.includes(r));if(gained)acquisition(gained,null,true);else if(choice?.cardIds?.length)acquisition(choice.cardIds[0]);else audio()?.playCue?.('eventChoice');}return;}if(a==='event-leave'){selected=null;act(()=>game.leaveEvent());scrollAfterAction();return;}
    if(a==='buy-antidote'){if(act(()=>game.buyAntidote?.()))audio()?.playCue?.('heal');return;}if(a==='rest-cleanse'){if(act(()=>game.rest('cleanse')))audio()?.playCue?.('heal');return;}if(a==='rest'){const heal=el.dataset.heal==='true';if(act(()=>game.rest(heal))&&heal)audio()?.playCue?.('heal');return;}if(a==='fox'){const sign=el.dataset.sign==='true';if(act(()=>game.fox(sign))&&sign)acquisition('fox',null,true);return;}if(a==='buy'){const id=game.state.shop?.cards[Number(el.dataset.index)]?.id,rect=el.getBoundingClientRect();if(act(()=>game.buyCard(Number(el.dataset.index))))acquisition(id,rect);return;}if(a==='remove-panel')return openModal('remove');
    if(a==='remove'){const uid=el.dataset.card;modal=null;modalRoot.innerHTML='';act(()=>game.removeCard(uid));return;}if(a==='leave-shop')return act(()=>game.leaveShop());
  });
  document.addEventListener('toggle',event=>{if(event.target.id==='starter-tactics'&&event.target.isConnected)tacticsExpanded=event.target.open;},true);
  document.addEventListener('input',event=>{if(event.target.matches('[data-action="volume"]')){const value=Number(event.target.value)/100;audio()?.setVolume?.(value);const output=document.getElementById('volume-value');if(output)output.textContent=Math.round(value*100)+'%';renderAudioToggle();}});
  document.addEventListener('pointerover',event=>{const el=event.target.closest('.card[data-preview]');if(el&&!el.contains(event.relatedTarget))showPreview(el);});
  document.addEventListener('pointerout',event=>{const el=event.target.closest('.card[data-preview]');if(el&&!el.contains(event.relatedTarget))hidePreview();});
  document.addEventListener('focusin',event=>showPreview(event.target.closest('.card[data-preview]')));
  document.addEventListener('focusout',hidePreview);
  window.addEventListener('scroll',hidePreview,true);
  // beforeunload is cancellable after user interaction; pagehide is best-effort only.
  // No progress is saved and no request is sent by either lifecycle handler.
  function guardUnfinishedRun(event){
    if(!game||['title','victory','defeat'].includes(game.state.screen))return;
    event.preventDefault();event.returnValue='';
  }
  window.addEventListener('beforeunload',guardUnfinishedRun);
  window.addEventListener('pagehide',guardUnfinishedRun);
  window.addEventListener('pagehide',()=>{disposePortraits(document);});
  document.addEventListener('keydown',event=>{if(window.uiBusy)return;if(event.key==='Enter'&&event.target.id==='redemption-key'){event.preventDefault();redeemKey();return;}if(event.key==='Escape'){hidePreview();if(modal)closeModal();else if(selected){selected=null;syncTargetSelection();}}if(event.key==='Tab'&&modal){const buttons=[...modalRoot.querySelectorAll('button:not(:disabled),[tabindex="0"]')],first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
  game=makeGame();window.game=game;window.renderGame=render;render();
})();

<style>#p2-review-tools{position:fixed;bottom:8px;left:8px;right:8px;max-width:700px;z-index:9999;padding:12px;background:#12212af5;border:1px solid #e5c58d;color:#fff;font:14px/1.6 sans-serif}#p2-review-tools button,#p2-review-tools select{min-height:44px;margin:4px;background:#243d47;color:#ffe7bb;border:1px solid #b69867;padding:6px}#p2-review-tools small{display:block}#p2-review-tools summary{cursor:pointer}</style><script>(()=>{const panel=document.createElement('details');panel.id='p2-review-tools';panel.open=true;panel.innerHTML='<summary>人工指定节点 · 剧情验收工具</summary><p>这是指定状态测试。另须用正常入口记录自然路线；本工具不生成任何真人评价。</p><label>角色 <select id="review-role"><option value="mark">夜铃</option><option value="sword">沈霜白</option></select></label> <label>线索 <select id="review-boss"><option value="snake">蛇井</option><option value="camp_boss">军营</option><option value="gate_boss">渡灯</option><option value="bell_boss">葬钟</option></select></label><button id="review-new">新建审阅局／来源</button><button id="review-cave">进入洞府</button><button id="review-battle">进入镇境之战</button><small>不补生命、不加灵石、不代选；跳转不算自然走图。</small>';document.body.append(panel);function go(kind){if(window.uiBusy)return;const boss=document.getElementById('review-boss').value;if(kind==='source'){game.newRun(document.getElementById('review-role').value);game.enterRegion();}const s=game.state;if(!s||['title','defeat','victory'].includes(s.screen))return;const floor=kind==='source'?4:kind==='cave'?8:10,n=s.map[floor-1][0];s.floor=floor;s.screen='map';s.journey.regionIndex=0;n.type=kind==='boss'?'boss':'event';delete n.storyId;delete n.encounter;if(kind==='boss')n.encounter={enemyId:boss,kind:'boss'};else n.storyId='faction_'+boss+'_'+kind;s.availableNodes=[n.id];game.enterNode(n.id);renderGame();}document.getElementById('review-new').onclick=()=>go('source');document.getElementById('review-cave').onclick=()=>go('cave');document.getElementById('review-battle').onclick=()=>go('boss');})();</script></body></html>
