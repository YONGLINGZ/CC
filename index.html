.route-floor{top:8px;width:110px;margin-left:-55px;font-size:10px;letter-spacing:.12em}

.route-map .map-node b{font-size:24px}
.route-map .map-node span{font-size:11px}
.route-map .map-node small{font-size:8px;line-height:1.35}
.route-map .map-node.unknown{background:linear-gradient(150deg,#182a2d,#101f22);border-style:dashed;border-color:#72877c55}

.event-orbit:before,.event-orbit:after{content:"";position:absolute;inset:12%;border:1px dashed #b99d6540;border-radius:50%;transform:rotate(28deg)}
.event-orbit:after{inset:25%;transform:rotate(-18deg)}
.event-glyph{position:relative;z-index:1;font:150px/1 var(--serif);color:var(--event-accent,var(--gold));text-shadow:0 0 35px #d7b87545,0 8px 25px #000;transform:translateY(-8px)}

.event-outcome>span{display:block;font-size:9px;letter-spacing:.24em;color:var(--muted);margin-bottom:8px}

  const ITEMS={
    hehuan_route_copy:{id:'hehuan_route_copy',name:'路引签押抄件',text:'晏绮罗当面对照过的路引。宋箴的签押与接收地点仍在，可用于找到秦蘅时的交涉；不是站队凭证，不使P2洞府自动敌对。',icon:'learned'},
    hehuan_ledger_original:{id:'hehuan_ledger_original',name:'交人账册原件',text:'记录合欢宗长老将弟子交给祭仪的原件。可公开、交回、据此索价或焚毁；每种处置只结算一次。',icon:'learned'},
    hehuan_ledger_copy:{id:'hehuan_ledger_copy',name:'已公开账册副本',text:'公开原件后留下的可核验副本。秦蘅有自己的去向，不因证词公开就欠下一份终身听命的契约。',icon:'learned'}

  const INITIAL_STORY=[
    '接应者把一页接收地点塞到扇下：“长老只要账册。秦蘅要是还活着，也别带她出封域。”',
    '“她是我带进门的。”晏绮罗按住纸角。接应者笑了：“替她出头，外堂的药钱就别想再领。”',
    '她把扇子合上：“行。那这趟我连账也一起算。”'
  ];
  const TUTORIAL='手牌可以立即使用，也可以付相同灵力藏进薄纱。最多两张，等下一次敌方实际行动，条件不符便落空且不退费。观息每战三次、每回合一次；用完后仍可明用、布通用条件，或两槽分别应对两类动作。';
  function flags(state){return state?.journey?.hehuan?.flags||{};}
  function hasItem(state,id){return (state?.player?.questItems||[]).includes(id);}
  function ownsLedger(state){return !!flags(state).ledgerOriginal&&hasItem(state,'hehuan_ledger_original');}
  const C=(key,label,text,outcome,effects={})=>({key,label,text,outcome,...effects});
  const battleChoice=(key,label,text,outcome,encounter,victoryFlags,victoryOutcome,victoryItems=[])=>C(key,label,text,outcome,{battle:{...encounter,hehuanBattle:{victoryFlags,victoryOutcome,victoryItems}},hehuanBattle:{...encounter,victoryFlags,victoryOutcome,victoryItems}});
  function scene(id,step,name,story,choices,state){return {id,name,glyph:'纱',kicker:'合欢旧案',hehuanStory:{id,step},story,connection:state?.journey?.hehuan?.lastOutcome||'',choices};}
  function buildEvent(id,state){
    if(!STORY_IDS.includes(id))return null;
    const f=flags(state);
    if(id==='hehuan_checkpoint')return scene(id,1,'门前的路引',[
      '巡使岳衡拦住一名合欢宗信使，地上散着三张路引：“昨夜失踪三个人，有人看见你把他们带进山门。”',
      '信使季远指着签押：“路引是我送的，人是宋箴领走的。你不问他，拿我顶罪？”晏绮罗蹲下拾纸：“签了字的人，得把话说清楚。”'
    ],[
      C('guarantee','替信使交钱担保',`支付 ${COSTS.guarantee} 灵石；信使暂时获释，你成为担保人。他会在后段留下证词，担保不是永久免罪。`,'你点清担保金，岳衡在路引旁记下晏绮罗的名字。季远走到灯下：“我会留在接收处等你，不替长老改口供。”',{goldCost:COSTS.guarantee,hehuanFlags:{metMessenger:true,messengerAvailable:true,guaranteedMessenger:true,guaranteePaid:COSTS.guarantee,checkpointResolved:true}}),
      C('investigate','先查路引，让双方说清楚','当面对照签押，取得路引抄件；不交担保金。信使暂留巡使处，尚未获释；本次不战斗。','你把接收地点与宋箴的签押抄在同一页。岳衡答应暂缓送人离山，仍扣着季远；你带走的是证据，不是一份已经完成的营救。',{questItem:'hehuan_route_copy',hehuanFlags:{metMessenger:true,checkpointEvidence:true,messengerDetained:true,checkpointResolved:true}}),
      C('handover','把信使交给巡使',`获得 ${COSTS.checkpointPay} 灵石协查补贴；失去本次向信使取证的机会。交人的事实不会被之后改变立场抹去。`,'岳衡接过缚绳，付清协查补贴。季远没有再求你：“到接收处自己看吧。”他被带走，你没有取得他的口供。',{goldGain:COSTS.checkpointPay,hehuanFlags:{metMessenger:true,handedMessenger:true,messengerAvailable:false,checkpointResolved:true}}),
      battleChoice('attack','我不信你这套，动手放人','立即与巡使岳衡交战，玩家先手；获胜才放走信使并留下杀巡使的记录，失败结束本局。没有先发放的证词或和平奖励。','晏绮罗将纱横在缚绳前。岳衡拔剑：“这一剑，你是要替谁作保？”',ENCOUNTERS.patrol,{metMessenger:true,messengerAvailable:true,killedPatrol:true,checkpointResolved:true},'岳衡倒下，季远解开缚绳。他愿为接收地点作证，却不肯将你的杀人说成只是交涉。'),
      C('leave','这事与我无关，离开','不支付、不战斗、不取得路引或证词；仍可沿原路线寻找接收处。','晏绮罗收起扇子，没有替任何一方签字。巡使带走信使；你只记得接收地点的大致方向，调查少了这一份口供。',{hehuanFlags:{missedMessenger:true,checkpointResolved:true}})
    ],state);
    if(id==='hehuan_qinheng'){
      const reliable=!!f.checkpointEvidence||(!!f.messengerAvailable&&!f.handedMessenger);
      const ally=f.messengerAvailable&&!f.handedMessenger?'季远果然等在门外。他把接收日期念给秦蘅听，秦蘅认出了那一夜。':f.checkpointEvidence?'你带来的路引抄件上，宋箴的签押与门内账册相同。':f.handedMessenger?'宋箴知道信使已被送走，合上账册：“你把能对账的人交出去了，现在打算拿什么指控我？”':'你没有可靠口供，门牌只证明这里曾接收过宗门的人。';
      const winFlags={rescueReached:true,rescuedQinHeng:true,ledgerOriginal:true,killedAgent:true,agentDefeated:true};
      const winOutcome='宋箴倒下，秦蘅自己从案后取出账册。她走出仪式白线：“我肯作证，也要自己决定以后去哪。”原件收入你的包裹。';
      return scene(id,2,'账册旁的活人',[
        '秦蘅还活着，手腕上的引灵线一端扣在案脚。宋箴把账册横在她面前：“长老付过价。她留下，外堂才有药领。”',
        '“我的名字在册上，不等于我答应过。”秦蘅扯住线头。晏绮罗看着宋箴：“原件和人，你开价，还是让我查？”',ally
      ],[
        C('purchase','买下原件，把秦蘅带离仪式',`支付 ${COSTS.buyLedger} 灵石；取得账册原件并救出秦蘅，不战斗。宋箴收款后离开，未被杀死。`,'宋箴点清灵石，亲手撤去案脚引灵符。秦蘅拿走写着自己名字的账页，跟你走出白线。你买下了原件，也把收钱的人留在了世上。',{goldCost:COSTS.buyLedger,questItem:'hehuan_ledger_original',hehuanFlags:{rescueReached:true,rescuedQinHeng:true,ledgerOriginal:true,boughtLedger:true,agentSpared:true}}),
        reliable?C('negotiate','用已核证据逼宋箴放人','出示路引抄件或信使证词，核对签押；宋箴无法否认，交出原件并放人。本次不支付、不战斗。','宋箴的签押与接收时间一项项对上。秦蘅自己划去受领栏，拿走原件。宋箴放开引灵线，要求你别把账交回同一位长老。',{questItem:'hehuan_ledger_original',hehuanFlags:{rescueReached:true,rescuedQinHeng:true,ledgerOriginal:true,negotiatedRescue:true,agentSpared:true}}):battleChoice('negotiate_failed','没有可靠证词，仍逼他放人','证据不足，交涉将失败并立即与宋箴交战，玩家先手；获胜才救出秦蘅、取得原件，失败结束本局。','宋箴把空白处转向你：“人已送走，证词也没有。你说我签过字，拿给谁看？”他按住案下兵刃。',ENCOUNTERS.agent,winFlags,winOutcome,['hehuan_ledger_original']),
        battleChoice('attack','拔扇，连人带原件一起带走','立即与宋箴交战，玩家先手；胜利后取得原件、救出秦蘅并领取一份正常精英战利，失败结束本局。','晏绮罗将扇骨挑开案上引灵线。宋箴起身拔刃，原件仍压在他的左手下。',ENCOUNTERS.agent,winFlags,winOutcome,['hehuan_ledger_original']),
        C('hush','收下封口钱，不带人回去',`获得 ${COSTS.hushMoney} 灵石；不取得原件，不救秦蘅；她仍留在宋箴看守的仪式中。之后不能把此事写成营救。`,'宋箴把灵石推来，账册重新合拢。秦蘅没有喊她师姐，只把自己的名字念了一遍。你收了钱，从白线外离开。',{goldGain:COSTS.hushMoney,hehuanFlags:{rescueReached:true,tookHushMoney:true,rescueAbandoned:true,agentSpared:true}})
      ],state);
    }
    const original=ownsLedger(state),rescued=!!f.rescuedQinHeng;
    const unavailable=!original?'未持有账册原件，不能按此方式处置。':'';
    const lock=(c,extraReason='')=>({...c,requiresHehuanItem:'hehuan_ledger_original',locked:!original||!!extraReason,text:[c.text,!original?unavailable:extraReason].filter(Boolean).join(' ')});
    const witness=rescued?'秦蘅站在门外：“救命的事我记着。可账上别再替我签一个新主人。”':f.tookHushMoney?'接应者看见你收过的封口款袋：“这趟安静得很。账册呢？”案后的秦蘅没有跟来。':'接应者只见到你一个人，先看行囊，再问账册；秦蘅仍未被你带出仪式。';
    const messenger=f.messengerAvailable&&!f.handedMessenger?'季远把签押写在一旁，愿在公开时署名。':f.handedMessenger?'季远已被交给巡使；接应者说他不能来。你没有假称他已同意替你作证。':f.checkpointEvidence?'你仍能拿路引抄件逐字对照，但原件的去向只能按手中实物说明。':'眼前没有当初信使的口供，空缺不能由一句传闻补上。';
    const choices=[
      lock(C('publish','公布原件，请证人各自署名',`交出原件供核验，留下副本；下场战斗首回合获得 ${COSTS.publishGuard} 护盾，获得回春草×2。不能同时收宗门的回购钱。`,'晏绮罗把原件摊在各宗见证人面前，签名的人只写亲见的部分。护送者将护符系在她腕上；秦蘅若愿出面，名字由她自己写。',{questItem:'hehuan_ledger_copy',hehuanItemsRemove:['hehuan_ledger_original'],guard:COSTS.publishGuard,itemGrants:[{id:'herb',count:2}],hehuanFlags:{ledgerOriginal:false,ledgerPublished:true,ledgerCopy:true,publicWitnessSupport:true}})),
      lock(C('return','把原件交回宗门，换取补给',`交出原件，获得 ${COSTS.returnLedger} 灵石与聚灵丹×2；失去原件，不能再用它公布或索价。`,'接应者封好原件，把灵石和药逐件放下。晏绮罗没有再留下可公开核对的那一册。秦蘅若已获救，便独自收起行囊，不再替她作证。',{goldGain:COSTS.returnLedger,itemGrants:[{id:'spirit_pill',count:2}],hehuanItemsRemove:['hehuan_ledger_original'],hehuanFlags:{ledgerOriginal:false,returnedLedger:true,sectSupport:true,qinTrustLost:rescued}})),
      lock(C('leverage','保留原件，向长老索价',`保留原件，获得 ${COSTS.leverage} 灵石与「满堂红」；不获公开证人的护符或宗门回购补给。`,'晏绮罗将原件贴身收好，只让接应者看了一行签名。“外堂的药钱，从这里重新算。”对方付钱留下功诀；把柄仍在你手里，秦蘅的名字也仍在册中。',{goldGain:COSTS.leverage,cardIds:['H12'],hehuanFlags:{ledgerLeverage:true,sectHostile:true}})),
      lock(C('destroy','只带秦蘅离开，当面毁掉原件',`须已救出秦蘅；焚毁原件，恢复 ${COSTS.burnHeal} 生命并获得回春草×2，不取得封口或回购钱。`,'秦蘅把自己的账页先投入火中，其余原件随后烧尽。“我不替长老守口。”她说，“但以后也别拿这本账替我决定。”晏绮罗留下药，让她自己择路。',{heal:COSTS.burnHeal,itemGrants:[{id:'herb',count:2}],hehuanItemsRemove:['hehuan_ledger_original'],hehuanFlags:{ledgerOriginal:false,ledgerDestroyed:true,qinOwnPath:true}}),rescued?'':'尚未救出秦蘅，不能选择带她离开。')
    ];
    if(!original)choices.push(C('unfinished',f.tookHushMoney?'保留封口钱，不伪称已带回证据':'没有原件，不接新的处置约定','不改变资源，不补发原件、不自动救人。此前交人、收款或错过证词的事实仍保留。',f.tookHushMoney?'接应者不再问账，转而清点你收过的钱。秦蘅不在门外，晏绮罗没有替这个空位编一个圆满的说法。':'你摊开手里实际有的纸页，没有账册原件。接应者收回空匣，你继续赶路；失踪者和旧账都还未结清。',{hehuanFlags:{ledgerDispositionMissed:true}}));
    return scene(id,3,'原件只够交给一方',['接应者追到断亭，打开一只空匣：“长老说，原件交回来，外堂还有药钱。你若拿去给别人看，便别再用宗门的名号。”',witness,messenger],choices,state);
  }
  function ending(state,won=true){
    const f=flags(state),rescue=f.rescuedQinHeng===true;
    if(!won)return {title:'纱断，账未结',goal:rescue?'秦蘅曾被救出；她能否独自出域，尚无消息。':'秦蘅未被你带离祭仪。',text:['晏绮罗没能走完寒渊。'+(rescue?'她安排过的避难处仍有一人等归路；这不是已经抵达雾外的证明。':'那本交人账册和没能带走的人，仍留在这一程的记录里。'),f.tookHushMoney?'她收过封口钱，这一笔没有因落败消失。':'她最后握紧的仍是扇骨，没能替旧案写下终页。'],relation:rescue?'秦蘅的去向待查':'营救未成',quote:'账别替我销。'};
    let title,text,relation;
    if(rescue&&f.ledgerPublished){title='人归，账见天光';text=['秦蘅自己走过雾外的界碑，转身指了指晏绮罗腕上的见证护符：“救我这笔记着。往后的名字，我自己写。”','公开副本让几处签押有了核验的人。长老不再能把秦蘅说成从未入册，宗门也没有因此全变得干净。'];relation='秦蘅愿独立作证，外堂与长老的关系决裂';}
    else if(rescue&&f.returnedLedger){title='归人不替归账';text=['秦蘅获救后独自收好行囊：“人情我认。可这回卖回去的，不只有纸。”她没有替晏绮罗再作证。','宗门回购原件的灵石和丹药已经入袋，原件不在你手里。晏绮罗拿到了补给，也失去了用那一本账公开核验的机会。'];relation='秦蘅已离去，信任受损；宗门仍愿交易';}
    else if(rescue&&f.ledgerLeverage){title='活人归路，把柄随身';text=['秦蘅走出封域，却没有接外堂的新名帖：“我不想再让自己的名字，替你的药钱担保。”','晏绮罗保留着原件，索来的灵石和「满堂红」已实际入手。她救回了人，也选择继续用这份把柄与长老做生意。'];relation='秦蘅保留距离；长老的把柄仍在你手里';}
    else if(rescue&&f.ledgerDestroyed){title='灰尽，人各有路';text=['秦蘅在界碑外停步：“我会说自己见过的事，不替那本烧掉的账作保证。”她拿着留下的药，选了另一条路。','原件已经焚毁，未换取长老的灵石。晏绮罗失去了那份把柄，也没有再替秦蘅订下下一份约定。'];relation='师姐妹各走自己的路；原件无法再核验';}
    else if(f.tookHushMoney){title='带钱出域，无人同行';text=['雾外接应者先点封口钱，再问账册。晏绮罗没有带出秦蘅，也没有拿到原件。','秦蘅在案后念自己名字的声音没有跟来。她收过的钱仍在本局账上，胜利没有将那次离去改写成救人。'];relation='营救被放弃，宗门接应者知晓封口交易';}
    else if(rescue){title='人已带回，旧案未竟';text=['秦蘅确实离开了祭仪，亲自走到雾外。她说自己会另选去处，没有应允替任何一方守口。','账册未按完整处置方案落定；'+(ownsLedger(state)?'原件仍由晏绮罗保管。':'她手中没有可供处置的原件。')+'这部分仍是未竟之事。'];relation='营救完成，证据处置未竟';}
    else {title='穿过寒渊，未带回她';text=['晏绮罗走完七境，扇边的符结已经换过数次。秦蘅却没有被她救出，不能用镇境之战的胜利来替代那一次营救。','她带出的见闻有多少，只按本局确实取得的纸页作数。长老、巡使与师妹的旧账，还没有结清。'];relation='营救未成，旧案未竟';}
    if(f.killedPatrol)text.push('巡使岳衡被她所杀。季远即使愿作证，也没有为这次杀人改写经过。');
    else if(f.handedMessenger)text.push('季远曾被她交给巡使，后来没有被悄悄写成一直同行的证人。');
    return {title,goal:rescue?'秦蘅已被救出。':'秦蘅未被救出。',text,relation,quote:rescue?'人不是账上的东西。可账，还得有人算。':'这一页，还不能合。'};
  }
  function identityReply(event,state){
    if(state?.character!=='hehuan')return '';
    const id=typeof event==='string'?event:event?.id||'',f=flags(state),m=/^faction_(gate_boss|camp_boss|snake|bell_boss)_(source|cave)$/.exec(id);if(!m)return '';

      C('scrap','拆掉旧机，带走保险销','获得20灵石与损坏保险销；不取得完整控制记录，也没有修好桥。','斧子落下前，陆听澜先取出那颗销。木骨断开，桥下的响动停了一瞬。阿川领孩子踩着浅水过去，没接她递来的鞋，鞋被放在了桥桩上。',{goldGain:20,questItem:'tl_broken_pin',flags:{tlBridgeMode:'scrapped',tlBridgeResolved:true}}),
      C('investigate','留下拆读原芯','取得护桥机控制记录；离开时与山魈进行一场普通战。胜利后才继续，落败结束本局。','原芯吐出两行刻痕：半夜三更，有人拆过保险销；天亮前，旧机收到一条“清桥”指令。陆听澜收起原芯，桥洞里的山魈已经爬上来了。',{questItem:'tl_control_record',battle:{enemyId:'ape',name:'山魈',kind:'fight'},flags:{tlBridgeMode:'investigated',tlHasControl:true,tlBridgeResolved:true}}),
      C('leave','绕过旧机，继续找救援队','不花钱，不取得证词或原芯；不会阻断七境主线。','陆听澜将供芯线压在石下，又在桥桩上划了一道禁启线。阿川牵着孩子走进浅水，鞋还留在原处。',{flags:{tlBridgeMode:'left',tlBridgeResolved:true}})
    ],state);
    if(id===STORY_IDS[1]){
      const original=has(state,'tl_control_record'),testimony=has(state,'tl_testimony'),pin=has(state,'tl_broken_pin');
      const evidence=original?'陆听澜将原芯立在桌角。管事认出芯槽的编号，先伸手盖住验真印。':testimony?'阿川画的纸被压在茶碗下。管事看了一遍路线，又把纸翻过来，看见陆听澜写的尺寸。':pin?'保险销滚到茶碗边。管事用袖口包着捡起，没有碰那道磨痕。':'管事掀开机匣，只看见陆听澜自己的工具。他把封存纸压平：“找到东西再来。”';
      return scene(id,2,'院里的封存令',[
        '接应棚里，管事吴桐把炉火拨旺：“先把东西交我。院里查清了，自然给你答复。茶别喝，放了一夜。”',evidence,
        '“保险销照我们的图纸改的。”陆听澜说。吴桐把门闩推上：“你现在拿出去，所有人只会记得天工院机关杀人。先替那些还等着修桥的人想想。”'
      ],[
        {...C('return','交回原芯，索取封存回执','须持有护桥机控制记录；交出原芯，获得35灵石，下场开战额外2驱动一次。','吴桐给原芯贴了两层封纸。陆听澜按住他的笔：“写清收的是几号芯。别只写旧器。”他停了一会儿，补上编号，把灵芯与回执一起推过来。',{goldGain:35,nextDriveAid:2,mechanistItemsRemove:['tl_control_record'],flags:{tlEvidenceReturned:true,tlHasControl:false,tlSealMode:'original'}}),locked:!original},
        {...C('copy','交刻痕拓纸，保留原芯','须持有护桥机控制记录；取得刻痕拓纸，下场开战额外2驱动一次。原芯仍保留；没有35灵石。','她用炭纸拓完芯槽，把拓纸推过去。吴桐伸手要原芯，她先合上了机匣。“够你查出货的人了。”他没接这句话，只将一枚备用灵芯放到桌边。',{questItem:'tl_record_copy',nextDriveAid:2,flags:{tlKeptCopy:true,tlSealMode:'copy'}}),locked:!original},
        {...C('statement','交出桥口证词的抄件，请他当场查账','须持有桥口证词或保险销；保留现有实物，获得「翼骨校准」；不取得灵芯援助。','吴桐翻到出货栏，停在一个空行。陆听澜用机尺压住那一页。“你再往前翻。”管事抽回手，拿出一份旧校准图：“路上用得着。出货的事，我查。”',{cardIds:['J36'],flags:{tlSealMode:'statement',tlNamedEmptyLine:true}}),locked:!testimony&&!pin},
        C('refuse','不交，自己去找出货的人','不取得灵石或灵芯援助。持有的实物全部保留。','她把机匣背好。吴桐追到门边，递来一张空白封存纸；她没接。纸在炉边烤得翘起一角，管事伸手压住，烫得缩了一下。',{flags:{tlSealMode:'refused'}})
      ],state);
    }
    const complete=(has(state,'tl_control_record')||has(state,'tl_testimony'))&&!f.tlEvidenceReturned;
    const bridge=f.tlBridgeMode==='repaired'?'邱生把阿川的画认了出来：“对，就是桥口那家。上头让我们先清那里。”':f.tlBridgeMode==='scrapped'?'邱生摸到缺齿的保险销，立即把手缩开：“磨这个的时候，我在场。”':f.tlBridgeMode==='investigated'?'邱生对上原芯上的刻痕：“清桥那行是我刻的。下面还有一句，没刻进去。”':'邱生拿机尺顶开袖口：“我一直等院里再派人来。你怎么来得这么晚？”';
    return scene(id,3,'该留下什么记录',[
      '失联救援队的邱生还活着，左腿被木骨支架撑着。他从袖尺暗匣里抽出一页出货账：改销、清桥、转交玄烬教，末尾有院内批准的日期。',bridge,
      '吴桐从后门进来，没看邱生，先把七十枚灵石排在桌上：“这张纸给我。伤员我接出去，院里的名字我来背。”邱生按住暗匣：“你来背，还是等我也不在了？”'
    ],[
      {...C('publish','带出原账，署名公开','须保留桥口证词或控制原芯；获得署名的公开记录、下战12护盾与回春草2份；此后不收院内封口钱。','陆听澜把出货账夹进桥口的记录里，在第一页写下自己的名字。邱生问能不能也写，她把笔递过去。吴桐起身要走，跨过门槛时说：“以后的修件，别再来找我。”',{questItem:'tl_public_record',guard:12,itemGrants:[{id:'herb',count:2}],flags:{tlFinalDisposition:'public',tlRescuerOut:true,tlWitnessPublic:true}}),locked:!complete},
      C('internal','交原账追责，要求留下签押','交出这页出货账，获得下战8护盾、聚灵丹2枚；已有旧证据保留。院内援助继续，雾外会有后续回信。','陆听澜把七十枚灵石推开，只让吴桐在收件处签字。“先封改销工坊，把邱生送出去。少一项，我就带这张收条去院门口。”吴桐签完，看了看邱生的腿，叫人搬来担架。',{guard:8,itemGrants:[{id:'spirit_pill',count:2}],flags:{tlFinalDisposition:'internal',tlRescuerOut:true,tlInternalReceipt:true}}),
      C('silence','收下灵石，把这页账留给吴桐','获得70灵石与「雷羽齐发」；不取得公开记录或院内护符。邱生会知道你接受了这笔交易。','灵石进袋时，邱生把袖尺的暗匣合上了。陆听澜伸手扶他，他撑着桌子自己站起来：“不用了。你修你的东西。”吴桐将出货账贴身收好，又留下了一张雷羽图。',{goldGain:70,cardIds:['J37'],flags:{tlFinalDisposition:'silence',tlRescuerOut:true,tlWitnessTrustLost:true}}),
      C('keep','带邱生离开，暂时留下原账','取得出货账与「急修」一张；不自动公布或宣告追责完成。','她先背起邱生，叫承山顶开门，才把账页塞进机匣。鸣镝停到屋檐下，她低声骂了一句：“说了别往屋顶上扎。”邱生在背后笑了一声，笑到一半变成了咳嗽。',{questItem:'tl_delivery_list',cardIds:['J11'],flags:{tlFinalDisposition:'kept',tlRescuerOut:true}})
    ],state);
  }
  function ending(state,won=true){
    const f=flags(state),d=f.tlFinalDisposition;
    if(!won)return {title:'线未断，人未归',goal:f.tlRescuerOut?'邱生曾离开旧址，能否出域尚无消息。':'失联救援队尚未被带出。',text:['陆听澜倒下时还握着折尺。承山胸前的半朵红花沾了灰，灯芯一闪，灭了。',f.tlBridgeMode==='repaired'?'桥口那段梁还撑着，阿川每天替她看一眼保险销。':'桥口的旧机停在断墩旁，供芯线压在石头下。'],relation:'救援与旧案未竟',quote:'线……先别剪。'};
    if(d==='public')return {title:'把名字写在图纸上',goal:'邱生出域，改造记录已经公开。',text:['雾外，邱生撑着新配的木拐，一笔一划重写出货的日期。阿川将孩子的红鞋放到桌边，鞋带已经补好。','院里寄来的公函没有称她同门。陆听澜用那张纸垫在机脚下，继续拧紧松动的螺钉。'],relation:'邱生与灾民愿作证；部分院内补给断绝',quote:'字写大一点。我签的，我认。'};
    if(d==='internal')return {title:'收件处有一个名字',goal:'邱生出域；封存回执交回天工院。',text:['三天后，吴桐送来封坊清单与两名管事的停职令。邱生逐个看了名字，指向末尾：“批准转交的那个人呢？”','陆听澜把回执摊在他面前，又取出折尺里的炭笔。院门还开着，两人没有急着进去。'],relation:'院内支持仍在；邱生继续追问批准者',quote:'他签过字。下一回，让他当面说。'};
    if(d==='silence')return {title:'机匣重了，人走远了',goal:'邱生出域；原账已交给吴桐。',text:['院里送来崭新的铜羽与一封嘉奖信。陆听澜拆开，第一眼却去找邱生的名字，没有找到。','邱生在渡口看见她，撑拐换了一个棚子候船。她追了两步，机匣里的灵石撞在一起，很响。'],relation:'院内愿意交易；邱生不再愿意同行',quote:'这笔钱……先放着。'};
    if(d==='kept')return {title:'尺中仍藏着一页纸',goal:'邱生出域，出货账尚未处置。',text:['邱生在雾外把袖尺留给她：“暗匣松了，你有空修一修。”他先去找失散的队员家属。','陆听澜把账页放回尺中，将暗匣的卡簧修好。找到了人，旧账还放在桌上。'],relation:'邱生归来；原账保留，追责未竟',quote:'能修。账也一样，一笔一笔来。'};
    return {title:'带着空机匣回来',goal:'救援队下落未能查清。',text:['雾外的接应者问救援三队还有谁活着。陆听澜打开机匣，取出一路找到的东西，最后只剩三格空位。','她把原来的急信翻到背面，写下仍未找到的名字。承山低下头，让她扶着肩甲坐了一会儿。'],relation:'寻人未成，旧案未竟',quote:'再等一下。我还没找完。'};
  }
  const api={CARDS,CHARACTERS,STARTERS,RELICS,MACHINES,FACTION,ITEMS,STORY_IDS,PERSONAL_SLOTS,INITIAL_STORY,TUTORIAL,COSTS,flags,buildEvent,ending};
  root.NightMechanist=api;if(typeof module!=='undefined'&&module.exports)module.exports=api;
})(typeof globalThis==='object'?globalThis:window);
</script>
<script>
/* Small offline expedition rules: inventory, fixed cave discoveries and shop supplies. */
(function(root){
  'use strict';
  const ITEMS={
    herb:{name:'回春草',text:'恢复 6 点生命。不会解除毒素。',icon:'herb',rarity:'common',price:9,heal:6},
    dewherb:{name:'凝露叶',text:'恢复 12 点生命。不会解除毒素。',icon:'herb',rarity:'common',price:16,heal:12},
    healing_pill:{name:'回气丹',text:'恢复 24 点生命。不会解除毒素。',icon:'pill',rarity:'uncommon',price:28,heal:24},
    fullheal_pill:{name:'九转还元丹',text:'将生命完全恢复至当前上限。不会解除毒素。',icon:'fullheal',rarity:'rare',price:55,fullHeal:true},
    antidote:{name:'百草解厄丹',text:'清除全部战斗毒素，并彻底根除缠脉毒；不恢复生命。',icon:'antidote',rarity:'rare',price:42,cure:true},
    battle_pill:{name:'虎魄丹',text:'本场战斗每张攻击牌的第一段伤害 +2，最多 +4；战斗外服用则在下一场生效。',icon:'strength',rarity:'uncommon',price:32,power:2},
    spirit_pill:{name:'聚灵丹',text:'立即获得 2 点灵力。只能在自己的战斗回合使用。',icon:'pill',rarity:'uncommon',price:20,energy:2}
  };
  const OUTSIDE_SCREENS=['arrival','map','rest','shop','fox','event','cave','threshold'];
  function create(hooks){
    const getState=hooks.getState;
    const random=()=>Math.max(0,Math.min(.999999999999,Number((hooks.rng||Math.random)())||0));
    const pick=values=>values[Math.floor(random()*values.length)];
    const emit=()=>hooks.emit?.();
    const note=message=>hooks.note?.(message);
    const event=(type,fields)=>hooks.event?.(type,fields);
    const log=message=>hooks.log?.(message);
    function resetRun(){const s=getState();s.player.inventory={herb:2};s.player.pendingPillPower=0;s.cave=null;}
    function grantItem(id,amount=1){
      if(!ITEMS[id]||!Number.isSafeInteger(amount)||amount<1)return false;
      const p=getState().player;p.inventory=p.inventory||{};p.inventory[id]=(p.inventory[id]||0)+amount;return true;
    }
    function getItemUse(id){
      const s=getState(),p=s.player,b=s.battle,item=ITEMS[id];
      const no=reason=>({usable:false,reason});
      if(!item||!(p.inventory?.[id]>0))return no('包裹中没有此物');
      if(p.hp<=0||s.screen==='defeat'||s.screen==='victory'||s.screen==='title')return no('此时无法服用');
      const battle=s.screen==='battle';
      if(battle&&(!b||b.phase!=='player'||b.enemy.hp<=0))return no('等待自己的回合');
      if(!battle&&!OUTSIDE_SCREENS.includes(s.screen))return no('完成当前结算后再服用');
      if(battle&&b.itemUsedTurn===b.turn)return no('本回合已服用一件药物');
      if((item.heal||item.fullHeal)&&p.hp>=p.maxHp)return no('生命已满');
      if(item.cure&&!(p.affliction?.active||(battle&&b.poison>0)))return no('当前没有需要清除的毒素');
      if(item.energy&&!battle)return no('只能在自己的战斗回合服用');
      if(item.power&&(battle?(b.pillPower||0):(p.pendingPillPower||0))>=4)return no('药力已达上限');
      return {usable:true,reason:battle?'不消耗灵力；每回合限服用一件':'服用后消耗一件'};
    }
    function getInventory(){
      const inventory=getState().player.inventory||{};
      return Object.keys(ITEMS).filter(id=>inventory[id]>0).map(id=>({id,...ITEMS[id],count:inventory[id],...getItemUse(id)}));
    }
    function useItem(id){
      const availability=getItemUse(id);if(!availability.usable)return false;
      const s=getState(),p=s.player,b=s.screen==='battle'?s.battle:null,item=ITEMS[id];
      if(b)hooks.beginEvents?.();
      // Consume and lock before effects: reentrant renders cannot spend this dose twice.
      p.inventory[id]--;if(!p.inventory[id])delete p.inventory[id];
      if(b)b.itemUsedTurn=b.turn;
      let result='';
      if(item.heal||item.fullHeal){const amount=hooks.heal(item.fullHeal?p.maxHp:item.heal,item.name);result=`恢复 ${amount} 点生命`;}
      if(item.cure){
        const poison=b?.poison||0;
        if(b){b.poison=0;if(poison)event('poison',{target:'player',amount:-poison,total:0});}
        if(p.affliction?.active){
          if(hooks.cureAffliction)hooks.cureAffliction();
          else {p.affliction.active=false;p.affliction.revealed=true;p.affliction.suppressed=0;}
        }
        result='毒素已清，经脉恢复平静';
      }
      if(item.power){
        if(b)b.pillPower=Math.min(4,(b.pillPower||0)+item.power);
        else p.pendingPillPower=Math.min(4,(p.pendingPillPower||0)+item.power);
        result=b?`本场攻击牌首段增伤 ${b.pillPower}`:`下一场攻击牌首段增伤 ${p.pendingPillPower}`;
      }
      if(item.energy){b.energy+=item.energy;result=`获得 ${item.energy} 点灵力`;event('energy',{target:'player',amount:item.energy,total:b.energy});}
      log(`${item.name}：${result}。`);
      if(b)event('item',{target:'player',itemId:id,name:item.name,text:result});
      note(`服下${item.name}，${result}。`);emit();return true;
    }
    function makeShopStock(){
      const first=pick(['herb','dewherb','healing_pill']);
      const second=pick(['fullheal_pill','antidote','battle_pill','spirit_pill']);
      return [first,second].map(id=>({id,price:ITEMS[id].price,bought:false}));
    }
    function buyItem(index){
      const s=getState();if(s.screen!=='shop'||!Number.isInteger(index))return false;
      const entry=s.shop?.items?.[index];
      if(!entry||entry.bought||!ITEMS[entry.id]||s.player.gold<entry.price)return false;
      entry.bought=true;s.player.gold-=entry.price;grantItem(entry.id);
      note(`花费 ${entry.price} 灵石，${ITEMS[entry.id].name}已收入包裹。`);emit();return true;
    }
    function rewardItem(id,amount=1){return {kind:'item',id,amount,name:ITEMS[id].name};}
    function rollCave(){
      const s=getState(),roll=random();
      if(roll<.28){
        const enemyId=pick(s.floor>=21?['bone','raider','yaksha']:s.floor>=11?['bone','ape','raider']:['paper','lantern','bone','ape']);
        return {kind:'enemy',enemyId,battleKind:enemyId==='yaksha'?'elite':'fight',title:'封石后的动静',text:'石门内传来兵刃刮过地面的声音。守在药匣旁的身影转向了你。',rewards:[rewardItem(pick(['healing_pill','battle_pill','antidote','spirit_pill']))]};
      }
      if(roll<.43)return {kind:'coins',title:'遗落的铜匣',text:'铜匣底铺着一层旧绒，散落的灵石仍带着微光。',rewards:[{kind:'gold',amount:25+Math.floor(random()*21),name:'灵石'}]};
      if(roll<.63)return {kind:'herbs',title:'石缝里的药香',text:'滴水润着一簇完好的灵草。你辨清药性，收进了包裹。',rewards:[rewardItem(pick(['herb','dewherb']),2+Math.floor(random()*2))]};
      if(roll<.85){const id=pick(['healing_pill','spirit_pill','battle_pill','antidote','fullheal_pill']);return {kind:'pills',title:ITEMS[id].rarity==='rare'?'封存的玉瓶':'未冷的丹炉',text:'炉旁的玉瓶封蜡未破，药香在瓶口凝成一线白雾。',rewards:[rewardItem(id)]};}
      const available=Object.keys(hooks.relics||{}).filter(id=>!['bell','fox','frostseal','veil','heartmirror'].includes(id)&&!s.player.relics.includes(id));
      if(available.length){const id=pick(available);return {kind:'treasure',title:'尘封秘藏',text:'重重封印自行散去。一件完整的灵物悬在石台上，仿佛等了很久。',rewards:[{kind:'relic',id,amount:1,name:hooks.relics[id].name}]};}

      {label:'坐下喝一杯水，把余下的留下',text:'恢复 18 生命。',heal:18,outcome:'杯里的水有淡淡松香。你把杯子放回原处，火光落在一路带来的行囊上，像远处仍有一扇门。'},
      {label:'把松枝换成随身火符，取走炉边丹药',text:'失去 3 生命，获得九转还元丹 ×1。',hpCost:3,itemGrants:[{id:'fullheal_pill',count:1}],outcome:'火符引燃时烫过指节。炉边的小药瓶被你取走，松枝却还能为下一位来人继续燃上一阵。'},
      {label:'把火拨旺，整理最后的护符',text:'下场战斗首回合获得 16 护盾。',guard:16,outcome:'火星没有升向天空，而是融进护符边沿。你看了看留下的两杯水，转身走向命枢。'}
    ]}
  };
  for(const [id,boss] of Object.entries(BOSSES))boss.id=id;
  for(const [id,event] of Object.entries(EVENTS))event.id=id;

    EVENT_IDS:Object.keys(EVENTS),PORTRAIT_IDS:[...Object.keys(BOSSES),...Object.keys(ELITES)],REGION_IDS:REGIONS.map(region=>region.id)};

<script>

(function(root){

 const gift=role=>role==='hehuan'?'H07':role==='sword'?'S14':role==='sovereign'?'F07':'C18';
 const CHAIN_DEFS={
 debt:{name:'渡口的旧账',person:'岑娘',theme:'欠债的人与替人记债的人，各自藏着一份不能毁掉的账。',stages:[

   C('aid','替她付十二枚灵石','支付12灵石；她会收好这份代付。','她当着你的面在借据背后按了手印，没有说这是最后一笔债。',{goldCost:12}),
   C('copy','抄下借据，问清账目','无即时奖励；带走亲手核对的借据。','你抄完数目，发现利灵石每月都变。岑娘说她识不得那些小字，只认得船客的脚步。'),
   C('leave','留下营地方向，继续走','数值不变；没有代她偿债。','她谢过指路，把碗翻过来挡雨。你离开时，她还在擦那两双鞋。')]),
  c=>E('册页里的鞋印',[c.p(1)==='aid'?'残桥账棚里，岑娘认出了代付的手印。催账的老人却说，那十二枚灵石早已用于买药。':'你在残桥的账棚再遇岑娘。她同催账老人争的不是利灵石，是一本不能交出去的册子。','册中记着偷渡者的旧名。老人解释，留名才能向营地领粮；若让追索者拿走，这些名字又会变成缉捕名单。'],[
   C('redact','对照借据，另抄匿名粮册','支付8灵石买纸墨；下一战首回合护盾+6。','你们逐户核对，姓名换成只有各家认得的鞋印。老人没被洗清，岑娘也没被免债；先让人吃上饭。',{goldCost:8,guard:6}),
   C('publish','把原册交给营地核查','获得18灵石抄录费；原册由营地接管。','执事收走原册，承诺依法处置。岑娘问姓名能否遮住，你没能替执事给出保证。',{goldGain:18}),
   C('return','把册子留给当事人','不领取报酬；各人自行承担这本账。','你把借据压在桌上，让他们自己谈。老人第一次摘了帽，露出同样逃亡留下的烙痕。')]),
  c=>E('灯下有人还灵石',[c.p(2)==='redact'?'泽边新渡口挂着鞋印木牌。有人拿粮，有人替老人搬货，欠账仍在，却终于能逐笔说清。':c.p(2)==='publish'?'原册送去后，一些人领到了粮，也有人被带走核验。岑娘把空船系好，仍在等一句确切消息。':'岑娘与老人合撑一条船。他们没和解所有旧事，只约好每一笔灵石都当面念给对方听。',c.p(1)==='aid'?'岑娘递回十二枚灵石：“该还的不能都变成人情。”':'她没有说你救过谁，只给你留了一个能避雨的位置。'],[
   C('settle','收下对方能承担的回报','获得16灵石与1份凝露叶。','灵石和药都当面点清。岑娘仍有债务，但她能决定这次借不借，向谁借。',{goldGain:16,...item('dewherb')}),
   C('fund','把十二枚灵石留作下一人的渡资','支付12灵石；获得1枚回气丹及下一战首回合护盾+12。','老人把渡资另设一栏，岑娘规定不得记下求助者的旧名。帮助不再只靠谁恰巧心软。',{goldCost:12,guard:12,...item('healing_pill')}),
   C('listen','不清旧账，只听她把故事说完','恢复8生命。','你们坐到雨停。她终于说，那些鞋来自没能过河的人；她不想再替活着的人决定该留下什么。',{heal:8})])]},
 medicine:{name:'分作两碗的药',person:'杜蘅',theme:'救人的资格不是奖赏，救人的代价也不能永远由一人承担。',stages:[
  c=>E('药棚只剩两碗',['杜蘅把最后一帖药分成两碗。一名剑宗伤者需要整剂才能赶路，押药的女行脚也在发热。','“我知道你急着进去。”她没有问你的门派，“但你买走的这一碗，不会自己再长回来。”'],[
   C('share','补十五枚灵石，让两人分药','支付15灵石；带走1份回春草。','两碗都端了出去。杜蘅没有许诺一定能救活，只记下谁喝了多少，准备等下一批药。',{goldCost:15,...item('herb')}),
   C('priority','请她优先救能回营求援的人','下一战首回合护盾+8；药棚把急救符借给你。','剑宗伤者喝下整剂，承诺带救援回来。行脚把自己的半碗推远了一点，什么也没说。',{guard:8}),
   C('buy','买下一份药带走','支付10灵石；获得1枚回气丹。','杜蘅把自己的备用丹递给你：“不是这两碗。”她的手抖了一下，仍把交易写进账里。',{goldCost:10,...item('healing_pill')})]),
  c=>E('被贴住的药单',[c.p(1)==='priority'?'喝过整剂的伤者确实带回了人，却也带回一道查封令：药棚曾给玄烬弃徒治病。':'杜蘅的药单贴上了封条。有人指证她救过玄烬弃徒，有人记得她也救过被弃徒伤过的人。','女行脚留下一张交货条，证明药在封域前已付款。它能说明来源，却不能替所有伤者证明清白。'],[
   C('testify','署名证明自己见过的部分','支付8灵石誊写供述；获得1枚百草解厄丹。','你只写亲眼见过的两碗药，没有替陌生人洗清罪名。杜蘅把一枚解毒丹交给你，执事终于肯逐条问话。',{goldCost:8,...item('antidote')}),
   C('move','帮她迁走仍在发热的病人','支付12灵石；下一战首回合护盾+12。','你没有与封条争辩，先把人搬到有风的地方。有人因此责你偏袒，病人的呼吸却不必等争论结束。',{goldCost:12,guard:12}),
   C('distance','替药棚抄清交货条，不介入查封','获得12灵石誊录工钱；不是退还从未支付的押金。','你把交货的日期和数量逐笔誊清，收下十二枚灵石工钱。杜蘅仍得面对查封，你没有替药棚作证。',{goldGain:12})]),
  c=>E('没人问出身的长凳',[c.p(2)==='distance'?'更深处的水榭里，杜蘅用旧门板重新支起药台。她认得你，却只先问伤在哪里。':'你写过的供述或搬过的病人没有解决所有争执。药棚重新开张时，长凳仍按伤势排队。',c.p(1)==='priority'?'那名伤者也在排队。他承认自己怕被问责才先递了查封文书，今日带来营中结余的药。':'女行脚把新的药包送到门口，没有再把自己的那份推开。'],[
   C('receive','接受一次治疗和一剂药','恢复14生命，获得1份凝露叶。','杜蘅同样记录了用药。她说这不是偿清人情，是让这张长凳继续有用。',{heal:14,...item('dewherb')}),
   C('supply','支付二十枚灵石，分担下一批药资','支付20灵石；获得1枚百草解厄丹和对应主角功法。','你的名字写在供药栏，不写在病人的身上。受过药的人不欠你一个必须回报的未来。',{goldCost:20,...item('antidote'),cardIds:[gift(c.role)]}),
   C('pass','把位置让给更急的人','下一战首回合护盾+10。','你把位置让出去，杜蘅仍替你补好护身符。她不赞你比旁人高尚，只说别撑到来不及。',{guard:10})])]},
 letter:{name:'未寄出的家书',person:'阿筠',theme:'真相有其价值，承受真相的人也有决定如何承受的权利。',stages:[
  c=>E('火盆上的封口',['驿亭里，阿筠把一封家书悬在火盆上。写信人死在引灵仪反噬那夜，收信人还在外面等他。','“他说那扇门是自己放开的。”她停了很久，“后面又说，他以为能救更多人。”'],[
   C('deliver','答应把封好的信带到下一座驿亭','下一战首回合护盾+5；保留原封。','阿筠把信交给你，提醒你信里还有活人的住处。你答应送达，不答应替任何人解释。',{guard:5}),
   C('read','与她核验信中能查证的部分','支付6灵石查询旧档。','你们只核对了开门的时辰，发现与营地公报不同。阿筠不再让纸角靠近火。',{goldCost:6}),

   C('consent','先让家属亲自读信，再决定是否公开','支付10灵石请可信的见证人。','家属哭完后要求留下复本。她说不替死者开脱，也不想让旁人用她的悲痛代为表态。',{goldCost:10}),
   C('expose','把可核验的命令时辰公示','获得15灵石查证赏金；隐去住处。','你抄出证据，没有抄住处。人群开始争论责任，阿筠去敲了收信人的门。',{goldGain:15}),
   C('seal','保全抚恤，把信只交到家属手中','恢复6生命。','她收下信与抚恤单，要求暂不公开。你知道这可能拖延追责，也知道她明日仍需吃饭。',{heal:6})]),
  c=>E('碑上留白',[c.p(2)==='consent'?'家属带着信的复本来到旧址。她选择公开命令时辰，却不愿把丈夫写成只剩罪或只剩功的人。':c.p(2)==='expose'?'命令时辰迫使营地重查旧档。写信人的名字仍被争论，家属没有授权任何人替她原谅。':'旧址的碑没有新增供人争论的字。阿筠说家属保存了信，也保存了暂时不说的权利。','阿筠要离开封域了。她问你，给后来的人留证据，是否一定要把某个人的一生刻在最显眼的地方。'],[
   C('archive','封存证据，注明已知与未查明之处','获得对应主角功法和16灵石。','你们留下有出处的副本，写清谁亲眼见过，谁只是转述。空白没有被好听的结论填满。',{goldGain:16,cardIds:[gift(c.role)]}),
   C('relief','把十八枚灵石留给等信的人','支付18灵石；获得1枚回气丹与下一战首回合护盾+12。','阿筠把灵石与证据分开装。援助不要求家属选择你认同的说法。',{goldCost:18,guard:12,...item('healing_pill')}),
   C('farewell','把决定留给家属，送她出驿亭','恢复10生命。','你们谁也没有说事情已经圆满。阿筠终于不用把信举在火上，来决定一个人的归处。',{heal:10})])]},
 name:{name:'借来的名字',person:'许渡',theme:'身份能给人庇护，也可能把另一个活人从自己的位置挤走。',stages:[
  c=>E('衣领里的玉牌',['山门残亭里，许渡穿着不合身的宗门外袍。他请你替他证明同行，好让伤者先过验关。','你看见玉牌背面沾着新泥。他说衣袍是从倒塌的驿舍里取的，没有说原主去了哪里。'],[
   C('vouch','只证明此刻见到的伤势','支付8灵石请人换药；下一战首回合护盾+4。','你没有替身份作保，只请守关者先看伤。他把玉牌藏得更深，低声道谢。',{goldCost:8,guard:4}),
   C('verify','请他一起寻找玉牌原主','获得8灵石路资。','他答应去找，给你看了领牌时找到的半张路线。你保留疑问，也没有把他赶回雾里。',{goldGain:8}),
   C('refuse','不替陌生身份作证','数值不变。','许渡把衣领扣好，另找可以通行的路。你没有承诺，也不知道那条路会不会更危险。')]),
  c=>E('同一块牌的两个人',['玉牌的原主还活着，靠在断墙边养伤。许渡说没有那件外袍，他根本到不了这里；原主说自己的身份也不能平白消失。','两个人都需要过关，而登记册只有一个名字。守关者愿听证言，却不肯在空白处多写一个没有来历的人。'],[
   C('record','请两人分别陈述，另立临时伤籍','支付12灵石；获得1份凝露叶。','许渡承认借走衣袍，原主确认他没有乘伤害人。守关者给了限期伤籍，没有把冒名说成从未发生。',{goldCost:12,...item('dewherb')}),
   C('owner','归还玉牌，让原主先过关','获得20灵石寻物报酬。','你把牌递回原主。他付清灵石，许渡退到墙外；归还了东西，并不等于第二个人就有了去处。',{goldGain:20}),
   C('escape','帮两人从不验身份的旧渠离开','下一战首回合护盾+8。','两人都活着离开关卡，也都失去了向营地求援的资格。你指的路不是没有代价。',{guard:8})]),
  c=>E('能够自报名姓',[c.p(2)==='record'?'许渡在新营地用自己的名字领到一份临时活计。玉牌原主替他作过见证，不曾说借牌之事值得效仿。':c.p(2)==='owner'?'原主已经过关，许渡则在搬运伤者时重新登记了名字。他没有等来你的援助，也没有因此停止活下去。':'旧渠尽头，两人轮流照看新来的伤者。没有宗门名册替他们担保，他们只能逐件做能被人看见的事。','许渡终于把自己的名字告诉你，不再附上一个更响亮的门派。'],[
   C('accept','收下他们共同备下的护符','下一战首回合护盾+16，获得1份回春草。','两个人各系了一半绳结。你收下的是今日的谢意，没有抹去昨日的责任。',{guard:16,...item('herb')}),

   C('part','互道名字后告别','恢复10生命。','他把旧外袍交还给原主。名姓并没有让路突然平坦，却让这次分别不必再靠一句假话。',{heal:10})])]},
 lanterns:{name:'逆水的灯',person:'孟夫人',theme:'思念可以挽留死者的形象，却不能替活人决定何时离开。',stages:[

   C('oil','买灯油，陪她坐一会儿','支付10灵石；恢复8生命。','她给你添了热水。帘后那只手停住，像在等你问一句，却最终没有开口。',{goldCost:10,heal:8}),
   C('ask','轻声询问帘后是谁','无即时奖励。','一个声音答：“我叫孟清，还活着。”孟夫人把灯拨得更亮，像是没有听见。'),
   C('leave','不惊扰这场家事','获得1份回春草。','孟夫人把草药放在门边，说来客路远。你离开后，水声又替她遮住了帘后的话。',item('herb'))]),
  c=>E('水里的人不是倒影',['孟清在泽国的小舟上找到你。灾变让她的形貌时常透明，母亲把她当成早逝姐姐的归魂，不肯让她出门。','“她也怕失去我。”孟清替母亲说完这句，才补上自己的请求，“但我不能用一辈子证明姐姐还在。”'],[
   C('speak','陪她回去，把两个人的话都听完','支付8灵石雇船；下一战首回合护盾+8。','你坐在两人之间，只在孟清被打断时请她继续说。孟夫人没有立刻理解，但第一次叫对了名字。',{goldCost:8,guard:8}),
   C('passage','替她安排独自离开的船位','支付14灵石；获得1枚聚灵丹。','孟清留下去向，没有留下供人追索的契印。她选择离开，也接受母亲可能一时不会原谅。',{goldCost:14,...item('spirit_pill')}),
   C('delay','劝她等母亲平复后再走','恢复6生命。','她点头，随后自己收好船票。你说了一个容易出口的“再等等”，却不能替她过等待的日子。',{heal:6})]),
  c=>E('顺流而下的一盏',[c.p(2)==='speak'?'天阙边的渡口，孟夫人终于把一盏灯交给孟清。她仍会叫错名字，却愿意被提醒。':c.p(2)==='passage'?'孟清寄来一小包灯芯。孟夫人看了去向很久，没有拆开回邮的封口；至少这次她知道活人能来信。':'孟清后来还是自己走了。孟夫人留着她的船票存根，等候的对象终于不再是死者的影子。','那盏灯这次随水向下。没有人说思念已经结束，只是不再拿它拴住另一个人。'],[
   C('keepsake','收下一枚不系归魂契的灯珠','获得1枚回气丹与下一战首回合护盾+10。','灯珠只是一盏灯的余温，不承诺让谁回来，也不要求收下的人永远留下。',{guard:10,...item('healing_pill')}),
   C('send','付十二枚灵石，替她们保留往来的船位','支付12灵石；获得对应主角功法。','船位可以不用，信也可以暂时不回。你留下的是来往的可能，而不是必须团圆的命令。',{goldCost:12,cardIds:[gift(c.role)]}),
   C('watch','看着河灯顺水离开','恢复12生命。','水面没有给出圆满的答案。两个人却终于能把各自的名字，放在同一封信上。',{heal:12})])]},
 grain:{name:'余粮与旧秤',person:'陶掌柜',theme:'价格、秩序与善意，都可能成为让某些人不必承担代价的说辞。',stages:[
  c=>E('秤盘里的最后一升',['陶掌柜用一把旧秤分粮。她把价码提了两倍，说护送费也涨了；护卫却悄悄割开一只粮袋给伤者。','“人人先拿一把，明日就都没得拿。”她发现破口，第一眼看的仍是剩下多少粮。'],[
   C('fund','付十二枚灵石，买一份公开分配的粮','支付12灵石；获得1份凝露叶。','陶掌柜把价目写在袋上，护卫依伤势分粮。灵石没有凭空变多，至少这一袋不能再暗中卖第二次。',{goldCost:12,...item('dewherb')}),
   C('guard','接受护送委托，领取报酬','获得18灵石；答应沿路照看车队。','她当面付了定金，护卫不太高兴。你答应的是护送，没有答应替每一种价码辩护。',{goldGain:18}),
   C('weigh','先核验秤与损耗，再决定','下一战首回合护盾+5。','秤没有少斤两，账里却把丢失的车马都摊给最后的买主。陶掌柜说，总要有人付。',{guard:5})]),
  c=>E('被算进损耗的人',[c.p(1)==='guard'?'车队按约经过营地，陶掌柜请求你继续护送。护卫带来一群付不起粮资的运粮人，问他们的劳酬何时结。':'你在新营地再见旧粮车。袋数对得上，付不起粮资的却有当初搬运它们的人。','掌柜拿出押运合同，护卫拿出伤者名单。两份都是真的，谁的损耗先入账却一直没人明说。'],[
   C('audit','先结运粮劳酬，再商量减价','支付10灵石请人逐笔核账；获得1枚回气丹。','陶掌柜删去自己一项利润，护卫交回私分的粮。谁也没有单凭善意就不必对账。',{goldCost:10,...item('healing_pill')}),
   C('discount','补二十枚灵石，替眼前伤者买粮','支付20灵石；下一战首回合护盾+14。','这批人吃到了粮，账上的劳酬仍未结清。你解决了今日的饥饿，没有把它说成全部的公道。',{goldCost:20,guard:14}),
   C('contract',c.p(1)==='guard'?'按先前委托护车，不介入分粮':'接下一段短途护车，不介入分粮',c.p(1)==='guard'?'完成已接护送，获得16灵石尾款。':'现在护送车队走到下一道灯桩，获得16灵石工钱；不是先前未接委托的尾款。',c.p(1)==='guard'?'掌柜点清尾款，划去你此前接下的护送一项。运粮人的劳酬仍在另一页。':'你把车护送到下一道灯桩。掌柜付清这段新差事的十六枚灵石，未将你记成旧约的护卫。',{goldGain:16})]),
  c=>E('新秤第一次落下',[c.p(2)==='audit'?'车队在泽岸支起公秤。运粮人有了自己的账页，陶掌柜还在做买卖，只是不再独自解释所有损耗。':c.p(2)==='discount'?'你买过粮的人中，有几位回来搬货抵劳酬。掌柜愿意重谈价码，护卫则要求写清谁有权停秤。':'买卖仍在继续，护卫离队另设小灶。掌柜少了一队人，也才发现粮袋不会自己被抬过桥。','陶掌柜请你看第一笔新账。她不再问自己算不算好人，只问这笔灵石还有谁没看见。'],[
   C('escrow','让双方共同保管二十枚押金','支付20灵石；获得2份凝露叶与下一战首回合护盾+10。','一把钥匙给掌柜，一把给搬运人。你无法保证他们永不争执，但让下一次争执有账可查。',{goldCost:20,guard:10,...item('dewherb',2)}),
   C('accept','收下明码标出的谢礼','获得24灵石。','谢礼写进公开账，没有改成伤者头上的新欠款。你点清后收下。',{goldGain:24}),
   C('meal','吃一顿按新价付清的饭','恢复14生命。','饭不因你曾帮过谁就更甜，账也不会因一顿饭就消失。你们总算能把这些分开谈。',{heal:14})])]},
 bridge:{name:'桥上三尺',person:'石砚',theme:'一个人变得不再像人，是否就失去了替自己解释的资格。',stages:[
  c=>E('还在修桥的人',['石砚用一只手修桥，另一只手臂已长成白色树皮与黑晶。他说桥塌那晚自己在下面，醒来便这样了。','岸上的人请他快些，又不许他踏上完工的桥。照灯的女医把灯举高，没有替谁下结论。'],[
   C('tools','付十枚灵石，替他补齐工具','支付10灵石；下一战首回合护盾+7。','石砚先用新凿子修了供伤者走的低阶。他没有要求你证明他还是不是人。',{goldCost:10,guard:7}),
   C('observe','帮女医记录异变，并征求他的同意','获得1份回春草。','他允许量伤口，不允许取骨。女医把这句话也写进记录，和脉象放在一起。',item('herb')),
   C('avoid','从旧渡口绕行','获得8灵石退回的过桥费。','你绕了远路，没有踏上新桥。石砚仍在岸边一下一下地凿石。',{goldGain:8})]),
  c=>E('火把照向桥下',['有人在桥边失踪，村人拿着火把找石砚。女医说失踪者刚在河岸偷拿过封禁药匣，也可能是去找解药。','石砚把藏在桥下的伤者让出来：那人确实拿了药匣，也确实病得无法过河。他没有要求对方替自己说好话。'],[
   C('witness','先让伤者说话，再查药匣','支付8灵石安置伤者；获得1枚百草解厄丹。','你让每个人只说亲眼见过的事。火把没有立即熄灭，至少不再把沉默当成认罪。',{goldCost:8,...item('antidote')}),
   C('escort','护送石砚离开桥边','下一战首回合护盾+10；桥暂时无人维护。','你让出退路，女医带他离开。众人保住了想要的距离，也得自己学会修桥。',{guard:10}),
   C('search','让他暂留桥下，先找齐失踪者','恢复6生命。','你留下水和照明，却没有给出保证。石砚问最迟等到何时，你只能把寻找的时限说清。',{heal:6})]),
  c=>E('桥有第二个工匠',[c.p(2)==='escort'?'旧桥如今由两个村民轮班修补。石砚在别处找到活计，来信只问女医的灯还亮不亮。':'失踪者被找回，石砚没有因此变回原样。桥边多了一个学手艺的人，也多了一条先听证言的规矩。','女医把抄本递给你：“不必说所有异变都无害。也别把不知道的事，当成一个人有罪的证据。”'],[
   C('record','留下经过核对的证言','获得对应主角功法与1份凝露叶。','你只担保自己见过的桥和人。后来的危险仍须后来的人认真分辨。',{cardIds:[gift(c.role)],...item('dewherb')}),
   C('pay','付十八枚灵石，让新工匠继续学下去','支付18灵石；下一战首回合护盾+18。','石砚没有被要求永远负责这座桥。第二个人学会以后，第一人才终于能自行决定去留。',{goldCost:18,guard:18}),
   C('rest','在桥边安静坐一会儿','恢复14生命。','桥下仍有雾，桥上终于容得下一张给修桥者坐的凳子。',{heal:14})])]},
 forge:{name:'铸剑余温',person:'陆炉',theme:'力量可以继承，别人的牺牲却不应在锻造时被抹去。',stages:[
  c=>E('炉里有人的回声',['陆炉从废宅铁料中锻出一截剑胚。每次敲击，剑里都会响起像人说话的余音。她说是引灵残渣，并非完整魂魄。','一名来认旧物的妇人站在炉外，手里拿着同样纹样的断剑柄。炉料确实已付清灵石买来，卖料的人却未必有权卖掉。'],[
   C('trace','替她核查炉料来处','支付10灵石；获得1枚聚灵丹。','陆炉暂时停炉，损耗由自己承担。你把断剑柄放在未冷的铁旁，纹样正好接上。',{goldCost:10,...item('spirit_pill')}),
   C('order','付十五枚灵石，订一把能用的剑','支付15灵石；下一战首回合护盾+9。','她开了收据，没保证这把剑只会带来好处。妇人把手柄握紧，没有替你决定要不要订。',{goldCost:15,guard:9}),
   C('return','请她先归还认得出的旧件','获得8灵石运送费。','陆炉挑出能认的纹样，付你运送费。她并未答应把所有来不及认领的铁都扔进河里。',{goldGain:8})]),
  c=>E('剑胚与姓名',['来认物的人更多了，有人想取回家人的旧铃，有人愿把旧件留下，只求名字别被磨掉。','陆炉说整把停工，守营的人便等不到新刃；继续铸，她也不能再把买到材料当成一切都已结清。'],[
   C('consent','逐件询问意愿，另铸不混名的刃','支付12灵石；获得1份凝露叶。','愿意留下的铁另封一炉，不愿留下的旧物退还。进度慢了，陆炉没有把这份慢都算给索物的人。',{goldCost:12,...item('dewherb')}),
   C('memorial','保留旧物纹样，优先铸守营的剑','下一战首回合护盾+12。','剑按期送到，旧名刻在匣上。有些家属接受，有些仍认为自己被迫替众人让步。你没有要求他们感激。',{guard:12}),
   C('purchase','按已付清的货约取用炉料','获得20灵石交易差额。','货约在手，炉料交割没有争议。没有写在货约里的人，却仍在炉外等着。',{goldGain:20})]),
  c=>E('炉火照得到的地方',[c.p(2)==='consent'?'新剑用另一炉铁铸成，旧件按当事人的意思分别留下或归还。陆炉终于能说清这把剑用了什么。':c.p(2)==='memorial'?'守营的剑确实挡过一次夜袭。剑匣上那些名字，也没有让反对者失去继续索还旧物的权利。':'陆炉照约交完货，后来却为未认领的旧件停了一炉。合法的买卖没能替她回答所有问题。','她把一把已稳住剑息的「听雪」放在案上；若你已有此剑，可以让它换作后来者的炉资。'],[
   C('sword','收下听雪，记住材料的来处','获得剑器「听雪」；若已有，改得22灵石。需灵识2级才可装备。','你没有把一把剑当成对所有旧事的赔偿。陆炉也没有把名字磨去。',{weapon:'rime',duplicateWeaponGold:22}),
   C('endow','留下二十枚灵石，给新一炉做底资','支付20灵石；获得对应主角功法和1枚虎魄丹。','新炉资单独记账，认领旧物不必再与守营的人争同一把刃。',{goldCost:20,cardIds:[gift(c.role)],...item('battle_pill')}),
   C('listen','听最后一道回声散去','恢复12生命。','那不是谁回来向你致谢，只是一段余音终于不必再被拿来证明力量值得一切。',{heal:12})])]},
 theatre:{name:'空席上的戏',person:'祝停云',theme:'苦难不是供旁人消费的故事，沉默也不该只能由出资者购买。',stages:[
  c=>E('没有客人的开场',['祝停云在废宫戏台上演灾变那夜。第一排只有一位穿素衣的女人，看到门被推开便起身要走。','台柱挂着资助人的印绳，戏本上删去了最后一折。停云说，若不删，今晚连台上的灯都点不起。'],[
   C('support','付十二枚灵石，让戏能演完这一夜','支付12灵石；恢复6生命。','灯没有灭。素衣女人没有因此坐回原处，停云也没把你的灵石当成她必须留下的理由。',{goldCost:12,heal:6}),
   C('ask','征求她们同意，听删去的那一折','下一战首回合护盾+6。','女人只肯说自己是幸存者，不肯说名字。停云合上戏本，先把她不愿登台的部分遮住。',{guard:6}),
   C('job','接受替戏班运灯的活计','获得12灵石。','你按约运灯，领到劳酬。谁出的灯油不等于谁有权替所有人编结局。',{goldGain:12})]),
  c=>E('戏本上不能写的人',['资助人要戏班把开门的命令改成“妖物蛊惑”，承诺再付三夜灯油。幸存者却认得下令的人，也认得那位出资者的印绳。','停云问素衣女人是否愿意作证。她回答：“我可以说我见过什么，不想每晚把那一夜再死一次。”'],[
   C('consent','分开证言与演出，允许当事人撤回','支付10灵石另抄案卷；获得1枚回气丹。','证言交给能查证的人，戏本另行征得同意。停云没有再拿“替她发声”当成越过她的理由。',{goldCost:10,...item('healing_pill')}),
   C('anon','演出时隐去能辨认幸存者的细节','下一战首回合护盾+10。','观众听见了命令，也不能靠一场戏找到那位女人的住处。停云知道隐去身份仍不等于万无一失。',{guard:10}),
   C('patron','按资助者要求删掉指认部分','获得26灵石灯油余款。','灯确实能继续亮。素衣女人把未采用的证言收走，说会找别的去处，而不是再坐在那张椅子上。',{goldGain:26})]),
  c=>E('谁来决定散场',[c.p(2)==='patron'?'戏班仍在演出，素衣女人另立了一份证言。没有人再把台上版本当成她已经同意的真相。':'证言有了单独的去处。停云改演后来人怎样互相救助，素衣女人有时看，有时也只是路过。','停云问你，要不要留一个响亮的名字在最后一折。她先补上一句：“不留，也不会少你一份劳酬。”'],[
   C('unnamed','不留英雄姓名，把劳酬结给所有人','获得18灵石及对应主角功法。','台上的灯不只照着一个英雄。搭台、递水、先开口的人，都在劳酬册里有自己的位置。',{goldGain:18,cardIds:[gift(c.role)]}),
   C('fund','付十六枚灵石，保留不依附资助者的一夜','支付16灵石；获得2份凝露叶。','停云把这一夜留给当事人选择说或不说。买下的不是他们的故事，是不用先讨谁欢心的灯油。',{goldCost:16,...item('dewherb',2)}),
   C('audience','只当一个能够中途离席的观众','恢复14生命。','你在散场前离开，台上没有因此追问。那张空椅子终于可以只是空椅子。',{heal:14})])]},
 well:{name:'守井的人',person:'井娘',theme:'公共的清白若建立在看不见的劳作上，称赞便可能成了另一种索取。',stages:[
  c=>E('井绳磨出的伤',['井娘每天更换滤井铜轮，双手缠满布条。管事挂起洁水玉印，告诉过路人此处受宗门庇佑。','她没有否认玉印有用，只请管事拨一个人替班。管事说大家都很忙，又问她还需要多少药。'],[
   C('shift','替她雇半日轮班的人','支付12灵石；获得1份凝露叶。','井娘终于能放下井绳。她没有把休息说成偷懒，轮班的人也拿到了当面点清的劳酬。',{goldCost:12,...item('dewherb')}),
   C('repair','检查铜轮与玉印各自的作用','下一战首回合护盾+6。','玉印确能压住一部分污秽，铜轮同样不可少。你把两者记在同一张纸上，不只抄门派的名字。',{guard:6}),
   C('water','按价买一份净水，不问井中事','支付6灵石；恢复10生命。','水很干净，伤口也不再发烫。井娘收清水资，再次把伤手缠紧。',{goldCost:6,heal:10})]),
  c=>E('玉印背面的名字',['井娘被请去接受褒奖，井却没有人接手。管事指着墙上的荣名说她该知足；新来的伤者只问为何今日无水。','她承认玉印与药资都帮过忙，也问：“被写进匾里以后，我是不是就不能说做不动？”'],[
   C('rota','把药资的一部分改为轮班劳酬','支付10灵石补足第一班；下一战首回合护盾+10。','管事起初说预算不能改，伤者却愿意公开见证新的用度。井娘终于不是唯一不能拒绝的人。',{goldCost:10,guard:10}),
   C('repair','先修好能减轻劳作的铜轮','支付16灵石；获得1枚百草解厄丹。','铜轮转得轻了一些，但仍要有人值守。你们没有拿一件器物宣称从此不再有人受累。',{goldCost:16,...item('antidote')}),
   C('medal','替她领回褒奖与药资','获得20灵石公开发放的路费。','井娘接了药，也把“不再独自守井”的请求另写一张。她没有把被称赞当成问题已经解决。',{goldGain:20})]),
  c=>E('井边多出来的凳子',[c.p(2)==='rota'?'井边轮值簿添了几个名字，井娘只在愿意的日子守井。管事的玉印还在，没有因此少一份应有的功劳。':c.p(2)==='repair'?'新铜轮减轻了伤势，后来几个人自发来帮手。井娘把办法留给他们，也留下随时可以退出的期限。':'井娘最终另找了愿付劳酬的水站。旧井停了两日，众人才学会玉印不会自己转动铜轮。','她给你留一壶水，不再说自己什么都不需要。'],[
   C('take','收下净水与护井药','恢复16生命，获得1枚百草解厄丹。','井娘把自己的药先收好，才分给你多出的那一份。你们谁也不必先把自己耗尽，才有资格帮人。',{heal:16,...item('antidote')}),
   C('share','支付十八枚灵石，补下一轮的劳酬','支付18灵石；获得对应主角功法与下一战首回合护盾+10。','这笔灵石写明用途，也写明谁可以查账。援手不再全靠井娘一直不好意思拒绝。',{goldCost:18,guard:10,cardIds:[gift(c.role)]}),
   C('rest','坐在井边，喝完水再走','恢复12生命。','她也坐下来。管事路过时想说两句，最后自己提起了下一桶水。',{heal:12})])]}
 };
 const CHAINS=Object.fromEntries(Object.entries(CHAIN_DEFS).map(([id,value])=>[id,{id,...value,artId:'tale_'+id}]));
 const META=Object.fromEntries(Object.keys(CHAINS).flatMap(chain=>[1,2,3].map(step=>['tale_'+chain+'_'+step,{chain,step,artId:'tale_'+chain+'_'+step}])));
 const INTERRUPT_IDS=['campfire_hunt','road_aftermath'];
 const ART_IDS=[...Object.values(META).map(m=>m.artId),'ambush_campfire','road_aftermath','cave'];
 function artId(id){return META[id]?.artId||(id==='campfire_hunt'?'ambush_campfire':id==='road_aftermath'?'road_aftermath':id);}
 function build(id,state){const meta=META[id];if(!meta)return null;const chain=CHAINS[meta.chain],record=state.journey.tales?.chains?.[meta.chain];if(!record||record.stage!==meta.step-1||state.floor<(record.floors?.[meta.step-1]||1))return null;
  const c={role:state.character,p:n=>record.choices[n]?.key};const e=chain.stages[meta.step-1](c);return {id,...e,tale:{chain:meta.chain,step:meta.step},glyph:'缘',kicker:'雾中相逢',description:e.story[0],connection:record.lastOutcome||'',choices:e.choices};}
 const api={CHAINS,META,EVENT_IDS:[...Object.keys(META),...INTERRUPT_IDS],INTERRUPT_IDS,ART_IDS,artId,build};root.NightTales=api;if(typeof module!=='undefined'&&module.exports)module.exports=api;
})(typeof globalThis==='object'?globalThis:window);
</script>
<script>
/* 镇境旧事：任务只在本局已抽定的镇境者所在地域出现。 */
(function(root){
 'use strict';
 const QUESTS={
  lotus_boss:{title:'空席上的热茶',items:['puppet_key','puppet_voice'],ward:null,stages:[
   {name:'灰里的一把钥匙',story:['烧毁的宅门外，一名老木匠拿着账簿。寻宝客付过修门灵石，纵火时却把他的女儿也关在了屋里。','他从灰里捡出主人的备用铜匙。那人曾替穷邻免过租，也替掠夺器谱的客人开过门。善意没有认清来人，留下的却是机仆一遍遍烧热的茶。'],act:'帮木匠安葬遗骨，接过铜匙',paid:'付 15 灵石，赎回铜匙',take:'替木匠护送木料，收下谢礼',outcome:'你把遗骨一一收好。木匠交出铜匙，叮嘱你别再把“守家”说成“复仇”。',paidOutcome:'他收下灵石，为女儿买最后一盏魂灯；铜匙留在你手中。'},
   {name:'留声簧里缺掉的半句',story:['一名修器女修正在听一枚开裂的留声簧。她曾替寻宝客修好开门的灵械，如今说自己当时并不知道他们要做什么。','簧片仍能拼出主人的末句话：“看好家……别追出去，救活着的人。”缄红听到的恰好只有前半句。女修既怕担责，又不愿让误听继续杀人。'],act:'陪她署名作证，修复留声簧',paid:'付 15 灵石，请她修复留声簧',take:'不取簧片，换取她的修器酬劳',outcome:'你陪她把名字刻在证词上。她把修复的簧片交给你，不再声称自己毫无关系。',paidOutcome:'灵石付清，簧片恢复完整。她依然不肯署名，却终于肯把主人的话还给缄红。'},
   {name:'门前仍有一双鞋',story:['故宅近在眼前。门阶上的鞋被擦得干净，鞋主人却永远不会回来。一个孩子说，机仆夜里仍给失踪的人缝冬衣。','孩子记得两件事：备用铜匙能开家令心匣，完整留声簧能让她听见主人最后的叮嘱。少一件，都只能闯过仍将来客视为凶手的家政机关。'],advice:'收好铜匙与留声簧，进门时会自动唤醒缄红；只有传闻、只有一件物品都无法止战。'}]},
  gate_boss:{title:'灯照不到的名字',items:['gate_names','gate_wick'],ward:'playerMark',stages:[
   {name:'渡簿上的空白',story:['桥头抄写人请求你帮他辨认泡湿的名册。当年他把无力交灵石的难民写成“无名”，好让渡灯人不必逐一记下他们的死。','他保住了自己的差事，也把那些人从被寻找的可能中抹去。如今灯影按着空白名单索人，他想补名字，却不敢让家属看见旧笔迹。'],act:'陪他补录亡者姓名',paid:'付 15 灵石，雇人核对名册',take:'替渡口搬灯，领取酬劳',outcome:'家属认出了旧笔迹，也认出了迟来的名字。抄写人没有得到宽恕，却交出一份不再空白的渡簿。',paidOutcome:'核验人把每个名字读过一遍。灵石买来了人手，没有买来原谅。'},
   {name:'最后一寸归灯芯',story:['一位老妇藏着照微用过的灯芯。她曾央求渡灯人多留一夜，等儿子归来；多留的那一夜里，渡口最后一船人再没出发。','老妇不愿承认儿子已经不在，也知道灯芯应该回到渡口。她问你，若把等待也拿走，一个人还能靠什么活下去。'],act:'听完她的话，接下旧灯芯',paid:'付 15 灵石，为她另点家灯',take:'替她整理屋舍，收下报酬',outcome:'你没有保证儿子会回来，只记下她想写给儿子的话；你没有接下一个并未完成的送信任务。她把旧灯芯交给了你。',paidOutcome:'新的家灯亮起。她仍会等，却让你把渡灯人的灯芯带回桥头。'},
   {name:'一盏不必再等的灯',story:['灯影里的人不断报出别人的名字，唯独没叫过自己。渡灯人的职责变成了不许任何人离开的理由。','补全的渡簿能抵去她首次追索印；归灯芯可在开战时护住你。她不会因为几句劝告放下灯，但你至少知道自己正在面对什么。'],advice:'携带补名渡簿：抵消本次战斗首次施加追索印；携带归灯芯：首回合额外 8 护盾。'}]},
  camp_boss:{title:'活人的誓书',items:['camp_ledger','camp_seal'],ward:'energyPenalty',stages:[
   {name:'营外的欠命簿',story:['一名退役守卒拿出欠饷簿，想用它换盘缠。闻铮当年按誓书把逃兵送回营地，也曾替全营扣下最后一份救命药。','簿子上后来改过一行：用来救军官的药，写成了救全营。守卒签过字；他如今想揭穿谎话，也想让自己的签名先消失。'],act:'保留原签名，替他誊清真账',paid:'付 15 灵石，买下未删改的账簿',take:'只接搬运差事，收取酬劳',outcome:'账簿没有洗掉任何名字。守卒把它交给你，第一次承认自己既是受害者，也做过帮凶。',paidOutcome:'他收下盘缠，却没能收回自己的签名。原账留在你这里。'},
   {name:'不再发号施令的印',story:['断营里的军医保管着旧营印。她用它骗过几次关卡，带走伤卒，也用它留下过她认为“还有用”的人。','她说放下印意味着再也不能命令别人牺牲。说完之后，她仍问你，若明天没有命令，谁来决定救谁。'],act:'带走营印，也记下她的选择',paid:'付 15 灵石，为伤卒备药换印',take:'协助清点营物，领取酬劳',outcome:'你没有替她辩白。她把营印放进布袋，不再要求你替她证明每个决定都是对的。',paidOutcome:'药箱留给伤卒，旧营印归你。救援不再以一纸军令作抵押。'},
   {name:'誓言留给谁',story:['闻铮的誓墙还在，墙下的名字却一半是被“保护”到再也无法离开的人。','原账能让你识破她首次封灵军令；旧营印可护住开战一刻。证据不自动结束争斗，它只是让人没那么容易再把服从误当成救命。'],advice:'携带欠命原账：抵消本次战斗首次封灵；携带旧营印：首回合额外 8 护盾。'}]},
  snake:{title:'旧鳞下的药方',items:['snake_formula','snake_scale'],ward:'poison',stages:[
   {name:'药摊后的试方簿',story:['采药人把发黑的试方簿压在摊底。绛鳞曾借自己的蛇毒救过疫民，商盟随后逼她加量，好把稀药卖到雾外。','采药人抄过那张加量的方子，得的灵石已经换成家人的口粮。他不敢把药全扔掉，也不敢再把下一瓶交出去。'],act:'陪他封存毒药，核验原方',paid:'付 15 灵石，买下未加量的原方',take:'只替他运送无毒草药，收取酬劳',outcome:'毒药封进石匣。你留下原方，他留下自己签过的加量记录；没有谁因此变得清白。',paidOutcome:'原方回到你手里。采药人还得决定怎样面对那些买过药的人。'},
   {name:'不该拿去抵债的旧鳞',story:['桥下的孩子藏着一片蜕鳞，说绛鳞曾用它替病母挡寒。母亲后来仍没活下来，债主却拿鳞片算起了利息。','孩子想把它卖掉离开，又怕最后连那次无偿的善意也像一笔交易。他不知道该恨谁，只是不想再欠谁。'],act:'替他核销虚账，收存旧鳞',paid:'付 15 灵石，替他赎回旧鳞',take:'替他送一趟药，领取酬劳',outcome:'假账被逐条划去。孩子让你带走旧鳞，免得它再成为讨债的凭据。',paidOutcome:'债契当面烧尽。旧鳞归你，孩子终于能不背着利息离开。'},
   {name:'蛇息前的一缕药香',story:['药香越近，越能看见石壁上实验的编号。绛鳞的沉默不是没有记忆，而是不再信任来取药的人。','按原方配出的药引可以挡下首次蛇毒；旧鳞可护住首回合。蜕鳞仍会清除猎印，绞缠也仍是三段攻击，准备并不等于免去防守。'],advice:'携带未改原方：抵消本次战斗首次施毒；携带避寒旧鳞：首回合额外 8 护盾。'}]},
  bell_boss:{title:'钟声里的第二个人',items:['bell_names','bell_mallet'],ward:'drawPenalty',stages:[
   {name:'没有写进丧帖的人',story:['抄丧帖的女修在墙角重写一份名单。晚蘅曾替无人收尸的人敲钟，灾变后，雇她的人却把异乡死者从丧帖里划掉。','女修照做过。她当时需要灵石送弟弟出域，如今弟弟安全了，那些被划掉的人仍一遍遍从钟里喊她。'],act:'陪她访认遗物，补全丧帖',paid:'付 15 灵石，请她重新刻帖',take:'帮她送纸灯，收取酬劳',outcome:'每认出一件遗物，她就补上一个名字。她没有再说自己只是照吩咐办事。',paidOutcome:'新帖保留了旧帖上的划痕。补刻没有假装当年的删除从未发生。'},
   {name:'敲钟人的手还在发抖',story:['曾为晚蘅铸钟的匠人留下了木槌。他发现钟腔会吞下未尽的愿望，却为了让工坊活下去，把这个发现写成了“余韵绵长”。','他把木槌举起又放下，说那口钟最初真的只想送人一程。谎话越小，延长它的理由反而越多。'],act:'让他写下实情，收下木槌',paid:'付 15 灵石，赎回封存木槌',take:'协助整理铸件，领取酬劳',outcome:'匠人在槌柄刻下自己的名字和钟的缺陷。木槌终于不再是一件待价而沽的名作。',paidOutcome:'工坊收下赎价，木槌归你。槌柄上的裂缝比柜上的价签更值得记住。'},
   {name:'钟停之前的一次呼吸',story:['山风进了钟楼，却没带走任何回声。晚蘅记得每个名字，已经分不清自己是在送别，还是在逼死者留下作伴。','补全的丧帖能抵消她首次封住抽牌的余响；旧木槌可护住第一回合。先安排防守，再决定何时将积蓄的力量交出去。'],advice:'携带补刻丧帖：抵消本次战斗首次抽牌封印；携带旧送魂槌：首回合额外 8 护盾。'}]}
 };

 const EXTRA_LORE={
 gate_boss:'照微最初渡的是付不起船资的人。后来她接受抄写人用无名替去亡者的姓名，以为不记便能少一次追责。灾后灯影开始按空名索人，她才发现体谅一个活人的难处，也可能让死者再失去一次归处。她不肯放下灯，是怕灯灭后连最后一位记得的人也不在。',
 camp_boss:'闻铮扣下救命药时相信营中必须有人撑到援军抵达。她留下最能战的人，也留下最不能拒绝的人；这两份名单后来被她写成同一张。旧甲里的誓书既有背叛者的签名，也有她自己的签名。她守桥是在履约，也是在拒绝接受命令未必等同于正义。',
 snake:'绛鳞曾用稀释蛇毒替疫民续命。商盟要求加量时，她同意以药换温鳞的丹砂，没有想到试方会成为标准。如今她不再开口答应来客，却仍将蜕鳞留在寒处。拒绝再交易并不能让旧药失去毒性，这也是她始终没有离开观测井的原因。',
 bell_boss:'晚蘅最怕死者无人送别，因此接受了不会停下的钟。她知道钟腔吞愿，却宁愿把迟迟不肯散的回声称作陪伴。最初替异乡人敲钟的善意是真的，后来借送别挽留他们的私心也是真的。钟声越来越重，因为她再也不敢问被留下的人是否想走。',

sourceText:['巡灯纸役把一名迷路老人牵到灯下，却拦着一名没有姓名的背夫。老人攥着灯杆：“灯一灭，我连回家的桥在哪都找不到。”','背夫指着挂名簿：“我的木牌被水泡没了。要我在这里等到有人认领吗？”纸役没有回答，只把灯结递给你。'],supportChoice:'答应替巡灯役护灯，收下续灯结',opposeChoice:'答应剪开拦路灯链，接应渡客',opposeActionName:'履行剪链约定，带一名渡客过河',opposeAction:'你当场剪开封路灯链，护送一名无名背夫走暗水路。老人选择留在灯下；取得「遮灯帛」，可在渡灯人战中减少首次追索印。此举放弃洞府精英战奖励。',opposeOutcome:'你剪开灯链并带一名背夫过河。老人留在灯下；纸役没有保证所有人都能平安渡过。',investigationIntro:'剪灯客认出你抄下的灯簿：“名字没在册上，不等于这人不该过河。可老人也不能被留在黑里。”',intro:'剪灯客把熄灯的小船推回阴影：“我剪的是拦路的链，可灯一灭，没跟上来的人也会迷路。”',testimony:'背夫的木牌被水磨平，巡灯役不敢认他；灯簿又只准有名者过渡。她知道一条不经灯簿的小路，也承认昨夜有人没能跟上。',investigation:'你记下木牌被水磨去的痕迹，也抄了灯簿拒绝无名者的条款；这能证明谁没被登记，不能证明谁故意拦人。',investigationReply:'你拿旧渡簿和水痕带一名无名背夫走过暗水路。老人仍选择留在亮处；剪灯客没有替她作决定。',investigationAftermath:'旧渡簿只让一名背夫过河；老人仍留在灯下。剪灯客没有替任何人决定去留。',battleLines:{support:'照微认出你衣上的续灯灯结：“你答应护灯，却要进我的渡棚。灯灭之后，谁替那位老人认路？”',oppose:'照微看见断灯剪印：“你剪开链，只带走一名背夫。老人还留在岸上，别替他们说都得救了。”',investigation:'照微翻过你带来的旧渡簿：“它能证明谁没登记，却不能替我回答灯灭之后谁能回家。”'},help:'你交药给等船的老人。她选择留在亮处，不愿随船逃走；渡客没有再劝。',reply:'渡棚留下被剪断的灯链。老人留在岸边等天亮；渡客带走了愿意跟上的人。'},
camp_boss:{source:'军令与药箱',cave:'堤下伤卒营',npc:'m09',support:'pursuit_order',oppose:'pass_fold',aid:'loose_band',proof:'空担架名册',normal:['m07','m08'],warning:'营门军徽都已剪去。公开佩着拘逃军令的人，会被守营者视作追捕者。',supportName:'拘逃军令',opposeName:'放行折符',aidName:'松誓绷带',effect:'energyPenalty',
sourceText:['残卒一把按住药箱：“带走一瓶，营里就少救一个人！”独臂逃卒拖着担架：“药锁了两天，他们等得到开箱吗？”','药役打断他们：“箱里还剩几份，我记得。先说清楚你们要我把药给谁。”残卒把军令递给你，逃卒伸手去推侧栅。'],supportChoice:'接受追药军令，之后拦下逃卒',opposeChoice:'答应送出一副担架，收下放行折符',opposeActionName:'按放行折符送出一副担架',opposeAction:'你只放行名册中那一副担架，不替所有逃卒作决定。药役给你一卷「松誓绷带」，可在缚誓者战中抵消一次封灵。此举放弃洞府精英战奖励。',opposeOutcome:'你把放行折符交给担架上的伤卒。他随你离营；其他人有人留下，有人另寻出路。',investigationIntro:'药役把你记下的数量与名册逐项对过：“至少这副担架在册。药箱谁锁的、药去了哪儿，还要继续查。”',intro:'独臂枪手把短枪压在担架上：“你是来拿药，还是来问我们为什么走？”他身后仍有一副空担架。',testimony:'他承认曾让一队人走亮处引开巡卒；伤者因此过桥，诱饵却没有全部回来。他不肯把这件事称作两全。',investigation:'药役核对了剩余药量与担架名册：有人确实缺药，也有一副空担架尚未登记去向。账目不能说明是谁私拿了药。',investigationReply:'你按名册陪一副担架先过侧栅，药役留下记录并交给你一卷绷带。其他伤卒与逃卒仍自行决定去留。',investigationAftermath:'名册让一副担架先过侧栅，但没有证明是谁动了药箱；营中仍有人等待查账。',battleLines:{support:'闻铮认出你身上的拘逃军令：“你来追人，还是来问药去了哪儿？誓墙上两件事写成了同一行。”',oppose:'闻铮看见放行折符：“你送走了一副担架；营里留下的人还在问药。别把放行说成救下全营。”',investigation:'闻铮核过你带来的名册：“数字对上了，缺药是真的；是谁扣下钥匙，还没有答案。”'},help:'药箱打开，一名伤卒自己拆下军牌；另一人仍把军牌贴身放好。他们没有替全营作决定。',reply:'桥边留下脱下的军牌与一卷用空的绷带；逃走的人仍有各自的去处。'},
snake:{source:'井沿的两张方子',cave:'秤鳞石窟',npc:'m12',support:'well_oath',oppose:'well_chisel',aid:'clean_gauze',proof:'加量药账',normal:['m10','m11'],warning:'石窟秤着旧鳞。封井鳞誓露出的绿光，会被当作阻断买卖的标志。',supportName:'封井鳞誓',opposeName:'开井凿契',aidName:'净砂药纱',effect:'poison',
sourceText:['井役把裂鳞压进泥里：“井封上，药铺明天就没水。”药工指着药方上的加量记号：“有人把剂量改大了，我没有写这笔。”','采鳞者推来秤盘：“开一道取鳞的路，药材就能下山。价钱到了窟里再谈。”她没有写报价。井外那瓶药还没分给病人。'],supportChoice:'答应替井役守住封井约定',opposeChoice:'答应替采鳞者开路，收下凿契',opposeActionName:'付12灵石，交凿契验货并取得净砂药纱',opposeAction:'支付12灵石购买1份回春草；采鳞者同时交付「净砂药纱」作为开井委托的验货凭据，之后才会开路。买卖不代表治好病人或证明谁改了药方。此举放弃洞府精英战奖励。',opposeOutcome:'你付清十二枚灵石，买下回春草；采鳞者验过凿契，交出净砂药纱，并开始履行开井委托。药工和井外病人的处境仍未解决。',investigationIntro:'采鳞者看到旧价账，沉默片刻：“上回是八枚。这回井路封了，我报十二。加量那笔字，我没签。”',intro:'她将秤砣推回自己这边：“我是来做生意的。我卖你一份药材，十二枚灵石；别把买卖说成救人。”',testimony:'已核过的药账显示，买主要求加量，商人也多收了灵石。旧方能说明原先的配法，不能替病人停药或治疗。',investigation:'你核对旧方和账本：同一味药上次卖八枚灵石，这次记作十二枚；加量字迹与收款签名不是同一只手。能议价，不能据此认定谁下毒。',investigationReply:'旧价账让你把回春草的价钱谈回八枚灵石。采鳞者收了钱，仍不承认谁改了剂量；药工仍等着另找药师核方。',investigationAftermath:'旧价账让你少付四枚灵石；买主是谁、加量是谁写的，仍无人认下。井外病人的药方没有因此改动。',battleLines:{support:'绛鳞看见你带来的封井鳞誓：“你答应封井，药铺还在等明天的水。你知道他们等的是什么吗？”',oppose:'绛鳞认出开井凿契：“货已经买到，病人的方子却没变。你要取鳞，还是查谁改了剂量？”',investigation:'绛鳞看着旧价账：“价差能证明有人多收钱，不能证明是谁把剂量改大。”'},help:'你把药草交给一名手掌发黑的药工。他把今天的剂量减了一次；明天是否继续，仍由他和药师商量。',reply:'药账留着被划掉的一笔。病人今天少服了一次，井仍封着；药债没有因此结清。'},
bell_boss:{source:'尚未系上的名字',cave:'无钟墓室',npc:'m15',support:'bell_knot',oppose:'bell_wedge',aid:'echo_wedge',proof:'归骨拓名纸',normal:['m13','m14'],warning:'墓室不挂钟。衣外的续钟铃结一响，掘名者会认为你来把姓名重新留在钟阵里。',supportName:'续钟铃结',opposeName:'停钟木楔',aidName:'止响短楔',effect:'drawPenalty',
sourceText:['家属抱着一块无字碑：“再留一晚，我还能听见他。”抬棺人把棺绳放下：“我已经背这副棺走了十年，不能再替他走一遍。”','执幡役说，补上名字只是记住死者；把名字系进钟阵，亡者才会留下。她把铃结和木楔放在你面前：“你要做的是哪一个？”'],supportChoice:'答应替家属留魂，收下续钟铃结',opposeChoice:'答应抬棺人停钟归骨，收下木楔',opposeActionName:'替这一户停钟归骨',opposeAction:'你按停钟木楔，替这一户解开续钟绳，把碑名交还家属。获得「止响短楔」，可在晚蘅战中抵消一次减抽牌。此举放弃洞府精英战奖励。',opposeOutcome:'你替这一户停下续钟。家属最终随棺车离开；抬棺人没有替其他亡者作决定。',investigationIntro:'掘名人看过你核出的碑名：“名字对得上，只说明这是谁；要不要留下，还是他们自己的话。”',intro:'她把石拓卷递到灯下：“名字带走，骨也带走。可有的人只想再听一次，未必愿意谢我。”',testimony:'她曾凿错一块无字碑，认错的家属仍坚持供奉多年。如今她逐字问证，不再凭自己的一次善意替别人决定送别。',investigation:'你把碑上的旧刻痕与抬棺名册对在一起，只能确认这一户的名字；家属是否愿意让亡者留下，仍须由他们自己决定。',investigationReply:'核名后，这户家属决定把碑留在原处，跟着棺车离开。抬棺人没有替别户剪断钟绳，并把一枚止响短楔交给你。',investigationAftermath:'这一户家属决定随棺车离开；其他无字碑仍没有被你代为补名。',battleLines:{support:'晚蘅认出你衣上的续钟铃结：“你答应替他们留一晚。你看见那户人家已经随棺车走了吗？”',oppose:'晚蘅看见停钟木楔：“你替这一户解绳，不等于其他亡者也想离开。”',investigation:'晚蘅核过你带来的碑名：“名字对了，心愿还要问活着的家属；我不能替他们说。”'},help:'你交药稳住拓名人的手，帮她对照旧碑。只记下本次确认的一人，不把其余空白填上。',reply:'墓外多了一张确认过的拓名纸。钟声停下之后，有人离开，也有人仍坐着等。'}
};

cultlab:[['手札一直翻到末页，又翻回来。记录只剩一句完整的话：“第九次试验，受试者全部安睡。”','石台旁的九双鞋底都磨穿了，鞋尖朝着门。最小的那双被钉在地上。'],['字从纸上钻进指缝，你流着血照着摆出两种起势。末页忽然多了一笔，写在“安睡”后面。','你取下一滴试剂，心口猛地停了一拍。九只阵盘同时停住，门边那双最小的鞋朝你转了过来。','你点燃手札，把封好的药和灵石搬出门。火一直追到鞋边才停，铁钉已经烧红。']],
swordgrave:[['碑上只有三个人名。第三个名字被剑痕从中斩断，断笔里冻着血。','冰里那些剑都朝着同一个方向，只有碑旁一柄，剑尖对着自己的主人。'],['你接住碑后的残招，腕上裂开一道口子。你再出手，剑气终于从那处断笔穿过去。','你在碑前反复拆掉惯用的起手。最后一次，旧剑的鸣声停了，碑后的残式接上了你的收势。','你把三根剑穗拨正，用石块压住断绳。冰里传来一声闷响，靠着碑坐下时，疼痛已缓了些。']],
pilgrims:[['有人拿牙换药，旁边的人当没看见。买路客把地图摊在膝上，纸上已经写满别人的名字。','“哪一条路？”他问。药师把拔牙钳扔进热水，溅了他一身，他没敢骂。'],['药师收钱，拿药贴住你的伤口。你问方子，他将刚写好的纸塞进炉膛，转头叫下一个人。','你掀开血衣指出走过的地方。买路客付了钱，当着你的面，把那一带向导的名字划掉。','你把灯架钉正，收下工钱。拿牙换药的人挪到灯下，低头数还剩几颗牙。']],
prisoner:[['“我能带你出去！”笼里的人抢着喊。你问他出口，他报出一个早已塌掉的地名。','他把纸往栏外推：“好，我不知道路。这个是真的。别把符贴回去，我连你说话都听不见。”'],['锁断了，笼里先掉出一面镜子。他把镜子推到你脚边，蜷在原处，等你退开才试着伸出一只脚。','他数了两次钱，才把口诀念完。你问刚才为什么骗人，他捂住耳朵，催你再使一遍新学的起势。','你贴紧黑符。他先叫了一声，声音在符纸合拢时截断。你背靠笼外的石壁调息，里面再没动静。']],
echo:[['测量绳绕过折了两次的岩壁，绳结却回到你手里。墙上刻着“第三次进去的人——”，后半被干血糊住。','你想读出墙角的字，舌尖先失了知觉。另一个声音已经替你念到一半。'],['两式未曾练过的招数在你眼前走完。你抓紧路边的钱袋，想起一件很远的事，想了一半便接不下去。','你抽回手，掌心缺了一层皮。那枚核心随你的呼吸明灭，测量绳终于从墙角垂到了地上。','你闭眼数完十次呼吸，再睁眼，只看脚下的绳。走到转角，身后还在数第十一次。']],
broker:[['代理人先看你袖口有没有血，又往来路瞥了一眼，才将奇物放上桌。','“九盏灯，只敢亮一盏。”他用牙咬开新灯油，“你要笑就出去笑。”'],['他收钱极快，交出匣子却慢，直到你握住匣底才松手。契纸烧成灰，他先去抢没烧到的钱袋。','你带回路标，血沿靴底滴到契纸上。他拿新纸重抄路线，原稿压到自己坐垫下面。','你借灯坐下。他算着灯油，还给后来的人留了半张凳子；门响时，你们同时抬头。']],
ji_first:[['季临川用断剑去撬阵眼，骂了一声，又把裂开的虎口藏到腿后。','“别踩那块！”他冲你喊完，才低下来，“帮我一下，我的干粮还在阵里。”'],['残阵松开，他先去捞干粮袋，才从衣内取出剑诀。袋底漏了，他弯腰一粒粒捡。','他拿灵石请了向导，摘下护符递给你。向导催了两遍，他还在确认来路有没有被雾盖住。','你指出侧面的石阶。他试着挪过去，断剑落在脚边，弯腰捡时又咒骂了一声。']],
wen_first:[['闻人烛的手被符锁钉在残柱上。她抬起染黑的指头：“你断吧。”','你没有动。她看向锁后自己画过的阵纹，声音小下去：“那你走吧。水……放近一点。”'],null],
sect_duel:[['剑先出了鞘，停在你喉前三寸。陆闻刀身后的弟子正踢开别人的行囊。','“出一招。”她没有收剑。被踢开的袋里滚出半只药瓶，瓶底裂了。'],null],
relic_dispute:[['两宗弟子各抓着铜匣一端，旧契被扯出一道口子。','“印是谁盗的？”一人问。另一人没答，猛地夺匣，铜环在石壁上擦出火星。'],null],
moon_trace:[['古剑压在沉钟下，剑柄缠着三层旧布。最里面一层绣着一个名字，已经被汗浸得发黑。','你刚摸到剑柄，布条就猛地绞住手腕。钟里传来一声极短的笑。'],null],
sealed_name:[['失踪者的行囊被翻过，姓名那格刮到透光，纸背留着指甲印。','更深处的井道被画了三遍。最后一遍只画到转角，炭笔断在那里。'],null],
moon_vow:[['誓石上没有字，中间被许多手掌按得凹下去。你把手放近，凹处先亮起月光。','石背压着一截染血的白绦，结打得太紧，拆不开。'],null],
demonic_offer:[['旧修把经页拍在湿石上，手背一条黑线正往袖里钻。','“要么学，要么走。再问一遍解不解毒，我也只剩这张纸。”她转身去拧已经干了的药布。'],['沈霜白读到第三行，呼吸不由自主跟了过去。旧修猛地拧紧药布，滴下最后一滴红水。','沈霜白将经页推回。旧修从她身旁挤过，鞋底踩住纸角，低头又把它捡起来。']],
demonic_warning:[['旧识把玉和药都收回怀里，沉默一会儿，只将一件放到桌上。','“你先选。”她另一只手一直捂着怀口，“别再拔剑了，我认得你。”'],null],
mirror_trial:[['镜里的人握住沈霜白的手，把掌心的黑线拨到亮处。她抽回手，镜中的手却没松。','镜座里嵌着玉，旁边药纸被水浸透一角，黑线在纸下仍看得见。'],null],
demon_manual:[['井下经页烧掉了大半。血指印盖住一句话的末尾，只剩“若你还有……”','你掀开下一页，同一个指印透了过去。这一次，字也没写完。'],null],
fallen_hunt:[['裴隐把药囊藏到身后。沈霜白认出划破掌心的搭扣，他又慢慢将药囊移回桌上。','“药是我递的，你也确实喝了。”他将药刀压在经卷上，“先看你还能不能握稳剑。”'],['沈霜白抬剑，裴隐先踢开了药桌。经卷压在刀下，仍留在原处。','沈霜白从另一边下井。裴隐等到脚步远了，才拾起桌边掉落的药囊。']],
blood_lesson:[['旧修用血气稳住剑锋，一根指头却怎么也伸不直。','“我师妹活了。”她把血盏往前推，“后来见我就躲。你还听不听？”'],['沈霜白照着经页压住自己的血气，指节一寸寸发白。旧修看完起势，转身去洗那只一直洗不净的盏。','经页贴上掌心便热起来。旧修突然把另一只手藏到背后，没让沈霜白看清她指尖在抖。','沈霜白抄完护心诀，合上经页。旧修把血盏盖好，仍盯着盖沿渗出的一点红。','沈霜白拿了药草。旧修将她没碰的经页叠好，压在那只缺了口的盏下。']],
blood_debt:[['守棚人把俘虏推到担架前：“用他续命便是。”俘虏往后退，绊在空药瓶上。','伤者先开口：“要拿谁的命救我，至少先让我听见。”说到最后一个字，他喘得接不下去。'],['沈霜白割开手掌，伤者的呼吸一点点稳住。俘虏扶着担架的手还在抖，直到她收剑才敢松开。','沈霜白把钱压在残谱下。守棚人还想把俘虏拉过来，她用剑鞘挡住他的手。','药送进棚里，俘虏先替伤者抬起头。沈霜白站到帘外换药，能听见里面争谁先抬担架。','沈霜白指向药棚外的路。伤者点了一下头，守棚人弯腰捡起被踢远的空瓶。']],
blood_choice:[['经卷最后写着“万命皆可为我”。下面一行被反复涂黑，纸已经擦破。','沈霜白将纸迎着火光，读出洞边剩下的几个字：“那我还算谁？”'],['沈霜白将终篇贴身收好。火光熄下去，她伸手去护经页，指腹留下一个新的血印。','沈霜白撕下两式，剩下的压回匣底。她关了两次，才把翘起的纸角关进去。','沈霜白把终篇封进匣中，换手重新握剑。旧诀从第一式走到最后，剑尖终于不再颤。','沈霜白取走药瓶，用原来的红绳扎紧匣盖。走到门口，瓶内丹丸碰响了一次。']],
marsh_pharmacy:[['药庐系在老柳上，水已经没过最下面一格药架。药师把一包发霉的药挪到自己这边。','她拆开新纸给你闻，随即咳了一声，把脸偏向窗外。'],['她给两包凝露叶各扎一根干绳，等钱压稳才松开。水又涨了一点，她用脚顶高了桌脚。','拔毒丹的封蜡还温着。她拿纸包住瓶身，没让你碰到浸过水的那一端。','药架落到梁上，她才看见你袖口被水浸湿。她递来干布，顺手将回春草卷在布里。']],
reed_procession:[['送行的人走进苇丛，队尾女子还抱着空盒。半只纸翅压在苇根下，另一半黏在她袖上。','她想撕下来，手指又停住：“别一着急就全揉破。”这句话也不知是在说谁。'],['符纸划破掌心，纸鹤终于合上翅膀。她把它放进盒中，取出压在盒底的灵石和草药，追上前面的人。','你们将残翅凑近小火。纸干到能拿起时，她把袖上的另一半也递来，低声数着折痕。','你指给她看，她蹲下时盒子碰了水。前面的人停在苇间，没人催她。']],
drowned_archive:[['潮水退去，书楼二层露出半扇窗。你伸手去取一页，楼主将食指压在纸上。','那根手指的指甲已经泡白。他不说话，另一只手向窗边的空格挪了挪。'],['你把灵石放进空格。手指移开，字停在纸上不再游动；你拿走后，那扇窗从里面关上。','你按页码将散纸归齐。楼主用墨在你的护符背后补了一道线，又把最后一页压住，免得它飘走。','你读完门上题字，一枚夹着灵石的书签落下。楼主的手还停在窗边，等你捡起才收回。']],
furnace_ledger:[['女子逐页烧账，碰到一页写着孩子名字的，手停在半空。','你走近时，她用手臂挡住那本：“别碰。”炉旁的冷石还堆着，她的袖口已经烤焦。'],['她划掉收款一行，将炼好的丹放进小瓶。纸没烧，她将那一页折到最里面。','你搬走案边的冷石。她将炉门压低，腾出的地方露出一圈被遮住的焦痕。','你添上灯油，她才看清袖口着火，用力拍了两下。你在门边坐下，她继续翻那本账。']],
captive_smith:[['铸匠的锁链压着脚踝，炉前白线磨去了半截。她试着抬锤，举到一半又放下。','“先压住炉门，别替我拽链。”她用下巴点了点门缝，火从那里往外窜。'],['你压住炉门，手臂被烫开一条红痕。最后一锤落下，她把淬刃札记推来，手抖得搁不稳锤柄。','她锤合护符背后的裂口。你付钱时，她用两根指头夹住，另一只手还在揉麻掉的虎口。','她喝了一口冷水，用剩下的水浇上脚踝。两束耐热草被她从砧下掏出，塞到你手里。']],
ash_orchard:[['灰白果树只剩三枚红果，树下的碗里装着清水。最左边一枚果子裂了口，还在细声笑。','碗边一行旧刻：“留一枚。”有只鸟啄过另外两枚，又把它们丢回枝上。'],['你摘下完整的红果，另外两枚同时落地，摔在灰里。火收住果肉，只剩一枚温热丹丸。','灵石沉进碗里，叶间凝出灵露。你饮尽时，那只鸟落到碗沿，啄了啄露出的钱。','水渗进土里，树根下露出半只缺口玉瓶。你拔瓶时，头顶枯枝断下，砸在瓷碗边上，响了一声。']],
mirror_guest:[['镜中女子脚边摆着一只行囊，绳结与你的相同。她将药瓶推到镜面，瓶底停在那里。','你伸手，她一直看着你的手。手上有一道伤，她也有，结痂却比你的旧。'],['灵石穿过镜面，药瓶落到掌心。她数完钱，把行囊往身后藏了藏。','她取走钱，将赤色丹丸装好递来。你收回手，镜里那道旧痂裂开了。','你沿镜外走去，她向另一边走。走到第三步，你听见身后有人收拾药瓶。']],
unfinished_portrait:[['画铺在地上，衣领和手势俱全，脸没有画。眼睛的位置却被摸得发亮，纸薄得快破了。','旁边的笔尖干硬，旧画谱被翻开的那页，只留着一块空白。'],['你将血色点在画边的小花上，干笔顺着血迹划出运气的笔路。没画完的脸仍空着。','你付钱取下旧画谱。照着留白拆去一式熟招，再合上书，画边已经多了一枚干掉的红指印。','你压住卷角，风终于过不去。坐到廊下时，一束草从画纸下面露出来，根还带着湿泥。']],
glass_assembly:[['十一个人围着琉璃桌，谁也不看谁。空椅前放着灯、刃、叶三个匣子。','你走近，一个人转头看你，只转了一半又转回去。桌上刻着：取一匣，离席。'],['你打开灯匣，两枚丹药碰在一起。那个转过头的人忽然闭了眼，直到你合匣才睁开。','你付清匣边刻着的钱数，展开折成刃形的功诀。空椅向后退了半尺，够你转身。','你拿起带水的绿叶。匣盖自己合上，十一人中最年轻的那个伸出手，又收回膝上。']],
fate_tailor:[['白发女子先把你按在矮凳上，拿剪刀挑开破口。脚边黑线团滚进门缝，她用脚勾回来。','她咬断线头，咳了两声，继续缝，没有问你叫什么。'],['针尖绕过皮肤，衣上的裂口一寸寸合拢。你试着吸气，肋下不再刺痛，她才剪断最后一针。','黑线被针带出掌心，缠在剪刀上。她剪了三次，才将最后一截投入炉中。','你把散针归进针筒。她挑出三根弯针，在你的护符上扎好，剩下的自己贴着眼检查。']],
silent_astrolabe:[['星盘卡在第七格，齿缝里挤着一截磨秃的骨指。指针每抖一次，骨指便刮下一点白屑。','旁边铜齿匣开着，一枚新齿正好缺同一块。风从断阶下面往上吹。'],['你补进铜齿，骨指终于退出齿缝，掉到阶下。盘面前进一格，刻槽里的功诀从中展开。','你沿指针所指运气，浊气推开指尖的寒意。槽里滚出一枚丹丸，骨指仍卡在原位。','你从断阶另一侧绕过，捡起钱袋。袋底压着一根断绳，绳头一直垂到看不见的地方。']],
last_campfire:[['火烧着山门的松枝，三只杯子并排放着，最里面一杯还冒热气。','纸条压在杯下：“后来的人，留一杯。”有人把“请”字划掉，又添回去。'],['你喝完水，将杯子放回原处。杯底一圈旧水印正好对上新的，松枝噼啪响了一声。','你用火符换下松枝，指节被火舌烫到。取走药瓶后，你将没烧尽的枝子重新推回炉旁。','你拨旺余火，照着火光补好护符。起身时，你把背风的那只杯子往里面挪了挪。']],
armory:[['守匣人将剑横在膝上，先看你的手，再看钱袋。','“剑认人，不认钱。”他松开布条，剑在鞘里撞了一下，“这话不是我编的，上一位手还在匣上。”'],null],
campfire_hunt:[['执炬巡使挡住火塘。她没问姓名，先看剑上的颜色：“营里刚抬回来几个失了魂息的。剑放下。”','沈霜白右手动了一下，火光沿剑脊晃过去。巡使身后的弟子悄悄往旁边退。'],['沈霜白没松剑。巡使伸手拦住身后弟子，自己压下第一道剑光。','灵石留在案上，巡使往旁边撤了半步。沈霜白抱剑坐下，火塘对面的人始终没把手从剑柄上拿开。','沈霜白从断墙缺口退开。巡使举火照了照她的脚印，等看不见了，才把火放回塘里。']],

      sourceOut:{support:'契纹贴进皮肤，炉役终于把愿帖送进火中。老人抹净碗底，挪到离火更远的地方。墙角那枚炭叉被拾灰人重重划成了两道。',oppose:'炭印沾在掌心，搓不掉。拾灰人卷起你的手指：“先来熄炉洞。原来的名字烧在哪一层，得一页页翻。”老人把空碗抱回怀里。',investigate:'你拨开冷灰，找到一页退契请求，末尾压着同一个指印。写请求的人说不识字，字是炉役替他填的；炉役用火钳碰了碰炉门，没有看这边。',leave:'你出门时，老人又问了一遍三年的事。炉役把那截契纸折好，塞进了衣领。'},

      inside:['她从膝下抽出纸，末尾的指印只剩半个：“这人去年想走，冬天又回来了。”','你看向洞里的寿灯。她按住其中一盏：“还活着。别碰倒。”灯油里浮着一小片药渣。'],
      recognition:'她看到你身上的炉纹，把寿灯一把护到身后：“你还替他们续火？出去。”炭铲已经架住了洞口。',
      oldEnemy:'她把被你打裂的炭盒翻过来给你看：“修不上了。”说完，将铲刃抵到那道旧裂纹上。',
      aid:'她对过你的炭印，从灰底抽出一张未烧尽的名字，折进冷灰封：“别弄湿。我只能认出这一笔。”她把另一盏寿灯挪回了自己身侧。',
      talk:'她收下灵石，给你看去年那人的回信：药用完了，求把退回的年岁再借一次。她念到第三行，停了，纸背上还有一个孩子刚学会写的“娘”字。',
      help:'草药敷上烫伤的手，那人仍想去摸寿灯。拾灰人把灯移近些，让他不用起身，又将凝露叶塞到你手中。',
      investigation:'灰底的指印和请求书合在一起，缺掉的半圈对上了。拾灰人取下一盏灯底的旧签，空出一个位置，半天没有把新签贴上。',
      attack:'你越过灰墙伸手，她挥铲挡住，整排寿灯跟着震了一下。她先扶灯，第二铲才朝你打来。',
      question:'你提起沿路听见的退契者。她报出一个人的乳名，见你答不上，便把那张纸重新压回膝下。',
      leave:'她将帘子替你压到背风那侧，自己仍坐在灰墙后。你走远了，里面才响起拨灰的细响。',
      aftermath:'炉门冷下去，洞里的寿灯一盏盏被搬到日光下。老人对着灯底的乳名认了很久，最后抱走了最小的那一盏。',
      replies:{help:'敷过药的手握住灯柄，没有再抖。拾灰人把他的名字从待取一栏挪到了已取那一栏。',talk:'那封回信的最后一行被你记了下来。纸上求药的人如今在哪里，拾灰人仍在四处问。',aid:'冷灰封的折角里夹着半圈旧指印，展开时要先托住底下。',leave:'洞中那排寿灯还亮着几盏。帘边留了个小口，灰没有再扑出来。',defeated:'铲柄折了。她拖着半截柄，一盏一盏扶起被撞歪的寿灯，等你从灰中捡走那页炭拓。'}
    },
    gate_boss:{
      source:['巡灯役牵着老人的袖角，一盏接一盏数灯。桥前的背夫把泡白的木牌翻来翻去，牌上已认不出一个字。','“再往前一步，灯会灭。”纸役将灯杆横过来。背夫低声骂了一句，把担子放下：“我娘也在灯下。她有名字，我就不是她儿子了？”'],
      sourceLabels:['收下灯结，答应护住亮桥','接过长剪留下的剪印','对照木牌水痕与渡簿','沿岸离开'],
      sourceOut:{support:'纸役把灯结系在你衣外，结扣朝着渡棚。老人借你的光往前挪了一步。背夫扛起担子，木牌撞在空架上，一声接一声。',oppose:'剪灯客隔水抛来一枚剪印：“棚里等，别在桥上动手。”你接住时，纸役把灯杆举高，照见了你掌中的齿纹。',investigate:'木牌泡掉的是姓名，背面的旧绳孔却对得上渡簿的搬运号。你抄下那一行，纸役低下灯，看了看，仍没有移开杆子。',leave:'老人问背夫要不要把担子寄在这里。他摇头，扛着两副空架退到岸边，等你从旁走过。'},
      approach:['渡棚一盏灯也没点。湿斗篷挂在低梁上滴水，水下有一只船，船舷被人磨出一道能抓稳的槽。','剪灯客蹲在槽边缠布：“小声点，船上有人刚睡着。”暗处露出半只泡白的木牌。'],
      inside:['她把长剪横在膝头，空出船头给你站。身后的背夫正拿湿布擦母亲留给他的旧木牌。','“昨夜漏下一个。”她用指甲刮了刮剪柄上的泥，“喊了两次，我没听见。”她没有再抬头看岸上的灯。'],
      recognition:'她看见你衣外亮着的灯结，马上将船推回棚影：“灯追到这里来了。”长剪在你脚边合了一次。',
      oldEnemy:'她认出你的脚步，将船绳绕在腕上：“这次别拿船挡。”长剪的缺口还朝着你。',
      aid:'你剪开堵路的那段灯链，背夫弯腰上船。老人没有跟来，还在亮桥上等天明。到对岸后，剪灯客把遮灯帛从船头解下，塞进你手里。',
      investigation:'她将你抄下的搬运号念给背夫听，背夫终于点头，抱着空架上船。船靠岸时，剪灯客拧干一块遮灯帛交给你；亮桥上的老人仍攥着灯杆。',
      talk:'灵石落在湿木上，她用布擦干，才说出昨夜漏下那人的穿着。背夫拿木炭画了两条水痕，其中一条在下游突然断了。',
      help:'你把草药给了咳嗽的老人。她裹紧衣服，指着亮桥摇头：“我走那边。”剪灯客没有再催船，只把一包凝露叶放到你的空药袋上。',
      attack:'你跨向船尾的渡簿，她用长剪挑住你的衣袖。船上刚睡着的人惊醒，低声喊了一个名字。',
      leave:'你踩回岸上，船却没有立刻开。剪灯客伸手，替那只露出船边的空架又垫了一层布。',
      aftermath:'灯杆已经移到桥侧，老人在木凳上打盹。棚下的小船换了一根粗绳，剪灯客一边系绳，一边数着今夜还没回来的人。',
      replies:{help:'老人认出给过药的那只手，把凳子挪开一半：“桥这段，我认得。”',investigation:'背夫到了对岸，留下泡白的旧木牌。剪灯客在背面添了一个小孔，穿上新的绳。',aid:'那段剪开的灯链被卷在棚角，断口上还沾着背夫架子上的麻丝。',talk:'你买下的那页渡簿上，最后一个搬运号还空着。有人正在下游打捞。',leave:'岸上的老人仍留在亮处。渡棚少了一只空架，没人知道背夫最后走了哪条水道。',defeated:'剪灯客捂住伤口，用另一只手拽住漂远的船。你拿到渡簿，纸角已经浸进水里。'}
    },
    camp_boss:{
      source:['药箱上了两道锁，残卒的指节压得发白。独臂逃卒把担架拖近半步：“锁了两天。他们等得到开箱吗？”','药役从怀里摸出木牌，牌上的“追药”两字还带着软封蜡。担架上有人咳了一声，残卒的眼睛动了动，手没有松。'],
      sourceLabels:['接下追药木牌','接过送担架的折符','核对箱余量与担架名册','推回木牌，离开'],
      sourceOut:{support:'你收下木牌，残卒把药箱往身后挪了半尺。独臂的那个不再争，重新把担架绳绕上肩。泥地上拖出一道很长的印子。',oppose:'逃卒把折符压进你手里，指了指侧栅：“别带一群人来，路窄。”药役张口想叫住他，先咳出了一点血沫。',investigate:'药役念箱数，残卒报领药数，两人报到末尾差了一瓶。你又翻过名册，找到一副没有写去向的空担架。独臂逃卒伸手压住了那行。',leave:'药役把木牌塞回怀里。三个人都没有动，只有担架上的人把脸转向门外，等你走出这道门。'},
      approach:['堤下营帐低得直不起身，空担架靠着侧栅。每张布铺上都压着一只水碗，风吹进来，碗底的药渣一齐颤动。','独臂逃卒在栅内磨短枪：“脚抬高，别踢着人。”他袖口别着的空药瓶，瓶绳已经磨进皮肉。'],
      inside:['他将短枪从担架上移开半寸。药役守着账，念一笔就用指甲掐下一小片药纸。','“说我偷药，钥匙却在他那儿。”逃卒指了指堤上，手又收回来，“先别吵，里面那位刚睡。”'],
      recognition:'逃卒看见追药木牌，枪尖立即横过空担架：“追到这儿了？”药役拖着锁链退到布铺旁，挡住了睡着的人。',
      oldEnemy:'逃卒看清你，先把担架推离枪尖：“上回的事我记着。往外站，别踩到伤的。”',
      aid:'你扶住名册上的那副担架，从侧栅慢慢挪出去。药役划掉去向栏的空格，把松誓绷带缠在担架杆上。逃卒试着要接，你先解下了它。',
      investigation:'药役核完你带来的箱数，终于在那副担架后写下去处。伤卒过侧栅时抬手遮了遮光；药役把一卷松誓绷带塞到你腰边，继续念下一人的名字。',
      failedMediation:'你才说了半句停手，残卒便喝道：“没对过账，你替谁说话？”逃卒猛地抬枪，担架上的水碗滚到泥里。',
      both:'你伸手夺锁链，残卒的盾先撞了上来。逃卒没有退，短枪从侧栅外顶住你：“要拿箱子，先从这里过去。”',
      talk:'药役收下灵石，翻出那副空担架的旧记录。逃卒用剩下的手指敲住一行：“他们走亮路，把巡卒引开了。还有两个，没接回来。”',
      help:'草药熬开，药役先闻了一遍才分进碗里。一个伤卒自己剪下军牌，另一个把牌攥得更紧。药役腾出手，往你的药袋里补了一份凝露叶。',
      attack:'你把手按上名册，逃卒的枪尖便挑断桌角一根绳。药役抱住账，另一只手还托着将洒的药碗。',
      leave:'逃卒用膝盖顶开侧栅，让你出去，随即又关上。里面有人问药什么时候发，药役清了清嗓子，接着念名字。',
      aftermath:'堤上的药箱终于开了，空瓶排在营外。药役坐在箱盖上补名册，写到那副空担架时，用指甲刮掉了纸上的泥。',
      replies:{help:'那两名喝过药的伤卒如今能扶着栅栏站。一个把军牌寄在药役那里，一个仍贴身戴着。',investigation:'那副担架的去向写清了。药役把记录折给来问的人，自己继续核算少掉的那瓶药。',aid:'侧栅外还留着担架杆划出的印子。药役添了一根粗绳，供下一副担架抓握。',talk:'空担架那行仍留着两个没接回来的名字。药役不许别人往后面写“亡”。',leave:'你走过的侧栅重新绑紧了。营里点过一次药，谁离开了，还没人递回准信。',defeated:'枪折在药箱旁。逃卒喘着气去扶倾倒的担架，名册从他掌边滑到你脚下。'}

    snake:{
      source:['井役把裂鳞压进湿泥，泥缝又冒起一串黑泡。井外的病人举着空瓶，药工将最后一点药倒回研钵，反复看那张抄方。','抄方上多了一笔“加倍”，墨比别处新。采鳞者把秤盘推过来：“路开了，药就能下山。”药工问卖多少，她只将秤砣移到自己这边。'],
      sourceLabels:['接下封井鳞誓，答应守住井口','接下开井凿契，到窟里谈货','对照原方、抄方与收款账','把空瓶还给病人，离开'],
      sourceOut:{support:'井役将鳞誓递来，绿光从衣褶透出。药工把空桶放在封口旁，病人还举着那只瓶。采鳞者收回秤盘：“那我们窟里见。”',oppose:'凿契沾着井沿的湿泥。采鳞者说货在石窟，先验过凿契再谈价；你追问山下药铺的售价，她已经弯腰去拢秤绳。',investigate:'原方旁没有“加倍”，旧账同一份草药记八枚，今天记十二枚。加量的笔与收款签名不一样。药工把两张方子叠起，光下那道新墨还没有干。',leave:'病人接过空瓶，先往里看了一眼，才揣回怀里。井役仍把肩顶在裂口上，采鳞者开始重新校秤。'},
      approach:['石窟里吊着一排旧鳞，秤盘下接了小碗，鳞上滴下的水一滴也没洒出去。门边整齐摆着几袋草药，袋口却都扎了死结。','采鳞者将金秤抬离膝头：“要买就进来，别踩我垫秤的纸。”纸上抄着井外那张方子的前半页。'],
      inside:['她用镊子从草药里夹出一小片黑鳞，藏进另一个匣。你看过去，她便把匣盖按住。','“一份十二。”她说。你问加量那笔，她的指头停在账本边：“不是我的字。”账里同一位买主的名字写了三遍。'],
      recognition:'她看见鳞誓透出的绿光，立刻收起药袋：“井封了，还想从我这里走？”剥鳞钩扯住门边的绳，秤盘升到头顶。',
      oldEnemy:'她按住上次被你打歪的秤臂：“这杆秤的钱还没算。”两把钩子从药袋后抽了出来。',
      aid:'十二枚灵石摆进秤盘，她称过才剪开药袋，又交出一块净砂药纱。凿契验毕，窟后才响起开路的锤声。井外病人的空瓶仍要另寻药师来配。',
      investigation:'你把旧账压在新账旁。她盯着八枚那一行，咬断药袋的线：“八就八，只有这一份。”药材交到你手里，她立刻将两本账分开收起。',
      talk:'她点完十二枚灵石，才翻开夹页。买主要求“多出三瓶”，收款栏有她的签名；加量处却挖过一块纸，背面贴了张新页。你伸手，她将账抬高了。',
      help:'药工黑肿的手碰到草药，忽然攥紧了。采鳞者皱眉，仍递来清水让他洗；他放下今天第二遍要加的丹砂，将一包凝露叶推给你。',
      attack:'你去拿那张补过的纸，她用秤盘扣住账本。两支剥鳞钩从秤绳两侧掠过来，门边的草药被拖落一地。',
      leave:'她重新扎上药袋，结还是死的。你走出窟口，听到她朝药工喊：“明天带原方来，别又拿这张。”',
      aftermath:'井口多摆了一张长桌，原方与抄方被石头分开压着。药工用仍发黑的手指挨字比过，病人将空瓶排在桌角，等他重新写剂量。',
      replies:{help:'那药工认出你的药袋，把加砂的小勺放到了够不着的地方。第一只新配好的药瓶，他自己先闻了。',investigation:'旧账上八枚那一行旁，多了你买药当天的日期。加量处挖去的纸，仍没找到。',aid:'窟后的取鳞道开了一道窄缝。采鳞者照旧收钱，药工站在外面，一瓶瓶核剂量。',talk:'药账夹页记着“多出三瓶”，你记下的签名还在。采鳞者把那只空秤盘擦了又擦。',leave:'你没带走的那袋药仍在窟口。井外的瓶子换了一批，药工将抄方压得更紧。',defeated:'秤绳断了，金秤落进药粉里。你拾起加量药账，采鳞者撑着墙问：“把我名字抄清楚了？”'}
    },
    bell_boss:{
      source:['家属抱着无字碑坐在棺车前，碑底把裙子磨开一个洞。抬棺人将另一头空绳往地上一放：“十年了，这回谁来接？”','铃响时，家属把头贴到碑上。执幡役递出铃结和木楔，手背的青筋突了一下：“我弟弟也在里面。别问我该拿哪样。”'],
      sourceLabels:['收下铃结，再留一夜钟声','接过木楔，答应替这一户停钟','核对碑底旧刻与抬棺册','绕过棺车'],
      sourceOut:{support:'铃结系好，碑里传来一点极轻的应声。家属抬起头，抬棺人却坐了下去，慢慢解开磨烂的肩垫。',oppose:'木楔被汗浸得发黑。你收下它时，家属将碑抱得更紧：“真停了，还能再听一次吗？”执幡役没有接话，替她拢住破了的裙角。',investigate:'碑底的旧刻还剩半个姓，棺册的纸背透出同一笔旧墨。你将两处覆纸拓下，抬棺人点着册上日期，指甲停了很久。',leave:'你侧身绕开棺车。空绳挡在路上，抬棺人弯腰捡起它，团进另一只手里。'},

      inside:['一张拓纸写错了最后一笔，掘名人用它包住凿柄。你瞥见那行字，她立刻换了块布。','“那户人家供了七年。”她说，“名字是我认的。”墓室外传来棺车轮子转动的声响。'],

      help:'你给她被凿柄磨裂的掌心敷上草药，替她压住纸角。她终于能把这一笔拓清，凝露叶放到了你收回的纸夹里。',

      replies:{help:'她裹着布的手能重新握凿了，拓出的最后一笔没有再晕。',investigation:'棺册上那一户添了离开的日期。碑上的旧刻没有被凿去。',aid:'停钟时取下的旧绳，被家属拴在棺车后，直到出墓道才松开。',talk:'那张认错的拓名纸摆在门口。掘名人开始向来往的人问那家人的住处。',leave:'棺车还停在岔路边。家属捧着碑，抬棺人重新缠好了肩垫。',defeated:'她没来抢你手中的拓纸，先爬到桌边，把被你撞落的名字一张张翻正。'}

    marsh_boss:{

      approach:['底舱压在干堤之下，梁上挂满搬家时来不及系牢的布包。一块屋舍图铺在船板上，用四把凿子压住角。','舟匠拿膝盖顶住裂开的船肋：“进来帮我挡一挡风。胶还没干。”图上两间屋被圈了三遍。'],
      inside:['他指着那两间屋：“一户腿脚不好，一户说死也不走。”他翻出备用船桨，又放了回去。','“我娘在低处。”他突然说，随即把船板翻到另一面，露出算过几次的吃水线。'],
      recognition:'你衣外的水光落在图上，他用凿子压住高堤那一边：“替工坊守水的人，别碰船。”门后的舟钩横了过来。',

      talk:'他收下灵石，把吃水线翻出来给你看。高地那口药井也接着同一片水，他每次算到这里，都把“娘”字往纸边挪一点。',
      help:'你用草药裹住搬舟人的伤手，他还能握住铅笔，一间间补出屋里剩下的人。舟匠将凝露叶递来，替他把第二只手套戴上。',
      attack:'你去拿屋舍图，舟匠用船板压住你的手背，长凿沿桌边扫过。没干的胶洒在地上，立刻粘住了纸角。',

      replies:{help:'那名伤手的搬舟人还在写门号，字歪得厉害。舟匠照着他的纸，一家家去找。',investigation:'新水痕停在你量过的低口下，两户人的布包晾满了半面堤墙。',aid:'凿堤舟的底板磨掉一片木屑，最后上来的那只布包还绑在船头。',talk:'工坊的药井被圈在图边，圈外有一行新字：“先搬药。”',leave:'屋舍图上有几间被划去了，另几间仍圈着。舟匠没有说划去的是搬空了，还是没再找到人。',defeated:'舟匠倚着船板坐下，看你卷起屋舍图，突然报出一个门号，让你记在纸背。'}

      approach:['剥银作坊里没有一面镜子能照清整张脸，木背上积着碎银。刮刀被逐把裹住，只留刃尖露在外面。','老匠将一块露木的镜板翻过来：“先别急着照。”他擦了擦镜面，里面仍是一片空白。'],

      inside:['她把一张空符压在桌上，另一只手按住抽痛的腕。凳边的来客自己握刀刻路牌，刻到半途就得停下喘气。','“我起先要换回我弟弟。”她望着那件宽袍，“后来他们说，还差一笔。我就一直差着。”'],

      help:'你把草药敷在来客腕上，等他喘过气，让他自己刻完那块路牌。他把木屑拢到一旁，递来藏在袍袋里的凝露叶。',

      inside:['他抬起木片让你看名字，刀口歪了两次，都没有重削。颈间还有一道勒出来的红痕。','“那夜我没地方去，她开了门。”他说，“后来我娘死了，门还不让我出。”热水放凉，他也没再喝。'],

      talk:'他收下灵石，翻出自己当年替旧宫收过的一夹名帖。有一张被汗浸软，收帖人落款正是他如今刻在木片上的名字。',

    feiye_echo:{

      sourceOut:{support:'代答承印压在信角，墨偶重新提笔。持信人伸手想拦，手悬了一会儿，又缩回袖中。那滴墨把“归”字浸得看不清了。',oppose:'裂签夹住两封信，旧折痕恰好错开一指宽。持信人反复叮嘱别弄丢第一封，墨偶只将空白信纸往自己身前又移了移。',investigate:'你对着灯看纸背，第一封的墨已透纸，第二封却沿着旧字描了一遍。持信人指着一个写反的字：“他从前就错这个。”',leave:'你将信按原来的位置放回。墨偶的两支笔又悬在落款上，持信人低头去摸那道已经起毛的折痕。'},

      talk:'灵石压在拆开的信封上，她才读出没念完的后半封。问播种之后，收信人还写了母亲死去的日期；那封代答回信却依旧问老人身体可好。',
      help:'草药缠上她被纸割开的手指，你替她压住最脆的信角。她把信逐封铺平，再从纸夹里拿出凝露叶递来。',
      attack:'你伸手拿薄页，她用拆信刀压住页角。另一张桌上的湿信被风掀起，她追着按回去，刀却没有从你手边移开。',

      investigation:'你报出锁舌加长的尺寸，灯匠找到了藏在木里的第二道销。他在门脚刻下位置，让里面的人伸手也能摸到。',
      talk:'他收下灵石，翻出那张订锁图。增添外锁的一笔是别人画的，做出的尺寸却一处没少；落款处，工匠的名字仍是他。',
      help:'你给推门裂掌的人敷上草药。那人等布缠紧，试着自己推开一掌宽的缝，将一份凝露叶从门内递出来。',

    heart:{

      sourceLabels:['收下封帖，将答案继续封存','亲手落印，保留这页证词','核对原稿与补写的墨次','放下笔，离开石案'],
      sourceOut:{support:'封帖压住纸角，执笔影将未写完的一叠收入暗格。醒梦人把裂口的茶杯拿走，桌上留下一个干圆印。',oppose:'你亲手在这一页上落印，墨透过纸背沾到指腹。醒梦人将纸举到光下看了一遍，指着未落印的石室：“到那儿，再取原稿。”',investigate:'最底下的原稿早已写了半句，后添的字沿着旧墨绕开。你逐次记下，执笔影想抽回其中一张，被醒梦人用杯底压住了。',leave:'你放下笔，笔尖滚到桌沿。执笔影伸手接住，没来得及接稳，袖子上又添了一滴墨。'},

      talk:'他收下灵石，念完被改去的半句。纸上原本叫一个人离开，后来每一遍都改成再等。他念到最后，用灰擦掉了自己背过的第七遍。',
      help:'你将草药交给守稿人，等他能抬起手，他亲自从灰里取回一页。纸角焦黑，他用指背轻轻弹掉浮灰，给了你最后一份凝露叶。',
      attack:'你抓住印绳，醒梦人以短拍截住。案上的原稿被风卷起，他一手去按纸，一手继续挡着你。',

      aftermath:'印已经落下，石案上多了一块洗墨的湿布。醒梦人将原稿摊给来问的人，遇到看不懂的字，就把纸转过去让他自己指。',

      approach:['井壁白鳞窟贴满掌宽的补片，片缝间仍渗出黑水。石锤倚在墙上，手握的位置裹了三层湿布。','采鳞人用肩顶住一片内鳞：“先别靠！脚底下那块是空的。”他腾出一只手，指了指另一侧还干着的石阶。'],
      inside:['他将石锤平放，手掌离不开白鳞。井下传出旧绛鳞叫人的声音，叫到第二遍，语气却和第一遍一模一样。','“我剥过她一片。”他盯着自己的刀鞘，“那天起，伤口就没再合。”他把刀推到够不着的地方。'],

      talk:'他收下灵石，解开刀鞘上的旧布。布里卷着最早剥下的那一点白鳞，边上写着他当年亲口保证的“剥了就能好”。字被水泡过，仍能辨认。',

      attack:'你伸手揭内鳞，他用锤柄将你的手顶开。补片错了一线，黑水钻出来，井下的声音突然变得很近。',
      leave:'你沿干石阶退开，他又把刀往远处踢了一脚。锤声重新响起来，每一下之后，他都得先按住白鳞喘口气。',

  function owns(state,id){const f=state?.journey?.factions;return !!state?.player?.questItems?.includes(id)&&!f?.invalid?.[id];}
  function factionData(defs){return defs?.ENEMY_FACTIONS||root.NightEnemyFactions||(typeof module!=='undefined'&&module.exports?require('./enemy-factions.js'):null);}
  function recordFor(e,state){return state?.journey?.factions?.records?.[e.factionEvent?.nodeId];}
  function isHostile(e,state,g){return owns(state,g.support)||!!state?.journey?.factions?.behaviors?.some(x=>x.npc===g.npc&&x.kind==='attacked');}
  function seenInvestigation(state,g){return !!state?.journey?.factions?.behaviors?.some(x=>x.npc===g.npc&&x.kind==='investigate');}

      {story:['誓墙下摆着空药箱，闻铮逐一合上箱盖，每合一只便念一遍旧誓。箱子全合上后，她还在念。','墙角一名瘸腿守卒试着起立，闻铮抬手按住他：“还没轮到你。”他的手撑着地，许久没有松开。'],present:['欠命原账在你臂弯展开，“全营”旁的私印正对着闻铮。','旧营印沉在袋底，断掉的穗子扎着指根。'],absent:['闻铮问药领给了谁。你翻过手头的残纸，箱号到这里就断了。','她看向你腰间，视线停了一瞬，随即重新按紧自己的印绶。'],act:'压好腕上护符，站到誓墙前',yes:'你把护符压在腕甲下，绕开脚边合死的药箱。闻铮终于停止念誓，拔剑挡在瘸腿守卒前；守卒却往后挪了半步，离开她的影子。',leave:'先绕过药箱，察看营门',no:'你退到营门外。誓墙那边又响起箱盖开合的声音，瘸腿守卒没有跟出来。'}
