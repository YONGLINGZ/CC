    snake:[
      {story:['采药人拿锅底灰擦试方簿，擦黑的正是加量那一行。摊外的病人捏着空瓶，瓶底凝着一粒红色沉渣。','“药苦，总得兑点水。”他看了一眼空瓶，又改口，“加量是上头的意思。”摊后的孩子掀起米袋叫他，他立刻把孩子推回帘内。'],act:'封住摊上的毒药，对照未改的原方',yes:'你刮下瓶底沉渣，放在原方旁边。他先说认不得，见孩子又来取米，忽然蹲下去抱紧了那口米袋：“加量能多卖三瓶。我抄的。”你收好原方，他把剩下的药一瓶瓶塞进石匣。',leave:'不接药瓶，从摊前离开',no:'采药人收回试方簿，用秤砣压住。摊外的人又问了一次药价，这回他只让人等。'},
      {story:['孩子把旧鳞藏进鞋底，走路一高一低。债主拦在桥洞口，说借过的药钱早已滚过三遍，鳞还不够抵。','“第一次你说只看一眼。”孩子脱下一只鞋，又赶紧捂住，“娘那时还在。”债主笑了，说小孩记性都差，袖里却掉出第一张欠条。'],act:'逐张对照欠条，划掉重复计的利息',yes:'你将第一张欠条压住，让债主拿出第二笔借钱的收据。他翻遍袖子，最后只抽回那张旧纸。孩子把鞋倒过来，旧鳞落在你掌中；他赤脚站了一会儿，才重新把鞋穿好。',leave:'不碰欠条，绕过桥洞',no:'孩子抱着鞋让到桥壁边。债主弯腰去捡欠条，你走出几步，听见孩子说：“你先把写价钱的那张拿来。”'},
      {story:['药井旁堆着洗净的空瓶，瓶口都朝着绛鳞。她把一瓶新药倒进井里，井底立刻响起密密的咳声。','“这次又要几箱？”她问。你没有报数，她抬起头，鳞缝间沁出一小股血。'],present:['原方摊在你膝上，没有加量的那一栏被井风吹得来回颤。','旧鳞在你手心缓缓回温，绛鳞的目光停在了它上面。'],absent:['她等着你拿出方子。你刚解开行囊，她便把药瓶收回袖里。','她扫过你摊开的手，指尖仍按在那道渗血的鳞缝上。'],act:'蘸井边清水画护符，封紧袖口',yes:'你用清水压平符纸的翘角，把它折进袖口。绛鳞收起最后一只空瓶，瓶底与石面碰了一下。她没有再问箱数。',leave:'避开药井，从外墙继续走',no:'你避过满地空瓶。绛鳞在身后慢慢倒空最后一瓶药，井底的咳声没有停。'}
    ],
    bell_boss:[
      {story:['抄帖女修把“异乡”两个字圈在丧帖背面，正面留了一大片白。来认尸的男人把一只破陶埙搁在白处，她伸手想挪开，男人便按住她的手。','“雇主只给本地人的纸钱。”她说，“我弟弟那天要出域，船不等。”陶埙里滚出一点泥，正落在她尚未写干的字上。'],act:'请认物的人逐一报姓名，补齐丧帖',yes:'她起先只肯抄籍贯。认物的人把陶埙吹响，短得只有半声，她就认出了那晚来求落名的人。她拆开自己预留的帖纸，把名字补到旧帖旁，交来时没有盖住原先的圈。',leave:'把陶埙留在桌上，退出抄帖棚',no:'她提笔等你走远。棚门合上前，认物的人又把陶埙往那片空白上推了一点。'},
      {story:['铸钟匠把木槌锁在柜里，柜面还贴着“余韵绵长”的旧奖帖。他说钟没坏，是敲钟的人舍不得停。','楼上应声传来一个名字，和他刚才喊徒弟的口音一模一样。他猛地抬头，手里的钥匙掉在地上：“别学我。”'],act:'请他当场敲验，在槌柄上刻出缺陷',yes:'匠人拾起钥匙，开柜取槌。他照旧想敲三下，第二下刚起，钟腔里就有人叫他的徒弟别进来。他放下槌，在柄上刻出吞愿的裂槽位置；刻刀每滑一次，他便把字再刻深一点。',leave:'不试这口钟，留下木槌',no:'他抢在你离开前锁好柜门。钥匙转过两圈，楼上却又用他的声音喊了一次徒弟。'},
      {story:['钟楼台阶上摆着几百只鞋，晚蘅一只只拨正鞋头。最上面的那只又翻过去，她便重新走上去扶。','“站稳些，路还远。”她对鞋说。钟腔里有人拍了三下，节奏很急，她把手搭上钟绳，没有拉。'],present:['补刻丧帖展开后，台阶上有几只鞋忽然停止了晃动。','旧送魂槌抵着你的臂侧，柄上的新刻痕硌出一排红印。'],absent:['她伸手来找名字，你只摸到了空纸封的边角。','风吹动钟绳，铃扣一路磕下来；你身侧没有可以压住回声的木槌。'],act:'把护符折入衣领，登上最后几级石阶',yes:'你将护符塞进衣领，走到钟绳垂下的地方。晚蘅伸手拦住你，先看了一眼你的鞋头：“你是来送谁的？”钟腔里的拍击声突然停了。',leave:'留在楼梯外，先听钟腔里的动静',no:'你退回楼梯转角。晚蘅继续拨正鞋头，翻倒的还是最上面那一只。'}
    ],
    marsh_boss:[
      {story:['水工用灶灰把潮尺的一截涂白，见你来了，反把尺塞进火里。尺太湿，火只冒出一股浓烟。','“图是上头改的。”他咳着把尺拽回来，“少这三寸，工坊才领得到工钱。”门外女人问他，水过自家门槛时怎么没听见警钟。'],act:'把潮尺放回旧刻线，请他写下验收姓名',yes:'你用井水洗去灶灰，旧刻线露了出来。女人把自家门板推到尺边，水痕比短尺高出整整三寸。水工写完监造的名字，又在最末添上自己的姓，将尺交过来时仍捏着尺尾。',leave:'不追问短尺，把它留在炉边',no:'水工把尺晾到炉边，没再往火里塞。门外女人坐了下来，手一直压在那块带水痕的门板上。'},
      {story:['摆渡妇用一根旧绳试船板，绳中段硬结发黑。她不让你解，说解开后就记不住当时拴在哪了。','“我娘就在这里。”她拍了拍船尾，又指向对岸，“那边叫了三次。我知道，别数给我听。”她重新穿绳时，打结的手忽然停了。'],act:'撑稳船板，问清绳结当时拴住了谁',yes:'你托住船板，她把旧结一点点挑开，露出里面的一截白发。新绳穿好后，她试着向对岸撑了一篙，又立刻收回。回岸绳留在你手里，她坐在船尾，重新整理那截白发。',leave:'不解那个结，从岸边离开',no:'她抱着船板坐回去，重新拽紧旧结。你走远时，船篙在浅水里碰了一下，没有再响。'},
      {story:['祭台只高出水面半尺，泠汐跪在台沿，月珠里的每次呼救都让她转一次头。有人喊开闸，她便抱紧珠子。','“等等。”她说，“这一声我还没听清。”水从她膝头漫过，台上那条白线已经看不见了。'],present:['潮尺被你竖在祭台边，水刚好淹到原先被改掉的刻线。','回岸绳绕在你的腰间，旧结拆开后留下的硬弯还没松。'],absent:['你沿台壁摸过去，几道互相矛盾的刻痕都被水泡白了。','泠汐向你伸了一下手，你低头看见水从空着的掌心流走。'],act:'护住符纸，踏入祭台外的浅水',yes:'你把护符封进油纸，塞到贴身的衣带里。迈进水里时，月珠中有人喊了声“别踩”；泠汐猛地看向你的脚，双臂依旧紧抱着那颗珠子。',leave:'沿干堤退开，不踏上祭台',no:'你退向高处。月珠里的呼声又响了，泠汐转向原来的方向，仍说：“等等。”'}
    ],
    furnace_boss:[
      {story:['青年把寿契背在身后，母亲从他衣角下抽出一半，盯着契尾歪斜的指印。她的手掌贴上去，纹路严丝合缝。','“那时你醒不过来！”青年说。母亲推开他的手：“醒来以后呢？你抱我按这个，没见过我睁眼？”他低头去系腰带，怎么也系不紧。'],act:'请母子逐笔认下签押，留下原寿契',yes:'青年先划掉母亲名字旁续写的那一行，又想把最早的指印折进去。母亲伸手摊平纸，自己在指印边写了日期。她将原契交给你，转身问儿子昨夜到底睡了几个时辰。',leave:'不拿原契，让他们继续说',no:'你出门后，青年终于松开腰带。母亲的声音低了下去，你只听见椅子往他那边挪了一下。'},
      {story:['守炉人把女儿的信塞进炉口，纸角刚焦就又拽了出来。上面写着“我不要再听见他们哭”，下面的字被她的手捂住。','“她烧糊涂了。”她说，却把炉温压低一格。炉门边有一袋熄炉砂，她的脚一直踩在袋口上。'],act:'让她读完信，再问被烧掉的退契纸',yes:'她一口气读到最后：“别再替我点别人的灯。”读完，她掀开炉底的灰，把尚看得出字的退契纸拣出来。熄炉砂从脚下拖出，袋口勒在她手上；她松开时，五指还保持着抓紧的样子。',leave:'不伸手拿砂，离开炉边',no:'她重新把砂袋踩住，将那封信折到最小，塞进贴胸的衣袋。你走出炉门时，炉温仍停在刚压低的那一格。'},
      {story:['赤绫把一张新愿帖贴在炉门上，帖尾写着“让她永远活着”。门后的人捶了一下，贴纸边缘便往外鼓了一下。','“她昨夜还叫疼。”赤绫抹平纸边，“关了，就不会叫了。”她抹了三次，那张纸仍被里面的手一点点顶起。'],present:['你展开原寿契，契尾后来补写的日期在炉光里清清楚楚。','熄炉砂安静地伏在袋底，守炉人留下的指痕还印在袋口。'],absent:['赤绫问谁按过指印。你翻开手边的纸，只有被烟熏黑的空边。','你看向炉灰槽，满槽细灰遇火就亮，找不到那袋不会燃起的砂。'],act:'将护符隔热封好，走近炉门',yes:'你把护符折进湿布，夹在腕带内。炉门里又有人敲了一下，你向声音那边走，赤绫猛地挡住门缝，手背被火光照得通红。',leave:'退出热浪，绕去炉室外侧',no:'你退到炉室外，帖纸又从门里鼓起来。赤绫用整只手掌按了上去。'}
    ],
    mirror_boss:[
      {story:['学徒拿湿布擦画稿上的疤，纸已经薄得透出桌纹。画中人的原身站在桌边，眼下那道旧伤比画上深得多。','“这样嫁过去好看。”学徒说。她将湿布夺过来：“你没问我。”他又去拿另一块布，拿到一半，才看见她挡在画前的胳膊。'],act:'把原稿摊给她，请她亲手圈出改过的地方',yes:'她先圈了伤疤，再圈住被画成微笑的嘴角。学徒说新纸贵，她便拆下头上的簪子压在桌上。你带走她留给查访者的原稿，听见她正让学徒把眼睛也照旧样画回去。',leave:'放下湿布，不带走原稿',no:'你将湿布放到桌边。她没再看你，抽过画稿，把圈错的嘴角用自己的指甲刮开了一点。'},
      {story:['磨镜老人坐在一堆刮下的银屑里，端着空镜照自己。镜中只映出椅背，椅背前的位置空着。','“上个月还照得见耳朵。”她侧过脸给你看，又把镜翻回去，“封口那袋钱，我一枚也没剩。”柜底的银镜还在发亮，她拿布盖住，布下立刻鼓起一张脸。'],act:'挡住柜中镜面，请她刮下最后一层银',yes:'你扶住木柜，老人用刮刀沿镜背划了三遍。银面剥下时，她突然去摸自己的脸，摸到后反而不动了。那块无银镜背被她递到你手里，刮刀留在膝上，刀口朝着自己的方向。',leave:'不碰柜门，离开银屑满地的作坊',no:'老人用脚把银屑拢到椅下。你走到门口，空镜里仍只有那把椅子，她把脸又凑近了一些。'},
      {story:['素照在镜庭正中挑脸，每换一张，庭里就有一面镜子裂开。她选到一张没有伤痕的，停住了。','“这一张认得我。”她说。身后那面镜子却传来抓挠声，有人在里面反复喊一个她刚刚擦掉的名字。'],present:['原貌画稿被你卷在掌边，纸上那道伤疤从卷口露了出来。','无银镜背朝向庭中，刮痕里留着一点没擦净的细银。'],absent:['她问你记得旧样子吗。你摊开空着的画筒，镜里的人忽然不再抓门。','你的倒影从最远一面镜子里走近，手中同样没有能翻转的镜背。'],act:'用护符压住衣襟，步入镜庭',yes:'你将护符扣在衣襟内，避过脚边新裂的银片。素照把那张无疤的脸对准你，镜中的抓挠声转了方向，紧贴着你的耳侧响起。',leave:'退离镜面，沿背光处前行',no:'你向背光处退去，素照又开始挑脸。刚才被她放下的那张，嘴角比先前低了一些。'}
    ],
    abyss_boss:[
      {story:['末席书记将一本命册抱在胸前，长大的“孩子”坐在对面，手边没有笔。契尾续签却一年比一年密。','“当年是谁把你救回来的？”书记问。他没答，指着最新一行：“这一年，我连这里都没来过。”书记把册子抱得更紧，书角顶出了衣上的线头。'],act:'让被续签者亲手撤签，保存删改前的册页',yes:'那人把笔尖按在册上，墨迹洇开一小片。他划到第三行时停住：“这一个，是我替他签的。”书记刚想说话，他已翻回最前一页，把自己的名字也圈了起来。你收到的原册夹着一截被攥断的线头。',leave:'合上命册，不追问续签的人',no:'你合上册子。书记松了一口气，随即把册子从你手里抽回去，抱在怀里。那人起身出门时撞到了门框，谁也没扶。'},
      {story:['铸印师守着一块写有“逆转”的价牌，价牌背后压着断契空印。她看你时先笑，笑到一半就去遮印口的裂纹。','“新试过一回，兴许能成。”案边的人把一小撮冷灰推向她：“你上回也是这么说的。”她想把灰吹开，张了张嘴，没有出气。'],act:'请她在众人面前试印，留下真实印模',yes:'她将空印压向那撮冷灰，印下的仍是一圈死灰。围观的人没有散，她撕下“逆转”两字，又在新纸上试出拒收命线的空栏。印交到你手里时，她还在把旧价牌撕成更小的条。',leave:'不接空印，让她留着价牌',no:'她迅速将空印藏回价牌后面。案边的人没走，把冷灰拢成小小一堆，坐在了门槛上。'},
      {story:['命枢里有个声音从纸背透出来：“还有人肯签。”册外那人按住空栏，指腹正好盖住一道旧划痕。','“先问清，”他说，“签的是自己的，还是别人的命。”上方一排命灯同时往下垂，最末那盏的灯穗擦过他的额头，他没有抬头。'],present:['你把删前命册摊在膝上，被圈住的名字没有再被续写。','断契空印握在手中，裂开的印口硌着拇指。'],absent:['你摸了摸行囊，只有半包药和一路积下的纸角。那人仍按着空栏等你。','纸背的声音伸来一截命线，你手中只有被汗浸湿的衣带。'],act:'将护符扣入腕带，走到命枢下',yes:'你把护符扣入腕带，越过拖在地上的命线。册外那人松开空栏，让出半张案面；纸背的声音低了下去，改用你一路听熟的几种嗓音叫你。',leave:'先离开签案，沿命灯下探路',no:'你退离签案，那人把笔横放在空栏上。命灯依旧低垂，最末那盏的灯穗停在他额前。'}
    ],
    feiye:[
      {story:['游方书生把祖母的名帖缝在衣里，拆线时总避开最下面的字。那里原有一个姓，如今只剩一团针孔。','“她说多亏旧宫。”他笑了一下，针扎进了手，“可每年扫墓，她都叫我去远处等。”名帖下垫着一张空墓纸，墨还没有磨。'],act:'核对名帖旧线，将改过的姓留在纸上',yes:'书生翻出祖母藏的旧家书，落款的姓与针孔接了起来。他在空墓纸上写一遍，写错了，又另取一张。名帖交给你，写对的那张被他夹回家书中。',leave:'不拆最后一排线，留下名帖',no:'书生把针重新穿好，缝回那条拆开的口子。空墓纸从衣角滑下来，他弯腰拾起，折了两次才放稳。'},
      {story:['制灯人给一根旧灯结加上新线，账上写着今年的等待钱。旁边已经叠了好几年的同样账单。','“她总有一天回来。”他说，“我替她等这么久，少算过一日没有？”一个赶路的人拿着付过的钱条来取灯，他把灯往身后挪了挪。'],act:'摊开旧账对照钱条，解下那根灯结',yes:'钱条上的日期正好压住第一笔等待钱。制灯人说忘了算，手却把后面几张同样的账单一起扣住。你们当面核到最后，赶路的人取走自己的灯；旧灯结被剪下来，掉在你的掌上。',leave:'不解灯结，离开灯架',no:'制灯人又绕上一圈新线。赶路的人把钱条举高了些，他低头去找一根并不短缺的灯针。'},
      {story:['井边挂着几块没有姓名的门牌，绯夜的影子在水里先一步停住。井内有人问：“他们还在等吗？”','一名老人抱着写好一半的墓纸坐在栏边，笔尖干了，便用舌头舔了一下。风把门牌撞在一起，他抬头骂了句吵。'],present:['无主名帖的针孔映在水面，被改过的姓从水下慢慢浮起。','旧宫灯结挂在你手边，断线碰着井栏，已不再牵住谁的灯。'],absent:['老人望向你刚打开的行囊，手里的半张墓纸又卷了回去。','井栏的空钩来回晃动，碰不到一根能解下的旧线。'],act:'将护符贴紧衣内，靠近井栏',yes:'你将护符压在衣内，扶住摇晃的井栏。井中的影子抬起脸，先看门牌，再看你的手。老人把墓纸挪到身后，给你腾出半步位置。',leave:'不答井里的问话，退到栏外',no:'你退开后，老人重新展开墓纸。井内那句话又问了一次，只有门牌撞击的声音回答。'}
    ],
    feiye_echo:[
      {story:['守井人收到两封同样笔迹的信，一封写“明日来”，一封写“到不了”。他把第二封垫在漏水的茶壶下面。','“哪有两封？只有这封。”他将“明日来”举到你面前。制信的墨偶从柜后伸出半只手，指尖还沾着同样的墨。'],act:'把两封信摊在一起，让墨偶说出代答的那一夜',yes:'你抬起茶壶，第二封的落款已经晕开。墨偶承认那夜本尊握不动笔，守井人先打断它，又忽然问明日究竟是哪一日。两封旧札被一同交给你，茶壶下换成了一块破木片。',leave:'不抬茶壶，只把第一封放回去',no:'守井人把信折回原样，反复抹平“明日”两字。柜后的墨偶收回手时，撞响了藏在里面的另一只茶杯。'},
      {story:['制镜者要把裂影铜边磨平，织席妇把磨石夺了下来。铜边里映着一只送过药的手，手腕的折痕与另一幅影子对不上。','“我发热那夜，是它背我过桥。”织席妇说。制镜者嘟囔修好了才好看，她把磨石摔进水桶：“我又没瞎。”'],act:'留下两道折痕，请她讲完那夜发生的事',yes:'织席妇把过桥那夜的时辰念了一遍，制镜者翻到本尊不在场的旧单，终于停下打磨。她拧干铜边上的水交给你，伸手又碰了碰影中那只送药的手；铜边里的手没有缩回去。',leave:'不拿铜边，让她自己保管',no:'织席妇把铜边抱进怀里，制镜者低头捡磨石。她盯着他，直到他把磨石放上了够不到的高架。'},
      {story:['碎镜在地上拼出半个人，倒影抱着一沓没回完的信，每张都写“明日”。另一边的门后，敲门声一次比一次慢。','“我答应过。”它把信贴紧胸前，“她没空，我有。”说完却抽不出哪一封该先回，纸页从手臂间滑下来。'],present:['两封代答旧札并在你手里，茶水晕开的落款仍能看出两道不同的停笔。','裂影铜边映出一只送过药的手，裂纹把它与本尊的袖口分开。'],absent:['倒影要你拿出它许过的那句话。你摸过纸封，只碰到几张一路受潮的空页。','脚边裂镜照出许多只手，你找不到能把两道折痕分开的那截铜边。'],act:'以护符扣住衣口，穿过散落的信纸',yes:'你把护符扣进衣口，绕过地上铺开的“明日”。倒影伸手去捡，门后敲了三下，它的手停在信纸上方，随后慢慢转向你。',leave:'退到镜外，先察看那道门',no:'你退到碎镜照不到的地方。倒影重新把信抱好，门后又敲了一下，比上一次更轻。'}
    ],
    retainer:[
      {story:['守门人把出入簿摊在桌上，前半本密密麻麻，后半本一张都没写。他说没人再要出去，桌脚却垫着一叠折起的离门条。','“外头死过人。”他用鞋尖把条子往里踢，“放走的那个孩子，后来没回来。”门后有人提着行李等，问他今日能不能给一句准话。'],act:'抽出桌脚的离门条，按日期补进旧簿',yes:'守门人先指着那张孩子的条子不让你碰。你把它单独放好，念起后面几十个等着走的名字，门后的人便一个接一个应声。他握住笔补完，交出旧簿时仍将那张孩子的条子留在自己手边。',leave:'把桌脚垫稳，不取旧簿',no:'你将桌角扶稳，守门人迅速把离门条塞回去。门后那个人又问了一遍，行李已经放到了地上。'},
      {story:['灯匠拿一枚能退回的铜环试锁，开了三次，又锁回三次。她面前摆着一份新图，最下面的工价被涂成了黑团。','“改一座灯架要一天。改完了，我吃什么？”她把图折起来，门内的人却从缝里推出一小袋路费，袋口磨得发白。'],act:'逐项核对工钱，请她按新图试开灯锁',yes:'她点过路费，说还差一截铜线，门内的人便把旧发钗从门缝塞来。她没有接发钗，拆下自己灯架上那截多余的线，把铜环试进锁里。门开了一指宽，退灯环从门缝递到你手中。',leave:'不取铜环，把新图留给她',no:'灯匠展开新图，在涂黑的工价旁重新写了个数。门内的人仍坐着，发钗停在门缝外，谁也没有去捡。'},
      {story:['卫烬把旧席擦得发亮，茶盏却都扣着锁。席外的人端着自己的杯子站了半晌，他仍只朝席内招手。','“位置我全留着。”他对空席说。门外的木箱被搬了两次，每回碰响门槛，他就把茶壶握紧一点。'],present:['出入旧簿摊在臂上，后半本终于写满了离门的日期。','退灯铜环在你指间扣合又分开，锁舌随着它轻响。'],absent:['卫烬问谁说过要走。你翻过手边的纸，门外等候的人把杯子端得更低。','你试了试门上的铜扣，锁眼里没有能退出的那一截环。'],act:'收紧护符，跨进旧席之外的门槛',yes:'你将护符收进腕带，踩过堆在门边的木箱。卫烬终于转过脸，看见你站在席外，先把一只空椅拖了出来，随后又死死压住椅背。',leave:'停在门外，不坐那张旧席',no:'你留在门外，端杯的人让开一点位置。卫烬重新扣好茶盏的锁，铜扣挨个发出短响。'}
    ],
    heart:[
      {story:['执笔人将一张没盖印的纸反扣着，说那日确实听见了应允。你问是哪句话，他便清了清喉咙，重复纸上的命令。','“不是问写了什么。”旁边的人翻开纸背，背面只有他自己的批注：“照办。”他想把纸压回去，砚台被袖口撞歪，墨淌到了边沿。'],act:'展开纸的两面，请他认下那条批注',yes:'他把砚台扶正，先写“奉意”，写到一半划掉，改成自己的名字。未落印的正面被你用干纸隔好，背面的墨仍未干；他伸手想吹，被旁边的人挡开了。',leave:'不翻纸背，把未落印纸留在案上',no:'执笔人重新把纸反扣。墨还在往案边滴，他拿一张空命令垫到下面，空纸上很快透出黑色。'},
      {story:['守梦人打开一只空枕，叫你闻一闻：“睡进去，什么都不记得。”他自己却把一撮灯灰缝在枕外，每次碰到便缩一下手。','你问那灰，他说是旧炉灰。门口送信的人问他赔药钱送往哪户，他立刻报出巷子、门牌，连门槛少一角也记得。'],act:'不碰忘事枕，请他说清灯灰来自谁家',yes:'他报完地址便闭了嘴，盯着那只空枕。送信人等他把名字也写全，才收起药钱。守梦人拆下灰包递给你，枕上留下一个没补好的口子，他没有拿针。',leave:'合上空枕，不带走灯灰',no:'他将空枕抱回膝头，绕过灯灰，把脸埋进没有缝口的那一侧。门口送信的人仍等着最后一个名字。'},
      {story:['心影坐在一张矮案后，手边没有印，案上却压着一排排命令。它每问一句，最末那张纸就自己添上一个字。','“那天，你听见了没有？”它问完，停下来摸了摸自己的喉咙。喉间发出的轻咳与绯夜一模一样。'],present:['未落印纸在你手里正反分开，背面的批注没有再盖住空白正面。','醒梦灯灰贴在衣内，细小灰粒扎着缝线松开的地方。'],absent:['你翻到最后一张随行的纸，纸背没有留下那一次批注。心影把案上的命令往前推了推。','心影把一只空枕推到案边，你手心里只有刚才摸纸沾下的灰。'],act:'将护符贴在腕内，在矮案前站定',yes:'你把护符贴紧腕内，站到心影伸手可及的地方。它抽出那张自行添字的纸，最后一个字写歪了；它看了很久，又抬头等你的回答。',leave:'离开案前，沿纸墙外探路',no:'你沿案外退开。心影把那排命令重新理齐，最后那张纸没有再添字。'}
    ],
    snake_ascended:[
      {story:['抄写人指着残注的后两行：“这都是教徒改的。”第一行“不可再试”上却横着一道更旧的删痕，笔锋与他手中那支一模一样。','你将纸转向他，他抬脚踩住地上的草稿：“最早谁也不知道会这样。”草稿边角露出同一句“剂量尚浅”，字还没写完。'],act:'取出草稿，把两种字迹按先后排好',yes:'你把草稿从他脚下抽出，与残注的删痕对在一起。他先指向后两行，指到一半停住：“那一笔，是我。”你收好并排的纸页，他把笔折成两截，墨洒了一脚。',leave:'不抽草稿，留下这页残注',no:'抄写人等你走开才挪脚。草稿被鞋底蹭破了，他蹲下去捡，越拢越散。'},
      {story:['采鳞人将一片未染黑的内鳞夹在刀柄里，刀刃下的布早已渗透。他说只割掉坏的，旁边的血水却还在往外淌。','“不割，她更疼。”他说。井里传来一下很低的抽气，他反而握紧刀柄，指节压在那片白鳞上。'],act:'压住刀背，封好已经脱落的那片内鳞',yes:'你按住他的刀，他起先不松，直到井里再次抽气，才猛地张开手。刀柄中那片内鳞被你用干布封好。他去找止血布，翻了一遍又一遍，最后撕开了自己那条沾血的围裙。',leave:'不接他的刀，从采鳞棚退开',no:'采鳞人把刀搁下，又拿起，最后只用刀背压住那块布。你退到棚外，听见布条被撕开的声音。'},
      {story:['深井的黑鳞沿石壁一片片竖起，井中的声音说：“都是那场灾变。”绛鳞的手压在一张旧契上，签名比灾变前的井水印还早。','“都是。”声音又说。她张了张嘴，却用指尖把自己的签名描了一遍；最末一捺划破了纸。'],present:['逆方残注夹在你衣内，最早的删痕与后来的加量字迹还并排留着。','未染内鳞被干布封在掌中，布角上没有新添的血。'],absent:['井中问谁先落的笔，你把纸封翻开，最早那一页没有随你到这里。','黑鳞从水下翻到井沿，你空着的手被逼回袖里。'],act:'护住腕内的符纸，迎向井口',yes:'你将护符封紧，走到旧契另一侧。井里再次传来“都是”，绛鳞猛地按住那张被划破的纸，指甲与石面刮出尖响。',leave:'避开竖起的鳞，从井壁外侧前行',no:'你退到鳞片够不到的地方。井中还在重复那两个字，绛鳞的指尖始终没有离开那道签名。'}
    ]
  };

  function questDefinitions(defs){
    return defs?.BOSS_QUESTS||{};
  }
  function previousOutcome(e,state,boss,step){
    if(step<2)return;
    const record=state?.journey?.bossQuests?.records?.[boss];
    const choice=record?.choices?.[step-1]?.key;
    const previous=CHAINS[boss]?.[step-2];
    if(choice==='witness')e.connection=previous.yes;
    else if(choice==='leave')e.connection=previous.no;
    // Historical/debug fixtures with another key retain what actually happened.
  }
  function awakening(e){
    e.story=[
      '铜匙转开家令心匣，完整留声簧接上断裂的半句。缄红的铜壶停住，裁衣剪合拢，扫帚里的铜针一根根缩回线匣。',
      '“看好家……别追出去，救活着的人。”声音播完，她看向阶前那双鞋，伸手扶正了鞋头。然后她打开门，把仍冒着热气的水放到门外。',
      '“主人的客人。”她的声音卡了一下，又说，“伤的人，也进来。”'
    ];
    const changes={
      shelter:['请她先给门外的伤者添水','你把门外的人扶到檐下。缄红挪开空席，烧水的铜壶重新落到炉上；她取出一包未受潮的药草，放在你仍沾灰的手边。'],
      testimony:['把纵火者的证词留在旧账旁','你把证词放到修门账簿上。缄红抽出一块没有焦痕的布，将纸页包紧，收进朱漆柜；柜里整齐叠着主人的旧收据。'],
      tea:['坐一会儿，喝完她端来的茶','你接过茶。缄红将第二杯推向空席，推到一半停下，收回炉边。杯底在桌面留下一圈湿印，她拿抹布擦了一次，没有再添水。'],
      farewell:['向她辞别，把门留着','你走下门阶时，缄红没有追来关门。她拾起檐外淋湿的那只鞋，和另一只摆在一起，又给门外的伤者添了一碗水。']
    };
    for(const c of e.choices||[]){const copy=changes[c.key];if(copy){c.label=copy[0];c.outcome=copy[1];}}
    e.description=e.story[0];
    e.bossEditorialRevision=REVISION;
    return e;
  }
  function rewrite(e,state,defs){
    if(!e||e.bossEditorialRevision===REVISION)return e;
    if(e.id==='boss_lotus_awake')return awakening(e);
    const match=/^boss_(.+)_([123])$/.exec(e.id||'');
    if(!match||!CHAINS[match[1]])return e;
    const boss=match[1],step=Number(match[2]),scene=CHAINS[boss][step-1];
    const primaryKey=step<3?'witness':'prepare';
    const primary=e.choices?.find(c=>c.key===primaryKey),leave=e.choices?.find(c=>c.key==='leave');
    if(!primary||!leave)return e;
    e.story=scene.story.slice();
    const q=questDefinitions(defs)[boss];
    const held=state?.player?.questItems||[];
    if(step===3&&q){
      for(let i=0;i<q.items.length;i++)e.story.push((held.includes(q.items[i])?scene.present:scene.absent)[i]);
      // Conditions and exact one-shot effects remain in the rule area, not NPC speech.
      const notes=q.items.map(id=>`${held.includes(id)?'已携带':'未携带'}「${defs?.QUEST_ITEMS?.[id]?.name||id}」`);
      if(boss==='lotus_boss')notes.push('铜匙与留声簧必须同时持有，且亲历前两段旧事；条件齐备时进门自动唤醒，否则进入战斗');
      else for(const id of q.items){if(held.includes(id)&&defs?.QUEST_ITEMS?.[id]?.text)notes.push(defs.QUEST_ITEMS[id].text);}
      primary.riskSummary=[primary.riskSummary,...notes].filter(Boolean).join('；');
    }
    primary.label=scene.act;
    primary.outcome=scene.yes;
    if(step<3){
      const item=primary.questItem;
      primary.text=`取得「${defs?.QUEST_ITEMS?.[item]?.name||item}」。不支付灵石。`;
    }
    leave.label=scene.leave;
    leave.outcome=scene.no;
    e.choices=[primary,leave];
    e.description=e.story[0];
    previousOutcome(e,state,boss,step);
    e.bossEditorialRevision=REVISION;
    return e;
  }
  const EVENT_IDS=Object.keys(CHAINS).flatMap(id=>[1,2,3].map(step=>`boss_${id}_${step}`));
  const api={REVISION,CHAINS,EVENT_IDS,rewrite};
  root.NightStoryBossesV5=api;
  if(typeof module!=='undefined'&&module.exports)module.exports=api;
})(typeof globalThis==='object'?globalThis:window);
</script>

      if (state.reward.relicPending) { note('请先选择一件精英珍藏。'); return false; }
      if (idOrNull !== null && !state.reward.cards.includes(idOrNull)) return false;
      if (idOrNull !== null) state.player.deck.push(makeCard(idOrNull));
      if(state.battle?.storyEncounter?.resumeRest&&state.interruption){resumeInterruptedRest();}else advance();
      emit();
      return true;
    }
    function chooseRelic(id) {
      const reward = state.reward;
      if (state.screen !== 'reward' || !reward || !reward.relicPending || !reward.relicChoices.includes(id)) return false;
      if (!addRelic(id)) return false;
      reward.relic = id;
      reward.relicPending = false;
      log(`获得精英珍藏「${RELICS[id].name}」。`);
      note(`已获得「${RELICS[id].name}」：${RELICS[id].text} 现在选一张卡牌或跳过。`);
      emit();
      return true;
    }
    function rerollReward() {
      const reward = state.reward;
      if (state.screen !== 'reward' || !reward || state.rewardRerolls <= 0 || reward.rerolled) return false;
      reward.cards = rewardCards(state.battle.kind, reward.cards);
      reward.rerolled = true;
      state.rewardRerolls--;
      note('本局唯一的免费换牌已使用。新候选已固定，精英珍藏不会重抽。');
      emit();
      return true;
    }
    function buyCard(index) {
      if (state.screen !== 'shop' || !state.shop || !Number.isInteger(index)) return false;
      const item = state.shop.cards[index];
      if (!item || item.bought || state.player.gold < 35) return false;
      item.bought = true;
      state.player.gold -= 35;
      state.player.deck.push(makeCard(item.id));
      note(`花费 35 灵石，购得「${CARDS[item.id].name}」。`);
      emit();
      return true;
    }
    function removeCard(uid) {
      if (state.screen !== 'shop' || !state.shop || state.shop.removed || state.player.gold < 40 || state.player.deck.length <= 5) return false;
      const index = state.player.deck.findIndex(card => card.uid === uid);

      const [card] = state.player.deck.splice(index, 1);

    function rest(shouldHeal) {
      if (state.screen !== 'rest') return false;
      if(shouldHeal==='cleanse'&&!state.player.affliction.active)return false;
      const cleansing=shouldHeal==='cleanse',amount = cleansing?heal(6):shouldHeal ? heal(18) : 0;
      if(cleansing)state.player.affliction.suppressed=Math.max(4,state.player.affliction.suppressed||0);
      advance();
      note(cleansing?`静息恢复 ${amount} 生命，经脉中的寒意暂时平复。第 ${state.floor} 段已开放。`:shouldHeal ? `休息结束，恢复 ${amount} 点生命。第 ${state.floor} 段已开放。` : `离开月庭。第 ${state.floor} 段已开放。`);
      emit();

    function fox(sign) {
      if (state.screen !== 'fox') return false;
      if (sign && (state.player.maxHp <= 8 || hasRelic('fox'))) return false;
      if (sign) {
        state.player.maxHp -= 8;
        state.player.hp = Math.min(state.player.hp, state.player.maxHp);
        state.player.relics.push('fox');
      }
      advance();
      note(sign ? '狐契已签：本局最大生命减少 8，获得一次免死。' : '你婉拒了交易，没有付出任何代价。');
      emit();
      return true;
    }

    function chooseTreasure(preferred) {
      if (preferred && !hasRelic(preferred)) return preferred;
      const pool = TREASURE_RELICS.filter(id => !hasRelic(id));
      return pool.length ? pool[rand(pool.length)] : null;
    }
    function choiceAvailable(choice, p) {
      if(choice.requiresHehuanItem&&!p.questItems.includes(choice.requiresHehuanItem))return false;
      if(choice.requiresAffliction&&!p.affliction.active)return false;
      if(choice.herbCost&&(p.inventory?.herb||0)<choice.herbCost)return false;
      if ((choice.goldCost || 0) > p.gold) return false;
      if ((choice.hpCost || 0) > 0 && p.hp <= choice.hpCost) return false;
      if ((choice.maxHpCost || 0) > 0 && p.maxHp - choice.maxHpCost < 5) return false;
      if (choice.removeBasic && (p.deck.length <= 5 || !p.deck.some(card => ['C01','C02','S01','S02','F01','F02','H01','H02','J01','J02'].includes(card.id)))) return false;
      return true;
    }
    function canChooseEvent(index){const e=state.event;if(state.screen!=='event'||!e||e.resolved||!Number.isInteger(index))return false;const c=e.choices[index];return !!c&&!c.locked&&choiceAvailable(c,state.player);}
    function finishChoices(choices, p) {
      const available = choices.map(choice => ({ ...choice,
        text: choice.maxHpCost ? `${choice.text} 最大生命须至少保留 5。` : choice.text,
        disabled: !choiceAvailable(choice, p) }));
      if (available.every(choice => choice.disabled)) available.push({
        label: '无力交易 · 安然离开', text: '不支付任何代价，也不获得奖励。', disabled: false,
        outcome: '你轻轻摇头，收好空空的袖袋。封域的怪事没有追上来，只留下一盏微光，照着你继续深入封域。'
      });
      return available;
    }
    function applyEventChoice(choice, p) {
      const received = [];
      if(choice.nextDriveAid&&state.character==='mechanist'){state.journey.nextDriveAid=(state.journey.nextDriveAid||0)+choice.nextDriveAid;received.push('下场开战额外'+choice.nextDriveAid+'驱动，一次');}
      if(choice.mechanistItemsRemove&&state.character==='mechanist')p.questItems=p.questItems.filter(id=>!choice.mechanistItemsRemove.includes(id));
      if(choice.hehuanFlags&&state.character==='hehuan')Object.assign(hehuanJourney().flags,choice.hehuanFlags);
      if(choice.hehuanItemsRemove)for(const item of choice.hehuanItemsRemove)p.questItems=p.questItems.filter(id=>id!==item);
      if(choice.returnFactionTools){state.player.questItems=state.player.questItems.filter(id=>!['split_nail','heat_tongs'].includes(id));factionState().invalid.split_nail=true;factionState().invalid.heat_tongs=true;received.push('已退还取谱器物');}
      if(choice.herbCost){p.inventory.herb-=choice.herbCost;received.push(`回春草 −${choice.herbCost}`);}
      if (choice.goldCost) {
        p.gold -= choice.goldCost;
        received.push(`灵石 −${choice.goldCost}`);
      }
      if (choice.hpCost) {
        p.hp = Math.max(1, p.hp - choice.hpCost);
        received.push(`生命 −${choice.hpCost}`);
      }
      if (choice.maxHpCost) {
        p.maxHp = Math.max(5, p.maxHp - choice.maxHpCost);
        p.hp = Math.min(p.hp, p.maxHp);
        received.push(`最大生命 −${choice.maxHpCost}`);
      }
      if (choice.removeBasic) {
        const index = p.deck.findIndex(card => ['C01','C02','S01','S02','F01','F02','H01','H02','J01','J02'].includes(card.id));
        if (index >= 0) {
          const [card] = p.deck.splice(index, 1);
          received.push(`移除「${CARDS[card.id].name}」`);
        }
      }
      if (Object.prototype.hasOwnProperty.call(choice, 'relic')) {
        if (addRelic(choice.relic)) received.push(`秘宝「${RELICS[choice.relic].name}」`);
        else {
          const fallback = choice.fallbackGold || 60;
          p.gold += fallback;
          received.push(`秘宝已齐，改得 ${fallback} 灵石`);
        }
      }
      for (const id of choice.cardIds || []) {
        p.deck.push(makeCard(id));
        received.push(`卡牌「${CARDS[id].name}」`);
      }
      if (choice.heal) {
        const before = p.hp;
        p.hp = Math.min(p.maxHp, p.hp + choice.heal);
        received.push(`生命 +${p.hp - before}`);
      }
      if (choice.goldGain) {
        p.gold += choice.goldGain;
        received.push(`灵石 +${choice.goldGain}`);
      }
      for (const grant of choice.itemGrants || []) {
        const count=grant.count||grant.amount||1;
        if (expedition.grantItem(grant.id,count)) received.push(`${EXPEDITION.ITEMS[grant.id].name} ×${count}`);
      }
      if(choice.weapon && WEAPONS[choice.weapon]) { if(!p.weaponInventory.includes(choice.weapon)){p.weaponInventory.push(choice.weapon);received.push(`剑器「${WEAPONS[choice.weapon].name}」`);}else if(choice.duplicateWeaponGold){p.gold+=choice.duplicateWeaponGold;received.push(`已有剑器，改得${choice.duplicateWeaponGold}灵石`);} }
      if(choice.powerGain) {const before=p.power;p.power=Math.min(3,p.power+choice.powerGain);received.push(`本源 +${p.power-before}`);}
      if(choice.afflict){p.affliction={active:true,revealed:false,ticks:0,suppressed:0,source:'tainted_mercy'};}
      if(choice.cureAffliction){cureAffliction();received.push('缠脉毒根除');}
      if(choice.learnDemonic||(choice.cardIds||[]).some(id=>id.startsWith('D'))){p.path.learned=true;}
      if(choice.questItem&&QUEST_ITEMS[choice.questItem]){
        if(!p.questItems.includes(choice.questItem))p.questItems.push(choice.questItem);
        p.path.protected=p.questItems.includes('clearheart_jade');received.push(QUEST_ITEMS[choice.questItem].name);
      }
      return received;
    }

  function restScreen(){const p=game.state.player,amount=Math.min(18,p.maxHp-p.hp),a=afflictionStatus();return `<section class="event-layout">${encounterArt('rest','栖月温泉','息','且将金铃，暂寄雨声。')}<div class="event-copy"><div class="eyebrow">A MOMENT OF PEACE / 月下歇息</div><h2>且听，一夜雨声</h2><p class="story">隔绝黑雾的阵灯仍在燃烧。<br>${heroQuote('你将金铃拢入掌心，暂且不问来路。','你将长剑横置膝上，霜声渐息。')}</p><p class="description">当前生命 ${p.hp} / ${p.maxHp}。<br>此处只能停留一次，歇息后便会继续前行。</p><div class="event-actions">${btn('rest',`静坐调息 · 恢复 ${amount} 点生命<small>恢复不超过最大生命；随后继续当前路径</small>`,'btn primary','data-heal="true"')}${a.revealed&&a.active?btn('rest-cleanse','静息调脉 · 恢复 6 生命<small>调匀经脉，暂缓异样；随后继续前行</small>','btn cleanse-choice'):''}${btn('rest','直接离开 →','btn ghost','data-heal="false"')}</div></div></section>`;}

  function endingScreen(win){const s=game.state,p=s.player,hiddenWon=win&&s.battle?.enemy.id==='feiye',sovereign=heroId()==='sovereign',v5Ending=globalThis.NightStoryV5?.ending?.(s)||[];return `<section class="ending"><div class="ending-copy"><div class="eyebrow">${win?'THE ABYSS REMAINS / 封域初探完结':'THE FOG REMEMBERS / 探查未归'}</div><h2>${hiddenWon?'月后的名字，终于落定':win&&sovereign?'散落之身，归于一人':win?'雾未散，人已归':'此行，未能归'}</h2><p class="story">${v5Ending.length?v5Ending.map(esc).join('<br>'):win&&hiddenWon?`那道身影放下指尖的月光。她没有说认输，只报出了自己的名字。<br>绯夜已解锁，可返回选角开启她自己的旅程。`:win&&sovereign?`旧影散去，三处失落的力量回到掌心。<br>变心者的誓言已经结束，镜里的声音也终于安静。<br>“现在，轮到雾外的人还账了。”`:win?`${esc(s.result?.enemy||'深渊之主')}倒下，七境深处的裂隙终于沉寂。<br>你带回一枚残缺的实验铭牌，各方已经等在雾外。<br>“${heroQuote('价码，得重新谈。','人未找全。我会再来。')}”<br>寒渊的真相，仍有一半藏在黑雾里。`:`你倒在第${chineseNumber(s.result?.floor||s.floor)}段，败于${esc(s.result?.enemy||'封域异物')}。<br>黑雾再次合拢，留下无人认领的脚印。<br>下一次，换一条路，或换一种出牌的方式。`}</p><div class="ending-stats"><span>生命 <b>${p.hp}</b> / ${p.maxHp}</span><span>灵石 <b>${p.gold}</b></span><span>牌组 <b>${p.deck.length}</b> 张</span><span>战胜 <b>${s.stats.battles}</b> 场</span><span>最高连招 <b>${s.stats.maxCombo||0}</b></span><span>最强一击 <b>${s.stats.maxHit||0}</b></span></div>${hehuanEndingMarkup(s)}<div class="ending-relics">${relics(p.relics)}</div>${factionFeedback(s.battle,true)}<div class="ending-journey"><h3>雾中结下的因缘</h3>${relationsMarkup()}${journalMarkup(3)}${btn('journal','翻看完整行旅手记','btn ghost small')}</div><div class="ending-route">本次路线：${s.history.map(h=>esc(h.name||nodes[h.type]?.[1]||h.type)).join(' → ')}</div><div class="actions">${btn('start',`以${esc(hero().name)}重新出发 · ${esc(STARTERS[s.starter]?.name||s.starter)}`,'btn primary')}${btn('title','返回选角','btn ghost')}${btn('deck','查看最终牌组','btn ghost')}${hiddenWon?btn('profile','查看解锁凭证','btn ghost'):''}</div><p class="note">重新开始将清空本局生命变化、灵石、牌组增删、遗物与路线进度。</p></div>${portrait(heroKind())}</section>`;}
  function render(){if(!game||holdRender)return;rememberMapScroll();if(game.state.screen==='title'&&!isUnlocked(chosenCharacter)){chosenCharacter='assassin';starter='mark';}if(game.state.screen!=='title'){starter=game.state.starter;chosenCharacter=game.state.character||chosenCharacter;}hidePreview();disposePortraits(app);renderAudioToggle();renderHud();const previous=lastScreen;lastScreen=game.state.screen;document.body.dataset.screen=lastScreen;document.body.dataset.opening=lastScreen==='title'?openingScreen:'';document.body.dataset.character=heroId();document.body.dataset.fallen=String(isFallen());const pages={title:titleScreen,arrival:arrivalScreen,map:mapScreen,threshold:thresholdScreen,battle:battleScreen,reward:rewardScreen,rest:restScreen,fox:foxScreen,event:eventScreen,cave:caveScreen,shop:shopScreen,victory:()=>endingScreen(true),defeat:()=>endingScreen(false)};app.innerHTML=(pages[game.state.screen]||titleScreen)();if(game.state.screen==='map')requestAnimationFrame(focusCurrentMap);if(modal)renderModal();const logs=document.getElementById('recent-logs');if(logs)logs.scrollTop=logs.scrollHeight;if(previous!==lastScreen)screenCue(lastScreen);}
  function renderAudioToggle(){const state=audio()?.getState?.()||{muted:false,volume:.3},el=document.getElementById('audio-nav');if(el){el.textContent=state.muted?'声音：关':'声音：开';el.setAttribute('aria-pressed',String(state.muted));}}
  function screenCue(screen){if(screen==='reward')audio()?.playCue?.(game.state.reward?.cards.some(id=>CARDS[id].rarity==='rare')?'rareReveal':'rewardReveal');if(['fox','rest','shop','event','cave'].includes(screen)){const id=screen==='event'?game.state.event.id:screen;lastEncounter=id;audio()?.playEncounter?.(id);}if(screen==='victory')audio()?.playCue?.('win');if(screen==='defeat')audio()?.playCue?.('death');}
  function openModal(kind,pile){if(window.uiBusy)return;selected=null;modal={kind,pile};render();modalRoot.querySelector('button')?.focus();}
  function closeModal(){disposePortraits(modalRoot);modal=null;modalRoot.innerHTML='';render();}
  function rules(){return `<div class="rules"><section><h3>天工机关师 · 陆听澜</h3><p>48种独立机关技，三具固定机体同时在场两具。驱动上限6，首回合2，第二回合起自然获得1。机匣操作不依赖抽牌：展开、换入、检修、充能各1灵力，收回0灵力；指令2驱动，过载3驱动且先付4耐久。</p><p>最后主动执行者负责接直接攻击；运转和用药不改变护卫。机体先以自身护盾和耐久承伤，溢出转给本体。损坏反馈3生命、无视护盾；毒、追索印和封灵仍作用于本体。收回不修复，过载退场本回合不能重返，损坏修好后要等下一个玩家回合才可展开。下场三机恢复完整。</p><p>回合末按两个机位顺序免费运转：承山自护，鸣镝射击，拾萤供驱动；校准只强化相应机体运转。机匣卡的执行者、接招者、驱动和耐久风险在确认前预览。随身装备可在战外切换免费首发。</p></section><section><h3>灵力与回合</h3><p>玩家先手。每回合先清空旧护盾，结算毒，再恢复基础 3 灵力、抽 5 张牌。手牌上限 10，溢出进入弃牌堆。</p><p>攻击／施加状态的牌先点卡牌，再点敌人；再次点同牌或 Esc 取消，不扣灵力。无目标牌点击即用。动作结算期间暂不能重复出牌。</p><p>结束回合弃掉剩余手牌并清除临时蓄势，敌人行动不会提前预告；实际招式与伤害在动作和战斗记录中显示。敌人旧护盾在其自己回合开始时清空。</p></section><section><h3>影契刺客 · 夜铃</h3><p>「猎印」即卡牌上的猎印，最多 5 层，跨回合保留；窥隙铺垫，扑杀兑现。只有写明互动的牌受到猎印影响。</p><p>所有攻击牌第一段的附加增伤合计最多 ${NightPact.BALANCE?.firstHitBonusCap||8}；牌面基础伤害与按猎印、剑意计算的招式伤害分别结算。</p><p>「连段」用低费、抽牌和返还灵力延长出牌。候机只增强下一张攻击的第一段，连爪每爪独立结算。</p><p>「流血」由特定爪技施加，最多 7 层。敌方回合开始时，按每层 3% 概率触发一次，等概率损失 1 至当前层数的生命，无视护盾；7 层即 21% 几率损失 1—7 生命。创口跨回合保留，也能与猎印、连击和汲取招式互动。血契自损无视护盾，生命不足会死亡。</p></section><section><h3>霜华剑修 · 沈霜白</h3><p>正道剑术 ${catalogueEntries('sword').length}种，魔修功法另列。御剑回合末自动攻击后减1层；剑阵与剑心提供跨回合护持，天地一剑可收束御剑与剑意。</p><p>「剑意」上限 8，跨回合保留。剑诀按各自说明蓄积或消耗剑意；没有写消耗的剑招不会自动扣层。</p><p>「霜寒」上限 10，跨回合保留，敌方回合结束后减少 1 层。5 层起降低行动力：每段攻击伤害 −1；10 层时有 10% 几率无法行动。特定净化招式能清除霜寒。精英与 Boss 需要两张施霜技能才能叠加 1 层，连击按一张技能计数。</p><p>霜寒减伤按实际结算生效；满层时冻结概率在状态说明中显示，结束回合后只判定一次。冰镜、三叠泉与碎霜可围绕寒意衔接，具体以牌面为准。</p></section><section><h3>合欢执事 · 晏绮罗</h3><p>${catalogueEntries('hehuan').length}种双模式技能，均可立即使用或藏进两个纱位。观息只辨攻击与否。幻席保留原藏招并复制；欲擒故纵撤下最后一张藏招并退回实际费用；偷梁换柱交换顺序。触发前效果、敌人整招、触发后效果依次结算，死亡停止后续治疗。</p></section><section><h3>伤害、牌堆与秘宝</h3><p>普通伤害先扣护盾再扣生命；自损和毒无视护盾。毒在持有者回合开始造成当前层数的直接生命伤害，随后减 1。</p><p>消耗牌本场不再抽回，下场恢复。商店删除指定实例，本局永久移除。抽牌堆空时重洗弃牌，正在结算的牌不会抽回自己。</p><p>遗物与秘宝的完整效果可点击顶栏查看。精英珍藏先二选一，再选卡；同一份战利只会发放一次。休息恢复 ${NightPact.BALANCE?.restHeal||18}，狐契以 8 最大生命换一次免死。</p></section><section><h3>包裹与未知洞府</h3><p>草药、丹药收入包裹后可随时查看。草药小幅疗伤，九转还元丹补满生命，解毒丹祛除余毒，战丹强化本场或下一场攻击；完整效果写在物品上。</p><p>玩家回合每回合只能服用一件，且不消耗灵力；敌方行动与动画结算中不能用药。战后仍保留未用物品，重新开始会清空。无效果时不会消耗。</p><p>洞府里可能有守卫、药草、遗留丹药或秘宝。入口不会提前揭示所藏之物；一旦探索，结果便不会重抽。击败守卫后才取得它看守的宝物。</p></section><section><h3>器灵与归月</h3><p>战斗后获得历练，提高本局灵识等级。剑匣中的装备只能在战斗与战利结算之外更换。高阶器灵可提前佩带；若灵识尚浅，器中躁动也会随之而来。可点开随身兵刃，察看此刻的气息。</p><p>绯夜解锁后可使用独立牌组。魂息上限 6，按具体牌面积蓄和消耗；归身之力来自专属道路上的交锋，每层强化一张攻击牌的第一段，最多 3 层。解锁只保存可选角色，本局养成仍在重开时清空。</p></section><section><h3>封域路线与异闻</h3><p>本局逐境深入，共 ${chineseNumber(regions().length)} 境、${chineseNumber(totalFloors())} 段。每境十段，第十段迎战镇境 Boss。走完当前地域，才会看见下一境；只显示当前一境的路线。地标由真实连线连接，不能跳段、返回，或进入未连接的分支。</p><p>每境至少 40 处地标，第一段位于画面底部，第十段镇境之敌位于上方。向上滚动可察看前路。连线与下方路线卡使用相同状态，每境独立抽取路线样式，只有亮起且相连的地标能进入。</p><p>异闻包含数段人物的连续故事：初逢、重遇、余波会沿行程逐渐展开。有人会报答援手，有人会带来麻烦，也有人觊觎你的宝物；戒备、交易和应战会改变后果。行旅手记只记录你已经知道的事，战斗与选择都只能结算一次。全程离线，本局不存档；角色解锁会单独保存。</p></section></div>`;}
  function worldLore(){return `<div class="world-lore"><p class="world-prologue">寒渊原是群山之间的采灵之地。玄烬教试图从地底引出一段不属于此世的灵性，却在最后一夜被仪式反噬。黑雾封住整片区域，山路和建筑渐渐失去原本的形状。外界的占卜、传讯与窥视均告失效，只能让活人走进去。</p><div class="faction-grid"><article><i>剑</i><h3>太微剑宗</h3><p>受托探查并寻找失踪弟子。有人只想救人，也有人想替正道先封存禁术。</p></article><article><i>烬</i><h3>玄烬残众</h3><p>回收实验记录与失控造物；想补救的人和想继续实验的人同行，却互不信任。</p></article><article><i>灯</i><h3>千灯商盟</h3><p>以补给换取遗物、记忆与情报。他们以护命灵符抵御黑雾，认定险地的丹药与遗器能卖出数倍价码；问路要价，救货也要先结灵石。</p></article><article><i>纱</i><h3>合欢宗</h3><p>魔门外堂负责交涉、收账和接应。宗内有人互惠修行，也有长老将弟子交给祭仪；晏绮罗来追问这笔交易。</p></article><article><i>影</i><h3>夜契盟与散修</h3><p>受雇寻物，或为自身执念而来。身上的契约、未偿的债与想带走的东西各不相同。</p></article></div><p class="note">雾外无人看清寒渊全貌。同行者未必同心，偶遇者也未必无害；你能带回多少真相，取决于你愿意走进哪些地方。</p></div>`;}
  function bossData(id){const boss=globalThis.NightSeven?.BOSSES?.[id]||(NightPact.BOSS_QUESTS?.[id]?ENEMIES[id]:null);return boss?{...boss,lore:[boss.lore,NightPact.BOSS_LORE?.[id]].filter(Boolean).join(' ')}:null;}
  function bossIds(){return Object.keys(NightPact.BOSS_QUESTS||{}).filter(id=>!['feiye','feiye_echo','retainer','heart','snake_ascended'].includes(id)||isUnlocked('sovereign')||game.state.history?.some(h=>h.enemyId===id)||game.state.battle?.enemy.id===id);}
  function intentSummary(intent){const parts=[];if(intent.clearMark)parts.push('清除猎印');if(intent.clearChill)parts.push('清除霜寒');if(intent.clearBleed)parts.push('清除流血');if(intent.heal)parts.push(`恢复 ${intent.heal} 生命`);if(intent.block)parts.push(`护盾 ${intent.block}`);const hits=intent.hits||[];if(hits.length)parts.push(hits.length===1?`攻击 ${hits[0]}`:`${hits.length} 段攻击 × ${hits.join(' / ')}`);if(intent.poison)parts.push(`毒 ${intent.poison} 层`);if(intent.playerMark)parts.push(`对你施加 ${intent.playerMark} 层追索印`);if(intent.counter)parts.push(`反击 ${intent.counter}`);if(intent.energyPenalty)parts.push(`下回合灵力 −${intent.energyPenalty}`);if(intent.drawPenalty)parts.push(`下回合少抽 ${intent.drawPenalty}`);return parts.join(' · ')||intent.text||'气息未定';}
  function bossGallery(){return `<div class="boss-gallery">${bossIds().map(id=>{const boss=bossData(id);return `<button class="boss-gallery-card" data-action="boss-detail" data-boss="${esc(id)}">${portrait(id,{player:false})}<div><small>${({early:'雾外守关',middle:'封域深处',final:'终极之敌'})[boss.tier]||'镇境之敌'}</small><h3>${esc(boss.name)}</h3><p>${esc(boss.title||'')}</p><span>展开人物画卷 →</span></div></button>`;}).join('')}</div>`;}
  function bossDetail(id){const boss=bossData(id);if(!boss)return '<p class="muted">这卷人物志尚未展开。</p>';return `<article class="boss-dossier" data-boss="${esc(id)}">${portrait(id,{player:false})}<div class="boss-dossier-copy"><div class="eyebrow">${esc(boss.title||'封域之主')}</div><h3>${esc(boss.name)}</h3><p class="boss-biography">${esc(boss.lore||'雾中的故事，尚待亲眼见证。')}</p>${(boss.quotes||[]).map(quote=>`<blockquote>“${esc(quote.replace(/^[“”]|[“”]$/g,''))}”</blockquote>`).join('')}${boss.passive?`<div class="boss-trait"><b>战斗气质</b><p>${esc(boss.passive)}</p></div>`:''}<p class="note">旧事可以循迹寻访。对方将如何出手，需要在交锋中亲眼见证。</p><div class="actions">${btn('bosses','返回人物志','btn ghost small')}</div></div></article>`;}
  function bossBattleLore(enemy){const visitor=NightPact.ENEMY_FACTIONS?.DEFS[enemy.id];if(visitor)return `<aside class="boss-battle-lore"><div><span>眼前的来客</span><p>${esc(visitor.intro)}</p>${game.state.battle?.factionCause?`<p class="event-dialogue">${esc(game.state.battle.factionCause)}</p>`:''}</div></aside>`;const boss=bossData(enemy.id);return boss?`<aside class="boss-battle-lore"><div><span>${esc(boss.title||'镇境之敌')}</span><p>“${esc(boss.quotes?.[0]||'雾深处，并无归途。')}”</p></div>${btn('boss-detail','读这段旧事','btn ghost small',`data-boss="${esc(enemy.id)}"`)}</aside>`:'';}
  function renderModal(){
    const s=game.state;let title='',hint='',body='';
    if(modal.kind==='bosses'){title='封域人物志';hint='镇境之人与雾后旧影，各有执念与未了的旧事。';body=bossGallery();}
    if(modal.kind==='boss-detail'){const boss=bossData(modal.pile);title=boss?.name||'镇境人物';hint=boss?.title||'';body=bossDetail(modal.pile);}
    if(modal.kind==='bag'){title='随身包裹';hint='旅途中采得的药草与丹药。未用的物品会随你进入下一处地标。';body=bagContents();}
    if(modal.kind==='equipment'){title='随身装备';hint=`灵识等级 ${s.player.level||1} · 历练 ${s.player.xp||0}。只在战斗与战利结算之外换器；装备跟随本局，重开清空。`;body=`${heroId()==='mechanist'?machinePreset():''}<div class="weapon-grid">${(s.player.weaponInventory||[]).map(id=>weaponCard(id)).join('')}</div>${wardrobe()}`;}
    if(modal.kind==='status'){const detail=statusDetail(modal.pile);title=detail.title;body=`<section class="status-detail" data-status="${esc(modal.pile)}">${symbol(detail.key)}<div><p>${esc(detail.text)}</p>${detail.equipment?`<div class="actions">${btn('equipment','打开随身装备','btn ghost')}</div>`:''}</div></section>`;}
    if(modal.kind==='profile'){title='留存解锁凭证';hint='只保存角色解锁，不保存本局进度。';body=profileSettings();}
    if(modal.kind==='rules'){title='玩法手札';hint='观察招式、选择路径，再决定何时出手。';body=rules();if(!isUnlocked('sovereign'))body=body.replace(/<p>绯夜解锁后[\s\S]*?<\/p>/,'');}
    if(modal.kind==='journal'){title='行旅手记 · 旧事有回声';hint='只记已经发生的选择与眼前的人，不预写任何人的结局。';body=relationsMarkup()+journalMarkup()+`<section class="faction-fieldnotes"><h3>亲见的来客</h3>${Object.entries(game.state.journey.factions?.seen||{}).map(([id,seen])=>`<article><h4>${esc(seen.name)}</h4><p>${esc(seen.intro||'当时未能看清来路。')}</p>${(seen.notes||[]).map(n=>`<blockquote><small>第${n.floor}段 · 当时留下的记录</small><p>${esc(n.text)}</p></blockquote>`).join('')}<p>亲眼见过：${seen.abilities.map(esc).join('、')||'尚未见其出手'}</p></article>`).join('')||'<p>尚无此类见闻。</p>'}</section>`;}
    if(modal.kind==='world'){title='寒渊封域 · 各怀所求';hint='禁术反噬之后，没有一方愿意空手离开。';body=worldLore();}

  function soundSettings(){const state=audio()?.getState?.()||{volume:.3,muted:false};return `<section class="sound-settings"><h3>剑鸣与妖术之声</h3><p>刺客的爪击、火符与血契，剑修的剑鸣、碎冰与霜寒，按实际结算逐段发声。</p><div class="sound-controls">${btn('audio-toggle',state.muted?'开启声音':'静音','btn ghost',`aria-pressed="${state.muted}"`)}<label for="audio-volume">总音量 <b id="volume-value">${Math.round((state.volume??.3)*100)}%</b></label><input id="audio-volume" data-action="volume" type="range" min="0" max="100" value="${Math.round((state.volume??.3)*100)}" aria-label="总音量"></div><div class="audio-previews">${(heroId()==='mechanist'?[['J01','牵丝'],['J17','注灵'],['J28',CARDS.J28?.name||'机关共鸣'],['J48',CARDS.J48?.name||'万机归流']]:heroId()==='hehuan'?[['H01','撩弦'],['H03','请君近前'],['H09','解带'],['H12','满堂红']]:heroId()==='sovereign'?[['F01',CARDS.F01?.name||'摄魂'],['F04',CARDS.F04?.name||'归潮'],['F09',CARDS.F09?.name||'噬念'],['F12',CARDS.F12?.name||'万相归一']]:heroId()==='sword'?[['S01','霜锋'],['S05','寒芒'],['S12','霜天壁'],['S16','万川归寂']]:[['C01','爪击'],['C15','妖火符'],['C16','残月'],['C02','敛息'],['C13','血契'],['C24','狂爪']]).map(([id,name])=>btn('audio-preview','试听 · '+name,'btn ghost small',`data-id="${id}"`)).join('')}</div><p class="note">浏览器首次点击后启用声音。静音设置仅作用于当前打开的页面。</p></section>`;}

  document.addEventListener('toggle',event=>{if(event.target.id==='starter-tactics'&&event.target.isConnected)tacticsExpanded=event.target.open;},true);
  document.addEventListener('input',event=>{if(event.target.matches('[data-action="music-volume"]')){const value=globalThis.NightMusic?.setVolume(Number(event.target.value)/100),label=document.getElementById('music-volume-value');if(label)label.textContent=Math.round(value*100)+'%';return;}if(event.target.matches('[data-action="volume"]')){const value=Number(event.target.value)/100;audio()?.setVolume?.(value);const output=document.getElementById('volume-value');if(output)output.textContent=Math.round(value*100)+'%';renderAudioToggle();}});
  document.addEventListener('pointerover',event=>{const el=event.target.closest('.card[data-preview]');if(el&&!el.contains(event.relatedTarget))showPreview(el);});
  document.addEventListener('pointerout',event=>{const el=event.target.closest('.card[data-preview]');if(el&&!el.contains(event.relatedTarget))hidePreview();});
  document.addEventListener('focusin',event=>showPreview(event.target.closest('.card[data-preview]')));
  document.addEventListener('focusout',hidePreview);
  window.addEventListener('scroll',hidePreview,true);
  // beforeunload is cancellable after user interaction; pagehide is best-effort only.
  // No progress is saved and no request is sent by either lifecycle handler.
  function guardUnfinishedRun(event){
    if(!game||['title','victory','defeat'].includes(game.state.screen))return;
    event.preventDefault();event.returnValue='';
  }
  window.addEventListener('beforeunload',guardUnfinishedRun);
  window.addEventListener('pagehide',guardUnfinishedRun);
  window.addEventListener('pagehide',()=>{disposePortraits(document);});
  document.addEventListener('keydown',event=>{if(window.uiBusy)return;if(event.key==='Enter'&&event.target.id==='redemption-key'){event.preventDefault();redeemKey();return;}if(event.key==='Escape'){hidePreview();if(modal)closeModal();else if(selected){selected=null;syncTargetSelection();}}if(event.key==='Tab'&&modal){const buttons=[...modalRoot.querySelectorAll('button:not(:disabled),[tabindex="0"]')],first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
  game=makeGame();window.game=game;window.renderGame=render;render();
})();
</script>
</body></html>
