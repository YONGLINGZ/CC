.event-orbit:after{inset:25%;transform:rotate(-18deg)}

  function mapScreen(){

  function shopScreen(){const s=game.state,p=s.player,shop=s.shop;return head('THE NIGHT MARKET / 无名夜市','钱货两清，不问来处','非基础牌每张 35 金币，每件商品每次到访仅能购买一次。',`可用金币 ${p.gold}`)+`<div class="shop-layout">${encounterArt('shop','夜市珍阁','市','金铃作响，钱货两清。')}<aside class="shop-note"><h3>断契 · 删牌</h3><p>永久移除本局牌组中的一个指定实例。<br>牌组最少保留 5 张。</p><p>每次到访仅一次，价格 40 金币。</p>${btn('remove-panel',shop.removed?'本次删牌已使用':'40 金币 · 选择要移除的牌','btn ghost',shop.removed||p.gold<40||p.deck.length<=5?'disabled':'')}<div class="reason">${shop.removed?'已完成本次服务':p.deck.length<=5?'牌组已达 5 张下限':p.gold<40?'金币不足 40':'选中具体实例后才扣款'}</div></aside><div class="shop-goods">${shop.cards.map((c,i)=>`<div class="shop-item">${cardMarkup(c.id)}${btn('buy',c.bought?'已售出':'35 金币 · 购买',`btn ${!c.bought&&p.gold>=35?'primary':'ghost'}`,`data-index="${i}" ${c.bought||p.gold<35?'disabled':''}`)}<div class="reason">${c.bought?'已加入本局牌组':p.gold<35?'金币不足 35':'下场战斗洗入牌堆'}</div></div>`).join('')}</div></div><div class="shop-bottom"><span>商品进入时固定，查看牌组不会刷新。</span>${btn('leave-shop','离开商店 →','btn primary')}</div>`;}
  function endingScreen(win){const s=game.state,p=s.player;return `<section class="ending"><div class="ending-copy"><div class="eyebrow">${win?'THE FIRST PACT ENDS / 一幕终':'THE TOWER REMEMBERS / 夜契未尽'}</div><h2>${win?'铃响，夜将明':'此夜，未能归'}</h2><p class="story">${win?'绛鳞散落，契文裂开一道微光。<br>“原来我交出去的，不只是一段记忆。”<br>你推开楼顶的门。第一夜，到此为止。':`你倒在第${cn[(s.result?.floor||s.floor)-1]}层，败于${esc(s.result?.enemy||'楼中妖异')}。<br>愿望有价，命火易熄。<br>下一次，换一种出牌的方式。`}</p><div class="ending-stats"><span>生命 <b>${p.hp}</b> / ${p.maxHp}</span><span>金币 <b>${p.gold}</b></span><span>牌组 <b>${p.deck.length}</b> 张</span><span>战胜 <b>${s.stats.battles}</b> 场</span><span>最高连契 <b>${s.stats.maxCombo||0}</b></span><span>最强一击 <b>${s.stats.maxHit||0}</b></span></div><div class="ending-relics">${relics(p.relics)}</div><div class="ending-route">本次路线：${s.history.map(h=>esc(h.name||nodes[h.type]?.[1]||h.type)).join(' → ')}</div><div class="actions">${btn('start','再入百妖楼 · 相同起手','btn primary')}${btn('title','返回首页，切换流派','btn ghost')}${btn('deck','查看最终牌组','btn ghost')}</div><p class="note">重新开始将清空本局生命变化、金币、牌组增删、遗物与地图进度。</p></div>${portrait(win?'cat':'snake')}</section>`;}
  function render(){if(!game||holdRender)return;hidePreview();disposePuppets(app);renderAudioToggle();renderHud();const previous=lastScreen;lastScreen=game.state.screen;document.body.dataset.screen=lastScreen;const pages={title:titleScreen,map:mapScreen,battle:battleScreen,reward:rewardScreen,rest:restScreen,fox:foxScreen,event:eventScreen,shop:shopScreen,victory:()=>endingScreen(true),defeat:()=>endingScreen(false)};app.innerHTML=(pages[game.state.screen]||titleScreen)();mountPuppets(app);if(modal)renderModal();const logs=document.getElementById('recent-logs');if(logs)logs.scrollTop=logs.scrollHeight;if(previous!==lastScreen)screenCue(lastScreen);}

  function rules(){return `<div class="rules"><section><h3>灵力与回合</h3><p>玩家先手。每回合先清空旧护盾，结算毒，再恢复基础 3 灵力、抽 5 张牌。手牌上限 10，溢出进入弃牌堆。</p><p>攻击／标记牌先点卡牌，再点敌人；再次点同牌或 Esc 取消，不扣灵力。无目标牌点击即用。动作表现期间暂不能出下一张牌。</p><p>结束回合弃掉剩余手牌并清除候机增伤，敌人执行展示的行动。敌人旧护盾在其自己回合开始时清空。</p></section><section><h3>三种构筑方向</h3><p>「标记」最多 5 层，跨回合保留；用窥隙铺垫，再用扑杀兑现。标记不自动增加所有攻击伤害。</p><p>「连段」用低费、抽牌和返还灵力延长出牌。候机只增强下一张攻击的第一段，连爪每爪独立结算。</p><p>「血契」以生命换抽牌、伤害或持续成长；自损无视护盾，生命不足会死亡。以回复或秘宝维持命火。</p></section><section><h3>护盾、反击与秘宝</h3><p>普通伤害先扣护盾再扣生命；自损和毒无视护盾。毒在持有者回合开始造成当前层数的直接生命伤害，随后减 1。</p><p>月髓、照魂镜、梦匣、无面神血与九命铃是奇遇中的强力秘宝，会明显改变整局节奏。完整效果以拾取时与顶栏遗物提示为准。</p><p>消耗牌本场不再抽回，下场恢复。商店删除的是指定实例，永久退出本局牌组。抽牌堆空时重洗弃牌，正在结算的牌不会抽回自己。</p></section><section><h3>迷雾、岔路与剧情奇遇</h3><p>每局生成四列、八层的分支路线，节点之间会横向交叉。亮起的节点只显示模糊气息；进入后才知道是战斗、商店、休息、精英还是奇遇。走过的节点会永久揭晓真名。</p><p>奇遇不再是即时买卖：先读前情，再选代价；选择后先看结局与所得，然后才继续上楼。六种异闻每局不重复，秘宝与稀有牌能带来明显收益。</p><p>三种开局各 10 张，合计 36 种卡牌。休息恢复 18 生命；狐妖收取 8 最大生命，交换一次免死。全程离线，暂无存档。导出 HTML 可另存完整游戏。</p></section></div>`;}
  function renderModal(){
    const s=game.state;let title='',hint='',body='';
    if(modal.kind==='rules'){title='玩法手札';hint='金铃既响，落牌有声。';body=rules();}
    if(modal.kind==='catalogue'){title=`妖契图鉴 · ${Object.keys(CARDS).length} 种`;hint='按编号排列；每张展示完整效果、费用、流派与稀有度。开局流派不会限制后续获得其他牌。';body=`<div class="deck-grid catalogue">${Object.keys(CARDS).map(id=>cardMarkup(id)).join('')}</div>`;}
    if(modal.kind==='settings'){title='战斗表现';hint='声音由本机合成，离线可用；动画速度与声音设置不改变任何结算规则。';body=`<div class="settings-options">${[['full','完整表现','猫妖蓄势扑击、残影、逐段命中与受击姿态。'],['fast','快速表现','更短的动作与数字停留，适合重复试玩。'],['reduced','减少动态','取消位移、晃动和闪烁，保留伤害数字与战损换装。']].map(([mode,name,text])=>btn('motion',`<b>${name}${motionMode===mode?' · 已选择':''}</b><small>${text}</small>`,'btn '+(motionMode===mode?'primary':'ghost'),`data-mode="${mode}"`)).join('')}</div><section class="portrait-settings"><h3>夜铃 · 动态立绘</h3><p>呼吸、目光与发尾随动作变化。生命降至 50% 与 25% 时，衣装和神态会留下不同战痕；恢复生命后会回到对应状态。</p><div class="actions">${btn('puppet-toggle',dynamicPortraits?'动态立绘：开':'动态立绘：关','btn ghost',`aria-pressed="${dynamicPortraits}"`)}${btn('portrait-gallery','展开三态画卷','btn ghost')}</div></section>${soundSettings()}`;}
    if(modal.kind==='portrait-gallery'){title='夜铃 · 三态画卷';hint='这里只预览立绘，不改变生命、战斗或本局进度。血量以当前最大生命的比例计算。';body=`<div class="damage-gallery">${[['normal','从容','生命高于 50%','衣袍齐整，金瞳含笑。'],['wounded','战痕','生命不高于 50%','外袍磨损，神色警觉。'],['critical','濒危','生命不高于 25%','衣袖破损，疲惫而不退。']].map(([stage,name,threshold,text])=>`<article class="damage-gallery-card" data-stage="${stage}">${portrait('cat',{previewStage:stage})}<div><span>${threshold}</span><h3>${name}</h3><p>${text}</p></div></article>`).join('')}</div><div class="actions">${btn('settings','返回声画设置','btn ghost')}</div>`;}
    if(modal.kind==='relics'){title='今夜的珍藏';hint='每件效果都已在本局生效；战斗中触发时会显示名称。';body=`<div class="relic-gallery">${s.player.relics.map(id=>relicCard(id)).join('')}</div>`;}
    if(['deck','remove'].includes(modal.kind)){const remove=modal.kind==='remove';title=remove?'选择一张牌，断去此契':'本局牌组';hint=remove?`40 金币，仅移除点击的一个实例。目前 ${s.player.deck.length} 张，至少保留 5 张。`:`共 ${s.player.deck.length} 张，起手流派「${STARTERS?.[s.starter]?.name||'标记'}」。每张是独立实例，战斗消耗不改变牌组。`;body=`<div class="deck-grid">${s.player.deck.slice().sort((a,b)=>a.id.localeCompare(b.id)).map(c=>cardMarkup(c,remove?'remove':'')).join('')}</div>`;}
    if(modal.kind==='pile'){const labels={draw:'抽牌堆',discard:'弃牌堆',exhaust:'本场消耗区'},cards=s.battle[modal.pile];title=`${labels[modal.pile]} · ${cards.length} 张`;hint=modal.pile==='draw'?'按卡号展示，实际抽取顺序隐藏；查看不会改变顺序。':modal.pile==='exhaust'?'本场不再抽回，下一场恢复。':'抽牌堆空时将这些牌洗回。';body=cards.length?`<div class="deck-grid">${cards.slice().sort((a,b)=>a.id.localeCompare(b.id)).map(c=>cardMarkup(c)).join('')}</div>`:'<p class="muted">这里暂时没有卡牌。</p>';}
    if(modal.kind==='log'){title='本场战斗记录';hint='按发生顺序展示，保留最近 90 条。';body=s.battle.logs.map(l=>`<p style="line-height:2">${esc(l)}</p>`).join('');}
    if(modal.kind==='restart'){title='重新开始这一夜？';body=`<p class="muted">当前进度将清空。保留当前起手流派重新开始，或返回首页切换流派。</p><div class="actions">${btn('start','重新开始','btn primary')}${btn('title','返回首页选流派','btn ghost')}${btn('close','继续当前游戏','btn ghost')}</div>`;}
    disposePuppets(modalRoot);modalRoot.innerHTML=`<div class="overlay" data-overlay="true"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-head"><div><h2>${title}</h2><p>${hint}</p></div>${btn('close','×','close','aria-label="关闭面板"')}</div>${body}</section></div>`;mountPuppets(modalRoot);
  }
  function soundSettings(){const state=audio()?.getState?.()||{volume:.3,muted:false};return `<section class="sound-settings"><h3>金铃与妖术之声</h3><p>36 张技能各有独立声纹，爪击、火符、月刃、护盾、标记与血契按实际结算逐段发声。</p><div class="sound-controls">${btn('audio-toggle',state.muted?'开启声音':'静音','btn ghost',`aria-pressed="${state.muted}"`)}<label for="audio-volume">总音量 <b id="volume-value">${Math.round((state.volume??.3)*100)}%</b></label><input id="audio-volume" data-action="volume" type="range" min="0" max="100" value="${Math.round((state.volume??.3)*100)}" aria-label="总音量"></div><div class="audio-previews">${[['C01','爪击'],['C15','妖火符'],['C16','残月'],['C02','敛息'],['C13','血契'],['C24','狂爪']].map(([id,name])=>btn('audio-preview','试听 · '+name,'btn ghost small',`data-id="${id}"`)).join('')}</div><p class="note">浏览器首次点击后启用声音。静音设置仅作用于当前打开的页面。</p></section>`;}
  function acquisition(id,rect,relic=false){hidePreview();audio()?.playCue?.(relic?(treasureIds.includes(id)?'treasure':'relic'):(CARDS[id]?.rarity==='rare'?'rareReveal':'rewardReveal'));if(!relic)audio()?.playCard?.(id);const el=document.createElement('div');el.className='acquisition '+(relic?'acquisition-relic':'');el.dataset.fx='acquire';el.innerHTML=relic?relicCard(id):cardMarkup(id,'detail');el.style.left=(rect?.left??innerWidth/2-110)+'px';el.style.top=(rect?.top??innerHeight*.3)+'px';fxRoot.append(el);if(motionMode==='full'){const target=document.querySelector(relic?'.relic-row':'#deck-nav')?.getBoundingClientRect();el.animate([{opacity:0,transform:'scale(.8)'},{opacity:1,transform:'scale(1.08)',offset:.3},{opacity:1,transform:'scale(1)',offset:.6},{opacity:0,transform:`translate(${(target?.left??innerWidth-100)-(rect?.left??innerWidth/2-110)}px,${(target?.top??40)-(rect?.top??innerHeight*.3)}px) scale(.12)`}],{duration:920,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});}setTimeout(()=>el.remove(),motionMode==='full'?960:350);toast(`${relic?'珍藏入袖':'新契入组'} · ${relic?RELICS[id]?.name:CARDS[id]?.name}`);}

  function actorGhost(actor,enemy){if(motionMode!=='full'||!actor)return null;const image=actor.querySelector(':scope > img'),rect=actor.getBoundingClientRect();if(!image?.src)return null;const el=document.createElement('div');el.className='fx-actor-ghost '+(enemy?'enemy-ghost':'');el.dataset.fx='afterimage';el.style.cssText=`left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px`;el.innerHTML=`<img src="${esc(image.src)}" alt="">`;fxRoot.append(el);el.animate([{opacity:.5,transform:'translateX(0) scale(1)'},{opacity:.2,transform:`translateX(${enemy?35:-35}px) scale(.97)`,offset:.45},{opacity:0,transform:`translateX(${enemy?55:-55}px) scale(.94)`}],{duration:340,easing:'ease-out',fill:'forwards'});return el;}

  function clawSVG(enemy=false){return `<svg viewBox="0 0 280 260" aria-hidden="true"><g fill="none" stroke="${enemy?'#a7e4a7':'#ffe7ad'}" stroke-width="8" stroke-linecap="round"><path d="M55 35 Q185 105 220 222"/><path d="M100 24 Q220 105 244 201"/><path d="M27 70 Q154 135 182 238"/></g><g fill="none" stroke="${enemy?'#4b8a6a':'#c94837'}" stroke-width="17" opacity=".45"><path d="M55 35 Q185 105 220 222"/><path d="M100 24 Q220 105 244 201"/><path d="M27 70 Q154 135 182 238"/></g></svg>`;}
  function serpentSVG(){return '<svg viewBox="0 0 280 260" aria-hidden="true"><path d="M35 196 C-10 95 256 35 245 130 C239 190 54 230 65 140 C70 83 180 77 211 92" fill="none" stroke="#9ed3aa" stroke-width="12" opacity=".9"/><path d="M35 196 C-10 95 256 35 245 130 C239 190 54 230 65 140 C70 83 180 77 211 92" fill="none" stroke="#264d48" stroke-width="5" stroke-dasharray="5 8"/><path d="M92 60 L127 157 L137 68 M153 62 L161 158 L195 64" fill="#ddf2c9" stroke="#5e927a" stroke-width="2"/><path d="M126 165 L122 188 M162 165 L167 185" stroke="#b5e19b" stroke-width="5" stroke-linecap="round"/></svg>';}
  function attackStyle(id,enemy,snake){if(snake)return{type:'serpent',svg:serpentSVG()};if(enemy)return{type:'strike',svg:clawSVG(true)};if(['C15'].includes(id))return{type:'fire',svg:'<svg viewBox="0 0 280 260"><path d="M140 20 C195 100 239 120 198 205 C185 235 95 252 65 198 C32 138 105 94 140 20" fill="#cf543f" opacity=".8"/><path d="M143 70 C169 140 205 160 168 206 C150 224 103 221 93 192 C85 160 132 129 143 70" fill="#ffe9a9"/><path d="M130 25 L169 89 L107 130 L175 183" fill="none" stroke="#ffe8b4" stroke-width="5"/></svg>'};if(['C16','C21'].includes(id))return{type:'moonblade',svg:'<svg viewBox="0 0 280 260"><path d="M226 28 C75 18 21 168 97 240 C81 146 156 54 226 28" fill="#f4e0bb"/><path d="M221 39 C90 62 52 180 94 229" fill="none" stroke="#e9b978" stroke-width="7"/><circle cx="176" cy="100" r="75" fill="none" stroke="#cfb981" opacity=".45"/></svg>'};if(['C14','C28','C30'].includes(id))return{type:'bloodclaw',svg:clawSVG(false)};if(id==='C35')return{type:'shieldbash',svg:'<svg viewBox="0 0 280 260"><path d="M140 20 L232 70 L218 161 Q195 220 140 244 Q78 216 61 159 L48 70 Z" fill="#84bfa868" stroke="#e4e6b5" stroke-width="7"/><path d="M140 58 V203 M78 103 H202 M100 66 L179 197" stroke="#cce8c2" stroke-width="5"/><path d="M230 72 L263 54 M238 125 H277 M230 177 L262 196" stroke="#ffe3a0" stroke-width="7"/></svg>'};return{type:'claw',svg:clawSVG(false)};}
  function lockBattleDOM(){for(const el of document.querySelectorAll('[data-action="card"],[data-action="target"],[data-action="end-turn"]'))el.disabled=true;document.querySelector('.enemy-target')?.classList.remove('targetable');document.querySelector('.target-tip')?.remove();}
  function updateNumber(id,value){const el=document.getElementById(id);if(el)el.textContent=String(Math.max(0,value));}
  function updateDisplayed(v){updateNumber('hp-value',v.player.hp);updateNumber('enemy-hp',v.enemy.hp);updateNumber('player-block',v.player.block);updateNumber('enemy-block',v.enemy.block);updateNumber('enemy-mark',v.enemy.mark);for(const target of ['player','enemy']){const bar=document.getElementById(target+'-hp-bar');if(bar)bar.style.width=Math.max(0,100*v[target].hp/v[target].maxHp)+'%';}syncPlayerAppearance(v.player);}
  function changeDisplayed(v,event){const target=event.target==='enemy'?'enemy':'player',who=v[target],amount=Number(event.amount)||0;if(event.type==='attack'){who.block=Math.max(0,who.block-(Number(event.absorbed)||0));who.hp=Math.max(0,who.hp-(Number(event.damage)||0));}else if(event.type==='selfDamage'){who.hp=Math.max(0,who.hp-(Number(event.damage??event.amount)||0));}else if(event.type==='heal'){who.hp=Math.min(who.maxHp,who.hp+amount);}else if(event.type==='block'){who.block=Number.isFinite(event.total)?event.total:who.block+amount;}else if(event.type==='mark'){v.enemy.mark=Math.max(0,Math.min(5,v.enemy.mark+amount));}updateDisplayed(v);}
  async function showEvent(event,visual,context){
    const type=event.type,target=event.target==='enemy'?'enemy':'player',temporary=[];
    const keep=el=>{temporary.push(el);return el;};
    if(type==='card'){context.cardId=event.cardId;audio()?.playCard?.(event.cardId);}
    else if(type!=='attack')audio()?.playEvent?.(event,{cardId:context.cardId,enemyId:game.state.battle?.enemy.id,intentName:context.intentName});
    if(type==='card'&&['C10','C11'].includes(event.cardId)){keep(fx('power','player',`<span>${({C10:'候机 · 首段增伤 +4',C11:'蓄势 · 下回合 +1 灵力 / +1 抽牌'})[event.cardId]}</span>`));await delay(200);
    }else if(type==='blockClear'){visual[target].block=0;updateDisplayed(visual);
    }else if(type==='power'){keep(fx('power','player',`<span>血力 +${event.amount||0} · 本场持续</span>`));await delay(250);
    }else if(type==='attack'){
      const from=event.source==='enemy'?'enemy':'player',actor=document.querySelector(`[data-combatant="${from}"] .portrait`),receiver=document.querySelector(`[data-combatant="${target}"] .portrait`),enemy=from==='enemy',heavy=!enemy&&(['C04','C21'].includes(context.cardId)||Number(event.amount)>=20),damage=Number(event.damage)||0,absorbed=Number(event.absorbed)||0;
      if(!enemy)puppetAct('attack',{heavy,cardId:context.cardId,hitIndex:event.hitIndex});attackMotion(actor,enemy,heavy);const ghost=actorGhost(actor,enemy);if(ghost)keep(ghost);
      if(actor)actor.dataset.attacking='true';
      await delay(95);
      audio()?.playEvent?.(event,{cardId:context.cardId,enemyId:game.state.battle?.enemy.id,intentName:context.intentName});
      const snake=enemy&&game.state.battle.enemy.id==='snake';
      const style=attackStyle(context.cardId,enemy,snake);
      keep(fx(style.type,target,style.svg,(event.hitIndex%2?'reverse ':'')+(heavy?'heavy-hit':'')));
      keep(fx(damage>0?'impact':'guard-impact',target,impactArt(damage===0),heavy?'impact-heavy':''));
      if(target==='player'&&damage>0)keep(fx('hurt-impact','player','<i></i><span>受击</span>'));
      if(heavy){keep(fx('harvest','enemy',`<span>${['C04','C21'].includes(context.cardId)?'猎印收割':'重击'}</span>`));audio()?.playCue?.('power');}
      hitMotion(receiver,target,damage,absorbed,heavy);
      keep(numberFX(target,damage?`−${damage}`:absorbed?'格挡':'0',`${event.hitIndex>0?`第 ${event.hitIndex+1} 段 · `:''}${absorbed?`护盾 −${absorbed}`:enemy?'受到伤害':'爪击命中'}`,damage?'damage':'guard'));
      changeDisplayed(visual,event);await delay(335);if(actor)delete actor.dataset.attacking;
    }else if(type==='block'){
      if(target==='player')puppetAct('guard',{amount:event.amount});
      keep(fx('shield',target,'<i></i><span>守</span>'));keep(numberFX(target,`+${event.amount||0}`,'护盾','guard'));changeDisplayed(visual,event);await delay(240);
    }else if(type==='mark'){
      keep(fx('mark','enemy',`<span>${event.amount<0?'散':'印'}</span>`));keep(numberFX('enemy',event.amount<0?(event.total===0?'标记清除':`标记 −${Math.abs(event.amount)}`):`标记 +${event.amount||0}`,'','gold'));changeDisplayed(visual,event);await delay(220);
    }else if(type==='poison'){
      if(event.damage&&target==='player')puppetAct('hurt',{damage:event.damage,kind:'poison'});
      keep(fx('poison',target,'<i></i><i></i><i></i><span>毒</span>'));keep(numberFX(target,event.damage?`−${event.damage}`:event.amount<0?`移除 ${-event.amount} 层毒`:`毒 +${event.amount||0}`,event.damage?'毒无视护盾':event.amount<0?'护心驱毒':'毒附着','poison-color'));if(event.damage){visual[target].hp=Math.max(0,visual[target].hp-event.damage);updateDisplayed(visual);}await delay(250);
    }else if(type==='selfDamage'){
      puppetAct('hurt',{damage:event.damage??event.amount,kind:'selfDamage'});
      keep(fx('blood',target,'<span>血契</span>'));keep(numberFX(target,`−${event.damage??event.amount??0}`,'生命为契','damage'));changeDisplayed(visual,event);await delay(230);
    }else if(type==='heal'){
      if(target==='player')puppetAct('heal',{amount:event.amount});
      keep(fx('heal',target,'<span>生</span>'));keep(numberFX(target,`+${event.amount||0}`,'生命恢复','heal'));changeDisplayed(visual,event);await delay(230);
    }else if(type==='relic'){
      const relic=event.relic||event.relicId||event.name,info=RELICS[relic],name=info?.name||event.name||'遗物发动';
      keep(fx('relic','player',`<i></i><span>${esc(name)}</span>`));if(['fox','ninelives'].includes(relic)){visual.player.hp=Math.min(relic==='fox'?12:18,visual.player.maxHp);updateDisplayed(visual);puppetAct('revive',{hp:visual.player.hp});keep(fx('rebirth','player',`<b>命火重燃</b><span>${esc(name)} · ${visual.player.hp} 生命</span>`));}await delay(['fox','ninelives'].includes(relic)?470:190);
    }else if(type==='draw'||type==='shuffle'){
      if(type==='shuffle'||!context.drawShown){keep(fx('draw','player',`<span>${type==='shuffle'?'弃牌重洗':`抽牌${event.amount>1?' ×'+event.amount:''}`}</span>`));context.drawShown=true;await delay(100);}
    }else if(type==='death'){
      const actor=document.querySelector(`[data-combatant="${target}"] .portrait`);if(actor&&motionMode==='full')actor.animate([{opacity:1,filter:'grayscale(0)'},{opacity:.35,filter:'grayscale(1)'}],{duration:250,fill:'forwards'});await delay(200);
    }else if(type==='victory'){keep(fx('victory','enemy','<span>契破</span>'));await delay(260);}
    temporary.forEach(el=>el.remove());
  }
  async function battleAction(fn,label,alreadyBusy=false){
    if(window.uiBusy&&!alreadyBusy)return false;
    setBusy(true);holdRender=true;lockBattleDOM();
    hidePreview();const previousPlayed=game.state.battle.played;
    const b=game.state.battle,visual={player:{hp:game.state.player.hp,maxHp:game.state.player.maxHp,block:b.block},enemy:{hp:b.enemy.hp,maxHp:b.enemy.maxHp,block:b.enemy.block,mark:b.enemy.mark}};
    let banner;
    try{
      const ok=fn();if(ok===false){toast(game.state.notice);return false;}
      const events=[...(game.state.battle?.events||[])];
      updateNumber('energy-value',game.state.battle?.energy||0);
      banner=document.createElement('div');banner.className='skill-banner';banner.dataset.fx='skill';banner.innerHTML=`<small>${alreadyBusy?'妖异行动':'夜铃 · 出契'}</small><b>${esc(label)}</b>`;fxRoot.append(banner);
      const context={drawShown:false,intentName:alreadyBusy?label:''};for(const event of events)await showEvent(event,visual,context);
      if(!events.length)await delay(180);
      const chain=game.state.battle?.played;if(!alreadyBusy&&chain>previousPlayed&&[3,5,7].includes(chain)&&game.state.screen==='battle'){const stamp=fx('combo','player',`<b>${chain} 连契</b><small>此回合已打出 ${chain} 张</small>`);audio()?.playCue?.('combo',{amount:chain});await delay(155);stamp.remove();}
      return true;
    }finally{banner?.remove();fxRoot.innerHTML='';holdRender=false;setBusy(false);render();if(game.state.notice)toast(game.state.notice);}
  }
  async function endTurn(){if(window.uiBusy||game.state.screen!=='battle'||game.state.battle.phase!=='player')return;selected=null;setBusy(true);const name=ENEMIES[game.state.battle.enemy.id].intents[game.state.battle.enemy.intentIndex].name;if(!act(()=>game.endTurn())){setBusy(false);render();return;}await delay(220);await battleAction(()=>game.resolveEnemyTurn(),name,true);}
  function start(){if(window.uiBusy)return;selected=null;disposePuppets(modalRoot);modal=null;modalRoot.innerHTML='';fxRoot.innerHTML='';act(()=>game.newRun(starter));window.scrollTo(0,0);}
  function title(){if(window.uiBusy)return;selected=null;disposePuppets(modalRoot);modal=null;modalRoot.innerHTML='';game=NightPact.createGame({onChange:render});window.game=game;render();window.scrollTo(0,0);}
  function exportHTML(){if(assets.mode==='folder'){const link=document.createElement('a');link.href='baiyao-standalone.html';link.download='百妖夜契-完整单文件.html';document.body.append(link);link.click();link.remove();toast('已请求保存同目录的完整单文件版；请保留压缩包中的 baiyao-standalone.html。');return;}const copy=document.documentElement.cloneNode(true);for(const id of ['app','hud','modal-root','toast-root','fx-root']){const el=copy.querySelector('#'+id);if(el)el.innerHTML='';}copy.querySelector('body').removeAttribute('data-ui-busy');copy.querySelector('#app').removeAttribute('aria-busy');const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='百妖夜契-index.html';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('已请求浏览器保存完整 HTML；重新打开从新的一局开始。');}
  document.addEventListener('click',event=>{
    void audio()?.unlock?.();
    if(event.target.matches('[data-overlay]'))return closeModal();
    const el=event.target.closest('button[data-action]');if(!el||el.disabled)return;if(modal&&!el.closest('#modal-root'))return;const a=el.dataset.action;
    if(window.uiBusy)return;
    if(a==='start')return start();if(a==='title')return title();if(a==='export')return exportHTML();if(['rules','deck','restart','log','catalogue','settings','relics','portrait-gallery'].includes(a))return openModal(a);if(a==='close')return closeModal();if(a==='pile')return openModal('pile',el.dataset.pile);
    if(a==='puppet-toggle'){window.setPuppetEnabled(!dynamicPortraits);if(modal?.kind==='settings')renderModal();return;}
    if(a==='audio-toggle'){const state=audio()?.getState?.();audio()?.setMuted?.(!state?.muted);renderAudioToggle();if(modal?.kind==='settings')renderModal();return;}
    if(a==='audio-preview'){audio()?.preview?.(el.dataset.id);return;}
    if(a==='starter'){starter=el.dataset.starter;return render();}if(a==='motion'){window.setMotionMode(el.dataset.mode);return renderModal();}
    if(a==='node'){selected=null;act(()=>game.enterNode(el.dataset.node));window.scrollTo(0,0);return;}
    if(a==='card'){const b=game.state.battle,c=b?.hand.find(c=>c.uid===el.dataset.card);if(game.state.screen!=='battle'||b.phase!=='player'||!c||CARDS[c.id].cost>b.energy)return;if(CARDS[c.id].target){selected=selected===c.uid?null:c.uid;render();}else{selected=null;void battleAction(()=>game.playCard(c.uid),CARDS[c.id].name);}return;}
    if(a==='target'){if(selected){const uid=selected,c=game.state.battle.hand.find(c=>c.uid===uid);selected=null;if(c)void battleAction(()=>game.playCard(uid,true),CARDS[c.id].name);}return;}
    if(a==='end-turn')return void endTurn();
    if(a==='reward'||a==='skip-reward'){const id=a==='reward'?el.dataset.id:null,rect=el.getBoundingClientRect();if(act(()=>game.chooseReward(id))&&id)acquisition(id,rect);window.scrollTo(0,0);return;}
    if(a==='choose-relic'){const id=el.dataset.relic,rect=el.getBoundingClientRect();if(act(()=>game.chooseRelic(id)))acquisition(id,rect,true);return;}
    if(a==='reroll-reward'){if(act(()=>game.rerollReward()))audio()?.playCue?.('shuffle');return;}
    if(a==='event-choice'){const before=[...game.state.player.relics],choice=game.state.event?.choices[Number(el.dataset.index)],id=game.state.event?.id;if(act(()=>game.chooseEvent(Number(el.dataset.index)))){audio()?.playEncounter?.(id);const gained=game.state.player.relics.find(r=>!before.includes(r));if(gained)acquisition(gained,null,true);else if(choice?.cardIds?.length)acquisition(choice.cardIds[0]);else audio()?.playCue?.('eventChoice');}return;}if(a==='event-leave')return act(()=>game.leaveEvent());
    if(a==='rest'){const heal=el.dataset.heal==='true';if(act(()=>game.rest(heal))&&heal)audio()?.playCue?.('heal');return;}if(a==='fox'){const sign=el.dataset.sign==='true';if(act(()=>game.fox(sign))&&sign)acquisition('fox',null,true);return;}if(a==='buy'){const id=game.state.shop?.cards[Number(el.dataset.index)]?.id,rect=el.getBoundingClientRect();if(act(()=>game.buyCard(Number(el.dataset.index))))acquisition(id,rect);return;}if(a==='remove-panel')return openModal('remove');
    if(a==='remove'){const uid=el.dataset.card;modal=null;modalRoot.innerHTML='';act(()=>game.removeCard(uid));return;}if(a==='leave-shop')return act(()=>game.leaveShop());
  });
  document.addEventListener('input',event=>{if(event.target.matches('[data-action="volume"]')){const value=Number(event.target.value)/100;audio()?.setVolume?.(value);const output=document.getElementById('volume-value');if(output)output.textContent=Math.round(value*100)+'%';renderAudioToggle();}});
  document.addEventListener('pointerover',event=>{const el=event.target.closest('.card[data-preview]');if(el&&!el.contains(event.relatedTarget))showPreview(el);});
  document.addEventListener('pointerout',event=>{const el=event.target.closest('.card[data-preview]');if(el&&!el.contains(event.relatedTarget))hidePreview();});
  document.addEventListener('focusin',event=>showPreview(event.target.closest('.card[data-preview]')));
  document.addEventListener('focusout',hidePreview);
  window.addEventListener('scroll',hidePreview,true);
  window.addEventListener('pagehide',()=>disposePuppets(document));
  document.addEventListener('keydown',event=>{if(window.uiBusy)return;if(event.key==='Escape'){hidePreview();if(modal)closeModal();else if(selected){selected=null;render();}}if(event.key==='Tab'&&modal){const buttons=[...modalRoot.querySelectorAll('button:not(:disabled),[tabindex="0"]')],first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
  game=NightPact.createGame({onChange:render});window.game=game;window.renderGame=render;render();
})();
</script>
