.event-orbit:after{inset:25%;transform:rotate(-18deg)}

    function rand(n) { return Math.min(n - 1, Math.max(0, Math.floor(rng() * n))); }
    function shuffle(items) {
      const array = items.slice();
      for (let i = array.length - 1; i > 0; i--) {
        const j = rand(i + 1);
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function setStoryNode(map,floor,id,{all=false,name='雾中异迹'}={}) {
      const row=map[floor-1],targets=all?row:[row.find(n=>n.type==='event'&&!n.storyId)||row.find(n=>!n.storyId)||row[row.length-1]];
      for(const node of targets){node.type='event';node.storyId=id;delete node.encounter;node.name=name;node.description='这条路上，留下了一段尚未完成的相逢。';}
      if(!all&&floor>1){
        const previous=map[floor-2],required=targets[0].id;
        for(const source of previous)if(!source.next.includes(required))source.next.push(required);
        const storyTargets=new Set(row.filter(node=>node.storyId).map(node=>node.id));
        const incoming=id=>previous.reduce((count,source)=>count+Number(source.next.includes(id)),0);
        for(const source of previous)while(source.next.length>3){
          let index=source.next.findIndex(id=>!storyTargets.has(id)&&incoming(id)>1);
          if(index<0){
            index=source.next.findIndex(id=>!storyTargets.has(id)&&previous.some(other=>other!==source&&other.next.length<3&&!other.next.includes(id)));
            if(index<0)break;
            const destination=source.next[index],other=previous.find(other=>other!==source&&other.next.length<3&&!other.next.includes(destination));other.next.push(destination);
          }
          source.next.splice(index,1);
        }
      }
    }
    function makeMap() {
      const weighted=['fight','fight','event','event','rest','rest','shop','elite'],map=[],templates=[];
      for(let chapter=0;chapter<3;chapter++){
        const configured=Array.isArray(options.routeTemplate)?options.routeTemplate[chapter]:options.routeTemplate;
        const template=ROUTE_TEMPLATES[Number.isInteger(configured)&&configured>=0&&configured<20?configured:rand(20)];templates.push({id:template.id,name:template.name,chapter:chapter+1,nodeCount:template.widths.reduce((a,b)=>a+b,0)});
        const rows=template.widths.map((width,local)=>{
          const floor=chapter*10+local+1;let types;
          if(local===0)types=['fight'];else if(local===9)types=['boss'];else if(local===2)types=Array(width).fill('event');
          else{types=Array.from({length:width},()=>weighted[rand(weighted.length)]);if([1,3,5,7,8].includes(local)){types[0]='rest';types[1]='shop';}if(local===5)types[2]='fox';types=shuffle(types);}
          return types.map((type,lane)=>({id:`f${floor}-${lane}`,type,floor,lane,regionIndex:chapter,xJitter:(rng()-.5)*.28,yJitter:(rng()-.5)*.35,revealed:false,name:NODE_INFO[type][0],description:NODE_INFO[type][1],omen:OMENS[type][rand(OMENS[type].length)],next:[]}));
        });
        for(let local=0;local<9;local++){
          const current=rows[local],next=rows[local+1];
          if(current.length===1){current[0].next=next.map(n=>n.id);continue;}if(next.length===1){for(const n of current)n.next=[next[0].id];continue;}
          const score=(n,t)=>Math.abs(n.lane/(current.length-1)-t.lane/(next.length-1)+template.bias*(local%2?1:-1))+rng()*.13;
          for(const target of next){const ranked=current.filter(n=>n.next.length<3).map(n=>({n,v:score(n,target)})).sort((a,b)=>a.v-b.v);ranked[0].n.next.push(target.id);}
          for(const n of current){const ranked=next.map(t=>({t,v:score(n,t)})).sort((a,b)=>a.v-b.v);if(!n.next.length)n.next.push(ranked[0].t.id);const desired=1+rand(3);for(const item of ranked)if(n.next.length<desired&&!n.next.includes(item.t.id))n.next.push(item.t.id);

    function choiceAvailable(choice, p) {

      if ((choice.hpCost || 0) > 0 && p.hp <= choice.hpCost) return false;

      if (choice.removeBasic && (p.deck.length <= 5 || !p.deck.some(card => ['C01','C02','S01','S02','F01','F02'].includes(card.id)))) return false;

      const available = choices.map(choice => ({ ...choice,

    function applyEventChoice(choice, p) {
      const received = [];
      if (choice.goldCost) {
        p.gold -= choice.goldCost;
        received.push(`金币 −${choice.goldCost}`);
      }
      if (choice.hpCost) {
        p.hp = Math.max(1, p.hp - choice.hpCost);
        received.push(`生命 −${choice.hpCost}`);
      }
      if (choice.maxHpCost) {
        p.maxHp = Math.max(5, p.maxHp - choice.maxHpCost);
        p.hp = Math.min(p.hp, p.maxHp);
        received.push(`最大生命 −${choice.maxHpCost}`);
      }
      if (choice.removeBasic) {
        const index = p.deck.findIndex(card => ['C01','C02','S01','S02','F01','F02'].includes(card.id));
        if (index >= 0) {
          const [card] = p.deck.splice(index, 1);
          received.push(`移除「${CARDS[card.id].name}」`);
        }
      }
      if (Object.prototype.hasOwnProperty.call(choice, 'relic')) {
        if (addRelic(choice.relic)) received.push(`秘宝「${RELICS[choice.relic].name}」`);
        else {
          const fallback = choice.fallbackGold || 60;
          p.gold += fallback;
          received.push(`秘宝已齐，改得 ${fallback} 金币`);
        }
      }
      for (const id of choice.cardIds || []) {
        p.deck.push(makeCard(id));
        received.push(`卡牌「${CARDS[id].name}」`);
      }
      if (choice.heal) {
        const before = p.hp;
        p.hp = Math.min(p.maxHp, p.hp + choice.heal);
        received.push(`生命 +${p.hp - before}`);
      }
      if (choice.goldGain) {
        p.gold += choice.goldGain;
        received.push(`金币 +${choice.goldGain}`);
      }
      if(choice.weapon && WEAPONS[choice.weapon]) { if(!p.weaponInventory.includes(choice.weapon))p.weaponInventory.push(choice.weapon);received.push(`剑器「${WEAPONS[choice.weapon].name}」`); }
      if(choice.powerGain) {const before=p.power;p.power=Math.min(3,p.power+choice.powerGain);received.push(`本源 +${p.power-before}`);}
      if(choice.afflict){p.affliction={active:true,revealed:false,ticks:0,suppressed:0,source:'tainted_mercy'};}
      if(choice.cureAffliction){cureAffliction();received.push('缠脉毒根除');}

      }

  function restScreen(){const p=game.state.player,amount=Math.min(18,p.maxHp-p.hp),a=afflictionStatus();return `<section class="event-layout">${encounterArt('rest','栖月温泉','息','且将金铃，暂寄雨声。')}<div class="event-copy"><div class="eyebrow">A MOMENT OF PEACE / 月下歇息</div><h2>且听，一夜雨声</h2><p class="story">隔绝黑雾的阵灯仍在燃烧。<br>${heroQuote('你将金铃拢入掌心，暂且不问来路。','你将长剑横置膝上，霜声渐息。')}</p><p class="description">当前生命 ${p.hp} / ${p.maxHp}。<br>此处只能停留一次，歇息后便会继续前行。</p><div class="event-actions">${btn('rest',`静坐调息 · 恢复 ${amount} 点生命<small>恢复不超过最大生命；随后继续当前路径</small>`,'btn primary','data-heal="true"')}${a.revealed&&a.active?btn('rest-cleanse','静息调脉 · 恢复 6 生命<small>调匀经脉，暂缓异样；随后继续前行</small>','btn cleanse-choice'):''}${btn('rest','直接离开 →','btn ghost','data-heal="false"')}</div></div></section>`;}

  function foxScreen(){const p=game.state.player,ok=p.maxHp>8&&!p.relics.includes('fox');return `<section class="event-layout">${encounterArt('fox','狐影朱亭','契','八分命火，一线生机。')}<div class="event-copy"><div class="eyebrow">THE FOX'S BARGAIN / 狐灯邀约</div><h2>以寿，换一线生机</h2><p class="story">“别急着拒绝，${esc(hero().name)}。<br>我只收你八分命火——<br>换你命悬一线时，再睁一次眼。”</p><p class="description">签约后，最大生命 ${p.maxHp} → ${p.maxHp-8}；当前生命最高降至新上限。<br>获得「狐契」：本局下一次致命伤免死，生命设为 12（不超过最大生命）；触发后消失，后续伤害照常结算。</p><div class="event-actions">${btn('fox','签订狐契 · 最大生命 −8，获得一次免死<small>代价仅在本局生效，无隐藏惩罚</small>','btn primary',`data-sign="true" ${ok?'':'disabled'}`)}${!ok?'<p class="reason">最大生命不足，或已经持有狐契。</p>':''}${btn('fox','婉拒交易 · 数值不变，继续前进 →','btn ghost','data-sign="false"')}</div></div></section>`;}
  function eventScreen(){
    const e=game.state.event,story=(e.story||[e.description]).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join(''),art=`<div class="encounter-column">${encounterArt(e.id,e.name,e.glyph||'异','')}</div>`,connection=e.connection?`<aside class="event-connection"><span>你记得</span><p>${esc(e.connection)}</p></aside>`:'';
    if(e.resolved)return `<section class="event-layout ${e.npc?'linked-encounter':''}">${art}<div class="event-copy"><div class="eyebrow">AFTER THE CHOICE / 这一次，你选择了</div><h2>${esc(e.name)}</h2>${connection}<div class="event-story">${story}</div><div class="event-outcome"><span>落下的一笔</span><b>${esc(e.choiceLabel||'')}</b><p>${esc(e.outcome||'')}</p><small>${esc(e.received||'没有即时变化')}</small></div>${eventLootPreview(e)}<div class="event-actions">${btn('event-leave',e.battle?'迎向来人 →':'记下这一段，继续前行 →','btn primary')}${btn('journal','查看行旅手记','btn ghost small')}</div></div></section>`;
    return `<section class="event-layout ${e.npc?'linked-encounter':''}">${art}<div class="event-copy"><div class="eyebrow">A MOMENT IN THE FOG / 雾中一刻</div><h2>${esc(e.name)}</h2>${connection}<div class="event-story">${story}</div><div class="event-actions">${e.choices.map((c,i)=>btn('event-choice',`${esc(c.label)}<small>${esc(c.text||'')}</small>`,'btn '+(i===0?'primary':'ghost')+(c.battle?' battle-choice':''),`data-index="${i}" ${c.disabled?'disabled':''}`)).join('')}</div>${e.choices.some(c=>c.disabled)?'<p class="reason">当前生命、金币或牌组不足以支付灰色选项的代价。</p>':''}</div></section>`;
  }

  function eventLootPreview(e){const chosen=e.choices?.find(c=>c.label===e.choiceLabel),held=game.state.player.relics;return `<div class="event-loot-preview">${chosen?.relic&&held.includes(chosen.relic)&&e.received?.includes(`秘宝「${RELICS[chosen.relic]?.name}」`)?relicCard(chosen.relic):''}${(chosen?.cardIds||[]).map(id=>cardMarkup(id)).join('')}</div>`;}
  function shopScreen(){const s=game.state,p=s.player,shop=s.shop,a=afflictionStatus();return head('THE NIGHT MARKET / 无名夜市','钱货两清，不问来处','非基础牌每张 35 金币，每件商品每次到访仅能购买一次。',`可用金币 ${p.gold}`)+`<div class="shop-layout">${encounterArt('shop','夜市珍阁','市','金铃作响，钱货两清。')}<aside class="shop-note">${a.revealed?`<section class="antidote-service"><h3>药匣 · 抑毒散</h3><p>恢复 6 生命，温养经脉，暂缓异样。<br>每次到访仅能服用一次。</p>${btn('buy-antidote',!a.active?'此刻无需服药':shop.antidoteBought?'本次抑毒散已用':p.gold<30?'30 金币 · 金币不足':'30 金币 · 服用抑毒散','btn '+(a.active&&p.gold>=30?'primary':'ghost'),!a.active||shop.antidoteBought||p.gold<30?'disabled':'')}<small>药气温润，只解一时急迫。</small></section>`:''}<h3>断契 · 删牌</h3><p>永久移除本局牌组中的一个指定实例。<br>牌组最少保留 5 张。</p><p>每次到访仅一次，价格 40 金币。</p>${btn('remove-panel',shop.removed?'本次删牌已使用':'40 金币 · 选择要移除的牌','btn ghost',shop.removed||p.gold<40||p.deck.length<=5?'disabled':'')}<div class="reason">${shop.removed?'已完成本次服务':p.deck.length<=5?'牌组已达 5 张下限':p.gold<40?'金币不足 40':'选中具体实例后才扣款'}</div></aside><div class="shop-goods">${shop.cards.map((c,i)=>`<div class="shop-item">${cardMarkup(c.id)}${btn('buy',c.bought?'已售出':'35 金币 · 购买',`btn ${!c.bought&&p.gold>=35?'primary':'ghost'}`,`data-index="${i}" ${c.bought||p.gold<35?'disabled':''}`)}<div class="reason">${c.bought?'已加入本局牌组':p.gold<35?'金币不足 35':'下场战斗洗入牌堆'}</div></div>`).join('')}</div></div>${shop.weapons?.length?`<section class="shop-weapons"><div class="screen-head"><div><div class="eyebrow">SWORDS THAT REMEMBER / 器有其主</div><h2>灯下剑匣</h2><p>灵识等级不足也能佩带高阶剑器，收下前请读清反噬。</p></div></div><div class="weapon-grid">${shop.weapons.map((w,i)=>weaponCard(w.id,'shop',i)).join('')}</div></section>`:''}<div class="shop-bottom"><span>商品进入时固定，查看牌组不会刷新。</span>${btn('leave-shop','离开商店 →','btn primary')}</div>`;}
  function endingScreen(win){const s=game.state,p=s.player,hiddenWon=win&&s.battle?.enemy.id==='feiye',sovereign=heroId()==='sovereign';return `<section class="ending"><div class="ending-copy"><div class="eyebrow">${win?'THE ABYSS REMAINS / 封域初探完结':'THE FOG REMEMBERS / 探查未归'}</div><h2>${hiddenWon?'月后的名字，终于落定':win&&sovereign?'散落之身，归于一人':win?'雾未散，人已归':'此行，未能归'}</h2><p class="story">${win&&hiddenWon?`那道身影放下指尖的月光。她没有说认输，只报出了自己的名字。<br>绯夜已解锁，可返回首页开启她自己的旅程。`:win&&sovereign?`旧影散去，三处失落的力量回到掌心。<br>变心者的誓言已经结束，镜里的声音也终于安静。<br>“现在，轮到雾外的人还账了。”`:win?`绛鳞倒下，实验核心的裂隙暂时沉寂。<br>你带回一枚残缺的实验铭牌，各方已经等在雾外。<br>“${heroQuote('价钱，得重新谈。','人未找全。我会再来。')}”<br>寒渊的真相，仍有一半藏在黑雾里。`:`你倒在第${chineseNumber(s.result?.floor||s.floor)}段，败于${esc(s.result?.enemy||'封域异物')}。<br>黑雾再次合拢，留下无人认领的脚印。<br>下一次，换一条路，或换一种出牌的方式。`}</p><div class="ending-stats"><span>生命 <b>${p.hp}</b> / ${p.maxHp}</span><span>金币 <b>${p.gold}</b></span><span>牌组 <b>${p.deck.length}</b> 张</span><span>战胜 <b>${s.stats.battles}</b> 场</span><span>最高连招 <b>${s.stats.maxCombo||0}</b></span><span>最强一击 <b>${s.stats.maxHit||0}</b></span></div><div class="ending-relics">${relics(p.relics)}</div><div class="ending-journey"><h3>雾中结下的因缘</h3>${relationsMarkup()}${journalMarkup(3)}${btn('journal','翻看完整行旅手记','btn ghost small')}</div><div class="ending-route">本次路线：${s.history.map(h=>esc(h.name||nodes[h.type]?.[1]||h.type)).join(' → ')}</div><div class="actions">${btn('start','再入寒渊封域 · 相同职业','btn primary')}${btn('title','返回首页，切换职业','btn ghost')}${btn('deck','查看最终牌组','btn ghost')}${hiddenWon?btn('profile','查看解锁凭证','btn ghost'):''}</div><p class="note">重新开始将清空本局生命变化、金币、牌组增删、遗物与路线进度。</p></div>${portrait(heroKind())}</section>`;}
  function render(){if(!game||holdRender)return;rememberMapScroll();if(game.state.screen==='title'&&!isUnlocked(chosenCharacter)){chosenCharacter='assassin';starter='mark';}if(game.state.screen!=='title'){starter=game.state.starter;chosenCharacter=game.state.character||chosenCharacter;}hidePreview();disposePortraits(app);renderAudioToggle();renderHud();const previous=lastScreen;lastScreen=game.state.screen;document.body.dataset.screen=lastScreen;document.body.dataset.character=heroId();document.body.dataset.fallen=String(isFallen());const pages={title:titleScreen,arrival:arrivalScreen,map:mapScreen,threshold:thresholdScreen,battle:battleScreen,reward:rewardScreen,rest:restScreen,fox:foxScreen,event:eventScreen,shop:shopScreen,victory:()=>endingScreen(true),defeat:()=>endingScreen(false)};app.innerHTML=(pages[game.state.screen]||titleScreen)();if(game.state.screen==='map')requestAnimationFrame(focusCurrentMap);if(modal)renderModal();const logs=document.getElementById('recent-logs');if(logs)logs.scrollTop=logs.scrollHeight;if(previous!==lastScreen)screenCue(lastScreen);}
  function renderAudioToggle(){const state=audio()?.getState?.()||{muted:false,volume:.3},el=document.getElementById('audio-nav');if(el){el.textContent=state.muted?'声音：关':'声音：开';el.setAttribute('aria-pressed',String(state.muted));}}
  function screenCue(screen){if(screen==='reward')audio()?.playCue?.(game.state.reward?.cards.some(id=>CARDS[id].rarity==='rare')?'rareReveal':'rewardReveal');if(['fox','rest','shop','event'].includes(screen)){const id=screen==='event'?game.state.event.id:screen;lastEncounter=id;audio()?.playEncounter?.(id);}if(screen==='victory')audio()?.playCue?.('win');if(screen==='defeat')audio()?.playCue?.('death');}
  function openModal(kind,pile){if(window.uiBusy)return;selected=null;modal={kind,pile};render();modalRoot.querySelector('button')?.focus();}
  function closeModal(){disposePortraits(modalRoot);modal=null;modalRoot.innerHTML='';render();}
  function rules(){return `<div class="rules"><section><h3>灵力与回合</h3><p>玩家先手。每回合先清空旧护盾，结算毒，再恢复基础 3 灵力、抽 5 张牌。手牌上限 10，溢出进入弃牌堆。</p><p>攻击／施加状态的牌先点卡牌，再点敌人；再次点同牌或 Esc 取消，不扣灵力。无目标牌点击即用。动作结算期间暂不能重复出牌。</p><p>结束回合弃掉剩余手牌并清除临时蓄势，敌人执行展示的固定行动。敌人旧护盾在其自己回合开始时清空。</p></section><section><h3>影契刺客 · 夜铃</h3><p>「猎印」即卡牌上的标记，最多 5 层，跨回合保留；窥隙铺垫，扑杀兑现。只有写明互动的牌受到标记影响。</p><p>「连段」用低费、抽牌和返还灵力延长出牌。候机只增强下一张攻击的第一段，连爪每爪独立结算。</p><p>「血契」以生命换抽牌、伤害或持续成长；自损无视护盾，生命不足会死亡。夜铃可选三套起手，后续奖励来自刺客牌池。</p></section><section><h3>霜华剑修 · 沈霜白</h3><p>「剑意」上限 8，跨回合保留。剑诀按各自说明蓄积或消耗剑意；没有写消耗的剑招不会自动扣层。</p><p>「霜寒」上限 4，令敌人下次行动的每一段攻击减少对应数值，最低为 0。敌人完整行动结束后清除，即使本次行动没有攻击也会清除；不会冻结、跳过或打乱意图。</p><p>霜寒减伤已计入界面显示的敌人意图。剑修有独立起始牌组、霜印遗物和技能奖励／商店池，与刺客构筑分开。</p></section><section><h3>伤害、牌堆与秘宝</h3><p>普通伤害先扣护盾再扣生命；自损和毒无视护盾。毒在持有者回合开始造成当前层数的直接生命伤害，随后减 1。</p><p>消耗牌本场不再抽回，下场恢复。商店删除指定实例，本局永久移除。抽牌堆空时重洗弃牌，正在结算的牌不会抽回自己。</p><p>遗物与秘宝的完整效果可点击顶栏查看。精英珍藏先二选一，再选卡；同一份战利只会发放一次。休息恢复 18，狐契以 8 最大生命换一次免死。</p></section><section><h3>器灵与归月</h3><p>战斗后获得历练，提高本局灵识等级。剑匣中的装备只能在战斗与战利结算之外更换。高阶器灵可提前佩带；若灵识尚浅，器中躁动也会随之而来。可点开随身兵刃，察看此刻的气息。</p><p>绯夜解锁后可使用独立牌组。魂息上限 6，按具体牌面积蓄和消耗；归身之力来自专属道路上的交锋，每层强化一张攻击牌的第一段，最多 3 层。解锁只保存可选角色，本局养成仍在重开时清空。</p></section><section><h3>封域路线与异闻</h3><p>本幕分为雾锁山门、断桥诸营、逆仪腹地三境，每境十段，第十段为镇境 Boss。走完 A 境才会抵达 B 境，再向 C 境深入；只显示当前一境的路线。地标由真实连线连接，不能跳段、返回，或进入未连接的分支。</p><p>每境至少 40 处地标，第一段位于画面底部，第十段镇境之敌位于上方。向上滚动可察看前路。连线与下方路线卡使用相同状态，每境独立抽取路线样式，只有亮起且相连的地标能进入。</p><p>异闻包含数段人物的连续故事：初逢、重遇、余波会跨越三境。有人会报答援手，有人会带来麻烦，也有人觊觎你的宝物；戒备、交易和应战会改变后果。行旅手记只记录你已经知道的事，战斗与选择都只能结算一次。全程离线，本局不存档；角色解锁会单独保存。</p></section></div>`;}
  function worldLore(){return `<div class="world-lore"><p class="world-prologue">寒渊原是群山之间的采灵之地。玄烬教试图从地底引出一段不属于此世的灵性，却在最后一夜被仪式反噬。黑雾封住整片区域，山路和建筑渐渐失去原本的形状。外界的占卜、传讯与窥视均告失效，只能让活人走进去。</p><div class="faction-grid"><article><i>剑</i><h3>太微剑宗</h3><p>受托探查并寻找失踪弟子。有人只想救人，也有人想替正道先封存禁术。</p></article><article><i>烬</i><h3>玄烬残众</h3><p>回收实验记录与失控造物；想补救的人和想继续实验的人同行，却互不信任。</p></article><article><i>灯</i><h3>千灯商盟</h3><p>以补给换取遗物、记忆与情报。危险会抬高价钱，也会催生别人的机会。</p></article><article><i>影</i><h3>夜契盟与散修</h3><p>受雇寻物，或为自身执念而来。身上的契约、未偿的债与想带走的东西各不相同。</p></article></div><p class="note">雾外无人看清寒渊全貌。同行者未必同心，偶遇者也未必无害；你能带回多少真相，取决于你愿意走进哪些地方。</p></div>`;}
  function renderModal(){

      if(!enemy)portraitAct('attack',{heavy,cardId:context.cardId,hitIndex:event.hitIndex});attackMotion(actor,enemy,heavy);const ghost=actorGhost(actor,enemy);if(ghost)keep(ghost);
      if(actor)actor.dataset.attacking='true';
      await delay(95);
      audio()?.playEvent?.(event,{cardId:context.cardId,enemyId:game.state.battle?.enemy.id,intentName:context.intentName});
      const snake=enemy&&game.state.battle.enemy.id==='snake';
      const style=attackStyle(context.cardId,enemy,snake);
      keep(fx(style.type,target,style.svg,(event.hitIndex%2?'reverse ':'')+(heavy?'heavy-hit':'')));
      keep(fx(damage>0?'impact':'guard-impact',target,impactArt(damage===0),heavy?'impact-heavy':''));
      if(target==='player'&&damage>0)keep(fx('hurt-impact','player','<i></i><span>受击</span>'));
      if(heavy){keep(fx('harvest','enemy',`<span>${String(context.cardId).startsWith('D')?'煞血归心':String(context.cardId).startsWith('F')?'月魄归尽':String(context.cardId).startsWith('S')?'霜华斩落':['C04','C21'].includes(context.cardId)?'猎印收割':'重击'}</span>`));audio()?.playCue?.('power');}
      hitMotion(receiver,target,damage,absorbed,heavy);
      keep(numberFX(target,damage?`−${damage}`:absorbed?'格挡':'0',`${event.hitIndex>0?`第 ${event.hitIndex+1} 段 · `:''}${absorbed?`护盾 −${absorbed}`:enemy?'受到伤害':heroId()==='sovereign'?'魂光命中':heroId()==='sword'?'剑锋命中':'爪击命中'}`,damage?'damage':'guard'));
      changeDisplayed(visual,event);await delay(335);if(actor)delete actor.dataset.attacking;
    }else if(type==='block'){
      if(target==='player')portraitAct('guard',{amount:event.amount});
      keep(fx('shield',target,'<i></i><span>守</span>'));keep(numberFX(target,`+${event.amount||0}`,'护盾','guard'));changeDisplayed(visual,event);await delay(240);
    }else if(type==='mark'){
      keep(fx('mark','enemy',`<span>${event.amount<0?'散':'印'}</span>`));keep(numberFX('enemy',event.amount<0?(event.total===0?'标记清除':`标记 −${Math.abs(event.amount)}`):`标记 +${event.amount||0}`,'','gold'));changeDisplayed(visual,event);await delay(220);
    }else if(type==='chill'){
      keep(fx('frost','enemy',frostSVG()));keep(numberFX('enemy',event.amount<0?'碎霜':`霜寒 +${event.amount||0}`,`当前 ${event.total??0} 层`,'ice-number'));updateNumber('enemy-chill',event.total??0);if(!context.enemyTurn){const intent=document.getElementById('intent-text');if(intent)intent.textContent=game.getIntent?.().text||intent.textContent;}await delay(240);
    }else if(type==='soul'){
      keep(fx('soul-rise','player',symbol('soul')));await delay(190);
    }else if(type==='weapon'||type==='environment'){
      keep(fx(type==='weapon'?'weapon-rebel':'domain','player',symbol(type)));await delay(180);
    }else if(type==='swordIntent'){
      keep(fx('sword-intent','player',symbol('swordIntent')));await delay(210);
    }else if(type==='afflictionSuppressed'){
      keep(fx('affliction','player',symbol('suppressed')));await delay(140);
    }else if(type==='affliction'){
      keep(fx('affliction','player',symbol(event.active===false?'cleansed':event.suppressed?'suppressed':'affliction')));if(event.damage){portraitAct('hurt',{damage:event.damage,kind:'poison'});keep(numberFX('player',`−${event.damage}`,'气息受损','poison-color'));visual.player.hp=Math.max(0,visual.player.hp-event.damage);updateDisplayed(visual);}await delay(260);
    }else if(type==='corruption'){
      // The change is carried by the story and portrait; its hidden accumulation has no display.
    }else if(type==='fall'||type==='fallen'){
      syncPlayerAppearance(visual.player);keep(fx('fall','player',symbol('fallen')));portraitAct('fall');await delay(560);
    }else if(type==='poison'){
      if(event.damage&&target==='player')portraitAct('hurt',{damage:event.damage,kind:'poison'});
      keep(fx('poison',target,'<i></i><i></i><i></i>'));if(event.damage)keep(numberFX(target,`−${event.damage}`,'气息受损','poison-color'));if(event.damage){visual[target].hp=Math.max(0,visual[target].hp-event.damage);updateDisplayed(visual);}await delay(250);
    }else if(type==='selfDamage'){
      portraitAct('hurt',{damage:event.damage??event.amount,kind:'selfDamage'});
      keep(fx('blood',target,'<span>血契</span>'));keep(numberFX(target,`−${event.damage??event.amount??0}`,'生命为契','damage'));changeDisplayed(visual,event);await delay(230);
    }else if(type==='heal'){
      if(target==='player')portraitAct('heal',{amount:event.amount});
      keep(fx(String(context.cardId).startsWith('D')?'demonic-heal':'heal',target,'<span>生</span>'));keep(numberFX(target,`+${event.amount||0}`,'生命恢复',String(context.cardId).startsWith('D')?'demonic-heal-number':'heal'));changeDisplayed(visual,event);await delay(230);
    }else if(type==='relic'){
      const relic=event.relic||event.relicId||event.name,info=RELICS[relic],name=info?.name||event.name||'遗物发动';
      keep(fx('relic','player',`<i></i><span>${esc(name)}</span>`));if(['fox','ninelives'].includes(relic)){visual.player.hp=Math.min(relic==='fox'?12:18,visual.player.maxHp);updateDisplayed(visual);portraitAct('revive',{hp:visual.player.hp});keep(fx('rebirth','player',`<b>命火重燃</b><span>${esc(name)} · ${visual.player.hp} 生命</span>`));}await delay(['fox','ninelives'].includes(relic)?470:190);
    }else if(type==='draw'||type==='shuffle'){
      if(type==='shuffle'||!context.drawShown){keep(fx('draw','player',`<span>${type==='shuffle'?'弃牌重洗':`抽牌${event.amount>1?' ×'+event.amount:''}`}</span>`));context.drawShown=true;await delay(100);}
    }else if(type==='death'){
      const actor=document.querySelector(`[data-combatant="${target}"] .portrait`);if(actor&&motionMode==='full')actor.animate([{opacity:1,filter:'grayscale(0)'},{opacity:.35,filter:'grayscale(1)'}],{duration:250,fill:'forwards'});await delay(200);
    }else if(type==='victory'){keep(fx('victory','enemy','<span>契破</span>'));await delay(260);}
    temporary.forEach(el=>el.remove());
  }
  async function battleAction(fn,label,alreadyBusy=false){
    if(window.uiBusy&&!alreadyBusy)return false;
    setBusy(true);holdRender=true;lockBattleDOM();
    hidePreview();const previousPlayed=game.state.battle.played;
    const b=game.state.battle,visual={player:{hp:game.state.player.hp,maxHp:game.state.player.maxHp,block:b.block},enemy:{hp:b.enemy.hp,maxHp:b.enemy.maxHp,block:b.enemy.block,mark:b.enemy.mark}};
    let banner;
    try{
      const ok=fn();if(ok===false){toast(game.state.notice);return false;}
      const events=[...(game.state.battle?.events||[])];
      updateNumber('energy-value',game.state.battle?.energy||0);
      banner=document.createElement('div');banner.className='skill-banner';banner.dataset.fx='skill';banner.innerHTML=`<small>${alreadyBusy?'妖异行动':`${hero().name} · ${heroId()==='sovereign'?'归月':heroId()==='sword'?'出剑':'潜袭'}`}</small><b>${esc(label)}</b>`;fxRoot.append(banner);
      const context={drawShown:false,intentName:alreadyBusy?label:'',enemyTurn:alreadyBusy};for(const event of events)await showEvent(event,visual,context);
      if(!events.length)await delay(180);
      const chain=game.state.battle?.played;if(!alreadyBusy&&chain>previousPlayed&&[3,5,7].includes(chain)&&game.state.screen==='battle'){const stamp=fx('combo','player',`<b>${chain} 连招</b><small>此回合已打出 ${chain} 张</small>`);audio()?.playCue?.('combo',{amount:chain});await delay(155);stamp.remove();}
      return true;
    }finally{banner?.remove();fxRoot.innerHTML='';holdRender=false;setBusy(false);render();if(game.state.notice)toast(game.state.notice);}
  }
  async function endTurn(){if(window.uiBusy||game.state.screen!=='battle'||game.state.battle.phase!=='player')return;selected=null;setBusy(true);const name=(game.getIntent?.()||ENEMIES[game.state.battle.enemy.id].intents[game.state.battle.enemy.intentIndex]).name;if(!act(()=>game.endTurn())){setBusy(false);render();return;}await delay(220);await battleAction(()=>game.resolveEnemyTurn(),name,true);}
  function start(){if(window.uiBusy)return;selected=null;disposePortraits(modalRoot);modal=null;modalRoot.innerHTML='';fxRoot.innerHTML='';act(()=>game.newRun(starter));mapFocusKey='';mapScrollPosition=null;window.scrollTo(0,0);}
  function title(){if(window.uiBusy)return;selected=null;disposePortraits(modalRoot);modal=null;modalRoot.innerHTML='';game=makeGame();window.game=game;render();window.scrollTo(0,0);}
  function exportHTML(){if(assets.mode==='folder'){const link=document.createElement('a');link.href='baiyao-standalone.html';link.download='百妖夜契-完整单文件.html';document.body.append(link);link.click();link.remove();toast('已请求保存同目录的完整单文件版；请保留压缩包中的 baiyao-standalone.html。');return;}const copy=document.documentElement.cloneNode(true);for(const id of ['app','hud','modal-root','toast-root','fx-root']){const el=copy.querySelector('#'+id);if(el)el.innerHTML='';}copy.querySelector('body').removeAttribute('data-ui-busy');copy.querySelector('#app').removeAttribute('aria-busy');const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='百妖夜契-index.html';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('已请求浏览器保存完整 HTML；重新打开从新的一局开始。');}
  document.addEventListener('click',event=>{
    void audio()?.unlock?.();
    if(event.target.matches('[data-overlay]'))return closeModal();
    const el=event.target.closest('button[data-action]');if(!el||el.disabled)return;if(modal&&!el.closest('#modal-root'))return;const a=el.dataset.action;
    if(window.uiBusy)return;
    if(a==='start')return start();if(a==='title')return title();if(a==='export')return exportHTML();if(['rules','world','journal','deck','restart','log','catalogue','settings','equipment','profile','relics','portrait-gallery'].includes(a))return openModal(a);if(a==='close')return closeModal();if(a==='pile')return openModal('pile',el.dataset.pile);if(a==='status')return openModal('status',el.dataset.status);
    if(a==='hidden-enter'){selected=null;act(()=>game.startHiddenBoss());scrollAfterAction();return;}if(a==='threshold-leave'){act(()=>game.leaveThreshold());scrollAfterAction();return;}
    if(a==='equip-weapon'){if(act(()=>game.equipWeapon(el.dataset.id))){renderModal();audio()?.playCue?.('relic');}return;}
    if(a==='buy-weapon'){if(act(()=>game.buyWeapon(Number(el.dataset.index)))){audio()?.playCue?.('treasure');toast('新器入匣；可在随身剑匣中佩带。');}return;}
    if(a==='profile-export'){const area=document.getElementById('profile-code');if(area){area.value=JSON.stringify(game.getProfile?.()||savedProfile);area.focus();area.select();toast('凭证已选中，请复制并保存。');}return;}
    if(a==='profile-import'){const value=document.getElementById('profile-code')?.value||'';if(game.importProfile?.(value)){profileChanged(game.getProfile());toast('凭证已载入，已解锁的角色可在首页选择。');render();}else toast('凭证格式不正确，未改变任何解锁。');return;}
    if(a==='catalogue-filter'){catalogueFilter=el.dataset.filter;return renderModal();}
    if(a==='audio-toggle'){const state=audio()?.getState?.();audio()?.setMuted?.(!state?.muted);renderAudioToggle();if(modal?.kind==='settings')renderModal();return;}
    if(a==='audio-preview'){audio()?.preview?.(el.dataset.id);return;}
    if(a==='character'){if(!isUnlocked(el.dataset.character))return;chosenCharacter=el.dataset.character;starter=(HEROES[chosenCharacter]?.starters||[chosenCharacter==='sword'?'sword':'mark'])[0];return render();}if(a==='starter'){starter=el.dataset.starter;return render();}if(a==='motion'){window.setMotionMode(el.dataset.mode);return renderModal();}
    if(a==='arrival-enter'){selected=null;act(()=>game.enterRegion());scrollAfterAction();return;}
    if(a==='node'){selected=null;act(()=>game.enterNode(el.dataset.node));scrollAfterAction();return;}
    if(a==='card'){const b=game.state.battle,c=b?.hand.find(c=>c.uid===el.dataset.card);if(game.state.screen!=='battle'||b.phase!=='player'||!c||CARDS[c.id].cost>b.energy)return;if(CARDS[c.id].target){selected=selected===c.uid?null:c.uid;syncTargetSelection();}else{selected=null;syncTargetSelection();void battleAction(()=>game.playCard(c.uid),CARDS[c.id].name);}return;}
    if(a==='target'){if(selected){const uid=selected,c=game.state.battle.hand.find(c=>c.uid===uid);selected=null;syncTargetSelection();if(c)void battleAction(()=>game.playCard(uid,true),CARDS[c.id].name);}return;}
    if(a==='end-turn')return void endTurn();
    if(a==='reward'||a==='skip-reward'){const id=a==='reward'?el.dataset.id:null,rect=el.getBoundingClientRect();if(act(()=>game.chooseReward(id))&&id)acquisition(id,rect);scrollAfterAction();return;}
    if(a==='choose-relic'){const id=el.dataset.relic,rect=el.getBoundingClientRect();if(act(()=>game.chooseRelic(id)))acquisition(id,rect,true);return;}
    if(a==='reroll-reward'){if(act(()=>game.rerollReward()))audio()?.playCue?.('shuffle');return;}
    if(a==='event-choice'){const before=[...game.state.player.relics],choice=game.state.event?.choices[Number(el.dataset.index)],id=game.state.event?.id;if(act(()=>game.chooseEvent(Number(el.dataset.index)))){audio()?.playEncounter?.(id);if(game.state.screen!=='event')return;const gained=game.state.player.relics.find(r=>!before.includes(r));if(gained)acquisition(gained,null,true);else if(choice?.cardIds?.length)acquisition(choice.cardIds[0]);else audio()?.playCue?.('eventChoice');}return;}if(a==='event-leave'){selected=null;act(()=>game.leaveEvent());scrollAfterAction();return;}
    if(a==='buy-antidote'){if(act(()=>game.buyAntidote?.()))audio()?.playCue?.('heal');return;}if(a==='rest-cleanse'){if(act(()=>game.rest('cleanse')))audio()?.playCue?.('heal');return;}if(a==='rest'){const heal=el.dataset.heal==='true';if(act(()=>game.rest(heal))&&heal)audio()?.playCue?.('heal');return;}if(a==='fox'){const sign=el.dataset.sign==='true';if(act(()=>game.fox(sign))&&sign)acquisition('fox',null,true);return;}if(a==='buy'){const id=game.state.shop?.cards[Number(el.dataset.index)]?.id,rect=el.getBoundingClientRect();if(act(()=>game.buyCard(Number(el.dataset.index))))acquisition(id,rect);return;}if(a==='remove-panel')return openModal('remove');
    if(a==='remove'){const uid=el.dataset.card;modal=null;modalRoot.innerHTML='';act(()=>game.removeCard(uid));return;}if(a==='leave-shop')return act(()=>game.leaveShop());
  });
  document.addEventListener('input',event=>{if(event.target.matches('[data-action="volume"]')){const value=Number(event.target.value)/100;audio()?.setVolume?.(value);const output=document.getElementById('volume-value');if(output)output.textContent=Math.round(value*100)+'%';renderAudioToggle();}});
  document.addEventListener('pointerover',event=>{const el=event.target.closest('.card[data-preview]');if(el&&!el.contains(event.relatedTarget))showPreview(el);});
  document.addEventListener('pointerout',event=>{const el=event.target.closest('.card[data-preview]');if(el&&!el.contains(event.relatedTarget))hidePreview();});
  document.addEventListener('focusin',event=>showPreview(event.target.closest('.card[data-preview]')));

  window.addEventListener('scroll',hidePreview,true);
  window.addEventListener('pagehide',()=>{disposePortraits(document);});
  document.addEventListener('keydown',event=>{if(window.uiBusy)return;if(event.key==='Escape'){hidePreview();if(modal)closeModal();else if(selected){selected=null;syncTargetSelection();}}if(event.key==='Tab'&&modal){const buttons=[...modalRoot.querySelectorAll('button:not(:disabled),[tabindex="0"]')],first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
  game=makeGame();window.game=game;window.renderGame=render;render();
})();
