.event-orbit:after{inset:25%;transform:rotate(-18deg)}

    function applyEventChoice(choice, p) {
      const received = [];
      if (choice.goldCost) {

        received.push(`金币 −${choice.goldCost}`);
      }
      if (choice.hpCost) {
        p.hp = Math.max(1, p.hp - choice.hpCost);
        received.push(`生命 −${choice.hpCost}`);
      }
      if (choice.maxHpCost) {
        p.maxHp = Math.max(5, p.maxHp - choice.maxHpCost);
        p.hp = Math.min(p.hp, p.maxHp);
        received.push(`最大生命 −${choice.maxHpCost}`);

      if (choice.removeBasic) {
        const index = p.deck.findIndex(card => ['C01','C02','S01','S02'].includes(card.id));
        if (index >= 0) {
          const [card] = p.deck.splice(index, 1);
          received.push(`移除「${CARDS[card.id].name}」`);
        }

      if (Object.prototype.hasOwnProperty.call(choice, 'relic')) {
        if (addRelic(choice.relic)) received.push(`秘宝「${RELICS[choice.relic].name}」`);
        else {
          const fallback = choice.fallbackGold || 60;
          p.gold += fallback;
          received.push(`秘宝已齐，改得 ${fallback} 金币`);
        }

      for (const id of choice.cardIds || []) {
        p.deck.push(makeCard(id));

      if (choice.heal) {

        p.hp = Math.min(p.maxHp, p.hp + choice.heal);
        received.push(`生命 +${p.hp - before}`);

      return received;

  function battleHint(b){if(heroId()==='sword'){if(b.enemy.chill)return `霜寒 ${b.enemy.chill}：敌人下次行动的每段攻击减少 ${b.enemy.chill}，行动后清除。意图已显示减伤后的准确数值。`;if((b.swordIntent||0)>=4)return `剑意 ${b.swordIntent}：可用强力剑诀消耗蓄积，斩出爆发。剑意跨回合保留，上限 8。`;return '施加霜寒压低连击，积累剑意后再出重剑。霜寒不冻结敌人，也不改变行动顺序。';}if(b.enemy.id==='snake'&&b.enemy.intentIndex===2&&b.enemy.mark)return '绛鳞即将蜕鳞清除猎印：考虑现在用扑杀兑现。';if(b.enemy.mark>=2)return `敌人已有 ${b.enemy.mark} 层猎印，扑杀基础伤害为 ${10+4*b.enemy.mark}。`;if(b.played===2&&game.state.player.relics.includes('jade'))return '再打一张牌，磨爪玉将返还 1 点灵力。';if(b.nextAttack)return `下一张攻击的第一段 +${b.nextAttack} 伤害，留给关键一击。`;return '影契刺客：猎印蓄杀 · 连段返利 · 血契换势，伺机切入敌人破绽。';}
  function battleScreen(){

  }

  function restScreen(){const p=game.state.player,amount=Math.min(18,p.maxHp-p.hp);return `<section class="event-layout">${encounterArt('rest','栖月温泉','息','且将金铃，暂寄雨声。')}<div class="event-copy"><div class="eyebrow">A MOMENT OF PEACE / 月下歇息</div><h2>且听，一夜雨声</h2><p class="story">隔绝黑雾的阵灯仍在燃烧。<br>${heroQuote('你将金铃拢入掌心，暂且不问来路。','你将长剑横置膝上，霜声渐息。')}</p><p class="description">当前生命 ${p.hp} / ${p.maxHp}。<br>休息恢复 18 点生命，不超过最大生命。此处只能停留一次。</p><div class="event-actions">${btn('rest',`静坐调息 · 恢复 ${amount} 点生命<small>治疗后沿当前路径继续</small>`,'btn primary','data-heal="true"')}${btn('rest','直接离开 →','btn ghost','data-heal="false"')}</div></div></section>`;}
  function foxScreen(){const p=game.state.player,ok=p.maxHp>8&&!p.relics.includes('fox');return `<section class="event-layout">${encounterArt('fox','狐影朱亭','契','八分命火，一线生机。')}<div class="event-copy"><div class="eyebrow">THE FOX'S BARGAIN / 狐灯邀约</div><h2>以寿，换一线生机</h2><p class="story">“别急着拒绝，${esc(hero().name)}。<br>我只收你八分命火——<br>换你命悬一线时，再睁一次眼。”</p><p class="description">签约后，最大生命 ${p.maxHp} → ${p.maxHp-8}；当前生命最高降至新上限。<br>获得「狐契」：本局下一次致命伤免死，生命设为 12（不超过最大生命）；触发后消失，后续伤害照常结算。</p><div class="event-actions">${btn('fox','签订狐契 · 最大生命 −8，获得一次免死<small>代价仅在本局生效，无隐藏惩罚</small>','btn primary',`data-sign="true" ${ok?'':'disabled'}`)}${!ok?'<p class="reason">最大生命不足，或已经持有狐契。</p>':''}${btn('fox','婉拒交易 · 数值不变，继续前进 →','btn ghost','data-sign="false"')}</div></div></section>`;}

  function shopScreen(){const s=game.state,p=s.player,shop=s.shop;return head('THE NIGHT MARKET / 无名夜市','钱货两清，不问来处','非基础牌每张 35 金币，每件商品每次到访仅能购买一次。',`可用金币 ${p.gold}`)+`<div class="shop-layout">${encounterArt('shop','夜市珍阁','市','金铃作响，钱货两清。')}<aside class="shop-note"><h3>断契 · 删牌</h3><p>永久移除本局牌组中的一个指定实例。<br>牌组最少保留 5 张。</p><p>每次到访仅一次，价格 40 金币。</p>${btn('remove-panel',shop.removed?'本次删牌已使用':'40 金币 · 选择要移除的牌','btn ghost',shop.removed||p.gold<40||p.deck.length<=5?'disabled':'')}<div class="reason">${shop.removed?'已完成本次服务':p.deck.length<=5?'牌组已达 5 张下限':p.gold<40?'金币不足 40':'选中具体实例后才扣款'}</div></aside><div class="shop-goods">${shop.cards.map((c,i)=>`<div class="shop-item">${cardMarkup(c.id)}${btn('buy',c.bought?'已售出':'35 金币 · 购买',`btn ${!c.bought&&p.gold>=35?'primary':'ghost'}`,`data-index="${i}" ${c.bought||p.gold<35?'disabled':''}`)}<div class="reason">${c.bought?'已加入本局牌组':p.gold<35?'金币不足 35':'下场战斗洗入牌堆'}</div></div>`).join('')}</div></div><div class="shop-bottom"><span>商品进入时固定，查看牌组不会刷新。</span>${btn('leave-shop','离开商店 →','btn primary')}</div>`;}
  function endingScreen(win){const s=game.state,p=s.player;return `<section class="ending"><div class="ending-copy"><div class="eyebrow">${win?'THE ABYSS REMAINS / 封域初探完结':'THE FOG REMEMBERS / 探查未归'}</div><h2>${win?'雾未散，人已归':'此行，未能归'}</h2><p class="story">${win?`绛鳞倒下，实验核心的裂隙暂时沉寂。<br>你带回一枚残缺的实验铭牌，各方已经等在雾外。<br>“${heroQuote('价钱，得重新谈。','人未找全。我会再来。')}”<br>寒渊的真相，仍有一半藏在黑雾里。`:`你倒在第${cn[(s.result?.floor||s.floor)-1]||s.floor}区，败于${esc(s.result?.enemy||'封域异物')}。<br>黑雾再次合拢，留下无人认领的脚印。<br>下一次，换一条路，或换一种出牌的方式。`}</p><div class="ending-stats"><span>生命 <b>${p.hp}</b> / ${p.maxHp}</span><span>金币 <b>${p.gold}</b></span><span>牌组 <b>${p.deck.length}</b> 张</span><span>战胜 <b>${s.stats.battles}</b> 场</span><span>最高连招 <b>${s.stats.maxCombo||0}</b></span><span>最强一击 <b>${s.stats.maxHit||0}</b></span></div><div class="ending-relics">${relics(p.relics)}</div><div class="ending-route">本次路线：${s.history.map(h=>esc(h.name||nodes[h.type]?.[1]||h.type)).join(' → ')}</div><div class="actions">${btn('start','再入寒渊封域 · 相同职业','btn primary')}${btn('title','返回首页，切换职业','btn ghost')}${btn('deck','查看最终牌组','btn ghost')}</div><p class="note">重新开始将清空本局生命变化、金币、牌组增删、遗物与路线进度。</p></div>${portrait(heroKind())}</section>`;}
  function render(){if(!game||holdRender)return;if(game.state.screen!=='title'){starter=game.state.starter;chosenCharacter=game.state.character||chosenCharacter;}hidePreview();disposePuppets(app);disposeScenes(app);renderAudioToggle();renderHud();const previous=lastScreen;lastScreen=game.state.screen;document.body.dataset.screen=lastScreen;document.body.dataset.character=heroId();const pages={title:titleScreen,map:mapScreen,battle:battleScreen,reward:rewardScreen,rest:restScreen,fox:foxScreen,event:eventScreen,shop:shopScreen,victory:()=>endingScreen(true),defeat:()=>endingScreen(false)};app.innerHTML=(pages[game.state.screen]||titleScreen)();mountPuppets(app);mountScenes(app);if(modal)renderModal();const logs=document.getElementById('recent-logs');if(logs)logs.scrollTop=logs.scrollHeight;if(previous!==lastScreen)screenCue(lastScreen);}
  function renderAudioToggle(){const state=audio()?.getState?.()||{muted:false,volume:.3},el=document.getElementById('audio-nav');if(el){el.textContent=state.muted?'声音：关':'声音：开';el.setAttribute('aria-pressed',String(state.muted));}}

  function openModal(kind,pile){if(window.uiBusy)return;selected=null;modal={kind,pile};render();modalRoot.querySelector('button')?.focus();}
  function closeModal(){disposePuppets(modalRoot);disposeScenes(modalRoot);modal=null;modalRoot.innerHTML='';render();}
  function rules(){return `<div class="rules"><section><h3>灵力与回合</h3><p>玩家先手。每回合先清空旧护盾，结算毒，再恢复基础 3 灵力、抽 5 张牌。手牌上限 10，溢出进入弃牌堆。</p><p>攻击／施加状态的牌先点卡牌，再点敌人；再次点同牌或 Esc 取消，不扣灵力。无目标牌点击即用。动作结算期间暂不能重复出牌。</p><p>结束回合弃掉剩余手牌并清除临时蓄势，敌人执行展示的固定行动。敌人旧护盾在其自己回合开始时清空。</p></section><section><h3>影契刺客 · 夜铃</h3><p>「猎印」即卡牌上的标记，最多 5 层，跨回合保留；窥隙铺垫，扑杀兑现。只有写明互动的牌受到标记影响。</p><p>「连段」用低费、抽牌和返还灵力延长出牌。候机只增强下一张攻击的第一段，连爪每爪独立结算。</p><p>「血契」以生命换抽牌、伤害或持续成长；自损无视护盾，生命不足会死亡。夜铃可选三套起手，后续奖励来自刺客牌池。</p></section><section><h3>霜华剑修 · 沈霜白</h3><p>「剑意」上限 8，跨回合保留。剑诀按各自说明蓄积或消耗剑意；没有写消耗的剑招不会自动扣层。</p><p>「霜寒」上限 4，令敌人下次行动的每一段攻击减少对应数值，最低为 0。敌人完整行动结束后清除，即使本次行动没有攻击也会清除；不会冻结、跳过或打乱意图。</p><p>霜寒减伤已计入界面显示的敌人意图。剑修有独立起始牌组、霜印遗物和技能奖励／商店池，与刺客构筑分开。</p></section><section><h3>伤害、牌堆与秘宝</h3><p>普通伤害先扣护盾再扣生命；自损和毒无视护盾。毒在持有者回合开始造成当前层数的直接生命伤害，随后减 1。</p><p>消耗牌本场不再抽回，下场恢复。商店删除指定实例，本局永久移除。抽牌堆空时重洗弃牌，正在结算的牌不会抽回自己。</p><p>遗物与秘宝的完整效果可点击顶栏查看。精英珍藏先二选一，再选卡；同一份战利只会发放一次。休息恢复 18，狐契以 8 最大生命换一次免死。</p></section><section><h3>封域路线与异闻</h3><p>本幕十个区域，多列地标由真实连线连接。战斗、精英、休息、商店和奇遇类型提前可见，只有相连的亮起地标可进入。选路后无法返回，也不能跳到未连接的分支。</p><p>地图与立体沙盘使用同一份状态；关闭立体场景或设备不支持时，仍可用路线卡和完整路线图游玩。</p><p>十四种剧情异闻每局尽量不重复：先读前情，再看代价与所得，选择后查看结局，再继续探索。全程离线，无存档；刷新会重新开始。</p></section></div>`;}
  function worldLore(){return `<div class="world-lore"><p class="world-prologue">寒渊原是群山之间的采灵之地。玄烬教试图从地底引出一段不属于此世的灵性，却在最后一夜被仪式反噬。黑雾封住整片区域，山路和建筑渐渐失去原本的形状。外界的占卜、传讯与窥视均告失效，只能让活人走进去。</p><div class="faction-grid"><article><i>剑</i><h3>太微剑宗</h3><p>受托探查并寻找失踪弟子。有人只想救人，也有人想替正道先封存禁术。</p></article><article><i>烬</i><h3>玄烬残众</h3><p>回收实验记录与失控造物；想补救的人和想继续实验的人同行，却互不信任。</p></article><article><i>灯</i><h3>千灯商盟</h3><p>以补给换取遗物、记忆与情报。危险会抬高价钱，也会催生别人的机会。</p></article><article><i>影</i><h3>夜契盟与散修</h3><p>受雇寻物，或为自身执念而来。身上的契约、未偿的债与想带走的东西各不相同。</p></article></div><p class="note">雾外无人看清寒渊全貌。同行者未必同心，偶遇者也未必无害；你能带回多少真相，取决于你愿意走进哪些地方。</p></div>`;}
  function renderModal(){
    const s=game.state;let title='',hint='',body='';
    if(modal.kind==='rules'){title='玩法手札';hint='看清意图、选择路径，再决定何时出手。';body=rules();}
    if(modal.kind==='world'){title='寒渊封域 · 各怀所求';hint='禁术反噬之后，没有一方愿意空手离开。';body=worldLore();}
    if(modal.kind==='catalogue'){const entries=Object.keys(CARDS).filter(id=>catalogueFilter==='all'||(catalogueFilter==='sword'?id.startsWith('S'):!id.startsWith('S')));title=`技能图鉴 · ${entries.length} 种`;hint='两职业使用独立的奖励与商店池；这里可查看所有技能的费用和完整效果。';body=`<div class="catalogue-filters">${[['all','全部技能'],['assassin','影契刺客'],['sword','霜华剑修']].map(([id,name])=>btn('catalogue-filter',name,'btn small '+(catalogueFilter===id?'primary':'ghost'),`data-filter="${id}"`)).join('')}</div><div class="deck-grid catalogue">${entries.map(id=>cardMarkup(id)).join('')}</div>`;}
    if(modal.kind==='settings'){title='声画与战斗表现';hint='这些设置只改变表现，不改变规则或奖励。';body=`<div class="settings-options">${[['full','完整表现','刺客潜袭、剑修剑芒、逐段命中与受击姿态。'],['fast','快速表现','更短的动作与数字停留，适合重复试玩。'],['reduced','减少动态','取消位移、晃动和闪烁，保留数值与战损换装。']].map(([mode,name,text])=>btn('motion',`<b>${name}${motionMode===mode?' · 已选择':''}</b><small>${text}</small>`,'btn '+(motionMode===mode?'primary':'ghost'),`data-mode="${mode}"`)).join('')}</div><section class="portrait-settings"><h3>${esc(hero().name)} · 角色表现</h3><p>生命降至 50% 与 25% 时，衣装和神态显示不同战痕；恢复生命后回到对应状态。人物模型与路线场景可独立关闭，保留原画与完整路线操作。夜铃另有动态立绘，剑修以原画和人物模型呈现。</p><div class="actions">${btn('scene-toggle',sceneEnabled?'立体场景：开':'立体场景：关','btn ghost',`aria-pressed="${sceneEnabled}"`)}${btn('puppet-toggle',dynamicPortraits?'夜铃动态立绘：开':'夜铃动态立绘：关','btn ghost',`aria-pressed="${dynamicPortraits}"`)}${btn('portrait-gallery','展开三态画卷','btn ghost')}</div></section>${soundSettings()}`;}
    if(modal.kind==='portrait-gallery'){const sword=heroId()==='sword';title=hero().name+' · 三态画卷';hint='这里只预览立绘，不改变生命、战斗或本局进度。血量以当前最大生命的比例计算。';body=`<div class="damage-gallery">${[['normal',sword?'静心':'从容','生命高于 50%',sword?'白袍齐整，目光清寒。':'衣袍齐整，金瞳含笑。'],['wounded','战痕','生命不高于 50%',sword?'衣角染尘，剑锋仍稳。':'外袍磨损，神色警觉。'],['critical','濒危','生命不高于 25%',sword?'霜衣破损，握剑不退。':'衣袖破损，疲惫而不退。']].map(([stage,name,threshold,text])=>`<article class="damage-gallery-card" data-stage="${stage}">${portrait(heroKind(),{previewStage:stage})}<div><span>${threshold}</span><h3>${name}</h3><p>${text}</p></div></article>`).join('')}</div><div class="actions">${btn('settings','返回声画设置','btn ghost')}</div>`;}
    if(modal.kind==='relics'){title='今夜的珍藏';hint='每件效果都已在本局生效；战斗中触发时会显示名称。';body=`<div class="relic-gallery">${s.player.relics.map(id=>relicCard(id)).join('')}</div>`;}
    if(['deck','remove'].includes(modal.kind)){const remove=modal.kind==='remove';title=remove?'选择一张牌，断去此契':'本局牌组';hint=remove?`40 金币，仅移除点击的一个实例。目前 ${s.player.deck.length} 张，至少保留 5 张。`:`共 ${s.player.deck.length} 张，起手流派「${STARTERS?.[s.starter]?.name||'标记'}」。每张是独立实例，战斗消耗不改变牌组。`;body=`<div class="deck-grid">${s.player.deck.slice().sort((a,b)=>a.id.localeCompare(b.id)).map(c=>cardMarkup(c,remove?'remove':'')).join('')}</div>`;}
    if(modal.kind==='pile'){const labels={draw:'抽牌堆',discard:'弃牌堆',exhaust:'本场消耗区'},cards=s.battle[modal.pile];title=`${labels[modal.pile]} · ${cards.length} 张`;hint=modal.pile==='draw'?'按卡号展示，实际抽取顺序隐藏；查看不会改变顺序。':modal.pile==='exhaust'?'本场不再抽回，下一场恢复。':'抽牌堆空时将这些牌洗回。';body=cards.length?`<div class="deck-grid">${cards.slice().sort((a,b)=>a.id.localeCompare(b.id)).map(c=>cardMarkup(c)).join('')}</div>`:'<p class="muted">这里暂时没有卡牌。</p>';}
    if(modal.kind==='log'){title='本场战斗记录';hint='按发生顺序展示，保留最近 90 条。';body=s.battle.logs.map(l=>`<p style="line-height:2">${esc(l)}</p>`).join('');}
    if(modal.kind==='restart'){title='重新开始这一夜？';body=`<p class="muted">当前进度将清空。保留当前起手流派重新开始，或返回首页切换流派。</p><div class="actions">${btn('start','重新开始','btn primary')}${btn('title','返回首页选流派','btn ghost')}${btn('close','继续当前游戏','btn ghost')}</div>`;}
    disposePuppets(modalRoot);modalRoot.innerHTML=`<div class="overlay" data-overlay="true"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-head"><div><h2>${title}</h2><p>${hint}</p></div>${btn('close','×','close','aria-label="关闭面板"')}</div>${body}</section></div>`;mountPuppets(modalRoot);
  }
  function soundSettings(){const state=audio()?.getState?.()||{volume:.3,muted:false};return `<section class="sound-settings"><h3>剑鸣与妖术之声</h3><p>刺客的爪击、火符与血契，剑修的剑鸣、碎冰与霜寒，按实际结算逐段发声。</p><div class="sound-controls">${btn('audio-toggle',state.muted?'开启声音':'静音','btn ghost',`aria-pressed="${state.muted}"`)}<label for="audio-volume">总音量 <b id="volume-value">${Math.round((state.volume??.3)*100)}%</b></label><input id="audio-volume" data-action="volume" type="range" min="0" max="100" value="${Math.round((state.volume??.3)*100)}" aria-label="总音量"></div><div class="audio-previews">${(heroId()==='sword'?[['S01','霜锋'],['S05','寒芒'],['S12','霜天壁'],['S16','万川归寂']]:[['C01','爪击'],['C15','妖火符'],['C16','残月'],['C02','敛息'],['C13','血契'],['C24','狂爪']]).map(([id,name])=>btn('audio-preview','试听 · '+name,'btn ghost small',`data-id="${id}"`)).join('')}</div><p class="note">浏览器首次点击后启用声音。静音设置仅作用于当前打开的页面。</p></section>`;}
  function acquisition(id,rect,relic=false){hidePreview();audio()?.playCue?.(relic?(treasureIds.includes(id)?'treasure':'relic'):(CARDS[id]?.rarity==='rare'?'rareReveal':'rewardReveal'));if(!relic)audio()?.playCard?.(id);const el=document.createElement('div');el.className='acquisition '+(relic?'acquisition-relic':'');el.dataset.fx='acquire';el.innerHTML=relic?relicCard(id):cardMarkup(id,'detail');el.style.left=(rect?.left??innerWidth/2-110)+'px';el.style.top=(rect?.top??innerHeight*.3)+'px';fxRoot.append(el);if(motionMode==='full'){const target=document.querySelector(relic?'.relic-row':'#deck-nav')?.getBoundingClientRect();el.animate([{opacity:0,transform:'scale(.8)'},{opacity:1,transform:'scale(1.08)',offset:.3},{opacity:1,transform:'scale(1)',offset:.6},{opacity:0,transform:`translate(${(target?.left??innerWidth-100)-(rect?.left??innerWidth/2-110)}px,${(target?.top??40)-(rect?.top??innerHeight*.3)}px) scale(.12)`}],{duration:920,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});}setTimeout(()=>el.remove(),motionMode==='full'?960:350);toast(`${relic?'珍藏入袖':'新招入组'} · ${relic?RELICS[id]?.name:CARDS[id]?.name}`);}
  function act(fn){const ok=fn();if(game.state.notice)toast(game.state.notice);return ok!==false;}
  const delay=ms=>new Promise(resolve=>setTimeout(resolve,motionMode==='fast'?Math.min(25,ms*.08):motionMode==='reduced'?Math.min(230,ms):ms));
  function center(target){const el=document.querySelector(`[data-combatant="${target}"] .portrait`),r=el?.getBoundingClientRect();return r?{x:r.left+r.width/2,y:r.top+r.height*.43,w:r.width,h:r.height}:{x:innerWidth/2,y:innerHeight*.35,w:200,h:250};}
  function fx(type,target,markup,extra=''){const p=center(target),el=document.createElement('div');el.className=`fx fx-${type} ${extra}`;el.dataset.fx=type;el.style.left=p.x+'px';el.style.top=p.y+'px';el.innerHTML=markup;fxRoot.append(el);return el;}
  function numberFX(target,value,label='',kind='damage'){return fx('number',target,`<b>${esc(value)}</b><small>${esc(label)}</small>`,kind);}
  function actorGhost(actor,enemy){if(motionMode!=='full'||!actor)return null;const image=actor.querySelector(':scope > img'),rect=actor.getBoundingClientRect();if(!image?.src)return null;const el=document.createElement('div');el.className='fx-actor-ghost '+(enemy?'enemy-ghost':'');el.dataset.fx='afterimage';el.style.cssText=`left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px`;el.innerHTML=`<img src="${esc(image.src)}" alt="">`;fxRoot.append(el);el.animate([{opacity:.5,transform:'translateX(0) scale(1)'},{opacity:.2,transform:`translateX(${enemy?35:-35}px) scale(.97)`,offset:.45},{opacity:0,transform:`translateX(${enemy?55:-55}px) scale(.94)`}],{duration:340,easing:'ease-out',fill:'forwards'});return el;}
  function attackMotion(actor,enemy,heavy){if(!actor||motionMode!=='full')return;const sword=!enemy&&heroId()==='sword',distance=Math.min(sword?(heavy?76:55):(heavy?130:105),innerWidth*.085),sign=enemy?-1:1;actor.animate([{transform:'translateX(0) rotate(0) scale(1)'},{transform:`translateX(${-sign*9}px) translateY(3px) rotate(${-sign*2}deg) scale(.98)`,offset:.16},{transform:`translateX(${sign*distance}px) translateY(-9px) rotate(${sign*2}deg) scale(1.08)`,offset:.39},{transform:`translateX(${sign*distance}px) translateY(-9px) rotate(${sign*2}deg) scale(1.08)`,offset:.48},{transform:'translateX(0) rotate(0) scale(1)'}],{duration:heavy?500:430,easing:'cubic-bezier(.18,.8,.26,1)'});}
  function hitMotion(receiver,target,damage,absorbed,heavy){if(!receiver)return;if(target==='player')puppetAct(damage>0?'hurt':'guard',{damage,absorbed,heavy});if(motionMode!=='full')return;const sign=target==='player'?-1:1,distance=damage>0?(heavy?20:11):5;receiver.animate([{transform:'translateX(0) rotate(0)',filter:'brightness(1)'},{transform:`translateX(${sign*distance}px) rotate(${sign*(damage>0?3:1)}deg)`,filter:damage>0?'brightness(1.65) saturate(.7)':'brightness(1.2)',offset:.24},{transform:`translateX(${-sign*distance*.25}px) rotate(${-sign}deg)`,filter:'brightness(1)',offset:.68},{transform:'translateX(0) rotate(0)',filter:'brightness(1)'}],{duration:heavy?340:250,easing:'cubic-bezier(.1,.7,.3,1)'});}
  function impactArt(guard=false){return `<svg viewBox="0 0 300 260" aria-hidden="true"><g fill="none" stroke="${guard?'#b8e6d9':'#ffd98c'}" stroke-linecap="round"><path d="M150 54 V12 M150 202 V248 M76 74 L42 42 M224 74 L258 42 M70 130 H16 M230 130 H284 M76 187 L42 221 M224 187 L258 221" stroke-width="5"/><circle cx="150" cy="130" r="${guard?67:40}" stroke-width="3"/><path d="M150 45 L164 110 L218 130 L163 147 L150 211 L135 148 L79 130 L136 112Z" stroke-width="2"/></g></svg>`;}

  function frostSVG(){return '<svg viewBox="0 0 280 280" aria-hidden="true"><g fill="none" stroke="#a8eafa" stroke-width="3"><circle cx="140" cy="140" r="81" opacity=".5"/><path d="M140 22V258 M38 81L242 199 M38 199L242 81 M140 45L121 65 M140 45L159 65 M140 235L121 215 M140 235L159 215 M59 93L63 121 M59 93L83 86 M221 187L217 159 M221 187L197 194 M59 187L82 194 M59 187L63 159 M221 93L197 86 M221 93L217 121"/></g></svg>';}
  function attackStyle(id,enemy,snake){if(!enemy&&String(id).startsWith('S'))return {type:'iceblade',svg:swordSlashSVG(['S04','S08','S11','S16'].includes(id))};if(snake)return{type:'serpent',svg:serpentSVG()};if(enemy)return{type:'strike',svg:clawSVG(true)};if(['C15'].includes(id))return{type:'fire',svg:'<svg viewBox="0 0 280 260"><path d="M140 20 C195 100 239 120 198 205 C185 235 95 252 65 198 C32 138 105 94 140 20" fill="#cf543f" opacity=".8"/><path d="M143 70 C169 140 205 160 168 206 C150 224 103 221 93 192 C85 160 132 129 143 70" fill="#ffe9a9"/><path d="M130 25 L169 89 L107 130 L175 183" fill="none" stroke="#ffe8b4" stroke-width="5"/></svg>'};if(['C16','C21'].includes(id))return{type:'moonblade',svg:'<svg viewBox="0 0 280 260"><path d="M226 28 C75 18 21 168 97 240 C81 146 156 54 226 28" fill="#f4e0bb"/><path d="M221 39 C90 62 52 180 94 229" fill="none" stroke="#e9b978" stroke-width="7"/><circle cx="176" cy="100" r="75" fill="none" stroke="#cfb981" opacity=".45"/></svg>'};if(['C14','C28','C30'].includes(id))return{type:'bloodclaw',svg:clawSVG(false)};if(id==='C35')return{type:'shieldbash',svg:'<svg viewBox="0 0 280 260"><path d="M140 20 L232 70 L218 161 Q195 220 140 244 Q78 216 61 159 L48 70 Z" fill="#84bfa868" stroke="#e4e6b5" stroke-width="7"/><path d="M140 58 V203 M78 103 H202 M100 66 L179 197" stroke="#cce8c2" stroke-width="5"/><path d="M230 72 L263 54 M238 125 H277 M230 177 L262 196" stroke="#ffe3a0" stroke-width="7"/></svg>'};return{type:'claw',svg:clawSVG(false)};}
  // Selecting a target changes only controls; keep the existing scene and portrait alive.
  function syncTargetSelection(){
    if(game.state.screen!=='battle')return;
    const b=game.state.battle,active=b.phase==='player'&&!window.uiBusy;
    const card=b.hand.find(c=>c.uid===selected),valid=!!(active&&card&&CARDS[card.id]?.target&&CARDS[card.id].cost<=b.energy);
    if(!valid)selected=null;
    for(const element of app.querySelectorAll('[data-action="card"]')){const chosen=valid&&element.dataset.card===selected;element.classList.toggle('selected',chosen);if(CARDS[element.dataset.id]?.target)element.setAttribute('aria-pressed',String(chosen));}
    const target=app.querySelector('.enemy-target');if(target){target.disabled=!valid;target.classList.toggle('targetable',valid);}
    const combatant=app.querySelector('.enemy-combatant');let tip=combatant?.querySelector('.target-tip');
    if(valid&&combatant&&!tip){tip=document.createElement('div');tip.className='target-tip';combatant.append(tip);}
    if(tip){if(valid)tip.textContent='点击敌人，'+(heroId()==='sword'?'出剑':'发动潜袭');else tip.remove();}
    const hint=app.querySelector('.battle-top>span:last-child');if(hint)hint.textContent=valid?'点击敌人结算 · 再点同牌或 Esc 取消':'攻击／施加状态的牌先选牌再点敌人；其他牌点击即用';
  }
  function lockBattleDOM(){for(const el of document.querySelectorAll('[data-action="card"],[data-action="target"],[data-action="end-turn"]'))el.disabled=true;document.querySelector('.enemy-target')?.classList.remove('targetable');document.querySelector('.target-tip')?.remove();}
  function updateNumber(id,value){const el=document.getElementById(id);if(el)el.textContent=String(Math.max(0,value));}
  function updateDisplayed(v){updateNumber('hp-value',v.player.hp);updateNumber('enemy-hp',v.enemy.hp);updateNumber('player-block',v.player.block);updateNumber('enemy-block',v.enemy.block);updateNumber('enemy-mark',v.enemy.mark);for(const target of ['player','enemy']){const bar=document.getElementById(target+'-hp-bar');if(bar)bar.style.width=Math.max(0,100*v[target].hp/v[target].maxHp)+'%';}syncPlayerAppearance(v.player);}
  function changeDisplayed(v,event){const target=event.target==='enemy'?'enemy':'player',who=v[target],amount=Number(event.amount)||0;if(event.type==='attack'){who.block=Math.max(0,who.block-(Number(event.absorbed)||0));who.hp=Math.max(0,who.hp-(Number(event.damage)||0));}else if(event.type==='selfDamage'){who.hp=Math.max(0,who.hp-(Number(event.damage??event.amount)||0));}else if(event.type==='heal'){who.hp=Math.min(who.maxHp,who.hp+amount);}else if(event.type==='block'){who.block=Number.isFinite(event.total)?event.total:who.block+amount;}else if(event.type==='mark'){v.enemy.mark=Math.max(0,Math.min(5,v.enemy.mark+amount));}updateDisplayed(v);}
  async function showEvent(event,visual,context){
    const type=event.type,target=event.target==='enemy'?'enemy':'player',temporary=[];
    const keep=el=>{temporary.push(el);return el;};
    if(type==='card'){context.cardId=event.cardId;audio()?.playCard?.(event.cardId);}
    else if(type!=='attack')audio()?.playEvent?.(event,{cardId:context.cardId,enemyId:game.state.battle?.enemy.id,intentName:context.intentName});
    if(type==='card'&&['C10','C11'].includes(event.cardId)){keep(fx('power','player',`<span>${({C10:'候机 · 首段增伤 +4',C11:'蓄势 · 下回合 +1 灵力 / +1 抽牌'})[event.cardId]}</span>`));await delay(200);
    }else if(type==='blockClear'){visual[target].block=0;updateDisplayed(visual);
    }else if(type==='power'){keep(fx('power','player',`<span>血力 +${event.amount||0} · 本场持续</span>`));await delay(250);
    }else if(type==='attack'){
      const from=event.source==='enemy'?'enemy':'player',actor=document.querySelector(`[data-combatant="${from}"] .portrait`),receiver=document.querySelector(`[data-combatant="${target}"] .portrait`),enemy=from==='enemy',heavy=!enemy&&(['C04','C21'].includes(context.cardId)||Number(event.amount)>=20),damage=Number(event.damage)||0,absorbed=Number(event.absorbed)||0;
      if(!enemy)puppetAct('attack',{heavy,cardId:context.cardId,hitIndex:event.hitIndex});attackMotion(actor,enemy,heavy);const ghost=actorGhost(actor,enemy);if(ghost)keep(ghost);
      if(actor)actor.dataset.attacking='true';
      await delay(95);
      audio()?.playEvent?.(event,{cardId:context.cardId,enemyId:game.state.battle?.enemy.id,intentName:context.intentName});
      const snake=enemy&&game.state.battle.enemy.id==='snake';
      const style=attackStyle(context.cardId,enemy,snake);
      keep(fx(style.type,target,style.svg,(event.hitIndex%2?'reverse ':'')+(heavy?'heavy-hit':'')));
      keep(fx(damage>0?'impact':'guard-impact',target,impactArt(damage===0),heavy?'impact-heavy':''));
      if(target==='player'&&damage>0)keep(fx('hurt-impact','player','<i></i><span>受击</span>'));
      if(heavy){keep(fx('harvest','enemy',`<span>${String(context.cardId).startsWith('S')?'霜华斩落':['C04','C21'].includes(context.cardId)?'猎印收割':'重击'}</span>`));audio()?.playCue?.('power');}
      hitMotion(receiver,target,damage,absorbed,heavy);
      keep(numberFX(target,damage?`−${damage}`:absorbed?'格挡':'0',`${event.hitIndex>0?`第 ${event.hitIndex+1} 段 · `:''}${absorbed?`护盾 −${absorbed}`:enemy?'受到伤害':heroId()==='sword'?'剑锋命中':'爪击命中'}`,damage?'damage':'guard'));
      changeDisplayed(visual,event);await delay(335);if(actor)delete actor.dataset.attacking;
    }else if(type==='block'){
      if(target==='player')puppetAct('guard',{amount:event.amount});
      keep(fx('shield',target,'<i></i><span>守</span>'));keep(numberFX(target,`+${event.amount||0}`,'护盾','guard'));changeDisplayed(visual,event);await delay(240);
    }else if(type==='mark'){
      keep(fx('mark','enemy',`<span>${event.amount<0?'散':'印'}</span>`));keep(numberFX('enemy',event.amount<0?(event.total===0?'标记清除':`标记 −${Math.abs(event.amount)}`):`标记 +${event.amount||0}`,'','gold'));changeDisplayed(visual,event);await delay(220);
    }else if(type==='chill'){
      keep(fx('frost','enemy',frostSVG()));keep(numberFX('enemy',event.amount<0?'碎霜':`霜寒 +${event.amount||0}`,`当前 ${event.total??0} 层`,'ice-number'));updateNumber('enemy-chill',event.total??0);if(!context.enemyTurn){const intent=document.getElementById('intent-text');if(intent)intent.textContent=game.getIntent?.().text||intent.textContent;}await delay(240);
    }else if(type==='swordIntent'){
      keep(fx('sword-intent','player',`<b>${event.amount<0?'剑意出鞘':'凝剑意'}</b><span>${event.amount>=0?'+':''}${event.amount||0} · 当前 ${event.total??0} / 8</span>`));updateNumber('player-sword-intent',event.total??0);await delay(210);
    }else if(type==='poison'){
      if(event.damage&&target==='player')puppetAct('hurt',{damage:event.damage,kind:'poison'});
      keep(fx('poison',target,'<i></i><i></i><i></i><span>毒</span>'));keep(numberFX(target,event.damage?`−${event.damage}`:event.amount<0?`移除 ${-event.amount} 层毒`:`毒 +${event.amount||0}`,event.damage?'毒无视护盾':event.amount<0?'护心驱毒':'毒附着','poison-color'));if(event.damage){visual[target].hp=Math.max(0,visual[target].hp-event.damage);updateDisplayed(visual);}await delay(250);
    }else if(type==='selfDamage'){
      puppetAct('hurt',{damage:event.damage??event.amount,kind:'selfDamage'});
      keep(fx('blood',target,'<span>血契</span>'));keep(numberFX(target,`−${event.damage??event.amount??0}`,'生命为契','damage'));changeDisplayed(visual,event);await delay(230);
    }else if(type==='heal'){
      if(target==='player')puppetAct('heal',{amount:event.amount});
      keep(fx('heal',target,'<span>生</span>'));keep(numberFX(target,`+${event.amount||0}`,'生命恢复','heal'));changeDisplayed(visual,event);await delay(230);
    }else if(type==='relic'){
      const relic=event.relic||event.relicId||event.name,info=RELICS[relic],name=info?.name||event.name||'遗物发动';
      keep(fx('relic','player',`<i></i><span>${esc(name)}</span>`));if(['fox','ninelives'].includes(relic)){visual.player.hp=Math.min(relic==='fox'?12:18,visual.player.maxHp);updateDisplayed(visual);puppetAct('revive',{hp:visual.player.hp});keep(fx('rebirth','player',`<b>命火重燃</b><span>${esc(name)} · ${visual.player.hp} 生命</span>`));}await delay(['fox','ninelives'].includes(relic)?470:190);
    }else if(type==='draw'||type==='shuffle'){
      if(type==='shuffle'||!context.drawShown){keep(fx('draw','player',`<span>${type==='shuffle'?'弃牌重洗':`抽牌${event.amount>1?' ×'+event.amount:''}`}</span>`));context.drawShown=true;await delay(100);}
    }else if(type==='death'){
      const actor=document.querySelector(`[data-combatant="${target}"] .portrait`);if(actor&&motionMode==='full')actor.animate([{opacity:1,filter:'grayscale(0)'},{opacity:.35,filter:'grayscale(1)'}],{duration:250,fill:'forwards'});await delay(200);
    }else if(type==='victory'){keep(fx('victory','enemy','<span>契破</span>'));await delay(260);}
    temporary.forEach(el=>el.remove());
  }
  async function battleAction(fn,label,alreadyBusy=false){
    if(window.uiBusy&&!alreadyBusy)return false;
    setBusy(true);holdRender=true;lockBattleDOM();
    hidePreview();const previousPlayed=game.state.battle.played;
    const b=game.state.battle,visual={player:{hp:game.state.player.hp,maxHp:game.state.player.maxHp,block:b.block},enemy:{hp:b.enemy.hp,maxHp:b.enemy.maxHp,block:b.enemy.block,mark:b.enemy.mark}};
    let banner;
    try{
      const ok=fn();if(ok===false){toast(game.state.notice);return false;}
      const events=[...(game.state.battle?.events||[])];
      updateNumber('energy-value',game.state.battle?.energy||0);
      banner=document.createElement('div');banner.className='skill-banner';banner.dataset.fx='skill';banner.innerHTML=`<small>${alreadyBusy?'妖异行动':`${hero().name} · ${heroId()==='sword'?'出剑':'潜袭'}`}</small><b>${esc(label)}</b>`;fxRoot.append(banner);
      const context={drawShown:false,intentName:alreadyBusy?label:'',enemyTurn:alreadyBusy};for(const event of events)await showEvent(event,visual,context);
      if(!events.length)await delay(180);
      const chain=game.state.battle?.played;if(!alreadyBusy&&chain>previousPlayed&&[3,5,7].includes(chain)&&game.state.screen==='battle'){const stamp=fx('combo','player',`<b>${chain} 连招</b><small>此回合已打出 ${chain} 张</small>`);audio()?.playCue?.('combo',{amount:chain});await delay(155);stamp.remove();}
      return true;
    }finally{banner?.remove();fxRoot.innerHTML='';holdRender=false;setBusy(false);render();if(game.state.notice)toast(game.state.notice);}
  }
  async function endTurn(){if(window.uiBusy||game.state.screen!=='battle'||game.state.battle.phase!=='player')return;selected=null;setBusy(true);const name=(game.getIntent?.()||ENEMIES[game.state.battle.enemy.id].intents[game.state.battle.enemy.intentIndex]).name;if(!act(()=>game.endTurn())){setBusy(false);render();return;}await delay(220);await battleAction(()=>game.resolveEnemyTurn(),name,true);}
  function start(){if(window.uiBusy)return;selected=null;disposePuppets(modalRoot);disposeScenes(modalRoot);modal=null;modalRoot.innerHTML='';fxRoot.innerHTML='';act(()=>game.newRun(starter));window.scrollTo(0,0);}
  function title(){if(window.uiBusy)return;selected=null;disposePuppets(modalRoot);disposeScenes(modalRoot);modal=null;modalRoot.innerHTML='';game=NightPact.createGame({onChange:render});window.game=game;render();window.scrollTo(0,0);}
  function exportHTML(){if(assets.mode==='folder'){const link=document.createElement('a');link.href='baiyao-standalone.html';link.download='百妖夜契-完整单文件.html';document.body.append(link);link.click();link.remove();toast('已请求保存同目录的完整单文件版；请保留压缩包中的 baiyao-standalone.html。');return;}const copy=document.documentElement.cloneNode(true);for(const id of ['app','hud','modal-root','toast-root','fx-root']){const el=copy.querySelector('#'+id);if(el)el.innerHTML='';}copy.querySelector('body').removeAttribute('data-ui-busy');copy.querySelector('#app').removeAttribute('aria-busy');const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='百妖夜契-index.html';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('已请求浏览器保存完整 HTML；重新打开从新的一局开始。');}
  document.addEventListener('click',event=>{
    void audio()?.unlock?.();
    if(event.target.matches('[data-overlay]'))return closeModal();
    const el=event.target.closest('button[data-action]');if(!el||el.disabled)return;if(modal&&!el.closest('#modal-root'))return;const a=el.dataset.action;
    if(window.uiBusy)return;
    if(a==='start')return start();if(a==='title')return title();if(a==='export')return exportHTML();if(['rules','world','deck','restart','log','catalogue','settings','relics','portrait-gallery'].includes(a))return openModal(a);if(a==='close')return closeModal();if(a==='pile')return openModal('pile',el.dataset.pile);
    if(a==='catalogue-filter'){catalogueFilter=el.dataset.filter;return renderModal();}
    if(a==='scene-toggle'){window.setSceneEnabled(!sceneEnabled);if(modal?.kind==='settings')renderModal();return;}
    if(a==='puppet-toggle'){window.setPuppetEnabled(!dynamicPortraits);if(modal?.kind==='settings')renderModal();return;}
    if(a==='audio-toggle'){const state=audio()?.getState?.();audio()?.setMuted?.(!state?.muted);renderAudioToggle();if(modal?.kind==='settings')renderModal();return;}
    if(a==='audio-preview'){audio()?.preview?.(el.dataset.id);return;}
    if(a==='character'){chosenCharacter=el.dataset.character;starter=(HEROES[chosenCharacter]?.starters||[chosenCharacter==='sword'?'sword':'mark'])[0];return render();}if(a==='starter'){starter=el.dataset.starter;return render();}if(a==='motion'){window.setMotionMode(el.dataset.mode);return renderModal();}
    if(a==='node'){selected=null;act(()=>game.enterNode(el.dataset.node));window.scrollTo(0,0);return;}
    if(a==='card'){const b=game.state.battle,c=b?.hand.find(c=>c.uid===el.dataset.card);if(game.state.screen!=='battle'||b.phase!=='player'||!c||CARDS[c.id].cost>b.energy)return;if(CARDS[c.id].target){selected=selected===c.uid?null:c.uid;syncTargetSelection();}else{selected=null;syncTargetSelection();void battleAction(()=>game.playCard(c.uid),CARDS[c.id].name);}return;}
    if(a==='target'){if(selected){const uid=selected,c=game.state.battle.hand.find(c=>c.uid===uid);selected=null;syncTargetSelection();if(c)void battleAction(()=>game.playCard(uid,true),CARDS[c.id].name);}return;}
    if(a==='end-turn')return void endTurn();
    if(a==='reward'||a==='skip-reward'){const id=a==='reward'?el.dataset.id:null,rect=el.getBoundingClientRect();if(act(()=>game.chooseReward(id))&&id)acquisition(id,rect);window.scrollTo(0,0);return;}
    if(a==='choose-relic'){const id=el.dataset.relic,rect=el.getBoundingClientRect();if(act(()=>game.chooseRelic(id)))acquisition(id,rect,true);return;}
    if(a==='reroll-reward'){if(act(()=>game.rerollReward()))audio()?.playCue?.('shuffle');return;}
    if(a==='event-choice'){const before=[...game.state.player.relics],choice=game.state.event?.choices[Number(el.dataset.index)],id=game.state.event?.id;if(act(()=>game.chooseEvent(Number(el.dataset.index)))){audio()?.playEncounter?.(id);const gained=game.state.player.relics.find(r=>!before.includes(r));if(gained)acquisition(gained,null,true);else if(choice?.cardIds?.length)acquisition(choice.cardIds[0]);else audio()?.playCue?.('eventChoice');}return;}if(a==='event-leave')return act(()=>game.leaveEvent());
    if(a==='rest'){const heal=el.dataset.heal==='true';if(act(()=>game.rest(heal))&&heal)audio()?.playCue?.('heal');return;}if(a==='fox'){const sign=el.dataset.sign==='true';if(act(()=>game.fox(sign))&&sign)acquisition('fox',null,true);return;}if(a==='buy'){const id=game.state.shop?.cards[Number(el.dataset.index)]?.id,rect=el.getBoundingClientRect();if(act(()=>game.buyCard(Number(el.dataset.index))))acquisition(id,rect);return;}if(a==='remove-panel')return openModal('remove');
    if(a==='remove'){const uid=el.dataset.card;modal=null;modalRoot.innerHTML='';act(()=>game.removeCard(uid));return;}if(a==='leave-shop')return act(()=>game.leaveShop());
  });
  document.addEventListener('input',event=>{if(event.target.matches('[data-action="volume"]')){const value=Number(event.target.value)/100;audio()?.setVolume?.(value);const output=document.getElementById('volume-value');if(output)output.textContent=Math.round(value*100)+'%';renderAudioToggle();}});
  document.addEventListener('pointerover',event=>{const el=event.target.closest('.card[data-preview]');if(el&&!el.contains(event.relatedTarget))showPreview(el);});
  document.addEventListener('pointerout',event=>{const el=event.target.closest('.card[data-preview]');if(el&&!el.contains(event.relatedTarget))hidePreview();});
  document.addEventListener('focusin',event=>showPreview(event.target.closest('.card[data-preview]')));
  document.addEventListener('focusout',hidePreview);
  window.addEventListener('scroll',hidePreview,true);
  window.addEventListener('pagehide',()=>{disposePuppets(document);disposeScenes(document);});
  document.addEventListener('keydown',event=>{if(window.uiBusy)return;if(event.key==='Escape'){hidePreview();if(modal)closeModal();else if(selected){selected=null;syncTargetSelection();}}if(event.key==='Tab'&&modal){const buttons=[...modalRoot.querySelectorAll('button:not(:disabled),[tabindex="0"]')],first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
  game=NightPact.createGame({onChange:render});window.game=game;window.renderGame=render;render();
})();
</script>
